<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>UrTV looks: options box and Control Center</title>
<style>
/* Each look's colours come from GlassStyle.java (dumped to TOKENS below at render time): the box and the panel use only those tokens, as
   AppOptions.java and ControlCenter.java do. A look with a ring (رملي) draws its focus as a soft fill with a green line; the others keep their solid focus fill. */
@font-face{font-family:TR;src:url("../fonts/plex-400.ttf")}
@font-face{font-family:TM;src:url("../fonts/plex-500.ttf")}
@font-face{font-family:TD;src:url("../fonts/plex-700.ttf")}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;font-family:TR}
.f{position:relative;width:1920px;height:1080px;overflow:hidden}
.photo{position:absolute;inset:0;background:url("../../../photos/XDtzu1D2P8c.jpg") center/cover}
.veil{position:absolute;inset:0}
.tag{position:absolute;left:120px;top:60px;font:30px TM}
.app{position:absolute;top:770px;width:262px;height:170px;border-radius:20px;display:flex;align-items:center;justify-content:center;font:40px TD;color:#fff}
svg{fill:none;stroke-linecap:round;stroke-linejoin:round}
</style></head><body><div class="f" id="f"></div>
<script>
const TOKENS={"glass-dark":{"light":false,"base":"#FF17181B","scrim":"#FF000000","scrimMin":0.3,"text":"#FFFFFFFF","sub":"#FFDADCE0","accent":"#FFFFFFFF","panel":"#6B14161A","line":"#24FFFFFF","dialog":"#FF18191C","focus":"#F2FFFFFF","onFocus":"#FF14161A","onFocusSub":"#FF3A3E46","ring":"#00000000"},"glass-light":{"light":true,"base":"#FFECEDEF","scrim":"#FFF5F6F8","scrimMin":0.4,"text":"#FF14161A","sub":"#FF3A3E46","accent":"#FF14161A","panel":"#9EFFFFFF","line":"#1F14161A","dialog":"#FFFCFCFD","focus":"#F214161A","onFocus":"#FFFFFFFF","onFocusSub":"#FFDADCE0","ring":"#00000000"},"graphite-dark":{"light":false,"base":"#FF121314","scrim":"#FF121314","scrimMin":0.82,"text":"#FFF2F0EC","sub":"#FFB9B6B0","accent":"#FFF0A64A","panel":"#E6202124","line":"#14FFFFFF","dialog":"#FF1E1F22","focus":"#FFF0A64A","onFocus":"#FF1A1206","onFocusSub":"#FF3D2A0E","ring":"#00000000"},"graphite-light":{"light":true,"base":"#FFF3F1EE","scrim":"#FFF3F1EE","scrimMin":0.85,"text":"#FF1C1B1A","sub":"#FF55514B","accent":"#FF8A4F00","panel":"#F2FFFFFF","line":"#1F1C1B1A","dialog":"#FFFFFFFF","focus":"#FF8A4F00","onFocus":"#FFFFFFFF","onFocusSub":"#FFF3E2CC","ring":"#00000000"},"navy-dark":{"light":false,"base":"#FF0B1630","scrim":"#FF0B1630","scrimMin":0.8,"text":"#FFF3EEE2","sub":"#FFB7BFD0","accent":"#FFE0BA74","panel":"#D9142247","line":"#1FE0BA74","dialog":"#FF101D3D","focus":"#FFE0BA74","onFocus":"#FF0B1630","onFocusSub":"#FF2A3350","ring":"#00000000"},"navy-light":{"light":true,"base":"#FFEEF1F7","scrim":"#FFEEF1F7","scrimMin":0.85,"text":"#FF14213D","sub":"#FF46516B","accent":"#FF6E5017","panel":"#F2FFFFFF","line":"#1F14213D","dialog":"#FFFFFFFF","focus":"#FF14213D","onFocus":"#FFFFFFFF","onFocusSub":"#FFD5DBE8","ring":"#00000000"},"clean-dark":{"light":false,"base":"#FF121314","scrim":"#FF121314","scrimMin":0.82,"text":"#FFF2F0EC","sub":"#FFB9B6B0","accent":"#FFF0A64A","panel":"#E6202124","line":"#14FFFFFF","dialog":"#FF1E1F22","focus":"#FFF0A64A","onFocus":"#FF1A1206","onFocusSub":"#FF3D2A0E","ring":"#00000000"},"clean-light":{"light":true,"base":"#FFECECE8","scrim":"#FFF4F4F1","scrimMin":0.88,"text":"#FF1B1D21","sub":"#FF50555E","accent":"#FF0B5E51","panel":"#FAFFFFFF","line":"#1414181E","dialog":"#FFFFFFFF","focus":"#FF0B5E51","onFocus":"#FFFFFFFF","onFocusSub":"#FFCFE6E1","ring":"#00000000"},"sand-dark":{"light":false,"base":"#FF151A17","scrim":"#FF151A17","scrimMin":0.8,"text":"#FFF2F1EC","sub":"#FFB8BDB9","accent":"#FF54C08A","panel":"#E61E2420","line":"#1AFFFFFF","dialog":"#FF1E2420","focus":"#FF1F3A2C","onFocus":"#FFF2F1EC","onFocusSub":"#FFC9D6CE","ring":"#FF54C08A"},"sand-light":{"light":true,"base":"#FFF6F4EF","scrim":"#FFF6F4EF","scrimMin":0.55,"text":"#FF1B1F1D","sub":"#FF545A57","accent":"#FF166A45","panel":"#E6FFFFFF","line":"#FFE3DFD5","dialog":"#FFFFFFFF","focus":"#FFEEF6F1","onFocus":"#FF1B1F1D","onFocusSub":"#FF3F4A44","ring":"#FF1B8354"}};
const P={move:'<path d="M4 9h15M15 5l4 4-4 4"/><path d="M20 15H5M9 11l-4 4 4 4"/>',
 hide:'<path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z"/><circle cx="12" cy="12" r="2.6"/><path d="M4 4l16 16"/>',
 lock:'<rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/>',
 star:'<path d="M12 4l2.4 5 5.4.6-4 3.7 1.1 5.4L12 16l-4.9 2.7 1.1-5.4-4-3.7 5.4-.6z"/>',
 info:'<circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5"/><path d="M12 7.6v.4"/>',
 wifi:'<path d="M2.5 9a14 14 0 0 1 19 0"/><path d="M5.5 12.5a9.5 9.5 0 0 1 13 0"/><path d="M8.5 16a5 5 0 0 1 7 0"/><path d="M12 19v.2"/>',
 bt:'<path d="M7 7l10 10-5 4V3l5 4L7 17"/>',sound:'<path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6"/>',
 speed:'<path d="M4 17a8 8 0 1 1 16 0"/><path d="M12 17l4-5"/>',sleep:'<path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/>',
 power:'<path d="M12 3.5v8"/><path d="M7 6.5a7.5 7.5 0 1 0 10 0"/>',cast:'<path d="M3.5 8V6a1.5 1.5 0 0 1 1.5-1.5h14A1.5 1.5 0 0 1 20.5 6v12a1.5 1.5 0 0 1-1.5 1.5h-5"/><path d="M3.5 12a8 8 0 0 1 7.5 7.5"/>',
 saver:'<rect x="3" y="4.5" width="18" height="12" rx="1.5"/><path d="M9 20h6"/>',home:'<path d="M4 11l8-7 8 7"/><path d="M6 10v10h12V10"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4"/>'};
const css=h=>{const a=parseInt(h.slice(1,3),16)/255,r=parseInt(h.slice(3,5),16),g=parseInt(h.slice(5,7),16),b=parseInt(h.slice(7,9),16);return `rgba(${r},${g},${b},${a.toFixed(3)})`;};
const over=(top,under)=>{const a=parseInt(top.slice(1,3),16)/255;const c=i=>Math.round(parseInt(top.slice(i,i+2),16)*a+parseInt(under.slice(i,i+2),16)*(1-a));
 return '#FF'+[3,5,7].map(i=>c(i).toString(16).padStart(2,'0')).join('').toUpperCase();};
const [key,what,foc]=(location.hash.slice(1)||'sand-light:box:move').split(':');
const L=TOKENS[key], ring=L.ring!=='#00000000';
const veil=`<div class="veil" style="background:${css(L.scrim.replace('#FF','#'+Math.round(Math.max(L.scrimMin,.6)*255).toString(16).padStart(2,'0').toUpperCase()))}"></div>`;
const tagc=css(L.text);
const ic=(k,c,w=34,fill='none')=>`<svg viewBox="0 0 24 24" style="width:${w}px;height:${w}px;stroke:${c};stroke-width:1.7;fill:${fill}">${P[k]}</svg>`;
const focusStyle=(rad)=>`background:${css(over(L.focus,L.dialog))};${ring?`box-shadow:inset 0 0 0 3px ${css(L.ring)};`:''}border-radius:${rad}px;`;
const tint=(f,on)=>f?(ring?L.ring:L.onFocus):(on?(ring?L.ring:L.accent):L.sub);
let out='<div class="photo"></div>'+veil+`<div class="tag" style="color:${tagc}">${key}</div>`;
if(what==='box'){
  const apps=[['YouTube','#E62117'],['شاهد','#1F1F1F'],['Netflix','#0B0B0B'],['TOD','#5B2BC4'],['المتصفح','#2F6FDB']];
  out+=apps.map((a,i)=>`<div class="app" style="right:${120+i*292}px;background:${a[1]};${i==0?`transform:scale(1.12);outline:4px solid ${css(ring?L.ring:'#E6FFFFFF')};outline-offset:5px`:''}">${a[0]}</div>`).join('');
  const W=262*1.12, H=16*2+4*72+3*8, top=770-170*.06-24-H, right=120-(W-262)/2, fav=foc!=='info';
  const row=(k,t)=>{const f=k===foc;return `<div style="height:72px;display:flex;align-items:center;gap:16px;padding:0 24px;border-radius:12px;${f?focusStyle(12):''}">${ic(k,css(tint(f,false)),32)}<span style="font:30px TM;color:${css(f?L.onFocus:L.text)}">${t}</span></div>`;};
  const ib=(k,on)=>{const f=k===foc;return `<div style="height:72px;display:flex;align-items:center;justify-content:center;border-radius:12px;${f?focusStyle(12):`background:${css(over(L.line,L.dialog))}`}">${ic(k,css(tint(f,on)),34,k==='star'&&on?css(tint(f,on)):'none')}</div>`;};
  out+=`<div style="position:absolute;right:${right}px;top:${top}px;width:${W}px;height:${H}px;padding:16px;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:72px;gap:8px;background:${css(L.dialog)};border:1px solid ${css(L.line)};border-radius:28px;box-shadow:0 24px 56px rgba(0,0,0,.22)">
   <div style="grid-column:1/3">${row('move','انقل')}</div><div style="grid-column:1/3">${row('hide','أخفِ')}</div><div style="grid-column:1/3">${row('lock','اقفل')}</div>${ib('star',fav)}${ib('info',false)}</div>`;
}else{
  const T=[['wifi','الشبكة','متصل، إشارة قوية'],['bt','البلوتوث','الريموت والملحقات'],['sound','مخرج الصوت','سماعات التلفزيون'],['speed','اختبار السرعة','اضغط اختيار للبدء'],
    ['sleep','مؤقت النوم','١٥ إلى ٩٠ دقيقة'],['power','أطفئ الآن','تُطفأ الشاشة فورًا'],['cast','انعكاس الشاشة','من الجوال'],['saver','شاشة التوقف','ابدأها الآن'],
    ['home','إعدادات تلفزيونك','الأذان والمفضلة والمظهر'],['gear','الإعدادات','إعدادات التلفزيون']];
  const W=1400,g=20,tw=(W-72-g*3)/4,th=200;
  out+=`<div style="position:absolute;left:${(1920-W)/2}px;top:150px;width:${W}px;height:${110+3*th+2*g+40}px;background:${css(L.dialog)};border:2px solid ${css(L.line)};border-radius:44px">
   <div style="position:absolute;right:36px;top:30px;font:40px TD;color:${css(L.text)}">مركز التحكم</div>`+
   T.map((t,i)=>{const f=i===0;return `<div style="position:absolute;right:${36+(i%4)*(tw+g)}px;top:${110+Math.floor(i/4)*(th+g)}px;width:${tw}px;height:${th}px;padding:26px 28px;display:flex;flex-direction:column;align-items:flex-start;gap:10px;border-radius:28px;${f?focusStyle(28):`background:${css(L.panel)};${ring?`box-shadow:inset 0 0 0 2px ${css(L.line)};`:''}`}">
     ${ic(t[0],css(f?L.onFocus:L.text),44)}<div style="font:32px TM;color:${css(f?L.onFocus:L.text)}">${t[1]}</div><div style="font:24px TR;color:${css(f?L.onFocusSub:L.sub)}">${t[2]}</div></div>`;}).join('')+'</div>';
}
document.getElementById('f').innerHTML=out;
</script></body></html>
