<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>UrTV settings prototype</title>
<style>
@font-face{font-family:TR;src:url("file:///home/user/TV-ScreenSaver/assets/fonts/Thmanyah-Regular.woff2")}
@font-face{font-family:TM;src:url("file:///home/user/TV-ScreenSaver/assets/fonts/Thmanyah-Medium.woff2")}
@font-face{font-family:TD;src:url("file:///home/user/TV-ScreenSaver/assets/fonts/ThmanyahDisplay-Bold.woff2")}
:root{--ink:#14161A;--inksub:#3A3E46;--sub:#DADCE0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#000;color:#fff;font-family:TR}
.f{position:relative;width:1920px;height:1080px;overflow:hidden}
.bg{position:absolute;inset:-60px;background:url("file:///home/user/TV-ScreenSaver/photos/XDtzu1D2P8c.jpg") center/cover;filter:blur(26px)}
.veil{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.wrap{position:absolute;left:120px;right:120px;top:0;bottom:0}
h1{position:absolute;right:0;top:56px;font:58px TD;line-height:1.2}
.card{position:absolute;height:140px;border-radius:26px;background:rgba(20,22,26,.42);border:1px solid rgba(255,255,255,.14);display:flex;align-items:center;gap:26px;padding:0 36px}
.card.fo{background:rgba(255,255,255,.95);color:var(--ink);border-color:transparent}
.card svg{flex:none;width:40px;height:40px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.tx{flex:1;min-width:0}
.nm{font:42px TM;line-height:1.3}
.sb{font:28px TR;color:var(--sub);margin-top:2px;line-height:1.3}
.fo .sb{color:var(--inksub)}
.sw{flex:none;width:104px;height:56px;border-radius:28px;position:relative;background:rgba(255,255,255,.28)}
.sw::after{content:"";position:absolute;top:50%;margin-top:-20px;right:6px;width:40px;height:40px;border-radius:50%;background:#fff}
.fo .sw{background:rgba(20,22,26,.28)}
.sw.on{background:#2FB872}.sw.on::after{right:auto;left:6px}
.list{position:absolute;right:0;left:0;top:196px;border-radius:30px;background:rgba(20,22,26,.42);border:1px solid rgba(255,255,255,.14)}
.row{position:absolute;left:14px;right:14px;height:84px;border-radius:20px;display:flex;align-items:center;gap:20px;padding:0 24px}
.row.fo{background:rgba(255,255,255,.95);color:var(--ink)}
.row .nm{font:36px TM;flex:1}
.row .val{font:30px TR;color:var(--sub)}.row.fo .val{color:var(--inksub)}
.bar{width:300px;height:12px;border-radius:6px;background:rgba(255,255,255,.22);position:relative}
.bar i{position:absolute;right:0;top:0;bottom:0;border-radius:6px;background:#fff}
.fo .bar{background:rgba(20,22,26,.18)}.fo .bar i{background:var(--ink)}
/* v3 toggle options, chosen by the hash: #adhan:A|B|C:1|0 */
.ck{flex:none;width:50px;height:50px;border-radius:10px;border:3px solid rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center}
.ck svg{width:34px;height:34px;fill:none;stroke:#fff;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;visibility:hidden}
.ck.on{background:#2FB872;border-color:#2FB872}.ck.on svg{visibility:visible}
.fo .ck{border-color:var(--ink)}.fo .ck.on{background:#1E8A53;border-color:#1E8A53}
.wd{font:34px TM;color:var(--sub);padding-bottom:6px;border-bottom:5px solid transparent;line-height:1.2}
.wd.on{color:#fff;border-bottom-color:#2FB872}
.fo .wd{color:var(--inksub)}.fo .wd.on{color:var(--ink);border-bottom-color:#1E8A53}
.sg{flex:none;display:flex;height:54px;border-radius:12px;border:2px solid rgba(255,255,255,.35);overflow:hidden}
.sg b{width:120px;display:flex;align-items:center;justify-content:center;font:28px TM;color:var(--sub);font-weight:normal}
.sg b.a{background:#fff;color:var(--ink)}.sg b.a.g{background:#2FB872;color:#fff}
.fo .sg{border-color:rgba(20,22,26,.35)}.fo .sg b{color:var(--inksub)}
.fo .sg b.a{background:var(--ink);color:#fff}.fo .sg b.a.g{background:#1E8A53;color:#fff}
/* v4: D status light, E flat TV switch, F the icon is the state */
.dt{display:inline-block;width:22px;height:22px;border-radius:50%;margin-right:22px;vertical-align:middle;position:relative;top:-3px;border:3px solid rgba(255,255,255,.75)}
.dt.on{background:#3DDC84;border-color:#3DDC84;box-shadow:0 0 16px 4px rgba(61,220,132,.65)}
.fo .dt{border-color:var(--inksub)}.fo .dt.on{background:#1E8A53;border-color:#1E8A53;box-shadow:0 0 14px 3px rgba(30,138,83,.55)}
.ts{flex:none;position:relative;width:100px;height:32px}
.ts::before{content:"";position:absolute;left:4px;right:4px;top:12px;height:8px;border-radius:1px;background:rgba(255,255,255,.35)}
.ts::after{content:"";position:absolute;top:0;right:0;width:32px;height:32px;border-radius:4px;background:#C9CCD1}
.ts.on::before{background:rgba(61,220,132,.55)}.ts.on::after{right:auto;left:0;background:#3DDC84}
.fo .ts::before{background:rgba(20,22,26,.25)}.fo .ts::after{background:#6B7078}
.fo .ts.on::before{background:rgba(30,138,83,.45)}.fo .ts.on::after{background:#1E8A53}
.ri{flex:none;width:44px;height:44px;fill:none;stroke:var(--sub);stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;opacity:.8}
.ri.on{stroke:#3DDC84;fill:#3DDC84;opacity:1}.ri.on .k{fill:none;stroke:#14161A}.ri.sp{visibility:hidden}
.fo .ri{stroke:var(--inksub)}.fo .ri.on{stroke:#1E8A53;fill:#1E8A53}
.row .nm small{display:block;font:26px TR;color:var(--sub);line-height:1.1}
.row.fo .nm small{color:var(--inksub)}
.row .nm small.on{color:#3DDC84}.row.fo .nm small.on{color:#1E8A53}
/* v5, Saudi: DGA «منصات» sa-flag greens (#1B8354 600, #25935F 500, #54C08A 400), Najdi diamond, Sadu triangle band */
.dm{flex:none;display:flex;align-items:center;gap:20px;font:30px TM;color:var(--sub)}
.dm i{width:34px;height:34px;transform:rotate(45deg);border:3px solid rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center}
.dm.on{color:#54C08A}.dm.on i{background:#25935F;border-color:#25935F}
.dm.on i::after{content:"";width:10px;height:10px;background:#fff}
.fo .dm{color:var(--inksub)}.fo .dm i{border-color:var(--inksub)}
.fo .dm.on{color:#1B8354}.fo .dm.on i{background:#1B8354;border-color:#1B8354}
.sd{flex:none;display:flex;align-items:center;gap:20px;font:30px TM;color:var(--sub)}
.sd svg{width:150px;height:30px}
.sd.on{color:#54C08A}.fo .sd{color:var(--inksub)}.fo .sd.on{color:#1B8354}
.tri{flex:none;width:18px;height:54px;fill:#25935F;visibility:hidden}.tri.on{visibility:visible}.fo .tri{fill:#1B8354}
.stv{font:32px TM;color:var(--sub)}.stv.on{color:#54C08A}
.fo .stv{color:var(--inksub)}.fo .stv.on{color:#1B8354}
</style></head><body>
<div class="f"><div class="bg"></div><div class="veil"></div><div class="wrap" id="w"></div></div>
<script>
// one stroke set: 24 grid, 1.75 stroke, round caps
const P={
 bell:'<path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 21h4"/>',
 pin:'<path d="M12 21s-6.5-6-6.5-11a6.5 6.5 0 0 1 13 0c0 5-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/>',
 book:'<path d="M12 6c-2-1.5-5-2-8-2v14c3 0 6 .5 8 2 2-1.5 5-2 8-2V4c-3 0-6 .5-8 2z"/><path d="M12 6v14"/>',
 cards:'<rect x="3.5" y="4.5" width="7" height="6.5" rx="1.5"/><rect x="13.5" y="4.5" width="7" height="6.5" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="6" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="6" rx="1.5"/>',
 look:'<circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/>',
 control:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>',
 phone:'<rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/>',
 update:'<path d="M20 11a8 8 0 0 0-14.5-4.5L4 8"/><path d="M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.5 4.5L20 16"/><path d="M20 20v-4h-4"/>',
 shield:'<path d="M12 3l7.5 3v5.5c0 4.5-3.2 8-7.5 9.5-4.3-1.5-7.5-5-7.5-9.5V6z"/>',
 more:'<circle cx="5.5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="18.5" cy="12" r="1.2"/>',
 saver:'<path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/>',
 home:'<path d="M4 11l8-7 8 7"/><path d="M6 10v10h12V10"/>',
 trend:'<path d="M4 17l5-5 4 4 7-8"/><path d="M15 8h5v5"/>',
 apps:'<rect x="4" y="4" width="6" height="6" rx="1.2"/><rect x="14" y="4" width="6" height="6" rx="1.2"/><rect x="4" y="14" width="6" height="6" rx="1.2"/><rect x="14" y="14" width="6" height="6" rx="1.2"/>',
 clock:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/>',
 report:'<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h6"/>',
 play:'<path d="M8 5l11 7-11 7z"/>'};
const ic=k=>`<svg viewBox="0 0 24 24">${P[k]}</svg>`;
const G={top:200,h:140,step:164};
const card=(col,row,k,name,sub,fo,end='',cols=2,span=1)=>{const w=(1680-40*(cols-1))/cols*span+40*(span-1);return `<div class="card${fo?' fo':''}" style="right:${col*((1680-40*(cols-1))/cols+40)}px;top:${G.top+row*G.step}px;width:${w}px;height:${G.h}px">${ic(k)}<div class="tx"><div class="nm">${name}</div>${sub?`<div class="sb">${sub}</div>`:''}</div>${end}</div>`;};
const S={};
S.main=()=>{
  // v2: «الأذان» is one wide card on top; OK opens its page, whose first row is the switch.
  // «الساعة والأرقام» joins the main screen next to «الموقع والصلاة».
  G.h=124;G.step=140;
  const C=[['pin','الموقع والصلاة','مكة المكرمة · أم القرى'],['clock','الساعة والأرقام','١٢ ساعة · أرقام عربية'],
    ['book','تلاوة وأذان','مشاري العفاسي'],['cards','البطاقات','شاشة التوقف · الشاشة الرئيسية'],
    ['look','المظهر','زجاجي · تلقائي'],['control','مركز التحكم',''],
    ['phone','التحكم من الجوال','متوقف'],['update','تحديث تلفزيوني','4.0 · محدّث'],
    ['report','أرسل تقرير','آخر تقرير: أمس'],['more','المزيد','']];
  return '<h1>الإعدادات</h1>'+card(0,0,'bell','الأذان','متوقف',1,'<div class="sw"></div>',2,2)
    +C.map((c,i)=>card(i%2,1+Math.floor(i/2),c[0],c[1],c[2],c[3],c[4]||'')).join('');
};
S.cards=()=>'<h1>البطاقات</h1>'+card(0,0,'saver','شاشة التوقف','آية اليوم · ساعة كبيرة',1)+card(1,0,'home','الشاشة الرئيسية','الصلاة · الطقس · آية اليوم');
S.more=()=>'<h1>المزيد</h1>'+[['trend','المباريات والأسواق','فريقان، ٣ أسواق',1],['apps','التطبيقات والمفضلة','٨ في المفضلة'],['play','جديد المسلسلات','الكل'],['shield','حماية العائلة','متوقفة']].map((c,i)=>card(i%2,Math.floor(i/2),c[0],c[1],c[2],c[3])).join('');
const H=(location.hash||'#main').slice(1).split(':'),T=H[1]||'',X=H[2]||'0';
const tg=on=>T=='A'?`<div class="ck${on?' on':''}"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>`
  :T=='B'?`<div class="wd${on?' on':''}">${on?'مفعّل':'متوقف'}</div>`
  :T=='C'?`<div class="sg"><b class="${on?'a g':''}">مفعّل</b><b class="${on?'':'a'}">متوقف</b></div>`
  :`<div class="sw ${on?'on':''}" style="width:84px;height:46px"></div>`;
const RI={'الأذان':'<path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path class="k" d="M10 21h4"/>',
 'أذان مختصر':'<path d="M4 6l7 6-7 6z"/><path d="M13 6l7 6-7 6z"/>',
 'إيقاف الأذان بأي زر':'<rect x="7" y="2.5" width="10" height="19" rx="2.5"/><circle class="k" cx="12" cy="8" r="2"/>',
 'تنبيه قبل الأذان':'<circle cx="12" cy="13" r="8"/><path class="k" d="M12 9v4l2.5 1.5"/>'};
// Sadu band: a row of triangles; filled green when on, a thin grey outline when off
const sadu=on=>{const fo='';let t='';for(let k=0;k<6;k++){const x=k*25;t+=`<path d="M${x+1} 28L${x+12.5} 3L${x+24} 28z"/>`;}
  return `<svg viewBox="0 0 150 30" style="fill:${on?'#25935F':'none'};stroke:${on?'#25935F':'currentColor'};stroke-width:2;stroke-linejoin:round${on?'':';opacity:.7'}">${t}</svg>`;};
const list=(title,R)=>{
  const rows=R.map((r,i)=>{const o=r[1];let e='';
    let nm=r[0],pre='',cls='';
    if(o.sw!==undefined){
      if(T=='D')nm+=`<i class="dt${o.sw?' on':''}"></i>`;
      else if(T=='G')e=`<div class="dm${o.sw?' on':''}">${o.sw?'مفعّل':'متوقف'}<i></i></div>`;
      else if(T=='H')e=`<div class="sd${o.sw?' on':''}">${o.sw?'مفعّل':'متوقف'}${sadu(o.sw)}</div>`;
      else if(T=='I'){e=`<div class="stv${o.sw?' on':''}">${o.sw?'مفعّل':'متوقف'}</div>`;pre=`<svg class="tri${o.sw?' on':''}" viewBox="0 0 18 54"><path d="M18 0L4 9L18 18zM18 18L4 27L18 36zM18 36L4 45L18 54z"/></svg>`;}
      else if(T=='E')e=`<div class="ts${o.sw?' on':''}"></div>`;
      else if(T=='F'){pre=`<svg class="ri${o.sw?' on':''}" viewBox="0 0 24 24">${RI[r[0]]}${o.sw?'':'<path d="M3.5 3.5l17 17" style="stroke-width:2"/>'}</svg>`;nm+=`<small class="${o.sw?'on':''}">${o.sw?'مفعّل':'متوقف'}</small>`;}
      else e=tg(o.sw);}
    else if(o.bar)e=`<div class="bar"><i style="width:${o.bar}%"></i></div><div class="val">٦٠٪</div>`;
    else if(o.v)e=`<div class="val">${o.v}</div>`;
    if(T=='I'&&o.sw===undefined)pre='<svg class="tri" viewBox="0 0 18 54"></svg>';
    if(T=='F'&&o.sw===undefined)pre='<svg class="ri sp" viewBox="0 0 24 24"></svg>';
    return `<div class="row${i==0?' fo':''}${cls}" style="top:${16+i*86}px">${pre}<div class="nm">${nm}</div>${e}</div>`;}).join('');
  return `<h1>${title}</h1><div class="list" style="height:${32+R.length*86-2}px">${rows}</div>`;
};
S.adhan=()=>list('الأذان',[['الأذان',{sw:+X}],['المؤذن',{v:'مؤذن ٣'}],['مؤذن الفجر',{v:'فجر الحرم المكي'}],['مستوى الصوت',{bar:60}],['أذان مختصر',{sw:0}],['إيقاف الأذان بأي زر',{sw:1}],['تنبيه قبل الأذان',{sw:1}],['أذان من ملفي',{v:'لا يوجد'}],['جرّب الصوت',{}]]);
S.clock=()=>list('الساعة والأرقام',[['نظام الساعة',{v:'١٢ ساعة'}],['الأرقام',{v:'عربية'}],['أسماء الأشهر الميلادية',{v:'يناير، فبراير'}],['تعديل التاريخ الهجري',{v:'٠ يوم'}]]);
document.getElementById('w').innerHTML=S[H[0]]();
</script></body></html>
