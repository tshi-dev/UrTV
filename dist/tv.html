function adjustedTimes(t){

  PRAYER_KEYS.forEach((k, i) => {
    const d = CONFIG.prayerAdj[i], [h, mi] = String(t[k]).split(':').map(Number);

function clockText(v){
  const m = /^\s*(\d{1,2}):(\d{2})/.exec(v == null ? '' : String(v));
  if(!m) return null;

}
function checkedTimings(j, want){
  const t = j && j.data && j.data.timings, got = j && j.data && j.data.date && j.data.date.gregorian && j.data.date.gregorian.date;
  if(!t || got !== want) return null;

  out.Sunrise = clockText(t.Sunrise) || undefined;
  const mins = k => { const [h, mi] = out[k].split(':').map(Number); return h * 60 + mi; };
  if(Math.abs(CONFIG.latitude) > 48 && mins('Maghrib') < mins('Asr')) out.Maghrib = pad(Math.floor((mins('Maghrib')+1440)/60))+':'+pad(mins('Maghrib')%60);
  if(mins('Isha') < mins('Maghrib')) out.Isha = pad(Math.floor((mins('Isha') + 1440) / 60)) + ':' + pad(mins('Isha') % 60);
  for(let i = 1; i < PRAYER_KEYS.length; i++) if(mins(PRAYER_KEYS[i]) <= mins(PRAYER_KEYS[i - 1])) return null;
  return out;
}
function buildPrayers(t){
  t = adjustedTimes(t);
  const list = PRAYER_KEYS.map(k => {
    const m = /^(\d{1,2}):(\d{2})$/.exec(String(t[k]));
    if(!m || +m[2] > 59) throw new Error('prayer time ' + k);
    return {key:k, name:PRAYER_NAMES[k], h:+m[1], mi:+m[2]};
  });
  DAY_TIMES = BASE_DAY_TIMES = t;
  PRAYERS = BASE_PRAYERS = list;

  if(Math.abs(CONFIG.latitude) > 48){
    const yesterday = new Date(Date.UTC(p.y,p.mo-1,p.d-1));
    const prev = adjustedTimes(computePrayers({y:yesterday.getUTCFullYear(),mo:yesterday.getUTCMonth()+1,d:yesterday.getUTCDate()}));

  if(day !== BASE_DAY){ buildPrayers(computePrayers()); return; }

function computePrayers(forDay){

}

let PRAYERS_DAY = '';
async function loadPrayers(){
  const p = riyadhParts(), want = `${pad(p.d)}-${pad(p.mo)}-${p.y}`;
  const url = `https://api.aladhan.com/v1/timings/${want}`
            + `?latitude=${CONFIG.latitude}&longitude=${CONFIG.longitude}`
            + `&method=${CONFIG.prayerMethod}&latitudeAdjustmentMethod=3&timezonestring=${encodeURIComponent(CONFIG.timezone)}`;
  const PT = 'ptimes:' + CONFIG.latitude + ',' + CONFIG.longitude + ',' + CONFIG.prayerMethod;
  if(!PRAYERS.length) try{
    let kept = null; try{ kept = JSON.parse(localStorage.getItem(PT) || 'null'); }catch(_){}
    if(kept && kept.d === want){ buildPrayers(kept.t); PRAYERS_DAY = want + '|api'; } else { buildPrayers(computePrayers()); PRAYERS_DAY = want + '|calc'; }
    tickPrayer(); renderPanel(false, 'prayers', 'adhkar', 'prayerrow', 'nextprayer');
  }catch(_){}
  try{
    if(CONFIG.prayerMethod >= 100) throw 0;
    const r = await fetchT(url, 12000);
    const t = checkedTimings(await r.json(), want);
    if(!t) throw 0;
    buildPrayers(t);
    PRAYERS_DAY = want + '|api';
    try{ localStorage.setItem(PT, JSON.stringify({d: want, t})); }catch(_){}
  }catch(e){
    if(!PRAYERS.length || PRAYERS_DAY.slice(0, 10) !== want){
      try{ buildPrayers(computePrayers()); PRAYERS_DAY = want + '|calc'; }catch(_){}
    }
  }
  tickPrayer();
  tickOccasion();
  renderPanel(false, 'prayers', 'adhkar', 'prayerrow', 'nextprayer');
}

const UNIT = {
  day: {one:'يوم', two:'يومين', few:'أيام', many:'يوم', mid:'يومًا'},
  hour:{one:'ساعة', two:'ساعتين', few:'ساعات', many:'ساعة'},
  min: {one:'دقيقة', two:'دقيقتين', few:'دقائق', many:'دقيقة'},
  task:{one:'مهمة', two:'مهمتان', few:'مهام', many:'مهمة', mid:'مهمة'}
};
const unitOf = (n, u) => { const r = n % 100; return r >= 3 && r <= 10 ? u.few : r >= 11 && u.mid || u.many; };
function qty(n,u){
  if(n === 1) return u.one;
  if(n === 2) return u.two;
  return `${ar(n)} ${unitOf(n, u)}`;
}
function humanRemaining(sec){
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), out = [];
  if(h) out.push(qty(h,UNIT.hour));
  if(m || !h) out.push(qty(m,UNIT.min));
  return out.join(' و ');
}
function shortRemaining(ms){
  const d = Math.floor(ms/86400000), h = Math.floor((ms%86400000)/3600000);
  const out = [];
  if(d) out.push(qty(d,UNIT.day));
  if(h && out.length < 2) out.push(qty(h,UNIT.hour));
  if(!out.length) out.push(qty(Math.max(1, Math.ceil(ms/60000)), UNIT.min));
  return out.join(' و ');
}

function isFriday(){
  return new Intl.DateTimeFormat('en-US',{timeZone:CONFIG.timezone,weekday:'short'}).format(new Date()) === 'Fri';
}
function prayerName(x){ return x.key === 'Dhuhr' && isFriday() ? 'الجمعة' : x.name; }

const ADHAN_BAR_MIN = 10;
const untilAdhan = leftMin => humanRemaining(Math.max(60, Math.round(leftMin * 60)));
let ADHAN_LIVE = null;
const ADHAN_PRAYER_NAMES = {0:'الفجر', 2:'الظهر', 3:'العصر', 4:'المغرب', 5:'العشاء'};
function adhanLiveText(){
  if(!ADHAN_LIVE) return '';
  if(ADHAN_LIVE.name) return ADHAN_LIVE.name + '، ' + (ADHAN_LIVE.any ? 'أي زر يوقفه' : 'اختيار يوقفه');
  const n = ADHAN_LIVE.prayer === 2 && isFriday() ? 'الجمعة' : ADHAN_PRAYER_NAMES[ADHAN_LIVE.prayer];
  return (n ? 'أذان ' + n : 'الأذان') + SEP + (ADHAN_LIVE.any ? 'أي زر يوقف الأذان' : 'اختيار: إيقاف الأذان');
}
function adhanLiveTick(){
  if(CONFIG.widget || !CONFIG.adhanBar || !(window.UrtvNative && window.UrtvNative.adhan)) return;
  let s = null;
  try{ const raw = window.UrtvNative.adhan(); s = raw ? JSON.parse(raw) : null; }catch(e){}
  ADHAN_LIVE = s && s.live && typeof s.prayer === 'number' && isFinite(s.prayer) ? {prayer: +s.prayer, any: !!s.any, name: typeof s.name === 'string' ? s.name.slice(0, 60) : ''} : null;
  tickAdhanBar();
}
function adhanBarText(){
  if(!CONFIG.adhanBar) return '';
  if(ADHAN_LIVE) return adhanLiveText();
  if(!PRAYERS.length) return '';
  const p = riyadhParts(), mins = p.h*60 + p.mi + p.s/60;
  for(const x of PRAYERS){
    const at = x.h*60 + x.mi, toAdhan = at - mins;
    if(toAdhan > 0 && toAdhan <= ADHAN_BAR_MIN) return 'أذان ' + prayerName(x) + ' بعد ' + untilAdhan(toAdhan);
    const gap = x.key === 'Dhuhr' && isFriday() ? 0 : (CONFIG.iqama[x.key] || 0);
    if(mins >= at && mins < at + gap) return 'إقامة ' + prayerName(x) + ' بعد ' + humanRemaining(Math.max(60, Math.ceil(at + gap - mins)*60));
  }
  return '';
}
function tickAdhanBar(){
  const bar = document.getElementById('adbar'), t = adhanBarText();
  if(!bar) return;
  bar.hidden = !t;
  if(t) setText(bar, t);
}

const REM_GRACE = 30*60000, REM_SNOOZE = 10;
const REMS = (_Q.get('rem') || '').split('\n').map(l => {
  const p = l.split('|');
  return p.length < 7 ? null : {id: +p[0], fire: +p[1], due: +p[2], snd: p[4] === '1', text: p.slice(6).join('|').trim().slice(0, 60), shut: false, chimed: false};
}).filter(r => r && r.id > 0 && isFinite(r.fire) && isFinite(r.due) && r.text).slice(0, 12);
let REM_NOW = null, REM_FOCUS = 0;
function remNative(fn, ...a){ try{ if(window.UrtvNative && window.UrtvNative[fn]) window.UrtvNative[fn](...a); }catch(e){} }
function remCurrent(now){
  if(CONFIG.widget || ADHAN_LIVE) return null;
  return REMS.filter(r => !r.shut && r.fire <= now && now < Math.max(r.due, r.fire) + REM_GRACE).sort((a, b) => a.due - b.due)[0] || null;
}
function remSub(r, now){
  const hm = FMT_HM.format(new Date(r.due)).split(':');
  const at = 'الساعة ' + fmtTime(+hm[0], +hm[1]);
  return now >= r.due ? at + '، الآن' : at + '، بعد ' + humanRemaining(Math.max(60, Math.ceil((r.due - now) / 60000) * 60));
}
function remFocus(k){
  REM_FOCUS = k;
  document.getElementById('rm-ok').classList.toggle('on', k === 0);
  document.getElementById('rm-sz').classList.toggle('on', k === 1);
}
function remDraw(){
  const now = Date.now(), r = remCurrent(now), card = document.getElementById('rm');
  if(!card) return;
  if(!r){ if(REM_NOW){ REM_NOW = null; card.hidden = true; remNative('reminderShown', false); } return; }
  if(!REM_NOW || REM_NOW.id !== r.id){
    REM_NOW = r; remFocus(0);
    setText(document.getElementById('rm-t'), r.text);
    setText(document.getElementById('rm-sz'), 'ذكّرني بعد ' + ar(REM_SNOOZE) + ' دقائق');
    card.hidden = false;
    remNative('reminderShown', true);
    if(r.snd && !r.chimed){ r.chimed = true; remNative('reminderChime'); }
  }
  setText(document.getElementById('rm-s'), remSub(r, now));
}
function remAct(k){
  const r = REM_NOW;
  if(!r) return;
  if(k === 0){ r.shut = true; remNative('reminderDone', r.id); }
  else { r.fire = Date.now() + REM_SNOOZE*60000; remNative('reminderSnooze', r.id, REM_SNOOZE); }
  remDraw();
}
function reminderKey(k){
  if(!REM_NOW) return false;
  if(k === 'ok') remAct(REM_FOCUS);
  else if(k === 'move') remFocus(1 - REM_FOCUS);
  else { REM_NOW.shut = true; remDraw(); }
  return true;
}
window.reminderKey = reminderKey;
document.addEventListener('keydown', e => {
  if(!REM_NOW || e.altKey || e.ctrlKey || e.metaKey) return;
  const k = e.key === 'Enter' || e.key === ' ' ? 'ok' : e.key === 'ArrowLeft' || e.key === 'ArrowRight' ? 'move' : 'away';
  if(['Shift','Control','Alt','Meta','CapsLock','Dead'].includes(e.key)) return;
  e.preventDefault(); e.stopImmediatePropagation();
  reminderKey(k);
}, true);
document.getElementById('rm-ok').onclick = () => remAct(0);
document.getElementById('rm-sz').onclick = () => remAct(1);

function tickPrayer(){
  nightPrayers();
  tickAdhanBar();
  const elL=document.getElementById('prayer-label'),
        elN=document.getElementById('prayer-name'),
        elT=document.getElementById('prayer-time'),
        elC=document.getElementById('prayer-count'),
        panel=document.querySelector('.p-prayer');
  if(!PRAYERS.length) return;
  const p = riyadhParts();
  const mins = p.h*60 + p.mi + p.s/60;
  const fill = document.getElementById('pbar-fill');
  if(CONFIG.prayerBar && fill) fill.style.width = (prayerBarFraction(mins) * 100).toFixed(1) + '%';
  elN.hidden = false;

  const cur = PRAYERS.find(x=>{
    const at = x.h*60 + x.mi;
    const gap = (x.key === 'Dhuhr' && isFriday()) ? 0 : (CONFIG.iqama[x.key] || 0);
    return mins >= at && mins < at + gap;
  });
  if(cur){
    const left = (cur.h*60 + cur.mi + CONFIG.iqama[cur.key]) - mins;
    if(!panel.classList.contains('now')) panel.classList.add('now');
    setText(elL, 'حان الآن');
    setText(elN, prayerName(cur));
    setText(elT, fmtTime(cur.h, cur.mi));
    setHTML(elC, 'الإقامة بعد <b>' + humanRemaining(Math.max(60, Math.ceil(left)*60)) + '</b>');
    return;
  }

  if(panel.classList.contains('now')) panel.classList.remove('now');
  if(CONFIG.sunrise && sunrisePanel(mins, elL, elN, elT, elC)) return;
  setText(elL, 'الصلاة القادمة');
  let next = PRAYERS.find(x => (x.h*60+x.mi) > mins);
  const leftM = next ? (next.h*60 + next.mi) - mins
                     : (PRAYERS[0].h*60 + PRAYERS[0].mi) + 1440 - mins;
  if(!next) next = PRAYERS[0];
  setText(elN, prayerName(next));
  setText(elT, fmtTime(next.h, next.mi));
  setHTML(elC, 'بعد <b>' + untilAdhan(leftM) + '</b>');
}

function prayerBarFraction(mins){
  const at = PRAYERS.map(x => x.h*60 + x.mi);
  if(CONFIG.sunrise && DAY_TIMES && DAY_TIMES.Sunrise){ const [h, m] = String(DAY_TIMES.Sunrise).split(':').map(Number); at.push(h*60 + m); }
  at.sort((a, b) => a - b);
  const last = at.filter(t => t <= mins).pop(), next = at.find(t => t > mins);
  const from = last !== undefined ? last : at[at.length-1] - 1440, to = next !== undefined ? next : at[0] + 1440;
  return Math.max(0, Math.min(1, (mins - from) / Math.max(1, to - from)));
}

const SUNRISE_AFTER_MIN = 30;
function sunrisePanel(mins, elL, elN, elT, elC){
  const fajr = PRAYERS.find(x => x.key === 'Fajr');
  if(!DAY_TIMES || !DAY_TIMES.Sunrise || !fajr) return false;
  const [sh, sm] = String(DAY_TIMES.Sunrise).split(':').map(Number), at = sh*60 + sm, from = fajr.h*60 + fajr.mi + (CONFIG.iqama.Fajr || 0);
  if(mins >= from && mins < at){
    setText(elL, 'الشروق'); elN.hidden = true; setText(elT, fmtTime(sh, sm));
    setHTML(elC, 'بعد <b>' + untilAdhan(at - mins) + '</b>');
    return true;
  }
  const ago = mins - at;
  if(ago >= 0 && ago < SUNRISE_AFTER_MIN){
    setText(elL, 'الشروق'); elN.hidden = true; setText(elT, fmtTime(sh, sm));
    setHTML(elC, ago < 1 ? 'الآن' : 'قبل <b>' + humanRemaining(Math.max(60, Math.floor(ago) * 60)) + '</b>');
    return true;
  }
  return false;
}

const OCCASIONS = [
  {hm:9,  hd:1,  days:30, name:'رمضان',             year:true, today:'رمضان مبارك'},
  {hm:10, hd:1,  days:3,  name:'عيد الفطر',          today:'عيد مبارك'},
  {hm:12, hd:1,  days:1,  name:'عشر ذي الحجة',       today:'اليوم أول أيام العشر'},
  {hm:12, hd:9,  days:1,  name:'يوم عرفة',           today:'اليوم يوم عرفة'},
  {hm:12, hd:10, days:4,  name:'عيد الأضحى',         today:'عيد مبارك'},
  {hm:1,  hd:1,  days:1,  name:'رأس السنة الهجرية',  today:'اليوم رأس السنة الهجرية'},
  {hm:1,  hd:10, days:1,  name:'عاشوراء',            today:'اليوم عاشوراء', note:'ويُستحب صيام التاسع'},
];
const OCC_TEXT = {unit:'يوم', expected:'متوقّع'};

let OCC_CACHE = {day:'', val:null};
function occasionNow(){
  const dayKey = FMT_DATE.format(new Date());
  if(OCC_CACHE.day === dayKey) return OCC_CACHE.val;
  const fmt = new Intl.DateTimeFormat('en-u-ca-islamic-umalqura',{timeZone:CONFIG.timezone,year:'numeric',month:'numeric',day:'numeric'});
  const hijri = d => fmt.formatToParts(hijriAt(d)).reduce((a,x) => (a[x.type] = +x.value.replace(/[^0-9]/g,''), a), {});
  const base = Date.now();
  let val = null, found = {};
  for(let i = 0; i < 400 && !val; i++){
    const d = new Date(base + i*86400000), h = hijri(d);
    if(i === 0){
      const o = OCCASIONS.find(o => h.month === o.hm && h.day >= o.hd && h.day < o.hd + o.days);
      if(o){ val = {o, today:true, hy:h.year}; break; }
    }
    OCCASIONS.forEach(o => {
      if(i > 0 && h.month === o.hm && h.day === o.hd && !found[o.name]){
        const p = riyadhParts(d);
        found[o.name] = {o, days:i, hy:h.year, y:p.y, mo:p.mo, d:p.d};
      }
    });
    if(Object.keys(found).length === OCCASIONS.length) break;
  }
  if(!val) val = Object.values(found).sort((a, b) => a.days - b.days)[0] || null;
  OCC_CACHE = {day: dayKey, val};
  return val;
}

function hijriMonthNow(raw){
  const at = raw ? new Date() : hijriAt(new Date());
  try{
    const m = +new Intl.DateTimeFormat('en-u-ca-islamic-umalqura',{timeZone:CONFIG.timezone,month:'numeric'}).format(at).replace(/[^0-9]/g,'');
    if(m >= 1 && m <= 12) return m;
  }catch(e){}
  return tabularHijriMonth(at);
}
function tabularHijriMonth(d){
  const p = riyadhParts(d), a = Math.floor((14 - p.mo) / 12), y = p.y + 4800 - a, mo = p.mo + 12 * a - 3;
  const jd = p.d + Math.floor((153 * mo + 2) / 5) + 365 * y + Math.floor(y / 4) - Math.floor(y / 100) + Math.floor(y / 400) - 32045;
  let l = jd - 1948440 + 10632;
  const n = Math.floor((l - 1) / 10631);
  l = l - 10631 * n + 354;
  const j = Math.floor((10985 - l) / 5316) * Math.floor(50 * l / 17719) + Math.floor(l / 5670) * Math.floor(43 * l / 15238);
  l = l - Math.floor((30 - j) / 15) * Math.floor(17719 * j / 50) - Math.floor(j / 16) * Math.floor(15238 * j / 43) + 29;
  return Math.floor(24 * l / 709);
}
function tickOccasion(){
  const elL=document.getElementById('occ-label'),
        elD=document.getElementById('occ-days'),
        elS=document.getElementById('occ-sub');

  const nat = nationalNow();
  if(nat && nat.today){
    setText(elL, nat.short);
    setHTML(elD, '<span class="txt">كل عام والوطن بخير</span>');
    setText(elS, '');
    return;
  }

  if(hijriMonthNow() === 9 && PRAYERS.length){
    const rp = riyadhParts();
    const mins = rp.h*60 + rp.mi + rp.s/60;
    const fajr = PRAYERS.find(p=>p.key==='Fajr');
    const maghrib = PRAYERS.find(p=>p.key==='Maghrib');
    const fajrM = fajr.h*60 + fajr.mi, maghribM = maghrib.h*60 + maghrib.mi;
    let label, targetM;
    if(mins < fajrM){ label = 'الإمساك'; targetM = fajrM; }
    else if(mins < maghribM){ label = 'الإفطار'; targetM = maghribM; }
    else { label = 'الإمساك'; targetM = fajrM + 1440; }
    const th = Math.floor((targetM % 1440) / 60), tm = targetM % 60;
    setText(elL, label);
    const at = timeParts(th, tm);
    setHTML(elD, at.t + (at.u ? ' <span class="unit">' + at.u + '</span>' : ''));
    setHTML(elS, 'بعد <b>' + humanRemaining(Math.max(0, Math.round((targetM - mins)*60))) + '</b>');
    return;
  }

  const oc = occasionNow();
  if(!oc){ setText(elL, ''); setText(elD, '—'); setText(elS, ''); return; }
  const o = oc.o;
  setText(elL, o.name + (o.year ? ' ' + ar(oc.hy) : ''));
  if(oc.today){
    setHTML(elD, '<span class="txt">' + esc(o.today) + '</span>');
    setText(elS, '');
    return;
  }
  setHTML(elD, ar(oc.days) + ' <span class="unit">' + unitOf(oc.days, UNIT.day) + '</span>');
  setHTML(elS, esc(gregFmt({timeZone:'UTC',weekday:'long',day:'numeric',month:'long'})
      .format(new Date(Date.UTC(oc.y, oc.mo-1, oc.d, 12))).replace('،','') + SEP + OCC_TEXT.expected)
    + (o.note ? '<div class="note">' + esc(o.note) + '</div>' : ''));

const hasArabic = s => /[؀-ۿ]/.test(s);

const TL_WORDS = {the:'ذا',of:'أوف',and:'آند',a:'إيه',in:'إن',on:'أون',to:'تو',us:'أس',fc:'',cf:'',sc:'',afc:'',
  united:'يونايتد',city:'سيتي',real:'ريال',club:'كلوب',sporting:'سبورتنغ',saint:'سانت',st:'سانت'};
const TL_LETTERS = {a:'إيه',b:'بي',c:'سي',d:'دي',e:'إي',f:'إف',g:'جي',h:'إتش',i:'آي',j:'جيه',k:'كيه',l:'إل',m:'إم',
  n:'إن',o:'أو',p:'بي',q:'كيو',r:'آر',s:'إس',t:'تي',u:'يو',v:'في',w:'دبليو',x:'إكس',y:'واي',z:'زد'};
function translit(en){
  const map = {sh:'ش',kh:'خ',th:'ث',dh:'ذ',gh:'غ',ch:'تش',ph:'ف',ck:'ك',qu:'كو',ou:'و',oo:'و',ee:'ي',
    a:'ا',b:'ب',c:'ك',d:'د',e:'ي',f:'ف',g:'ج',h:'ه',i:'ي',j:'ج',k:'ك',l:'ل',m:'م',n:'ن',o:'و',p:'ب',
    q:'ق',r:'ر',s:'س',t:'ت',u:'و',v:'ف',w:'و',x:'كس',y:'ي',z:'ز'};
  const start = {a:'أ',e:'إ',i:'إ',o:'أو',u:'أ'};
  const word = w => {
    if(hasArabic(w) || !/[A-Za-z0-9]/.test(w)) return w;
    const lw = w.toLowerCase();
    if(TL_WORDS[lw] !== undefined) return TL_WORDS[lw];
    if(/^[A-Z]{2,4}$/.test(w)) return lw.split('').map(c=>TL_LETTERS[c]).join(' ');
    if(/^al-/.test(lw)) return 'ال' + word(w.slice(3));
    let out = '', x = lw.replace(/(.)\1/g,'$1');
    for(let i = 0; i < x.length;){
      const two = i+1 < x.length ? map[x.slice(i,i+2)] : undefined;
      if(i === 0 && start[x[0]] && !two){ out += start[x[0]]; i++; continue; }
      if(two){ out += two; i += 2; continue; }
      const ch = x[i];
      if(ch === 'e' && i > 0){ i++; continue; }
      if(ch === 'c' && /[eiy]/.test(x[i+1] || '')){ out += 'س'; i++; continue; }
      out += /[0-9]/.test(ch) ? ar(ch) : (map[ch] || '');
      i++;
    }
    return out;
  };
  return String(en).replace(/&/g,' و ').replace(/\bAl (?=[A-Z])/g,'Al-')
    .split(/(\s+)/).map(word).join('').replace(/\s{2,}/g,' ').trim();
}

async function wikidataArabic(en, kind){
  const api = 'https://www.wikidata.org/w/api.php?format=json&origin=*';
  const r = await fetchT(`${api}&action=wbsearchentities&type=item&limit=7&language=en&search=${encodeURIComponent(en)}`, 10000);
  const hits = ((await r.json()).search || []).filter(h => AR_KIND[kind].test(h.description || ''));
  if(!hits.length) return '';
  const r2 = await fetchT(`${api}&action=wbgetentities&props=labels&languages=ar&ids=${hits.slice(0,3).map(h=>h.id).join('|')}`, 10000);
  const ents = (await r2.json()).entities || {};
  for(const h of hits.slice(0,3)){
    const l = ents[h.id] && ents[h.id].labels && ents[h.id].labels.ar;
    if(l && l.value) return l.value.replace(/\s*\([^)]*\)\s*/g,' ').replace(/^(نادي|فريق)\s+/,'').trim();
  }
  return '';
}

let arQueue = Promise.resolve();
function arName(en, kind, id){
  if(kind === 'team' && id && TEAM_BY_ID[id]) return TEAM_BY_ID[id];
  en = String(en || '').trim();
  if(!en || hasArabic(en)) return en;
  if(kind === 'team'){
    const k = TEAM_KEYS[teamKey(en)];
    if(k) return k;
  }
  const key = kind + ':' + en;
  if(AR_NAMES[key] !== undefined) return AR_NAMES[key] || translit(en);
  if(!AR_PENDING.has(key) && !(Date.now() - (AR_FAIL[key] || 0) < AR_RETRY_MS)){
    AR_PENDING.add(key);
    arQueue = arQueue.then(async ()=>{
      try{
        AR_NAMES[key] = await wikidataArabic(en, kind);
        delete AR_FAIL[key];
        try{ localStorage.setItem('arNames', JSON.stringify(AR_NAMES)); }catch(e){}
        if(AR_NAMES[key]){ renderMatches(); renderPanel(false, 'matches'); }
      }catch(e){
        AR_FAIL[key] = Date.now();
        try{ localStorage.setItem('arFail', JSON.stringify(AR_FAIL)); }catch(_){}
      }
      AR_PENDING.delete(key);
      await sleep(CONFIG.queueGapMs);
    });
  }
  return translit(en);
}

const matchDay = d => FMT_DAY_MONTH.format(d).replace('،','');
const FMT_DM = gregFmt({timeZone:CONFIG.timezone,day:'numeric',month:'long'});

function resultBlock(done){

    + `<div class="big"><span><span class="tm">${esc(teamAr(done.strHomeTeam, done.idHomeTeam))}</span> <span class="sc">${ar(+done.intHomeScore)} - ${ar(+done.intAwayScore)}</span> <span class="tm">${esc(teamAr(done.strAwayTeam, done.idAwayTeam))}</span></span></div>`

function gameBlock(ev, now, big){
  const home = esc(teamAr(ev.strHomeTeam, ev.idHomeTeam)), away = esc(teamAr(ev.strAwayTeam, ev.idAwayTeam));

  if(calledOff(ev))
    return diff < -86400000 || diff > CONFIG.weekWindowDays * 86400000 ? ''
      : `<div class="mblock"><div class="big"><span><span class="tm">${home}</span> × <span class="tm">${away}</span></span></div><div class="sub">${offWord(ev)}${SEP}${matchDay(d)}</div></div>`;
  if(timeTbd(ev))
    return diff < -86400000 || diff > CONFIG.weekWindowDays * 86400000 ? ''
      : `<div class="mblock"><div class="big"><span><span class="tm">${home}</span> × <span class="tm">${away}</span></span></div><div class="sub">${matchDay(d)}</div></div>`;
  if(pendingResult(ev, now))
    return `<div class="mblock"><div class="big"><span><span class="tm">${home}</span> × <span class="tm">${away}</span></span></div><div class="sub">${matchWhen(d)}</div></div>`;
  if(diff < -20*60000 && ev.intHomeScore == null && /^(NS|TBD|NOT STARTED|)$/.test((ev.strStatus || '').toUpperCase()) && diff >= -durMs(ev))
    return `<div class="mblock"><div class="big"><span><span class="tm">${home}</span> × <span class="tm">${away}</span></span></div><div class="sub">${matchWhen(d)}</div></div>`;
  if(diff < -durMs(ev) || diff > CONFIG.weekWindowDays * 86400000) return '';

  const clk = ar(fmtTime(+p.hour % 24, +p.minute));

const LEAGUE_BASE = 'https://raw.githubusercontent.com/tshi-dev/UrTV/data-leagues/leagues/';
const LEAGUE_LIVE_MAX = 6;
const leagueSlug = n => String(n).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
let LEAGUE_DATA = (()=>{ try{ return JSON.parse(localStorage.getItem('leagueData') || '{}') || {}; }catch(e){ return {}; } })();
const STALE_ASK_H = 6, STALE_ASKED = new Set();
let LIVE_PATCH = {};
const catId = name => (/^id(\d{1,6})$/.exec(name) || [])[1];
async function loadCatalogueLeague(name, step){
  const id = catId(name), evs = [];
  let ok = 0;
  for(const path of ['eventsnextleague', 'eventspastleague']){
    await step();
    try{
      const r = await fetchT(`https://www.thesportsdb.com/api/v1/json/${CONFIG.sportsKey}/${path}.php?id=${id}`, 12000);
      if(!r.ok) continue;
      const j = await r.json();
      ok++;

    }catch(e){}
  }

  LEAGUE_DATA[name] = {updated: new Date().toISOString(), events: evs};
  return 1;
}
async function loadLeagues(step, ready){
  let got = 0;
  Object.keys(LEAGUE_DATA).forEach(k => { if(!CONFIG.leagues.includes(k) && !(CONFIG.tour && k === 'tournaments')) delete LEAGUE_DATA[k]; });
  const cat = (async () => { await ready; for(const [i, name] of CONFIG.leagues.entries()) if(catId(name) && followDue(i, SOFT_LEAGUES, !LEAGUE_DATA[name])) got += await loadCatalogueLeague(name, step); })();
  await Promise.all([cat, inBatches(CONFIG.leagues.filter(n => !catId(n)), 4, async name => {
    try{
      const r = await fetchData(LEAGUE_BASE + leagueSlug(name) + '.json', 12000);
      if(!r.ok) return;
      const j = await r.json();
      if(j && Array.isArray(j.events)){ LEAGUE_DATA[name] = {updated: j.updated, events: j.events}; got++; }
    }catch(e){}
  })]);
  if(CONFIG.tour) try{
    const r = await fetchData(LEAGUE_BASE + 'tournaments.json', 12000), j = r.ok && await r.json();
    if(j && Array.isArray(j.events)){ LEAGUE_DATA.tournaments = {updated: j.updated, events: j.events, names: j.names || {}}; got++; }

function leagueGames(){
  const seen = new Set(), out = [];
  CONFIG.leagues.concat(CONFIG.tour ? ['tournaments'] : []).forEach(name => {
    const d = LEAGUE_DATA[name], tour = name === 'tournaments';
    if(!d || (tour && Date.now() - Date.parse(d.updated) > 36 * 3600000)) return;
    const at = Date.parse(d.updated) || 0;
    (d.events || []).forEach(ev => {
      if(!ev || !ev.idEvent || seen.has(ev.idEvent) || isNaN(toDate(ev)) || (tour && CONFIG.tourOff.includes(String(ev.idLeague)))) return;
      seen.add(ev.idEvent);
      if(tour && d.names && d.names[ev.idLeague] && !CONFIG.leagueNames[ev.idLeague]) CONFIG.leagueNames[ev.idLeague] = d.names[ev.idLeague];
      const p = LIVE_PATCH[ev.idEvent];

function liveStatus(ev, clk){

  if(st === 'HT') return 'استراحة';
  if(['FT','AET','PEN'].includes(st)) return 'انتهت';

const loadLive = guarded('live', async function(){
  const now = Date.now();
  let asked = false;
  const live = ev => { if(!ev || !ev.idEvent || calledOff(ev) || timeTbd(ev)) return false; const k = toDate(ev).getTime(); return now >= k - 5*60000 && now <= k + durMs(ev); };
  const own = new Set(Object.values(MATCHES).filter(Boolean).map(ev => ev.idEvent));
  const look = async ev => {
    asked = true;
    try{
      const r = await fetchT(`https://www.thesportsdb.com/api/v1/json/${CONFIG.sportsKey}/lookupevent.php?id=${ev.idEvent}`, 10000);
      const j = await r.json();
      const fresh = (j.events || [])[0];
      return fresh && fresh.idEvent === ev.idEvent ? fresh : null;
    }catch(e){ return null; }
  };
  const theirs = CONFIG.leagues.length ? leagueGames().filter(ev => live(ev) && !own.has(ev.idEvent)).slice(0, LEAGUE_LIVE_MAX) : [];
  const stale = matchEvents().filter(ev => !STALE_ASKED.has(ev.idEvent) && now - toDate(ev).getTime() > STALE_ASK_H * 3600000 && pendingResult(ev, now)).slice(0, LEAGUE_LIVE_MAX);
  stale.forEach(ev => STALE_ASKED.add(ev.idEvent));
  const jobs = [
    ...Object.entries(MATCHES).map(([id, ev]) => async () => {
      if(!live(ev)) return;
      const fresh = await look(ev);
      if(fresh){ MATCHES[id] = Object.assign({}, ev, fresh); keepResult(id, MATCHES[id]); }
    }),
    ...theirs.map(ev => async () => {
      const fresh = await look(ev);
      if(fresh) LIVE_PATCH[ev.idEvent] = {at: Date.now(), ev: fresh};
    }),
    ...stale.map(ev => async () => {
      const fresh = await look(ev);
      if(!fresh) return;
      LIVE_PATCH[ev.idEvent] = {at: Date.now(), ev: fresh};
      const mend = list => (list || []).map(x => x && x.idEvent === ev.idEvent ? Object.assign({}, x, fresh) : x);
      Object.keys(MATCHES).forEach(id => { MATCHES[id] = mend([MATCHES[id]])[0]; });
      Object.keys(NEXT_LIST).forEach(id => { NEXT_LIST[id] = mend(NEXT_LIST[id]); });
      Object.keys(RESULTS).forEach(id => { RESULTS[id] = mend(RESULTS[id]); });
    }),
  ];
  for(const job of jobs){
    const before = asked;
    await job();
    if(asked !== before && job !== jobs[jobs.length - 1]) await sleep(CONFIG.queueGapMs);
  }
  if(asked){ MATCH_REV++; renderMatches(); }
});

function eventInfo(key, ev){

  let title = '', session = '', head = '', pre = '', card = '';

    const gp = name.match(/^(.*?)\s*grand prix/i);
    const place = gp ? foldKey(gp[1].replace(/\bformula\s*1\b/i,'').replace(/\b20\d\d\b/,'')) : '';
    const rest = name.replace(/^.*?grand prix/i,'');
    for(const [rx, label] of SESSIONS){
      const m = (rest || name).match(rx);
      if(!m) continue;
      session = label || 'التجارب الحرة ' + arDigits(m[1] || m[2] || '');
      break;
    }
    if(!session) session = 'السباق';
    const gpName = gp ? 'جائزة ' + (GP_AR[place] || trl(gp[1].trim())) + ' الكبرى' : trl(name);

    pre = session;

  }else{
    let prefix = '', rest = name;
    const u = key === 'ufc' ? name.match(/^UFC(\s+Fight\s+Night)?\s*(\d+)?\s*[:\-]?\s*(.*)$/i) : null;
    if(u){ prefix = 'UFC' + (u[1] ? ' فايت نايت' : '') + (u[2] ? ' ' + arDigits(u[2]) : ''); rest = u[3]; }
    let pair = ev.strHomeTeam && ev.strAwayTeam ? [ev.strHomeTeam, ev.strAwayTeam] : rest.split(/\s+vs\.?\s+/i);
    const body = pair.length === 2 ? trl(pair[0]) + ' × ' + trl(pair[1]) : trl(rest);

    const two = per > 1 && i + 1 < slots.length && !NARROW.has(pairKey(slots[i], slots[i + 1]));

const FIT_STEPS = [1, .92, .85, .78, .72];
const FIT_RANGE = document.createRange();
function fits(sp){
  FIT_RANGE.selectNodeContents(sp);
  const cs = getComputedStyle(sp);
  return FIT_RANGE.getBoundingClientRect().width <= sp.getBoundingClientRect().width - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) + .05;
}
const shorten = sp => sp.querySelectorAll('.tm').forEach(t => { const n = t.querySelector('.nm') || t, s = t.dataset.short || TEAM_SHORT[n.textContent.trim()]; if(s) n.textContent = s; });
function fitMatches(row){
  const spans = [...row.querySelectorAll('.mblock .big > span')];
  const size = k => spans.forEach(sp => { sp.style.fontSize = k === 1 ? '' : k + 'em'; });
  const step = () => FIT_STEPS.find(k => { size(k); return spans.every(fits); });
  if(step()) return true;
  spans.forEach(shorten);
  if(step()) return true;
  size(FIT_STEPS[FIT_STEPS.length - 1]);
  return false;
}
const rowCut = row => {
  const r = row.getBoundingClientRect();
  return [...row.children].some(c => { const b = c.getBoundingClientRect(); return b.width && (b.left < r.left - .05 || b.right > r.right + .05); });
};
function fitGameRow(li){
  const row = li.firstElementChild;
  if(!row || !row.classList.contains('mr')) return;
  const names = row.querySelectorAll('.nm'), when = row.querySelector('.mwhen');
  names.forEach(n => { if(n.dataset.full === undefined) n.dataset.full = n.textContent; n.textContent = n.dataset.full; });
  if(when){ if(when.dataset.full === undefined) when.dataset.full = when.textContent; when.textContent = when.dataset.full; }
  row.style.fontSize = '';
  row.classList.remove('nocr');
  const size = (steps = FIT_STEPS) => steps.find(k => { row.style.fontSize = k === 1 ? '' : k + 'em'; return !rowCut(row); });
  if(size([1])) return;
  row.classList.add('nocr');
  if(size([1])) return;
  shorten(row);
  if(size([1])) return;
  if(when && when.dataset.s) when.textContent = when.dataset.s;
  if(size()) return;
  size([...FIT_STEPS, .64, .56, .5]);
}
function shortenRows(ul){
  const games = [...ul.querySelectorAll('li.mg')];
  games.forEach(fitGameRow);
  const k = Math.min(1, ...games.map(li => parseFloat(li.firstElementChild.style.fontSize) || 1));
  if(k < 1) games.forEach(li => { li.firstElementChild.style.fontSize = k + 'em'; });
  ul.querySelectorAll('li:not(.mg)').forEach(li => {
    const sp = li.firstElementChild;
    if(!sp || !sp.matches('span') || fits(sp)) return;
    shorten(sp);
    if(!fits(sp)) sp.querySelectorAll('img.cr').forEach(i => i.remove());
    if(!fits(sp)) FIT_STEPS.slice(1).find(k => { sp.style.fontSize = k + 'em'; return fits(sp); });
  });
}

function alignGames(card){

  rows.forEach(r => { r.children[2].style.marginInlineEnd = ''; r.lastElementChild.style.minWidth = ''; });
  if(rows.length < 2) return;
  const rtl = getComputedStyle(rows[0]).direction === 'rtl', edge = (r, e) => { const a = r.getBoundingClientRect(), b = e.getBoundingClientRect(); return rtl ? a.right - b.left : b.right - a.left; };
  const clubs = rows.map(r => edge(r, r.children[2])), when = rows.map(r => r.lastElementChild.getBoundingClientRect().width);
  const W = Math.max(...clubs), D = Math.max(...when);
  rows.forEach((r, i) => {
    const em = parseFloat(getComputedStyle(r).fontSize) || 16;
    r.children[2].style.marginInlineEnd = ((W - clubs[i]) / em).toFixed(3) + 'em';
    r.lastElementChild.style.minWidth = (D / parseFloat(getComputedStyle(r.lastElementChild).fontSize || em)).toFixed(3) + 'em';
    if(r.scrollWidth > r.clientWidth + 1){ r.children[2].style.marginInlineEnd = ''; r.lastElementChild.style.minWidth = ''; }
  });
}

function fastReasons(hm, hd, wd){
  if((hm === 10 && hd === 1) || (hm === 12 && hd >= 10 && hd <= 13)) return [];
  const out = [];
  if(hm === 9) return ['ramadan'];
  if(hm === 12 && hd === 9) out.push('arafah');
  if(hm === 1 && hd === 9) out.push('tasua');
  if(hm === 1 && hd === 10) out.push('ashura');
  if(hd >= 13 && hd <= 15) out.push('white');
  if(wd === 1) out.push('mon');
  if(wd === 4) out.push('thu');
  if(hm === 10 && hd >= 2) out.push('shawwal');
  return out;
}
const FAST_HIJRI = new Intl.DateTimeFormat('en-u-ca-islamic-umalqura', {timeZone:'UTC', month:'numeric', day:'numeric'});
function fastingNext(now){
  const p = riyadhParts(now), base = Date.UTC(p.y, p.mo - 1, p.d, 12);

async function fetchT(url, ms){

async function yahooChart(sym, q = 'interval=1d&range=5d'){
  if(Date.now() - (YH_404[sym] || 0) < YH_404_MS) throw 0;
  const gone = () => { YH_404[sym] = Date.now(); try{ localStorage.setItem('yh404', JSON.stringify(YH_404)); }catch(e){} throw 0; };
  const direct = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(sym)}?${q}`;
  const routes = [
    [direct, 7000, j => j, false],
    ['https://api.allorigins.win/get?url=' + encodeURIComponent(direct), 15000, w => JSON.parse(w.contents), true],
    ['https://corsproxy.io/?url=' + encodeURIComponent(direct), 12000, j => j, true],
  ];
  for(const [url, ms, unwrap, proxy] of routes){
    let r;
    try{ r = await fetchT(url, ms); }

async function directQuote(j){
  try{
    if(j.cg){
      const r = await fetchT(`https://api.coingecko.com/api/v3/simple/price?ids=${j.cg}&vs_currencies=usd&include_24hr_change=true`, 10000);
      if(!r.ok) throw 0;
      const c = (await r.json())[j.cg];
      if(!c || typeof c.usd !== 'number') throw 0;
      return {p:c.usd, v:null, c:[], pct:c.usd_24h_change != null ? c.usd_24h_change : (c.usd_24hr_change != null ? c.usd_24hr_change : null), at:Date.now()};
    }
    const res = (await yahooChart(j.key, j.intra ? 'interval=15m&range=1d' : 'interval=1d&range=5d')).chart.result[0];
    const price = res.meta.regularMarketPrice;
    if(typeof price !== 'number') throw 0;
    let c = ((res.indicators.quote[0] || {}).close || []).filter(x => typeof x === 'number');
    const was = res.meta.chartPreviousClose || res.meta.previousClose || null;
    if(!j.intra) return {p:price, v:c.length >= 2 ? c[c.length-2] : was, c:[], at:Date.now()};
    if(c.length > 30){ const n = Math.ceil(c.length / 30); c = c.filter((x, i) => i % n === 0 || i === c.length - 1); }
    return {p:price, v:was, c, at:Date.now()};
  }catch(e){ return null; }
}

let WEEK_OK_AT = 0, WEEK_FAIL_AT = 0;
const loadWeek = guarded('week', async function(){
  const F = CONFIG.shows, seen = new Set(), out = [];
  let asked = 0, failed = 0, answered = 0;
  const ask = async url => {
    if(asked++) await sleep(CONFIG.weekGapMs);
    try{ const r = await fetchT(url, 12000); if(!r.ok) throw 0; const j = await r.json(); answered++; return j; }
    catch(e){ failed++; return null; }
  };
  const days = [];
  for(let i=0;i<7;i++) days.push(FMT_DATE.format(new Date(Date.now()+i*86400000)));
  const inWeek = d => d && d >= days[0] && d <= days[6];
  const add = (s, e, picked) => {
    if(!s || !s.name || seen.has(s.name)) return;
    seen.add(s.name);
    const prem = e.number === 1;
    out.push({
      name: s.name,
      ep: e.season ? (prem ? `الموسم ${ar(e.season)}` : `الموسم ${ar(e.season)}${SEP}ح ${ar(e.number)}`) : '',
      date: e.airdate || '',
      rating: (s.rating && s.rating.average) || 0,
      prem, picked
    });
  };

  for(const id of F.ids){
    const s = await ask(`https://api.tvmaze.com/shows/${id}?embed=nextepisode`);
    const e = s && s._embedded && s._embedded.nextepisode;
    if(e && inWeek(e.airdate)) add(s, e, true);
  }

  if(!F.ids.length || F.genres.length || F.langs.length){
    const lists = [];
    for(const dt of days){
      lists.push(await ask(`https://api.tvmaze.com/schedule/web?date=${dt}`));
      for(const c of F.countries) lists.push(await ask(`https://api.tvmaze.com/schedule?country=${encodeURIComponent(c)}&date=${dt}`));
    }
    lists.filter(Array.isArray).reduce((all, list) => all.concat(list), []).forEach(e => {
      const s = e.show || (e._embedded && e._embedded.show) || {};
      if(s.type && SKIP_TYPES.includes(s.type)) return;
      if(s.genres && s.genres.includes('Soap')) return;
      if(!e.number || e.number < 1) return;
      if(e.season && e.season > 15) return;
      if(((s.rating && s.rating.average) || 0) < F.minRating) return;
      if(F.genres.length && !(s.genres || []).some(g => F.genres.includes(g))) return;
      if(F.langs.length && !F.langs.includes(s.language)) return;
      add(s, e, false);
    });
  }

  const whole = answered > 0 && failed === 0;
  if(!whole && !(answered > 0 && !WEEK_POOL.length && out.length)){
    WEEK_FAIL_AT = Date.now();
    if(!WEEK_OK_AT) setTimeout(loadWeek, CONFIG.retryMs);
    renderPanel(false, 'shows');
    return;
  }
  WEEK_POOL = out.sort((a,b)=> (b.picked - a.picked) || (b.prem - a.prem) || a.date.localeCompare(b.date)).slice(0, 50);
  CARDS.forEach(c => { if(c.kind === 'shows') c.page = 0; });
  WEEK_OK_AT = Date.now(); WEEK_FAIL_AT = 0;
  WEEK_LOADED = true;
  renderPanel(false, 'shows');
});

  if(PRAYERS.length){
    const p = riyadhParts(), mins = p.h * 60 + p.mi + p.s / 60;
    let n = PRAYERS.find(x => x.h * 60 + x.mi > mins), tomorrow = false;
    if(!n){ n = PRAYERS[0]; tomorrow = true; }
    rows.push(tdRow('الصلاة القادمة', `${prayerName(n)}${SEP}${fmtTime(n.h, n.mi)}`, 'بعد ' + shortHM(Math.max(0, Math.round((n.h * 60 + n.mi + (tomorrow ? 1440 : 0) - mins) * 60)))));
  }
  const g = nextFollowedGame(now);
  if(g){
    const live = now >= g.k;
    rows.push(tdRow('المباراة', `<span class="tm">${esc(teamAr(g.ev.strHomeTeam, g.ev.idHomeTeam))}</span> × <span class="tm">${esc(teamAr(g.ev.strAwayTeam, g.ev.idAwayTeam))}</span>`,
      live ? '<span class="live">مباشر</span>' : 'بعد ' + shortRemaining(g.k - now).split(' و ')[0]));
  }
  if(CONFIG.tasks.length) rows.push(tdRow('المهمة', esc(CONFIG.tasks[0])));
  const oc = occasionNow();
  if(oc){
    const name = oc.o.name + (oc.o.year ? ' ' + ar(oc.hy) : '');
    rows.push(tdRow(oc.today ? 'اليوم' : 'المناسبة القادمة', esc(name), oc.today ? '' : 'بعد ' + qty(oc.days, UNIT.day)));
  }
  return {title: 'يومك', rows};
}

function liveWhen(ev){
  const p = hmParts(toDate(ev));
  return `<span class="live">مباشر</span>${SEP}${liveStatus(ev, ar(fmtTime(+p.hour % 24, +p.minute)))}`;
}
const liveScore = ev => ev.intHomeScore != null && ev.intAwayScore != null ? `<span class="sc">${ar(+ev.intHomeScore)} - ${ar(+ev.intAwayScore)}</span>` : '<span class="sc">×</span>';
function nextTeamGame(now){
  return matchEvents().filter(ev => fbMine(ev) && !calledOff(ev) && !FINAL.includes(String(ev.strStatus || '').toUpperCase()) && fbKick(ev) + durMs(ev) > now).sort((a, b) => fbKick(a) - fbKick(b))[0] || null;
}
function liveRow(ev){
  return `<li class="lv"><div class="lvm">${liveWhen(ev)}</div><div class="lvt"><span class="tm"><span class="nm">${esc(teamAr(ev.strHomeTeam, ev.idHomeTeam))}</span>${crestImg(ev, 'Home')}</span>`
    + `${liveScore(ev)}<span class="tm">${crestImg(ev, 'Away')}<span class="nm">${esc(teamAr(ev.strAwayTeam, ev.idAwayTeam))}</span></span></div></li>`;
}
function fitLive(ul){
  ul.querySelectorAll('.lvt').forEach(t => {
    const ok = () => t.scrollWidth <= t.clientWidth + .5;
    const step = (steps = FIT_STEPS) => steps.find(k => { t.style.setProperty('--k', k); return ok(); });
    if(step()) return;
    shorten(t);
    if(step()) return;
    t.querySelectorAll('img.cr').forEach(i => i.remove());
    step([...FIT_STEPS, .64, .56, .5]);
  });
}

const SMART_GAME_MIN = 60, SMART_PRAYER_MIN = 15;
function focusGames(now, liveOnly){
  const seen = new Set(), out = [];
  const lg = leagueMap();
  CONFIG.teamIds.forEach(id => teamNext(id, lg).forEach(ev => {
    if(!ev || !ev.idEvent || seen.has(ev.idEvent)) return;
    seen.add(ev.idEvent);
    const k = toDate(ev).getTime(), st = (ev.strStatus || '').toUpperCase();
    if(isNaN(k) || FINAL.includes(st) || calledOff(ev) || timeTbd(ev)) return;
    const live = now >= k && now < k + durMs(ev), soon = now < k && k - now <= SMART_GAME_MIN * 60000;
    if(live || (soon && !liveOnly)) out.push(ev);
  }));
  return out.sort((a, b) => toDate(a) - toDate(b));
}
function prayerSoon(minutes){
  const p = riyadhParts(), now = p.h * 60 + p.mi + p.s / 60;
  return PRAYERS.some(x => { const d = x.h * 60 + x.mi - now; return d > 0 && d <= minutes; });
}
function smartKind(now = Date.now()){
  if(CONFIG.teamIds.length && focusGames(now).length) return 'matches';
  if(prayerSoon(SMART_PRAYER_MIN)) return 'prayerrow';
  const w = adhkarWindow();
  if(w === 'morning' || w === 'evening') return 'adhkar';
  return 'hourly';
}

function renderCard(card, animate, keepSize){
  const ul = card.ul, hd = card.hd;
  const was = card.eff;
  card.eff = card.kind === 'smart' ? smartKind() : card.kind === 'nextmatch' ? 'matches' : card.kind;
  const P = card.eff;
  ul.classList.toggle('pgrid', P === 'prayers');
  card.el.classList.toggle('boxes', P === 'prayers');
  if(P !== was){
    card.page = 0; card.skip = 0; card.maxLen = 0; ul.__h = null;
    if(was === 'adhkar'){ clearTimeout(card.ad.t); card.ad.t = 0; card.ad.mode = ''; }
  }
  if(!keepSize){ card.z = 1; card.cap = 0; card.maxLen = 0; card.zi = 0; card.ri = 0; card.el.style.removeProperty('--z'); }
  if(P === 'shows'){
    const by = '<span class="srcl">TVmaze</span>';
    if(WEEK_OK_AT && WEEK_FAIL_AT > WEEK_OK_AT) paintHd(hd, '', `<span>${PANEL_TITLE.shows}</span><span class="until">${fmtAgo(WEEK_OK_AT)}</span>${by}`);
    else paintHd(hd, '', `<span>${PANEL_TITLE.shows}</span>${by}`);
    renderWeekPage(card, animate); return;
  }
  card.el.classList.toggle('stocks', P === 'stocks');
  card.el.classList.toggle('nm1', card.kind === 'nextmatch' && !OLD_LOOK);
  let rows = [];
  if(P === 'prayers') rows = prayerRows();
  else if(P === 'forecast') rows = forecastRows();
  else if(P === 'hourly') rows = hourlyRows();
  else if(P === 'prayerrow'){ const q = prayerRowCard(); paintHd(hd, q.title); rows = q.rows; }
  else if(P === 'nextprayer') rows = nextPrayerRows();
  else if(P === 'matches'){
    rows = matchRows(card);
    const n = card.kind === 'nextmatch' && rows.length && nextTeamGame(Date.now()), meet = n && !fbLive(n, Date.now()) && h2hLine(n);
    if(meet) rows = rows.concat(`<li class="h2l"><span>${esc(meet)}</span></li>`);
  }
  else if(SPORT_KINDS.includes(P)){ const q = SPORTS ? SPORTS.card(card, P) : {rows: [`<li class="empty">${matchesEmptyText()}</li>`]}; rows = q.rows; if(q.titleHtml) paintHd(hd, '', q.title); else paintHd(hd, q.title || PANEL_TITLE[P]); }
  else if(P === 'year') rows = [yearCard(card)];
  else if(P === 'album') rows = [albumCard(card)];
  else if(P === 'today'){ const q = todayCard(); paintHd(hd, q.title); rows = q.rows; }
  else if(P === 'tasks') rows = CONFIG.tasks.map(t => `<li class="task"><span>${esc(t)}</span></li>`);
  else if(P === 'verse' || P === 'hadith'){ const q = quoteOfDay(card, P === 'hadith' ? 'hadith' : CONFIG.cards.includes('hadith') ? 'verse' : CONFIG.verseKind); paintHd(hd, q.title); rows = q.rows; }
  else if(P === 'wisdom'){ const q = wisdomOfDay(); paintHd(hd, q.title); rows = q.rows; }
  else if(P === 'adhkar'){ const q = adhkarCard(card); paintHd(hd, q.title, q.hd); rows = q.rows; }
  else if(P === 'stocks'){ const q = stocksCard(); paintHd(hd, '', q.hd); rows = q.rows; }
  const title = PANEL_TITLE[card.kind === 'nextmatch' ? 'nextmatch' : P];
  if(P === 'matches' && matchesStaleNote()) paintHd(hd, '', `<span>${title}</span><span class="until">${matchesStaleNote()}</span>`);
  else if(P === 'tasks' && !OLD_LOOK && CONFIG.tasks.length) paintHd(hd, '', `<span>${PANEL_TITLE.tasks}</span><span class="until near">${qty(CONFIG.tasks.length, UNIT.task)}</span>`);
  else if(title && !SPORT_KINDS.includes(P)) paintHd(hd, title);
  if(!rows.length){
    if(P === 'matches' && !MATCHES_LOADED && ul.firstElementChild && !ul.firstElementChild.classList.contains('empty')) return;
    if(P === 'matches' && ul.firstElementChild && ul.firstElementChild.classList.contains('empty') && ul.firstElementChild.textContent === matchesEmptyText()) return;
    ul.classList.remove('flip');
    setHTML(ul, `<li class="empty">${P === 'matches' ? matchesEmptyText() : P === 'tasks' ? 'لا مهام اليوم' : 'لا تتوفر بيانات الآن'}</li>`);
    return;
  }
  const per = card.cap || (P === 'matches' ? MATCH_ROWS : WEEK_ROWS);
  if((P === 'matches' || P === 'stocks' || P === 'tasks') && rows.length > per){
    if(P === 'matches'){
      const pages = Math.ceil(rows.length / per), start = (card.page % pages) * per;
      rows = rows.slice(start, start + per);
    }else{
      const start = (card.page * per) % rows.length;
      rows = Array.from({length: per}, (_, i) => rows[(start + i) % rows.length]);
    }
  }
  const wrote = setHTML(ul, rows.join(''), animate);
  if(!keepSize){ card.base = rows.length; card.len0 = card.len || 0; }
  if(P === 'matches'){ fillCrests(ul); if(wrote){ shortenRows(ul); fitLive(ul); } alignGames(card); }
  fitQuote(ul);
  if(CONFIG.tafsir) fitTafsir(ul);
  ul.classList.remove('flip');
  if(animate){ void ul.offsetWidth; ul.classList.add('flip'); }
}

const Z_STEPS = [1, .94, .88, .82, .76, .7, .64];
function cardCut(card){
  for(const e of card.el.querySelectorAll('li, li *, .hd > span')){
    if(e.clientWidth > 0 && e.scrollWidth > e.clientWidth + 1) return true;
    if(!CONFIG.widget && e.clientWidth > 0 && e.scrollWidth >= e.clientWidth && getComputedStyle(e).textOverflow === 'ellipsis' && !fits(e)) return true;
  }
  return false;
}
const PAIR_FLOOR = {row: .021, small: .0145};
function aboveFloor(c){
  const vh = innerHeight, z = parseFloat(c.el.style.getPropertyValue('--z')) || 1, px = e => parseFloat(getComputedStyle(e).fontSize);
  const under = (e, floor) => { const now = px(e); return now < Math.min(floor * vh, now / z) - .05; };
  for(const li of c.ul.children) if(li.textContent.trim() && under(li, PAIR_FLOOR.row)) return false;
  for(const e of c.el.querySelectorAll('.hd, li *')) if(e.children.length === 0 && e.textContent.trim() && under(e, PAIR_FLOOR.small)) return false;
  return true;
}
function shrinkCard(c, tooWide){
  if(!CONFIG.widget){
    const zi = c.zi;
    if(c.zi < Z_STEPS.length - 1){
      c.zi++; c.el.style.setProperty('--z', Z_STEPS[c.zi]);
      const ok = aboveFloor(c);
      c.zi = zi; c.el.style.setProperty('--z', Z_STEPS[zi]);
      if(!ok) return shrinkByContent(c);
    }else return shrinkByContent(c);
  }
  const list = LISTS.includes(c.eff), quote = c.eff === 'verse' || c.eff === 'hadith' || c.eff === 'adhkar', zLeft = c.zi < Z_STEPS.length - 1;
  if(tooWide){ if(!zLeft) return false; c.zi++; }
  else if(list && c.ri < c.base - 1) c.ri++;
  else if(quote && c.zi < 3) c.zi++;
  else if(quote && c.ri < 6) c.ri++;
  else if(zLeft) c.zi++;
  else return false;
  const cap = list && c.ri ? c.base - c.ri : 0, maxLen = quote && c.ri ? Math.max(20, Math.floor(c.len0 * Math.pow(.8, c.ri))) : 0;
  c.z = Z_STEPS[c.zi];
  c.el.style.setProperty('--z', c.z);
  if(c.eff === 'matches') shortenRows(c.ul);
  if(cap !== c.cap || maxLen !== c.maxLen){ c.cap = cap; c.maxLen = maxLen; renderCard(c, false, true); }
  return true;
}
function shrinkByContent(c){
  const list = LISTS.includes(c.eff), quote = c.eff === 'verse' || c.eff === 'hadith' || c.eff === 'adhkar';
  if(list && c.ri < c.base - 1) c.ri++;
  else if(quote && c.ri < 6) c.ri++;
  else return false;
  const cap = list ? c.base - c.ri : 0, maxLen = quote ? Math.max(20, Math.floor(c.len0 * Math.pow(.8, c.ri))) : 0;
  if(cap !== c.cap || maxLen !== c.maxLen){ c.cap = cap; c.maxLen = maxLen; renderCard(c, false, true); }
  return true;
}
function fitCards(){
  if(CARDS.length < 2 && !CONFIG.widget) return;
  const mid = document.querySelector('.mid');
  const tooTall = CONFIG.widget ? () => mid.getBoundingClientRect().height > innerHeight + .5 : pairTooTall;
  mid.classList.add('fit');
  try{
    for(let g = 0; g < 120; g++){
      const tall = tooTall();
      const cut = CARDS.filter(cardCut);
      if(!tall && !cut.length) return;
      if(cut.some(c => shrinkCard(c, true))) continue;
      if(!tall || !CARDS.slice().sort((a, b) => b.el.offsetHeight - a.el.offsetHeight).some(c => shrinkCard(c))) return;
    }
  }finally{ mid.classList.remove('fit'); }
}
function pairTooTall(){
  const stage = document.querySelector('.stage'), cs = getComputedStyle(stage);
  const room = stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - 2 * parseFloat(cs.rowGap)
    - document.querySelector('.top').offsetHeight - document.querySelector('.bottom').offsetHeight - .02 * innerHeight;
  return Math.max(...CARDS.map(c => c.el.offsetHeight)) > room + .5;
}

function yearFacts(){
  const p = riyadhParts(new Date(Date.now())), y = p.y;
  const total = (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0 ? 366 : 365;
  const day = Math.round((Date.UTC(y, p.mo - 1, p.d) - Date.UTC(y, 0, 1)) / 864e5) + 1;
  const pct = Math.round(100 * day / total);
  return {y, total, day, pct, text: `اليوم <b>${ar(day)}</b> من ${ar(total)}${SEP}${ar(pct)}${LATIN ? '%' : '٪'}`};
}

const ALBUM_HINT = 'أضف صورك من صفحة الجوال ← صوري';
let ALBUM_DATES = null, ALBUM_READY = null;
const FMT_ALBUM = gregFmt({timeZone:'UTC', day:'numeric', month:'long', year:'numeric'});
function albumCard(card){

  if(!ALBUM_DATES){ ALBUM_DATES = []; ALBUM_READY = (CONFIG.albumDate ? fetchT(OWN_BASE + 'dates.json', 6000).then(r => r.ok ? r.json() : []).then(j => { ALBUM_DATES = Array.isArray(j) ? j : []; }) : Promise.resolve()).catch(() => {}); }

  if(!a.t) a.t = setInterval(() => albumNext(card), CONFIG.albumMs);

function albumNext(card, first){
  const box = card.ul.querySelector('.alb .af');
  if(!box){ if(card.alb && card.alb.t){ clearInterval(card.alb.t); card.alb.t = 0; } return; }
  if(first && box.querySelector('img.on')) return;
  const a = card.alb, k = first ? a.i : (a.i = (a.i + 1) % CONFIG.own), imgs = box.querySelectorAll('img');
  const back = CONFIG.lowram || !imgs[0].classList.contains('on') ? imgs[0] : imgs[1];
  const url = OWN_BASE + (k + 1) + '.jpg?s=900', pre = new Image();
  pre.onload = () => {
    if(!box.isConnected) return;
    back.src = url;
    imgs.forEach(i => i.classList.toggle('on', i === back));
    const cap = box.parentNode.querySelector('.ac'), t = CONFIG.albumDate && ALBUM_DATES[k];
    const m = /^(\d{4})-(\d\d)-(\d\d)$/.exec(t || '');
    if(cap) cap.textContent = m ? FMT_ALBUM.format(new Date(Date.UTC(+m[1], +m[2] - 1, +m[3], 12))) : '';
  };
  pre.src = url;
}

function yearCard(card){
  const {y, total, day, pct, text} = yearFacts();
  const COLS = 36, ROWS = Math.ceil(total / COLS), PITCH = 10, R = 3.2;
  const rows = [];
  for(let r = 0; r < ROWS; r++){
    let g = '';
    for(let c = 0; c < COLS; c++){
      const n = r * COLS + c + 1;
      if(n > total) break;
      const cx = (COLS - 1 - c) * PITCH + PITCH / 2, cy = r * PITCH + PITCH / 2;
      if(n < day) g += `<circle class="on" cx="${cx}" cy="${cy}" r="${R}" fill-opacity="${(.28 + .72 * n / day).toFixed(2)}"/>`;
      else if(n === day) g += `<circle class="halo" cx="${cx}" cy="${cy}" r="${R * 3}" fill-opacity=".12"/><circle class="halo" cx="${cx}" cy="${cy}" r="${R * 1.9}" fill-opacity=".28"/><circle class="now" cx="${cx}" cy="${cy}" r="${R * 1.15}"/>`;
      else g += `<circle class="off" cx="${cx}" cy="${cy}" r="${R}"/>`;
    }
    rows.push(`<g class="r" style="--i:${r}">${g}</g>`);
  }
  const anim = !card.yearShown;
  card.yearShown = true;
  const svg = `<svg viewBox="-10 -10 ${COLS * PITCH + 20} ${ROWS * PITCH + 20}" role="img" aria-label="${ar(day)} / ${ar(total)}">${rows.join('')}</svg>`;
  return `<li class="yr${anim ? ' fill' : ''}"><div class="yn">${ar(y)}</div>${svg}`
       + `<div class="yt">${text}</div></li>`;
}

function renderYearStrip(){
  const el = document.getElementById('ystrip');
  if(!el || !CONFIG.yearStrip || CONFIG.widget) return;
  const {y, total, day} = yearFacts(), key = y + ':' + day + ':' + LATIN;
  if(el.dataset.key !== key){
    el.dataset.key = key;
    const COLS = 53, ROWS = 7, PITCH = 6, R = 2;
    let g = '';
    for(let n = 1; n <= total; n++){
      const c = (n - 1) % COLS, r = Math.floor((n - 1) / COLS);
      const cx = (COLS - 1 - c) * PITCH + PITCH / 2, cy = r * PITCH + PITCH / 2;
      if(n < day) g += `<circle class="on" cx="${cx}" cy="${cy}" r="${R}" fill-opacity="${(.3 + .7 * n / day).toFixed(2)}"/>`;
      else if(n === day) g += `<circle class="halo" cx="${cx}" cy="${cy}" r="${R * 1.9}" fill-opacity=".25"/><circle class="now" cx="${cx}" cy="${cy}" r="${R * 1.1}"/>`;
      else g += `<circle class="off" cx="${cx}" cy="${cy}" r="${R}"/>`;
    }
    el.innerHTML = `<svg viewBox="0 0 ${COLS * PITCH} ${ROWS * PITCH}" role="img" aria-label="${ar(day)} / ${ar(total)}">${g}</svg>`;
  }
  fitYearStrip();
}
function fitYearStrip(){
  const el = document.getElementById('ystrip');
  if(!el || !CONFIG.yearStrip || CONFIG.widget) return;
  el.hidden = false; el.style.removeProperty('--yp');
  const clock = document.querySelector('.clock').getBoundingClientRect(), wrap = document.querySelector('.clockwrap').getBoundingClientRect();
  const bottom = document.querySelector('.bottom').getBoundingClientRect();
  let pitch = el.querySelector('svg').getBoundingClientRect().width / 53;
  if(pitch * 53 > clock.width) { pitch = clock.width / 53; el.style.setProperty('--yp', pitch + 'px'); }
  const h = el.getBoundingClientRect().height, room = bottom.top - wrap.bottom - 4;
  if(pitch < 3 || h + parseFloat(getComputedStyle(el).marginTop) > room) el.hidden = true;
}

function prayerRows(){
  if(!DAY_TIMES) return [];
  const p = riyadhParts(), mins = p.h * 60 + p.mi + p.s / 60;
  const names = {Fajr:'الفجر', Sunrise:'الشروق', Dhuhr:isFriday() ? 'الجمعة' : 'الظهر', Asr:'العصر', Maghrib:'المغرب', Isha:'العشاء'};
  const at = k => { const [h, mi] = String(DAY_TIMES[k]).split(':').map(Number); return h * 60 + mi; };
  const cur = PRAYERS.find(x => { const gap = x.key === 'Dhuhr' && isFriday() ? 0 : (CONFIG.iqama[x.key] || 0); return mins >= at(x.key) && mins < at(x.key) + gap; });
  const lit = cur ? cur.key : (PRAYERS.find(x => at(x.key) > mins) || PRAYERS[0] || {}).key;
  const tomorrow = !cur && PRAYERS.length && !PRAYERS.some(x => at(x.key) > mins);
  return Object.keys(names).filter(k => DAY_TIMES[k]).map(k => {
    const [h, mi] = String(DAY_TIMES[k]).split(':').map(Number);
    const cls = k === lit ? 'next' : at(k) <= mins && !(tomorrow && k === lit) ? 'past' : '';
    const cd = cls === 'next' && !cur ? '<span class="cd">' + 'بعد ' + shortHM(Math.max(60, Math.round((at(k) + (tomorrow ? 1440 : 0) - mins) * 60))) + '</span>' : '';
    return `<li class="${cls}"><span>${names[k]}</span><span class="dt">${fmtTime(h, mi)}</span>${cd}</li>`;
  });
}

const cityToday = (ms = Date.now()) => FMT_DATE.format(new Date(ms));
function forecastRows(){
  const today = cityToday(), tomorrow = new Date(Date.parse(today + 'T12:00:00Z') + DAY_MS).toISOString().slice(0, 10);
  const days = FORECAST.filter(d => d.date >= today).slice(0, 5);
  if(!days.some(d => d.date === today)) return [];
  const lo = Math.min(...days.map(d => d.lo)), span = Math.max(1, Math.max(...days.map(d => d.hi)) - lo);
  return days.map(d => {
    const day = d.date === today ? 'اليوم' : d.date === tomorrow ? 'غداً'
      : new Intl.DateTimeFormat(GREG, {timeZone:'UTC', weekday:'long'}).format(new Date(d.date + 'T12:00:00Z'));
    const a = (d.lo - lo) / span * 100, b = (d.hi - d.lo) / span * 100;
    return `<li class="fc"><span>${day}</span><span class="wxi">${wxIcon(d.code, false)}</span><span class="ep">${WX_CODES[d.code] || ''}</span>`
         + `<span class="lo">${ar(Math.round(d.lo))}°</span><span class="rg"><i style="--s:${a.toFixed(0)}%;width:${b.toFixed(0)}%"></i></span><span class="hi">${ar(Math.round(d.hi))}°</span></li>`;
  });
}

try{ CRESTS = JSON.parse(localStorage.getItem('crests') || '{}') || {}; }catch(e){}
function crestOf(ev, side){
  const u = String(ev['str' + side + 'TeamBadge'] || ''), id = String(ev['id' + side + 'Team'] || '');

function fillCrests(root){

function crestShrink(blob){
  return new Promise(done => {
    const url = URL.createObjectURL(blob), im = new Image();
    const end = v => { URL.revokeObjectURL(url); done(v); };
    im.onload = () => {
      try{
        const k = Math.min(1, CREST_PX / Math.max(im.naturalWidth, im.naturalHeight, 1)), c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(im.naturalWidth * k)); c.height = Math.max(1, Math.round(im.naturalHeight * k));
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        end(c.toDataURL('image/png'));
      }catch(e){ end(''); }
    };
    im.onerror = () => end('');
    im.src = url;
  });
}
async function crestFetch(u){
  for(const url of /\/(tiny|small|medium|preview)$/.test(u) ? [u] : [u + '/tiny', u]){
    try{
      const r = await fetchT(url, 10000);
      if(!r.ok) continue;
      const d = await crestShrink(await r.blob());
      if(d) return d;
    }catch(e){}
  }
  return '';
}
let CREST_BUSY = false;
async function loadCrests(){
  if(!CRESTS_ON || CREST_BUSY) return;
  CREST_BUSY = true;
  try{
    const want = {};
    for(const ev of matchEvents()) for(const side of ['Home', 'Away']){
      const c = crestOf(ev, side);
      if(c && !(CRESTS[c.id] && CRESTS[c.id].u === c.u)) want[c.id] = c.u;
    }
    let got = 0;
    for(const [id, u] of Object.entries(want).slice(0, CREST_PER_ROUND)){
      const d = await crestFetch(u);
      delete CRESTS[id]; CRESTS[id] = d ? {u, d} : {u}; got++;
    }
    if(!got) return;
    Object.keys(CRESTS).slice(0, Math.max(0, Object.keys(CRESTS).length - CREST_KEEP)).forEach(k => delete CRESTS[k]);
    try{ localStorage.setItem('crests', JSON.stringify(CRESTS)); }catch(e){}
    renderPanel(false, 'matches');
  }finally{ CREST_BUSY = false; }
}

function shortHM(sec){
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60);
  return [h ? ar(h) + ' س' : '', m || !h ? ar(Math.max(m, 1)) + ' د' : ''].filter(Boolean).join(' و ');
}
function nextPrayerRows(){
  if(!PRAYERS.length) return [];
  const p = riyadhParts(), mins = p.h * 60 + p.mi + p.s / 60;
  let i = PRAYERS.findIndex(x => x.h * 60 + x.mi > mins), tomorrow = false;
  if(i < 0){ i = 0; tomorrow = true; }
  const n = PRAYERS[i], at = n.h * 60 + n.mi + (tomorrow ? 1440 : 0), pr = PRAYERS[(i + PRAYERS.length - 1) % PRAYERS.length];
  const from = pr.h * 60 + pr.mi - (i === 0 && !tomorrow ? 1440 : 0), done = Math.max(0, Math.min(100, (mins - from) / Math.max(1, at - from) * 100));
  const iq = n.key === 'Dhuhr' && isFriday() ? 0 : CONFIG.iqama[n.key] || 0, q = n.h * 60 + n.mi + iq;
  const left = untilAdhan(at - mins);

    + (iq ? '<span class="iq">' + 'الإقامة' + ' ' + fmtTime(Math.floor(q / 60) % 24, q % 60) + '</span>' : '') + `<span class="pb"><i style="width:${done.toFixed(1)}%"></i></span></li>`];
}

function wxIcon(code, night){
  if(code <= 1) return night ? WX_SVG.moon : WX_SVG.sun;
  if(code === 2) return night ? WX_SVG.partnight : WX_SVG.part;
  if(code === 3) return WX_SVG.cloud;

function matchEvents(){
  const seen = new Set(), evs = [], lg = leagueMap();
  const take = ev => ev && ev.idEvent && !seen.has(ev.idEvent) && !seen.has(evKey(ev)) && seen.add(ev.idEvent) && seen.add(evKey(ev));
  CONFIG.teamIds.forEach(id => {
    const next = (NEXT_LIST[id] || (MATCHES[id] ? [MATCHES[id]] : [])).concat(archOf(id, 'next'));
    next.forEach(ev => { if(take(ev)){ const e = fresher(MATCHES[id] && MATCHES[id].idEvent === ev.idEvent ? MATCHES[id] : ev, lg); if(!calledOff(e)) evs.push(e); } });
    resultsFor(id, lg).forEach(ev => { if(take(ev) && !calledOff(ev)) evs.push(ev); });
  });
  if(CONFIG.leagues.length) leagueGames().forEach(ev => {
    if(!calledOff(ev) && take(ev)) evs.push(ev);
  });
  return evs;
}
function matchRows(card){

  const one = card && card.kind === 'nextmatch';
  if(one){ const n = nextTeamGame(now); evs = n ? evs.filter(ev => ev.idEvent === n.idEvent) : []; }
  const others = smart || one ? [] : eventRows(now);
  const shown = evs.map(ev => ({ev, t: toDate(ev).getTime(), r: gameRank(ev, now) + (ev.tour ? 100 : 0)}))
    .filter(x => finishedRecently(x.ev, now) || pendingResult(x.ev, now)

    .sort(byRank).filter((x, i, a) => !x.ev.tour || a.slice(0, i).filter(y => y.ev.tour).length < 3);

      const done = finishedRecently(ev, now), upcoming = !done && now < t, pending = r === 0 && !done;
      const when = done ? 'انتهت'

      const date = upcoming || pending ? matchNear(d, now) : done ? (OLD_LOOK || cityToday(t) !== cityToday(now) ? matchDay(d) : 'اليوم') : '';
      const dateEl = date ? `<i class="mwhen" data-s="${esc(matchWhenShort(d, now, done))}">${date}</i>` : '';

function spark(c, up){
  if(c.length < 2) return '<svg viewBox="0 0 60 16" preserveAspectRatio="none"></svg>';
  const lo = Math.min(...c), hi = Math.max(...c), span = hi - lo || 1;
  const pts = c.map((y, i) => (i * 60 / (c.length - 1)).toFixed(1) + ',' + (15 - (y - lo) / span * 14).toFixed(1)).join(' ');
  return `<svg viewBox="0 0 60 16" preserveAspectRatio="none" class="${up ? 'up' : 'down'}"><polyline points="${pts}"/></svg>`;
}

let QUOTES_FULL = false;
const quotesOk = j => j && Array.isArray(j.verses) && j.verses.length && Array.isArray(j.hadith) && j.hadith.length;
function quotes(){

    try{
      const x = new XMLHttpRequest();
      x.open('GET', u, false); x.send();
      const j = JSON.parse(x.responseText);
      if(quotesOk(j)){ VERSES = j.verses; HADITH = j.hadith; return; }
    }catch(e){}
  }

  x.onload = () => { try{ const j = JSON.parse(x.responseText); if(quotesOk(j)){ VERSES = j.verses; HADITH = j.hadith; renderPanel(false, 'verse'); } }catch(e){} };

}
const quoteSize = n => n > 420 ? ' q3' : n > 300 ? ' q2' : n > 180 ? ' q1' : '';

let TAFSIR = null;

  const next = i => {
    if(i >= urls.length) return;

const TAFSIR_PG = {t: 0};
function fitTafsir(ul){
  clearInterval(ul.__tafsirT); ul.__tafsirT = 0;
  const el = ul.querySelector('li.tafsir');
  if(!el) return;
  const tt = el.querySelector('.tt'), tp = el.querySelector('.tp'), full = el.dataset.full || (el.dataset.full = tt.textContent), words = full.split(' ');
  const card = ul.closest('.week'), bar = document.querySelector('.bottom'), mid = document.querySelector('.mid');
  const lines = () => Math.round(tt.getBoundingClientRect().height / parseFloat(getComputedStyle(tt).lineHeight));
  const crowded = () => { const c = card.getBoundingClientRect();
    return CONFIG.widget ? mid.getBoundingClientRect().height > innerHeight + .5 : c.height > .42 * innerHeight || c.bottom > bar.getBoundingClientRect().top - 4; };
  tt.style.minHeight = ''; setText(tp, '');
  for(const k of [1, .9, .82]){
    el.style.fontSize = k === 1 ? '' : 'calc(' + (CLAMP_OK ? 'clamp(11px,.92vw,17px)' : '.92vw') + '*var(--z,1)*' + k + ')';
    setText(tt, full);
    if(lines() <= 3 && !crowded()){ el.__pages = [full]; return; }
  }
  for(const max of [3, 2]){
    const pages = [];
    for(let i = 0; i < words.length;){
      let n = i + 1;
      while(n < words.length){ setText(tt, words.slice(i, n + 1).join(' ')); if(lines() > max) break; n++; }
      pages.push(words.slice(i, n).join(' ')); i = n;
    }
    let h = 0;
    for(const p of pages){ setText(tt, p); h = Math.max(h, tt.getBoundingClientRect().height); }
    tt.style.minHeight = h + 'px';
    let k = 0;
    el.__pages = pages;
    const show = () => { setText(tt, pages[k]); setText(tp, pages.length > 1 ? ar(k + 1) + '/' + ar(pages.length) : ''); };
    show();
    if(crowded() && max === 3) continue;
    if(crowded()){ el.remove(); return; }

function pickShort(list, at, len, card){
  card = card || {};
  card.len = len(list[at % list.length]);
  if(!card.maxLen) return list[at % list.length];
  let best = list[at % list.length];
  for(let k = 0; k < list.length; k++){
    const x = list[(at + k) % list.length];
    if(len(x) <= card.maxLen){ best = x; break; }
    if(len(x) < len(best)) best = x;
  }
  card.len = len(best);
  return best;
}

  if(VERSES.length && (kind === 'verse' || (kind === 'both' && n % 2 === 0))){
    const v = pickShort(VERSES, half, x => x.text.length, card);
    return {title:CONFIG.verseMin ? 'آية كريمة' : 'آية اليوم', rows:[`<li class="quote quran${v.text.length > 330 ? ' q4' : quoteSize(v.text.length)}"><span class="orn">﴿</span><span class="qt">${esc(v.text)}</span><span class="orn">﴾</span></li>`, '<li class="src">' + esc(v.surah) + SEP + 'الآية' + ' ' + ar(v.ayah) + '</li>']
      .concat(CONFIG.tafsir && tafsirOf(v) ? [OLD_LOOK ? `<li class="tafsir"><span class="tk">${TAFSIR_NAME}</span><span class="tt">${esc(tafsirOf(v))}</span><span class="tp"></span></li>`
        : `<li class="tafsir"><span class="tt">${esc(tafsirOf(v))}</span><span class="tp"></span><span class="tk under">${tafsirSource(v)}</span></li>`] : [])};
  }
  const h = pickShort(HADITH, half, x => x.parts.reduce((m, [, t]) => m + t.length, 0), card);
  const saw = s => s.replace(/ﷺ/g, '<span class="saw">ﷺ</span>').replace(/[﴿﴾]/g, m => `<span class="orn">${m}</span>`);
  const body = h.parts.map(([k, t]) => k === 'q' ? `«${saw(esc(t))}»` : `<span class="nar">${saw(esc(t))}</span>`).join(' ');

function adhkarWindow(){
  if(!DAY_TIMES) return '';
  const p = riyadhParts(), now = p.h * 60 + p.mi;
  const at = k => { const [h, mi] = String(DAY_TIMES[k]).split(':').map(Number); return h * 60 + mi; };
  if(now >= at('Fajr') && now < at('Dhuhr')) return 'morning';
  if(now >= at('Asr') && now < at('Maghrib')) return 'evening';
  const late = ADHKAR.some(d => d.when === 'night') ? 'night' : 'late';
  if(now >= at('Isha') || now < at('Fajr')) return late;
  return '';
}
function adhkarNext(card){
  card.ad.t = 0;
  card.ad.i++;
  renderCard(card, card.ad.n > 1);
  fitCards();
}
function adhkarNextWindow(){
  const at = k => { const [h, mi] = String(DAY_TIMES[k]).split(':').map(Number); return fmtTime(h, mi); };
  const p = riyadhParts(), now = p.h * 60 + p.mi, mins = k => { const [h, mi] = String(DAY_TIMES[k]).split(':').map(Number); return h * 60 + mi; };
  return !DAY_TIMES ? ['أذكار الصباح والمساء', 'في أوقاتها، من الفجر ومن العصر', '']
    : now < mins('Asr') ? ['أذكار المساء', 'مع العصر ' + at('Asr'), 'evening'] : ['الآيتان من آخر سورة البقرة', 'بعد العشاء ' + at('Isha'), 'night'];
}
function adhkarWait(){
  const [title, when] = adhkarNextWindow();
  return {title, hd: `<span>${title}</span>`, rows: [`<li class="adw"><span>${esc(when)}</span></li>`]};
}
function adhkarCard(card){
  const ad = card.ad, mode = adhkarWindow(), key = mode || 'between';
  const list = ADHKAR.filter(d => mode ? d.when === (mode === 'late' ? 'evening' : mode) || (d.when === 'both' && mode !== 'night') : d.when === 'both');
  if(!list.length){ clearTimeout(ad.t); ad.t = 0; ad.mode = ''; return adhkarWait(); }
  if(key !== ad.mode){ ad.mode = key; ad.i = 0; clearTimeout(ad.t); ad.t = 0; }
  let i = ad.i % list.length;
  if(card.maxLen) for(let k = 0; k < list.length && list[i].text.length > card.maxLen; k++){ ad.i++; i = ad.i % list.length; }
  const d = list[i];
  card.len = d.text.length;
  ad.n = list.length;
  if(!ad.t) ad.t = setTimeout(() => adhkarNext(card), Math.min(60, 20 + .1 * d.text.length) * 1000);
  const dots = Math.min(list.length, 12), on = Math.floor(i * dots / list.length);
  const qt = d.quran && LATIN ? d.text.replace(/(\u06DD)[\u0660-\u0669]+/g, '$1') : d.text;
  const text = d.quran ? `<span class="orn">﴿</span><span class="qt">${esc(qt)}</span><span class="orn">﴾</span>` : esc(d.text);
  const [title, until, icon] = mode ? [...ADHKAR_HEAD[mode], mode] : adhkarNextWindow();
  return {
    title,
    hd: `${ADHKAR_ICON[icon] || ''}<span>${title}</span><span class="until">${esc(until)}</span>`,
    rows: [`<li class="quote${d.quran ? ' quran' : ''}${d.text.length > 560 ? ' q4' : quoteSize(d.text.length)}">${text}</li>`,
           `<li class="adf"><span class="s">${esc(ar(d.virtue ? `${d.virtue.text}${SEP}${d.virtue.source.replace(' · ', ' ')}` : d.source.replace(/ · /g, SEP)))}</span><span class="c">${ADHKAR_COUNT[d.count] || ar(d.count) + ' مرة'}</span>`
           + `<span class="d">${Array.from({length: dots}, (_, k) => k === on ? '<i class="on"></i>' : '<i></i>').join('')}</span></li>`],
  };
}

function applyNight(){

  if(h >= 23 || h < 5)      o = MAX;
  else if(h >= 21)          o = MAX * (h - 21) / 2;
  else if(h < 7)            o = MAX * (7 - h) / 2;

const PHOTO_SET = 5, PHOTO_PERIOD_DAYS = 4;
function riyadhDayNumber(){
  const p = riyadhParts();
  return Math.floor(Date.UTC(p.y, p.mo - 1, p.d) / 86400000);
}
function photoSet(n){
  const period = Math.floor(riyadhDayNumber() / PHOTO_PERIOD_DAYS);
  let seed = (period % 2147483646) + 1;
  const pick = [];
  for(let guard = 0; pick.length < Math.min(PHOTO_SET, n) && guard < 1000; guard++){
    seed = (seed * 48271) % 2147483647;
    const k = seed % n;
    if(!pick.includes(k)) pick.push(k);
  }
  return pick;
}
const OWN_WAIT_MS = 6000;
let BG_SLOT = -1, PREFETCHED = false, BG_TURN = 0;
function showOwn(pick, own, local){
  const at = own.indexOf(pick), order = own.slice(at).concat(own.slice(0, at)), turn = ++BG_TURN;
  const bundled = () => { if(turn === BG_TURN && !document.querySelector('.photo').style.backgroundImage) showBackground(local.u, local); };
  const t = setTimeout(bundled, OWN_WAIT_MS);
  const next = i => {
    if(i >= order.length){ clearTimeout(t); bundled(); return; }
    const img = new Image();
    img.onload = () => { clearTimeout(t); if(turn === BG_TURN) showBackground(order[i].url, order[i].b); };
    img.onerror = () => next(i + 1);
    img.src = order[i].url;
  };
  next(0);
}
function applyBackground(force){
  try {
    const p = riyadhParts();
    const slotSec = Math.round(CONFIG.photoMinutes * 60);
    const slot = riyadhDayNumber() * (86400 / slotSec) + Math.floor((p.h * 3600 + p.mi * 60 + (p.s || 0)) / slotSec);
    if(slot === BG_SLOT && !force) return;
    BG_SLOT = slot; BG_TURN++;
    const only = OWN_ONLY(), own = CONFIG.ownMode === 'album' ? [] : ownPhotos(), packs = only ? [] : packPhotos(), mine = own.concat(packs);
    const set = !only && REMOTE_BGS.length ? photoSet(REMOTE_BGS.length).map(k => REMOTE_BGS[k]) : [];
    const local = BGS[slot % BGS.length];
    let pool = own;
    if(!only){
      const ours = !CONFIG.ours ? [] : set.length ? set.map(b => ({url: PHOTO_BASE + b.f, b})) : mine.length ? BGS.map(b => ({url: b.u, b, bundled: true})) : [];
      pool = ours.concat(mine);
    }
    if(!pool.length){ showBackground(local.u, local); return; }
    const shuf = (a, seed) => { const r = a.slice(); let x = (seed + 1) * 2654435761 >>> 0 || 1; for(let i = r.length - 1; i > 0; i--){ x = (x * 1664525 + 1013904223) >>> 0; const j = x % (i + 1); [r[i], r[j]] = [r[j], r[i]]; } return r; };
    const pick = (only ? pool : shuf(pool, Math.floor(slot / pool.length)))[slot % pool.length], url = pick.url, b = pick.b;
    if(mine.includes(pick)){ showOwn(pick, mine, local); return; }
    if(pick.bundled){ showBackground(url, b); return; }
    let done = false;
    const fallback = () => { if(!done && !document.querySelector('.photo').style.backgroundImage) showBackground(local.u, local); };
    const t = setTimeout(fallback, 1200);
    const img = new Image();
    img.onload = () => { done = true; clearTimeout(t); showBackground(url, b); };
    img.onerror = () => { clearTimeout(t); fallback(); done = true; };
    img.src = url;
    if(!PREFETCHED && set.length){ PREFETCHED = true; setTimeout(() => set.forEach(x => { new Image().src = PHOTO_BASE + x.f; }), 20000); }
  } catch(e) {}
}

const MASK_BASE = 'https://raw.githubusercontent.com/tshi-dev/urtv-data/data/masks/';
const MASK_IDX = {};
const SD_BOX = [601, 266, 1319, 542];
const SD_GLYPHS = [[.56, .56, -.24, .56, .56], [.56, -.24, .56, .56]];
function maskKey(url){
  if(url.startsWith(PHOTO_BASE)){ const m = /^([A-Za-z0-9_-]{4,40})\.jpg/.exec(url.slice(PHOTO_BASE.length)); return m ? ['photos', m[1]] : null; }

  return b ? ['photos', b[1]] : null;
}
function sdCover(sky, colon){
  const [l, t, r, b] = SD_BOX, dh = b - t, cx = (l + r) / 2;
  let most = 0;
  for(const lay of SD_GLYPHS){
    let x0 = cx - lay.reduce((a, g) => a + Math.abs(g), 0) * dh / 2;
    for(const g of lay){
      const gw = Math.abs(g) * dh;
      if((g < 0) === colon) for(let x = x0; x <= x0 + gw; x += 2){ const c = Math.floor(x * sky.length / 1920); if(c >= 0 && c < sky.length) most = Math.max(most, Math.min(1, (b - sky[c]) / dh)); }
      x0 += gw;
    }
  }
  return most;
}
const sdLegible = sky => sdCover(sky, false) <= .25 + 1e-4 && sdCover(sky, true) <= .25 + 1e-4;
function sdImage(url){ return new Promise((ok, no) => { const i = new Image(); i.crossOrigin = 'anonymous'; i.onload = () => ok(i); i.onerror = no; i.src = url; }); }
function sdRead(photo, fg, box){
  try{
    const cw = 960, ch = Math.max(1, Math.round(box[3] / 2)), c = document.createElement('canvas'), d = document.createElement('canvas');
    c.width = cw; c.height = ch; d.width = 960; d.height = 540;
    const g = c.getContext('2d'), h = d.getContext('2d');
    g.drawImage(fg, 0, 0, cw, ch); h.drawImage(photo, 0, 0, 960, 540);
    const a = g.getImageData(0, 0, cw, ch).data, p = h.getImageData(0, 0, 960, 540).data;
    const sky = new Array(192).fill(1080);
    for(let k = 0; k < 192; k++){
      const x = Math.min(cw - 1, Math.floor(((k + .5) * 10 - box[0]) * cw / box[2]));
      if(x < 0) continue;
      for(let y = 0; y < ch; y++) if(a[(y * cw + x) * 4 + 3] > 127){ sky[k] = Math.round(box[1] + y * box[3] / ch); break; }
    }
    let best = 1e9, here = 1e9;
    for(let dy = -3; dy <= 3; dy++) for(let dx = -3; dx <= 3; dx++){
      let sum = 0, n = 0;
      for(let y = 0; y < ch; y++) for(let x = 0; x < cw; x++){
        const i = (y * cw + x) * 4;
        if(a[i + 3] < 250) continue;
        const px = Math.round((box[0] + (x + .5) * box[2] / cw) / 2 - .5) + dx, py = Math.round((box[1] + (y + .5) * box[3] / ch) / 2 - .5) + dy;
        if(px < 0 || py < 0 || px >= 960 || py >= 540) continue;
        const j = (py * 960 + px) * 4;
        sum += Math.abs(a[i] - p[j]) + Math.abs(a[i + 1] - p[j + 1]) + Math.abs(a[i + 2] - p[j + 2]); n++;
      }
      if(!n) continue;
      const m = sum / (3 * n);
      best = Math.min(best, m);
      if(!dx && !dy) here = m;
    }
    return {sky, aligned: here <= 16 && here <= best + .05};
  }catch(e){ return null; }
}
