// one line, always: the names step down in size, then take their short forms, then lose their crests (as the list's rows do)
function fitLive(ul){
  ul.querySelectorAll('.lvt').forEach(t => {
    const ok = () => t.scrollWidth <= t.clientWidth + .5;
    const step = (steps = FIT_STEPS) => steps.find(k => { t.style.setProperty('--k', k); return ok(); });
    if(step()) return;
    shorten(t);
    if(step()) return;
    t.querySelectorAll('img.cr').forEach(i => i.remove());
    step([...FIT_STEPS, .64, .56, .5]);   // a narrow card: smaller still, never two lines
  });
}

// ---- «البطاقة الذكية» (smart): the card for what matters now, picked again with every redraw (the clock timers draw it every 15 s,
// so a change shows within a minute); no request of its own, it shows what the other cards load. In this order:
//  1. a followed team's game is live, or starts within 60 minutes: the matches card, with that game;
//  2. within 15 minutes of a prayer: the prayers' row, with the minutes left in its title (before the adhkar: the last quarter
//     hour of the adhkar window is the wait for Dhuhr or Maghrib, and the prayer is what matters then);
//  3. the adhkar window (morning from Fajr to Dhuhr, evening from Asr to Maghrib): the adhkar card;
//  4. otherwise: the next hours' weather.
const SMART_GAME_MIN = 60, SMART_PRAYER_MIN = 15;
// the followed teams' games that are live now, or (not liveOnly) start within SMART_GAME_MIN minutes: [ev] in time order
function focusGames(now, liveOnly){
  const seen = new Set(), out = [];
  CONFIG.teamIds.forEach(id => [MATCHES[id], ...(NEXT_LIST[id] || [])].forEach(ev => {
    if(!ev || !ev.idEvent || seen.has(ev.idEvent)) return;
    seen.add(ev.idEvent);
    const k = toDate(ev).getTime(), st = (ev.strStatus || '').toUpperCase();
    if(isNaN(k) || FINAL.includes(st) || CALLED_OFF.test(st)) return;
    const live = now >= k && now < k + durMs(ev), soon = now < k && k - now <= SMART_GAME_MIN * 60000;
    if(live || (soon && !liveOnly)) out.push(ev);
  }));
  return out.sort((a, b) => toDate(a) - toDate(b));
}
function prayerSoon(minutes){   // is a prayer's adhan within that many minutes?
  const p = riyadhParts(), now = p.h * 60 + p.mi + p.s / 60;
  return PRAYERS.some(x => { const d = x.h * 60 + x.mi - now; return d > 0 && d <= minutes; });
}
function smartKind(now = Date.now()){
  if(CONFIG.teamIds.length && focusGames(now).length) return 'matches';
  if(prayerSoon(SMART_PRAYER_MIN)) return 'prayerrow';
  const w = adhkarWindow();
  if(w === 'morning' || w === 'evening') return 'adhkar';
  return 'hourly';
}


// the header: HTML when the kind has icons or a note in it, else its title (the two never share a stale copy)
function paintHd(hd, title, html){
  if(html) setHTML(hd, html); else { setText(hd, title); hd.__h = null; }
}

// Draw the cards of these kinds (none given = all). A kind may sit in a smart or «يومك» card, which follow the same data.
function renderPanel(animate, ...kinds){
  for(const c of CARDS){
    if(kinds.length && !kinds.includes(c.kind) && c.kind !== 'smart' && c.kind !== 'today') continue;
    renderCard(c, animate);
  }
  fitCards();
}

function renderCard(card, animate, keepSize){
  const ul = card.ul, hd = card.hd;
  const was = card.eff;
  card.eff = card.kind === 'smart' ? smartKind() : card.kind;
  const P = card.eff;
  ul.classList.toggle('pgrid', P === 'prayers');
  card.el.classList.toggle('boxes', P === 'prayers');
  if(P !== was){   // the smart card changed its mind: a fresh page of the new kind
    card.page = 0; card.skip = 0; card.maxLen = 0; ul.__h = null;
    if(was === 'adhkar'){ clearTimeout(card.ad.t); card.ad.t = 0; card.ad.mode = ''; }
  }
  if(!keepSize){ card.z = 1; card.cap = 0; card.maxLen = 0; card.zi = 0; card.ri = 0; card.el.style.removeProperty('--z'); }
  if(P === 'shows'){
    if(WEEK_OK_AT && WEEK_FAIL_AT > WEEK_OK_AT) paintHd(hd, '', `<span>${PANEL_TITLE.shows}</span><span class="until">${fmtAgo(WEEK_OK_AT)}</span>`);
    else paintHd(hd, PANEL_TITLE.shows);
    renderWeekPage(card, animate); return;
  }
  let rows = [];
  if(P === 'prayers') rows = prayerRows();
  else if(P === 'forecast') rows = forecastRows();
  else if(P === 'hourly') rows = hourlyRows();
  else if(P === 'prayerrow'){ const q = prayerRowCard(); paintHd(hd, q.title); rows = q.rows; }
  else if(P === 'nextprayer') rows = nextPrayerRows();
  else if(P === 'matches') rows = matchRows(card);
  else if(P === 'year') rows = [yearCard(card)];
  else if(P === 'today'){ const q = todayCard(); paintHd(hd, q.title); rows = q.rows; }
  else if(P === 'tasks') rows = CONFIG.tasks.map(t => `<li class="task"><span>${esc(t)}</span></li>`);
  else if(P === 'verse'){ const q = quoteOfDay(card); paintHd(hd, q.title); rows = q.rows; }
  else if(P === 'wisdom'){ const q = wisdomOfDay(); paintHd(hd, q.title); rows = q.rows; }
  else if(P === 'adhkar'){ const q = adhkarCard(card); paintHd(hd, q.title, q.hd); rows = q.rows; }
  else if(P === 'stocks'){ const q = stocksCard(); paintHd(hd, '', q.hd); rows = q.rows; }
  if(P === 'matches' && matchesStaleNote()) paintHd(hd, '', `<span>${PANEL_TITLE.matches}</span><span class="until">${matchesStaleNote()}</span>`);
  else if(PANEL_TITLE[P]) paintHd(hd, PANEL_TITLE[P]);
  if(!rows.length){
    if(P === 'matches' && !MATCHES_LOADED && ul.firstElementChild && !ul.firstElementChild.classList.contains('empty')) return;
    if(P === 'matches' && ul.firstElementChild && ul.firstElementChild.classList.contains('empty') && ul.firstElementChild.textContent === matchesEmptyText()) return;   // the saved games stay until the first answer
    ul.classList.remove('flip');
    setHTML(ul, `<li class="empty">${P === 'matches' ? matchesEmptyText() : P === 'tasks' ? 'لا مهام اليوم' : 'لا تتوفر بيانات الآن'}</li>`);
    return;
  }
  const per = card.cap || (P === 'matches' ? MATCH_ROWS : WEEK_ROWS);
  if((P === 'matches' || P === 'stocks' || P === 'tasks') && rows.length > per){        // page through, like the shows
    if(P === 'matches'){   // fixed pages, each game once a lap; the last holds what is left
      const pages = Math.ceil(rows.length / per), start = (card.page % pages) * per;
      rows = rows.slice(start, start + per);
    }else{
      const start = (card.page * per) % rows.length;
      rows = Array.from({length: per}, (_, i) => rows[(start + i) % rows.length]);
    }
  }
  const wrote = setHTML(ul, rows.join(''), animate);
  if(!keepSize){ card.base = rows.length; card.len0 = card.len || 0; }   // what full size holds: the rows of a page, the length of the text
  if(P === 'matches'){ fillCrests(ul); if(wrote){ shortenRows(ul); fitLive(ul); } }
  if(CONFIG.tafsir) fitTafsir(ul);
  ul.classList.remove('flip');
  if(animate){ void ul.offsetWidth; ul.classList.add('flip'); }
}

// ---- sizing in the launcher. The cards share the box of the WebView (two or three of them). A card that does not fit steps
// down in text size, then in rows per page (a list), then picks a shorter text (a verse, a hadith, a dhikr); the one that is
// cut off or tallest goes first. One card keeps the box to itself and is never changed, as it always was.
// How a card gets smaller, one step at a time. Its text size comes from Z_STEPS (card.zi); a list may also give rows (card.ri
// of them gone: the pages are shorter, and every row still comes round), a verse or a dhikr ask for a shorter text (card.ri
// times a fifth shorter than the day's). A card that is too tall gives rows first, a quote comes down to .82 before a shorter
// text is looked for; one that is too wide (a name that would end in «…») can only give text size.
const Z_STEPS = [1, .94, .88, .82, .76, .7, .64];
function cardCut(card){   // a name or a cell wider than its place: it would end in «…» or run into the next
  for(const e of card.el.querySelectorAll('li, li *, .hd > span')){
    if(e.clientWidth > 0 && e.scrollWidth > e.clientWidth + 1) return true;
    // the screensaver's pair is measured to the fraction of a pixel (fits()): a source line over by half a pixel ended in «…» there
    if(!CONFIG.widget && e.clientWidth > 0 && e.scrollWidth >= e.clientWidth && getComputedStyle(e).textOverflow === 'ellipsis' && !fits(e)) return true;
  }
  return false;
}
// The screensaver's pair is read from the sofa: its text never goes below a floor (a row's text 2.1vh, every other line 1.45vh);
// at the floor a verse or a dhikr takes a shorter text and a list fewer rows, as the home screen's cards do, instead of a smaller size.
const PAIR_FLOOR = {row: .021, small: .0145};
// (a text that is smaller than its floor at full size is not made smaller at all)
function aboveFloor(c){
  const vh = innerHeight, z = parseFloat(c.el.style.getPropertyValue('--z')) || 1, px = e => parseFloat(getComputedStyle(e).fontSize);
  const under = (e, floor) => { const now = px(e); return now < Math.min(floor * vh, now / z) - .05; };
  for(const li of c.ul.children) if(li.textContent.trim() && under(li, PAIR_FLOOR.row)) return false;
  for(const e of c.el.querySelectorAll('.hd, li *')) if(e.children.length === 0 && e.textContent.trim() && under(e, PAIR_FLOOR.small)) return false;
  return true;
}
function shrinkCard(c, tooWide){   // false when there is no step left
  if(!CONFIG.widget){   // the pair: a smaller size only while it stays above the floor; else the other ways
    const zi = c.zi;
    if(c.zi < Z_STEPS.length - 1){
      c.zi++; c.el.style.setProperty('--z', Z_STEPS[c.zi]);
      const ok = aboveFloor(c);
      c.zi = zi; c.el.style.setProperty('--z', Z_STEPS[zi]);
      if(!ok) return shrinkByContent(c);
    }else return shrinkByContent(c);
  }
  const list = LISTS.includes(c.eff), quote = c.eff === 'verse' || c.eff === 'adhkar', zLeft = c.zi < Z_STEPS.length - 1;
  if(tooWide){ if(!zLeft) return false; c.zi++; }
  else if(list && c.ri < c.base - 1) c.ri++;
  else if(quote && c.zi < 3) c.zi++;
  else if(quote && c.ri < 6) c.ri++;
  else if(zLeft) c.zi++;
  else return false;
  const cap = list && c.ri ? c.base - c.ri : 0, maxLen = quote && c.ri ? Math.max(20, Math.floor(c.len0 * Math.pow(.8, c.ri))) : 0;
  c.z = Z_STEPS[c.zi];
  c.el.style.setProperty('--z', c.z);
  if(c.eff === 'matches') shortenRows(c.ul);   // smaller text: a row may keep more of its names and date now
  if(cap !== c.cap || maxLen !== c.maxLen){ c.cap = cap; c.maxLen = maxLen; renderCard(c, false, true); }
  return true;
}
// at the pair's floor: fewer rows of a list, a shorter verse or dhikr; false when neither is left (the card is then as it is)
function shrinkByContent(c){
  const list = LISTS.includes(c.eff), quote = c.eff === 'verse' || c.eff === 'adhkar';
  if(list && c.ri < c.base - 1) c.ri++;
  else if(quote && c.ri < 6) c.ri++;
  else return false;
  const cap = list ? c.base - c.ri : 0, maxLen = quote ? Math.max(20, Math.floor(c.len0 * Math.pow(.8, c.ri))) : 0;
  if(cap !== c.cap || maxLen !== c.maxLen){ c.cap = cap; c.maxLen = maxLen; renderCard(c, false, true); }
  return true;
}
// The screensaver's pair beside the small clock (#panel2=) is fitted the same way: its box is the middle row, which may not push
// the bottom row down (and keeps 2vh of air); the pair is drawn the same height, so while it is fitted each card has its own.
function fitCards(){
  if(CARDS.length < 2) return;
  const mid = document.querySelector('.mid');
  const tooTall = CONFIG.widget ? () => mid.getBoundingClientRect().height > innerHeight + .5 : pairTooTall;
  mid.classList.add('fit');
  try{
    for(let g = 0; g < 120; g++){
      const tall = tooTall();
      const cut = CARDS.filter(cardCut);
      if(!tall && !cut.length) return;
      // the cut-off cards first; then, only if the box is too tall, the tallest that can still give something
      if(cut.some(c => shrinkCard(c, true))) continue;
      if(!tall || !CARDS.slice().sort((a, b) => b.el.offsetHeight - a.el.offsetHeight).some(c => shrinkCard(c))) return;
    }
  }finally{ mid.classList.remove('fit'); }
}
function pairTooTall(){
  const stage = document.querySelector('.stage'), cs = getComputedStyle(stage);
  const room = stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - 2 * parseFloat(cs.rowGap)
    - document.querySelector('.top').offsetHeight - document.querySelector('.bottom').offsetHeight - .02 * innerHeight;
  return Math.max(...CARDS.map(c => c.el.offsetHeight)) > room + .5;
}

// the year's numbers, shared by the card and the strip: the Gregorian year in Riyadh time, its days, today's number
function yearFacts(){
  const p = riyadhParts(new Date(Date.now())), y = p.y;
  const total = (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0 ? 366 : 365;
  const day = Math.round((Date.UTC(y, p.mo - 1, p.d) - Date.UTC(y, 0, 1)) / 864e5) + 1;
  const pct = Math.round(100 * day / total);
  return {y, total, day, pct, text: `اليوم <b>${ar(day)}</b> من ${ar(total)} · ${ar(pct)}${LATIN ? '%' : '٪'}`};
}

// ---- «السنة»: a dot for every day of this Gregorian year (Riyadh time). Drawn again only when the day changes.
function yearCard(card){
  const {y, total, day, pct, text} = yearFacts();
  const COLS = 36, ROWS = Math.ceil(total / COLS), PITCH = 10, R = 3.2;
  const rows = [];
  for(let r = 0; r < ROWS; r++){
    let g = '';
    for(let c = 0; c < COLS; c++){
      const n = r * COLS + c + 1;
      if(n > total) break;
      const cx = (COLS - 1 - c) * PITCH + PITCH / 2, cy = r * PITCH + PITCH / 2;   // right to left, like the page
      if(n < day) g += `<circle class="on" cx="${cx}" cy="${cy}" r="${R}" fill-opacity="${(.28 + .72 * n / day).toFixed(2)}"/>`;
      else if(n === day) g += `<circle class="halo" cx="${cx}" cy="${cy}" r="${R * 3}" fill-opacity=".12"/><circle class="halo" cx="${cx}" cy="${cy}" r="${R * 1.9}" fill-opacity=".28"/><circle class="now" cx="${cx}" cy="${cy}" r="${R * 1.15}"/>`;
      else g += `<circle class="off" cx="${cx}" cy="${cy}" r="${R}"/>`;
    }
    rows.push(`<g class="r" style="--i:${r}">${g}</g>`);
  }
  const anim = !card.yearShown;
  card.yearShown = true;
  const svg = `<svg viewBox="-10 -10 ${COLS * PITCH + 20} ${ROWS * PITCH + 20}" role="img" aria-label="${ar(day)} / ${ar(total)}">${rows.join('')}</svg>`;
  return `<li class="yr${anim ? ' fill' : ''}"><div class="yn">${ar(y)}</div>${svg}`
       + `<div class="yt">${text}</div></li>`;
}

// ---- the slim year strip under the clock (#yearstrip=1): 365/366 dots in 7 rows of 53, from the right, top row first;
// the passed days light up toward gold, today glows, the rest stay faint. No text line. Drawn again only when the day changes;
// fitYearStrip() runs after every clock redraw: no wider than the clock, hidden when the room under it is too small.
function renderYearStrip(){
  const el = document.getElementById('ystrip');
  if(!el || !CONFIG.yearStrip || CONFIG.widget) return;
  const {y, total, day} = yearFacts(), key = y + ':' + day + ':' + LATIN;
  if(el.dataset.key !== key){
    el.dataset.key = key;
    const COLS = 53, ROWS = 7, PITCH = 6, R = 2;   // the viewBox is 4 px dots and 2 px gaps; CSS scales it with the screen
    let g = '';
    for(let n = 1; n <= total; n++){
      const c = (n - 1) % COLS, r = Math.floor((n - 1) / COLS);
      const cx = (COLS - 1 - c) * PITCH + PITCH / 2, cy = r * PITCH + PITCH / 2;
      if(n < day) g += `<circle class="on" cx="${cx}" cy="${cy}" r="${R}" fill-opacity="${(.3 + .7 * n / day).toFixed(2)}"/>`;
      else if(n === day) g += `<circle class="halo" cx="${cx}" cy="${cy}" r="${R * 1.9}" fill-opacity=".25"/><circle class="now" cx="${cx}" cy="${cy}" r="${R * 1.1}"/>`;
      else g += `<circle class="off" cx="${cx}" cy="${cy}" r="${R}"/>`;
    }
    el.innerHTML = `<svg viewBox="0 0 ${COLS * PITCH} ${ROWS * PITCH}" role="img" aria-label="${ar(day)} / ${ar(total)}">${g}</svg>`;
  }
  fitYearStrip();
}
function fitYearStrip(){
  const el = document.getElementById('ystrip');
  if(!el || !CONFIG.yearStrip || CONFIG.widget) return;
  el.hidden = false; el.style.removeProperty('--yp');
  const clock = document.querySelector('.clock').getBoundingClientRect(), wrap = document.querySelector('.clockwrap').getBoundingClientRect();
  const bottom = document.querySelector('.bottom').getBoundingClientRect();
  let pitch = el.querySelector('svg').getBoundingClientRect().width / 53;   // 6 px at 960 wide
  if(pitch * 53 > clock.width) { pitch = clock.width / 53; el.style.setProperty('--yp', pitch + 'px'); }
  const h = el.getBoundingClientRect().height, room = bottom.top - wrap.bottom - 4;
  if(pitch < 3 || h + parseFloat(getComputedStyle(el).marginTop) > room) el.hidden = true;
}

function prayerRows(){
  if(!DAY_TIMES) return [];
  const p = riyadhParts(), mins = p.h * 60 + p.mi + p.s / 60;
  const names = {Fajr:'الفجر', Sunrise:'الشروق', Dhuhr:isFriday() ? 'الجمعة' : 'الظهر', Asr:'العصر', Maghrib:'المغرب', Isha:'العشاء'};
  // The lit box is the one the bottom panel names (tickPrayer): during the iqama wait the prayer that has just been called, else the next
  // of the five, and after Isha tomorrow's Fajr. The sunrise is not a prayer and is never lit. Before Fajr nothing is past.
  const at = k => { const [h, mi] = String(DAY_TIMES[k]).split(':').map(Number); return h * 60 + mi; };
  const cur = PRAYERS.find(x => { const gap = x.key === 'Dhuhr' && isFriday() ? 0 : (CONFIG.iqama[x.key] || 0); return mins >= at(x.key) && mins < at(x.key) + gap; });
  const lit = cur ? cur.key : (PRAYERS.find(x => at(x.key) > mins) || PRAYERS[0] || {}).key;
  const tomorrow = !cur && PRAYERS.length && !PRAYERS.some(x => at(x.key) > mins);
  return Object.keys(names).filter(k => DAY_TIMES[k]).map(k => {
    const [h, mi] = String(DAY_TIMES[k]).split(':').map(Number);
    const cls = k === lit ? 'next' : at(k) <= mins && !(tomorrow && k === lit) ? 'past' : '';
    return `<li class="${cls}"><span>${names[k]}</span><span class="dt">${fmtTime(h, mi)}</span></li>`;
  });
}

// the city's date as YYYY-MM-DD, and the one after it
const cityToday = (ms = Date.now()) => FMT_DATE.format(new Date(ms));
// A saved forecast can be days old: the rows are the days from today in the city's zone, named by their date («اليوم» is today's, not the
// first row), and a forecast that has no today is not shown (its first row would be named «اليوم»).
function forecastRows(){
  const today = cityToday(), tomorrow = new Date(Date.parse(today + 'T12:00:00Z') + DAY_MS).toISOString().slice(0, 10);
  const days = FORECAST.filter(d => d.date >= today).slice(0, 5);
  if(!days.some(d => d.date === today)) return [];
  return days.map(d => {
    const day = d.date === today ? 'اليوم' : d.date === tomorrow ? 'غداً'
      : new Intl.DateTimeFormat(GREG, {timeZone:'UTC', weekday:'long'}).format(new Date(d.date + 'T12:00:00Z'));
    return `<li><span>${day}</span><span class="ep">${WX_CODES[d.code] || ''}</span>`
         + `<span class="dt">${ar(Math.round(d.hi))}° / ${ar(Math.round(d.lo))}°</span></li>`;
  });
}

// ---- club crests on match cards: TheSportsDB's badge, which the events already carry
// (strHomeTeamBadge / strAwayTeamBadge, with idHomeTeam / idAwayTeam). No request of its own except the picture,
// once per club: kept as a 48 px copy in localStorage and fetched again only when the badge's address changes.
// The launcher's page is a file:// document and the badge host may send no Access-Control-Allow-Origin: fetch() is then refused (or
// the answer is no picture). The club keeps its address alone and the row shows a plain <img> of it, which needs no CORS.
const CRESTS_ON = USES('matches');
const CREST_PX = 48, CREST_KEEP = 60, CREST_PER_ROUND = 10;
let CRESTS = {};   // team id -> {u: badge address, d: data: URI of the small copy, none when only the address could be kept}
try{ CRESTS = JSON.parse(localStorage.getItem('crests') || '{}') || {}; }catch(e){}
function crestOf(ev, side){
  const u = String(ev['str' + side + 'TeamBadge'] || ''), id = String(ev['id' + side + 'Team'] || '');
  return /^https:\/\/[a-z0-9.-]+\.thesportsdb\.com\/\S+$/i.test(u) && /^\d+$/.test(id) ? {id, u} : null;
}
const crestImg = (ev, side) => {
  const c = CRESTS_ON && crestOf(ev, side);
  const k = c && CRESTS[c.id];
  if(!k) return '';   // no crest: the name alone
  return k.d ? `<img class="cr" data-t="${c.id}" alt="">`
    : `<img class="cr" data-t="${c.id}" src="${esc(k.u)}" width="${CREST_PX}" height="${CREST_PX}" loading="lazy" alt="">`;
};
function fillCrests(root){   // the rows carry the club's id only; the picture is put in here (a saved row has none)
  root.querySelectorAll('img.cr').forEach(i => {
    const c = CRESTS[i.dataset.t], src = c && (c.d || c.u);
    if(!src) return;
    if(!c.d) i.onerror = () => i.remove();   // an address that shows nothing (gone, or no picture): the name alone
    if(i.getAttribute('src') !== src) i.src = src;
  });
}
function crestShrink(blob){   // -> a data: URI no larger than CREST_PX, '' when it is not a picture
  return new Promise(done => {
    const url = URL.createObjectURL(blob), im = new Image();
    const end = v => { URL.revokeObjectURL(url); done(v); };
    im.onload = () => {
      try{
        const k = Math.min(1, CREST_PX / Math.max(im.naturalWidth, im.naturalHeight, 1)), c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(im.naturalWidth * k)); c.height = Math.max(1, Math.round(im.naturalHeight * k));
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        end(c.toDataURL('image/png'));
      }catch(e){ end(''); }
    };
    im.onerror = () => end('');
    im.src = url;
  });
}
async function crestFetch(u){   // the small size the API offers first; the plain file if it refuses the suffix
  for(const url of /\/(tiny|small|medium|preview)$/.test(u) ? [u] : [u + '/tiny', u]){
    try{
      const r = await fetchT(url, 10000);
      if(!r.ok) continue;
      const d = await crestShrink(await r.blob());
      if(d) return d;
    }catch(e){}
  }
  return '';
}
let CREST_BUSY = false;
async function loadCrests(){
  if(!CRESTS_ON || CREST_BUSY) return;
  CREST_BUSY = true;
  try{
    const want = {};
    for(const ev of matchEvents()) for(const side of ['Home', 'Away']){
      const c = crestOf(ev, side);
      if(c && !(CRESTS[c.id] && CRESTS[c.id].u === c.u)) want[c.id] = c.u;
    }
    let got = 0;
    for(const [id, u] of Object.entries(want).slice(0, CREST_PER_ROUND)){
      const d = await crestFetch(u);
      delete CRESTS[id]; CRESTS[id] = d ? {u, d} : {u}; got++;   // no copy: the address alone, asked for once
    }
    if(!got) return;
    Object.keys(CRESTS).slice(0, Math.max(0, Object.keys(CRESTS).length - CREST_KEEP)).forEach(k => delete CRESTS[k]);
    try{ localStorage.setItem('crests', JSON.stringify(CRESTS)); }catch(e){}
    renderPanel(false, 'matches');
  }finally{ CREST_BUSY = false; }
}

// ---- «الصلوات في صف»: the five prayers in one row, the next lit, and above it «المغرب بعد ١ س و ٥ د»
function shortHM(sec){   // «١ س و ٥ د», «٢ س», «٥ د»
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60);
  return [h ? ar(h) + ' س' : '', m || !h ? ar(Math.max(m, 1)) + ' د' : ''].filter(Boolean).join(' و ');
}
// ---- «الصلاة القادمة»: one line, «المغرب ٥:٢١ م، بعد ١ ساعة و ٩ دقائق», the calm one of the prayer cards (after Isha: tomorrow's Fajr)
function nextPrayerRows(){
  if(!PRAYERS.length) return [];
  const p = riyadhParts(), mins = p.h * 60 + p.mi + p.s / 60;
  let n = PRAYERS.find(x => x.h * 60 + x.mi > mins), tomorrow = false;
  if(!n){ n = PRAYERS[0]; tomorrow = true; }
  // in the words of the bar and of the screensaver's own «الصلاة القادمة» (untilAdhan): the same minutes at the same second
  const left = untilAdhan(n.h * 60 + n.mi + (tomorrow ? 1440 : 0) - mins);
  return [`<li class="np"><b>${prayerName(n)}</b><span class="t">${fmtTime(n.h, n.mi)}،</span><span class="r">بعد ${left}</span></li>`];   // «،», not «·»: beside «م» it reads as «٠»
}

function prayerRowCard(){
  if(!PRAYERS.length) return {title:'مواقيت اليوم', rows:[]};
  const p = riyadhParts(), mins = p.h * 60 + p.mi + p.s / 60;
  let next = PRAYERS.findIndex(x => x.h * 60 + x.mi > mins), tomorrow = false;
  if(next < 0){ next = 0; tomorrow = true; }   // after Isha the next is tomorrow's Fajr
  const n = PRAYERS[next], left = n.h * 60 + n.mi + (tomorrow ? 1440 : 0) - mins;
  return {
    title: `${prayerName(n)} بعد ${shortHM(Math.max(0, Math.round(left * 60)))}`,
    rows: ['<li class="prow">' + PRAYERS.map((x, i) =>
      `<div class="pc${i === next ? ' next' : tomorrow || x.h * 60 + x.mi <= mins ? ' past' : ''}"><b>${prayerName(x)}</b><i>${fmtTime(x.h, x.mi)}</i></div>`).join('') + '</li>'],
  };
}

function wxIcon(code, night){
  if(code <= 1) return night ? WX_SVG.moon : WX_SVG.sun;
  if(code === 2) return night ? WX_SVG.partnight : WX_SVG.part;
  if(code === 3) return WX_SVG.cloud;
  if(code === 45 || code === 48) return WX_SVG.fog;
  if(code >= 95) return WX_SVG.storm;
  if((code >= 71 && code <= 77) || code === 85 || code === 86) return WX_SVG.snow;
  return WX_SVG.rain;   // drizzle, rain and showers
}
function isNight(t){   // sunrise and sunset of that day when known, else 06:00 to 18:00
  const hm = t.slice(11, 16), sun = SUN[t.slice(0, 10)];
  return sun ? hm < sun[0] || hm >= sun[1] : hm < '06:00' || hm >= '18:00';
}
function hourlyRows(){
  const next = HOURLY.filter(x => x.t > hourKey() && x.temp != null).slice(0, 6);
  if(!next.length) return [];
  return ['<li class="hrs">' + next.map(x => {
    const h = +x.t.slice(11, 13), at = timeParts(h, 0), hr = at.u ? at.h + ' ' + at.u : at.t;   // «٦ م», or «١٨:٠٠»
    return `<div class="hc"><b>${hr}</b>${wxIcon(x.code, isNight(x.t))}<i>${ar(Math.round(x.temp))}°</i></div>`;
  }).join('') + '</li>'];
}

// every followed team's games this week, plus results from the last day
function matchEvents(){
  const seen = new Set(), evs = [];
  CONFIG.teamIds.forEach(id => {
    const next = NEXT_LIST[id] || (MATCHES[id] ? [MATCHES[id]] : []);
    next.forEach(ev => { if(ev && ev.idEvent && !seen.has(ev.idEvent)){ seen.add(ev.idEvent); evs.push(MATCHES[id] && MATCHES[id].idEvent === ev.idEvent ? MATCHES[id] : ev); } });
    resultsFor(id).forEach(ev => { if(!seen.has(ev.idEvent)){ seen.add(ev.idEvent); evs.push(ev); } });
  });
  if(CONFIG.leagues.length) leagueGames().forEach(ev => {   // after the teams': a game both follow is the team's copy
    if(!seen.has(ev.idEvent) && !CALLED_OFF.test(ev.strStatus || '')){ seen.add(ev.idEvent); evs.push(ev); }
  });
  return evs;
}
// ... in time order
function matchRows(card){
  const now = Date.now();
  const live = focusGames(now, true);   // a followed team is playing: that game alone, big
  if(live.length) return live.map(ev => liveRow(ev));
  let evs = matchEvents();
  const smart = card && card.kind === 'smart';
  if(smart){ const ids = new Set(focusGames(now).map(ev => ev.idEvent)); evs = evs.filter(ev => ids.has(ev.idEvent)); }   // only the game that brought the smart card here
  const others = smart ? [] : eventRows(now);
  const shown = evs.map(ev => ({ev, t: toDate(ev).getTime(), r: gameRank(ev, now)}))
    .filter(x => finishedRecently(x.ev, now) || pendingResult(x.ev, now)
      || (now < x.t + durMs(x.ev) && !FINAL.includes((x.ev.strStatus || '').toUpperCase())
          && x.t - now <= CONFIG.weekWindowDays * 86400000))
    .sort(byRank);
  // a club with no crest keeps a crest-wide empty space, but only in a card where other rows have crests (the rows line up);
  // a card with no crest at all is as it was
  const anyCrest = shown.some(x => crestImg(x.ev, 'Home') || crestImg(x.ev, 'Away'));
  const crestOrGap = (ev, side) => crestImg(ev, side) || (anyCrest ? '<span class="crgap"></span>' : '');
  return [...shown
    .map(({ev, t, r}) => {
      const d = new Date(t), scored = ev.intHomeScore != null && ev.intAwayScore != null;
      const mid = scored && now >= t ? `<span class="sc">${ar(+ev.intHomeScore)} - ${ar(+ev.intAwayScore)}</span>` : '<span class="x">×</span>';
      const done = finishedRecently(ev, now), upcoming = !done && now < t, pending = r === 0 && !done;
      const when = done ? 'انتهت'
        : pending ? ''   // over with no result yet: no score, no «بعد …»
        : now >= t ? '<span class="live">مباشر</span>'
        : 'بعد ' + shortRemaining(t - now).split(' و ')[0];   // one unit: the date says the rest
      // the date is always there but for a game under way: the day and time of a game to come or one with no result yet, the day of a finished one
      const date = upcoming || pending ? matchWhen(d) : done ? matchDay(d) : '';
      const dateEl = date ? `<i class="mwhen" data-s="${esc(matchWhenShort(d, now, done))}">${date}</i>` : '';
      const club = (id, name, home) => `<span class="tm">${home ? '' : crestOrGap(ev, 'Away')}<span class="nm">${esc(teamAr(name, id))}</span>${home ? crestOrGap(ev, 'Home') : ''}</span>`;
      return {t, r, html: `<li class="mg"><span class="mr">${club(ev.idHomeTeam, ev.strHomeTeam, true)} ${mid} ${club(ev.idAwayTeam, ev.strAwayTeam, false)} ${dateEl} <span class="dt">${when}</span></span></li>`};
    }), ...others.map(o => ({...o, r: o.t <= now ? 1 : 2}))].sort(byRank).map(x => x.html);
}

// The exchanges keep their own hours whatever the city: Tadawul Sun-Thu 10:00-15:00 (Riyadh is UTC+3 all year); the US Mon-Fri 09:30-16:00 New York time (holidays are ignored)
const NY_CLOCK = new Intl.DateTimeFormat('en-US', {timeZone:'America/New_York', weekday:'short', hour:'2-digit', minute:'2-digit', hourCycle:'h23'});
function marketOpen(sa, ms = Date.now()){
  if(sa){ const d = new Date(ms + 3*3600000), day = d.getUTCDay(), m = d.getUTCHours() * 60 + d.getUTCMinutes(); return day <= 4 && m >= 600 && m < 900; }
  const p = NY_CLOCK.formatToParts(new Date(ms)).reduce((a, x) => (a[x.type] = x.value, a), {}), m = (+p.hour % 24) * 60 + +p.minute;
  return p.weekday !== 'Sat' && p.weekday !== 'Sun' && m >= 570 && m < 960;   // New York's own clock, summer time and winter time alike
}
let STOCKS = {};   // code -> {p: price, v: previous close or null, c: the day's closes, at: when it was fetched, bad: the last refresh failed}

// a small line of the day's closes, 60 x 16, drawn only when the card's markup changes
function spark(c, up){
  if(c.length < 2) return '<svg viewBox="0 0 60 16" preserveAspectRatio="none"></svg>';
  const lo = Math.min(...c), hi = Math.max(...c), span = hi - lo || 1;
  const pts = c.map((y, i) => (i * 60 / (c.length - 1)).toFixed(1) + ',' + (15 - (y - lo) / span * 14).toFixed(1)).join(' ');
  return `<svg viewBox="0 0 60 16" preserveAspectRatio="none" class="${up ? 'up' : 'down'}"><polyline points="${pts}"/></svg>`;
}
function stocksCard(){
  const shown = CONFIG.stocks.filter(k => STOCKS[k]);
  const allClosed = shown.length && shown.every(k => !marketOpen(isSA(k)));
  const mixed = shown.some(k => marketOpen(isSA(k)));
  const stale = shown.filter(k => staleMark(STOCKS[k])).map(k => STOCKS[k]).sort((a, b) => (a.at || 0) - (b.at || 0));
  const rows = shown.map(k => {
    const d = STOCKS[k], v = d.v, pct = v ? (d.p - v) / v * 100 : null;
    const up = pct !== null ? pct >= 0 : d.c.length > 1 ? d.c[d.c.length - 1] >= d.c[0] : null;
    const cls = up === null ? '' : up ? 'up' : 'down';
    return `<li class="stk${staleMark(d) ? ' old' : ''}"><span class="nm">${esc(stockName(k))}${mixed && !marketOpen(isSA(k)) ? '<span class="cl">مغلق</span>' : ''}</span>`
      + (up === null ? '' : spark(d.c, up)) + `<span class="px">${num(d.p, 2)}</span>`
      + (pct === null ? '' : `<span class="chg ${cls}">${pct >= 0 ? '▲' : '▼'} ${num(Math.abs(pct), 2)}${LATIN ? '%' : '٪'}</span>`) + '</li>';
  });
  const note = [allClosed ? 'السوق مغلق' : '', stale.length ? staleMark(stale[0]) : ''].filter(Boolean).join(' · ');   // the oldest price that is not current
  return {hd: '<span>الأسهم</span>' + (note ? `<span class="until">${note}</span>` : ''), rows};
}
