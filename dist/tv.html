  const id = String(v.id), j = archWant('teams/' + id + '.json'), name = teamNameOf(id, j), now = Date.now();
  const its = ev => String(ev.idHomeTeam) === id || String(ev.idAwayTeam) === id;
  const own = fbGames().filter(ev => its(ev) && !fbDone(ev, now));
  const coming = own.concat(archNew(own, ((j && j.next) || []).map(g => archEv(g, j)).filter(ev => ev && !fbDone(ev, now)))).sort((a, b) => fbKick(a) - fbKick(b));
  const lastOwn = fbGames().filter(ev => its(ev) && fbDone(ev, now) && fbScored(ev));
  const last = lastOwn.concat(archNew(lastOwn, ((j && j.last) || []).map(g => archEv(g, j)).filter(Boolean))).sort((a, b) => fbKick(b) - fbKick(a)).slice(0, 10);
  const vs = String(v.vs || (coming[0] ? (String(coming[0].idHomeTeam) === id ? coming[0].idAwayTeam : coming[0].idHomeTeam) : '') || '');
  const h = /^\d+$/.test(vs) ? archWant('h2h/' + [id, vs].sort((a, b) => a - b).join('-') + '.json') : null;
  const wait = x => x === undefined ? FB_W.loading : FB_W.noData, groups = [], by = new Map();
  coming.forEach(ev => { const k = fbRound(ev) || FB_W.upcoming; if(!by.has(k)) by.set(k, []); by.get(k).push(ev); });
  by.forEach((games, k) => groups.push({key: 'n' + groups.length, name: k, games, dated: 1}));
  if(!coming.length) groups.push({key: 'n', name: FB_W.upcoming, games: [], none: wait(j)});
  groups.push({key: 'last', name: FB_W.last, games: last, dated: 1, none: wait(j)});
  if(/^\d+$/.test(vs)){
    const ms = ((h && h.meetings) || []).map(g => archEv(g)).filter(Boolean), all = h2hAll(id, vs), rows = [];
    if(all) rows.push(mpItem(fw(FB_W.h2hAll, name, ar(all.a), ar(all.d), teamNameOf(vs), ar(all.b)), fw(FB_W.h2hIn, ar(all.n)), () => {}));
    rows.push(...(v.allH2h ? ms : ms.slice(0, 10)));
    if(!v.allH2h && ms.length > 10) rows.push(mpItem(fw(FB_W.h2hMore, ar(ms.length)), '', () => { v.allH2h = 1; mpRender(); }));
    groups.push({key: 'h2h', name: fw(FB_W.h2h, teamNameOf(vs)), games: rows, dated: 1, none: wait(h)});
  }
  const tabs = [{t: fw(fbFollowed(id) ? FB_W.unfollowT : FB_W.followT, name), act: () => mpFollowTeam(id)}];
  if(v.vs) tabs.push({t: fw(FB_W.see, teamNameOf(vs)), act: () => { MP.view = {k: 'club', id: vs, vs: id}; MP.zone = 'rows'; MP.d = MP.l = MP.r = 0; MP.note = MP.ask = ''; mpRender(); }});
  const f = formOf(id);
  return {title: name, tabs, groups, sub: f.length ? `<span class="fmh">${FB_W.form}</span>${formHtml(f)}` : ''};
}
function mpAct(){
  const ev = MP.detail, ringed = document.querySelector('#mp-detail .mdb button.f, #mp-detail .mdq button.f');
  if(ringed && ringed.dataset.k === 'back'){ mpBack(); return; }
  if(ringed && ringed.dataset.k === 'club'){ mpBack(); mpGo({k: 'club', id: String(ev.idHomeTeam), vs: String(ev.idAwayTeam)}); return; }
  const b = ringed && mpButtons(ev, Date.now()).find(x => x.k === ringed.dataset.k);
  if(!b) return;
  if(b.k === 'follow'){ const g = mpGate('teams', b.k); if(g === 'stop') return mpDetailRender(); if(g === 'warned') MP.ask = b.k; }
  if((b.k === 'follow' || b.k === 'unfollow') && MP.ask !== b.k){ MP.ask = b.k; MP.note = FB_W.sure; return mpDetailRender(); }
  MP.ask = '';
  const host = window.UrtvMatches;
  let ok = false;
  try{
    if(b.k === 'watch'){ ok = !!(host && host.open(b.app)); MP.note = ok ? '' : FB_W.failed; if(ok) return; }
    else if(b.k === 'install'){ ok = !!(host && host.installPlayer()); MP.note = ok ? '' : FB_W.failed; if(ok) return; }
    else if(b.k === 'player'){ ok = !!(host && host.findMatch(JSON.stringify(mpFacts(ev)))); MP.note = ok ? '' : FB_W.failed; if(ok) return; }
    else if(b.k === 'unfollow'){
      const id = String(ev['id' + b.side + 'Team']);
      ok = !!(host && host.unfollow(id));
      if(ok){ const i = CONFIG.teamIds.indexOf(id); if(i >= 0) CONFIG.teamIds.splice(i, 1); }
    }
    else if(b.k === 'remind') ok = !!(host && host.remind(fw(FB_W.taskText, teamAr(ev.strHomeTeam, ev.idHomeTeam) + ' × ' + teamAr(ev.strAwayTeam, ev.idAwayTeam),
      fbDayWord(fbDayOf(fbKick(ev))) + ' ' + fbClock(fbKick(ev))), fbKick(ev)));
    else{
      const id = String(ev['id' + b.side + 'Team']);
      ok = !!(host && host.follow(id, String(ev['str' + b.side + 'Team'] || '')));
      if(ok && !CONFIG.teamIds.includes(id)) CONFIG.teamIds.push(id);
    }
  }catch(e){ ok = false; }
  if(ok && b.k !== 'remind') MP.picked = true;
  if(ok && b.k !== 'remind'){
    try{ Promise.resolve(loadMatches()).then(() => { fbRender(); if(document.getElementById('mp')) mpRender(); }).catch(() => {}); }catch(e){}
  }
  MP.note = ok ? (b.k === 'remind' ? FB_W.reminded : fw(b.k === 'unfollow' ? FB_W.unfollowed : FB_W.followed, teamAr(ev['str' + b.side + 'Team'], ev['id' + b.side + 'Team']))) : FB_W.failed;
  mpDetailRender();
}
function mpKey(e){
  const fwd = Dir_rtl() ? 'ArrowLeft' : 'ArrowRight', back = Dir_rtl() ? 'ArrowRight' : 'ArrowLeft', k = e.key;
  const ok = k === 'Enter' || k === ' ';
  if(MP.detail){
    const n = mpButtons(MP.detail, Date.now()).length;
    if(ok) return mpAct(), e.preventDefault();
    MP.ask = '';
    if(k === 'Escape' || k === 'Backspace'){ mpBack(); return e.preventDefault(); }
    if(MP.btn >= n){ if(k === 'ArrowUp') MP.btn = n > 0 ? 0 : -1; else if((k === fwd || k === back) && mpHasClub(MP.detail)) MP.btn = MP.btn === n ? n + 1 : n; }
    else if(k === 'ArrowDown') MP.btn = n;
    else if(k === fwd) MP.btn = Math.min(n - 1, MP.btn + 1);
    else if(k === back) MP.btn = Math.max(-1, MP.btn - 1);
    else return;
    e.preventDefault(); return mpDetailRender();
  }
  if(MP.view && MP.zone === 'head') MP.zone = 'days';
  if(MP.zone === 'head'){
    if(ok){ e.preventDefault(); return mpGo({k: 'mine'}); }
    if(k !== 'ArrowDown') return;
    MP.zone = 'days'; e.preventDefault(); return mpRender();
  }
  if(MP.zone !== 'days' && !MP.rows.length) MP.zone = 'days';
  if(MP.zone === 'days' && MP.tabs){
    if(e.target && e.target.id === 'mp-q' && !['ArrowDown', 'ArrowUp', 'Enter'].includes(k)) return;
    if(k === fwd) MP.d = Math.min(MP.tabs.length - 1, MP.d + 1); else if(k === back) MP.d = Math.max(0, MP.d - 1);
    else if(k === 'ArrowDown' || (k === 'Enter' && e.target && e.target.id === 'mp-q')) MP.zone = MP.rows.length ? 'rows' : MP.leagues.length ? 'leagues' : 'days';
    else if(ok){ const x = MP.tabs[MP.d]; e.preventDefault(); if(x && x.act) x.act(); return; }
    else if(k !== 'ArrowUp') return;
  } else if(MP.zone === 'days'){
    if(k === fwd) MP.d = Math.min(MP.days.length - 1, MP.d + 1); else if(k === back) MP.d = Math.max(0, MP.d - 1);
    else if(k === 'ArrowDown') MP.zone = MP.rows.length ? 'rows' : MP.leagues.length ? 'leagues' : 'days';
    else if(k === 'ArrowUp' && document.getElementById('mp-teams')) MP.zone = 'head';
    else if(!ok) return;
    if(k === fwd || k === back || ok){ MP.day = MP.days[MP.d]; MP.picked = true; MP.r = 0; MP.l = 0; }
  } else if(MP.zone === 'leagues'){
    const pin = MP.leagues[MP.l] && MP.leagues[MP.l].pin;
    if(k === 'ArrowDown') MP.l = Math.min(MP.leagues.length - 1, MP.l + 1);
    else if(k === 'ArrowUp'){ if(MP.l) MP.l--; else MP.zone = 'days'; }
    else if(pin && (k === fwd || ok)){ e.preventDefault(); return mpGo({k: 'league', id: pin}); }
    else if(k === fwd || ok){ if(MP.rows.length) MP.zone = 'rows'; }
    else return;
    if(MP.only) MP.r = 0;
    else if(MP.zone === 'leagues' || k === fwd || ok){ let n = 0; for(let i = 0; i < MP.l; i++) n += MP.leagues[i].games.length; MP.r = n; }
  } else {
    if(k === 'ArrowDown') MP.r = Math.min(MP.rows.length - 1, MP.r + 1);
    else if(k === 'ArrowUp'){ if(MP.r) MP.r--; else MP.zone = 'days'; }
    else if(k === back){ if(MP.leagues.length) MP.zone = 'leagues'; }
    else if(ok){ const x = MP.rows[MP.r]; e.preventDefault(); if(x && x.it){ if(x.act) x.act(); } else if(x) mpOpen(x); return; }
    else return;
    if(!MP.only){ let n = 0; MP.leagues.forEach((g, i) => { if(MP.r >= n) MP.l = i; n += g.games.length; }); }
  }
  e.preventDefault();
  mpRender();
}
function bootMatchPage(){
  document.documentElement.classList.add('mpage');
  document.documentElement.classList.toggle('mpdark', !!CONFIG.pageDark);
  document.body.insertAdjacentHTML('beforeend', `<div id="mp"><header><h1 id="mp-h">${FB_W.title}</h1><span id="mp-age"></span>${window.UrtvMatches && window.UrtvMatches.openTeams ? `<button id="mp-teams" type="button" tabindex="-1">${FB_W.teams}</button>` : ''}</header>`
    + '<ul id="mp-days"></ul><div class="mpb"><ul id="mp-side"></ul><div id="mp-list"></div></div></div><div id="mp-detail" hidden></div>');
  document.documentElement.style.setProperty('--u', (innerWidth / 1920) + 'px');
  addEventListener('resize', () => document.documentElement.style.setProperty('--u', (innerWidth / 1920) + 'px'));
  addEventListener('keydown', mpKey);
  addEventListener('input', e => { if(e.target && e.target.id === 'mp-q'){ MP.q = e.target.value.slice(0, 40); MP.r = 0; mpRender(); } });
  const want = _Q.get('event');
  mpRender();
  const openWanted = () => { if(want && !MP.detail){ const ev = fbGames().find(x => String(x.idEvent) === want); if(ev){ MP.day = fbDayOf(fbKick(ev)); MP.picked = true; mpRender(); MP.r = MP.rows.indexOf(ev); mpOpen(ev); } } };
  openWanted();
  loadPrayers();
  loadMatches().then(() => { mpRender(); openWanted(); });
  periodic(loadLive, 2 * 60000);
  setInterval(mpRender, 30000);
  reveal();
}

let SPORTS = null;
function loadSportsJs(){
  if(SPORTS || !(CONFIG.cards.some(k => SPORT_KINDS.includes(k)) || (CONFIG.teamIds.length && _Q.get('ko') !== '0'))) return;
  const stamp = document.querySelector('meta[name="urtv-build"]').content, f = document.documentElement.lang === 'en' ? 'sports-en.js' : 'sports.js';
  const urls = [f, 'file:///android_asset/' + f, 'file:///android_asset/web/' + f, 'https://raw.githubusercontent.com/tshi-dev/UrTV/master/dist/' + f];
  const next = i => {
    if(i >= urls.length) return;
    const x = new XMLHttpRequest(), fail = () => next(i + 1);
    x.onload = () => {
      if(!x.responseText.includes('SPORTS_BUILD:' + stamp + ':')) return fail();
      const sc = document.createElement('script'); sc.textContent = x.responseText; document.head.appendChild(sc);
      if(SPORTS){ renderPanel(false, ...SPORT_KINDS); if(MATCHES_LOADED) SPORTS.load(); }
    };
    x.onerror = x.ontimeout = fail;
    try{ x.open('GET', urls[i]); x.timeout = 8000; x.send(); }catch(e){ fail(); }
  };
  next(0);
}
function boot(){
  if(CONFIG.lowram) document.documentElement.classList.add('lowram');
  pruneStorage();
  if(CONFIG.matchPage){ bootMatchPage(); return; }
  if(CONFIG.football){ bootFootball(); loadSportsJs(); return; }
  if(CONFIG.widget){ bootWidget(); loadSportsJs(); return; }
  PAGE_FULL = true;
  buildCards();
  loadSportsJs();
  if(document.fonts) document.fonts.ready.then(() => {
    fitYearStrip();
    fitMatches(document.getElementById('match-row'));
    if(MATCHES_LOADED) CARDS.forEach(c => { if(c.eff === 'matches') c.ul.__h = null; });
    renderPanel(false, 'matches');
  });
  if(CONFIG.slot === 'none') document.documentElement.classList.add('slot-none');
  if(!CONFIG.occasion) document.documentElement.classList.add('occ-off');
  if(!SLOT_MATCHES) document.getElementById('match-row').textContent = '';
  addCardStyle();
  if(CONFIG.clockSize !== 'large') document.documentElement.classList.add('ck-' + CONFIG.clockSize);
  if(CONFIG.clockSize === 'small') document.documentElement.style.setProperty('--ckk', ((LATIN ? 3.26 : 2.62) + (CONFIG.seconds ? .44 : 0)).toFixed(2));
  if(CONFIG.seconds && !CONFIG.widget) document.getElementById('ck-m').insertAdjacentHTML('afterend', '<span class="sec" id="ck-s"><i></i><i></i></span>');
  buildMarkets();
  restoreSnap();
  const wxMoreEl = document.getElementById('wx-more');
  if(CONFIG.wxMore && !wxMoreEl) document.getElementById('wx-src').insertAdjacentHTML('beforebegin', '<div class="wxmore" id="wx-more" hidden></div>');
  if(!CONFIG.wxMore && wxMoreEl) wxMoreEl.remove();
  paintMkUp(); wxExpire(); wxSource();
  setTimeout(saveSnap, 15*1000);
  setInterval(saveSnap, 60*1000);
  addEventListener('pagehide', saveSnap);
  if(CONFIG.prayerBar) document.getElementById('prayer-count').insertAdjacentHTML('afterend', '<div class="pbar" id="pbar"><i id="pbar-fill"></i></div>');
  const wxCity = document.getElementById('wx-city');
  if(wxCity) wxCity.textContent = CONFIG.city;
  const cs = document.getElementById('clock-sub');
  if(cs) cs.textContent = clockSubText();
  const cn = document.getElementById('citynote');
  if(cn && CONFIG.cityNote){
    cn.textContent = 'المدينة: ' + CONFIG.city + '. لتغييرها: الإعدادات ثم الموقع';
    cn.hidden = false;
    setTimeout(() => { cn.hidden = true; }, 10*60*1000);
  }
  document.title = 'شاشة تلفزيونك';
  applyBackground(true);
  loadPhotoIndex().then(() => applyBackground(true));
  setInterval(() => applyBackground(false), (CONFIG.photoMinutes < 1 ? 5 : 60)*1000);
  tickClock(); tickDates(); tickOccasion(); renderSlot();
  loadMarkets();
  renderPanel(false, ...CARD_KINDS.filter(k => k !== 'shows'));
  if(NEEDS_MATCHES) loadMatches();
  loadPrayers(); if(USES('shows')) loadWeek(); loadWeather(); loadTafsir();
  applyNight(); pixelShift();

  nowPlayingTick();
  setInterval(nowPlayingTick, 60*1000);
  reportZone();
  setInterval(reportZone, 60*60*1000);
  setInterval(adhanLiveTick, CONFIG.lowram ? 15000 : 3000);
  if(REMS.length){ remDraw(); setInterval(remDraw, CONFIG.lowram ? 5000 : 1000); }
  if(CONFIG.seconds){
    const onSecond = () => { if(document.hidden) PAGE_SKIPPED = true; else tickClock(); setTimeout(onSecond, 1000 - Date.now() % 1000 + 15); };
    setTimeout(onSecond, 1000 - Date.now() % 1000 + 15);
  } else setInterval(tickClock, 1000);
  setInterval(()=>{ tickDates(); tickPrayer(); tickOccasion(); wxExpire(); wxSource(); if(!SLOT_MATCHES) renderSlot(); designTick(); }, 15000);
  if(SLOT_MATCHES){
    setInterval(() => renderMatches(false), 60000);
    const turn = () => { if(document.hidden) PAGE_SKIPPED = true; else renderMatches(true); setTimeout(turn, CONFIG.leagues.length && MATCH_PAGES > 3 ? CONFIG.matchPageFastMs : CONFIG.matchPageMs); };
    setTimeout(turn, CONFIG.matchPageMs);
  }
  if(NEEDS_MATCHES){ periodic(loadLive, 2*60000); periodic(loadMatches, 30*60*1000); }
  periodic(loadPrayers, 6*3600*1000);
  periodic(loadMarkets, (CONFIG.lowram ? 15 : CONFIG.midram ? 10 : 5)*60*1000);
  if(USES('shows')) periodic(loadWeek, 6*3600*1000);
  periodic(loadWeather, 30*60*1000);
  cardTimers();
  designInit();
  loadSchool();
  setTimeout(designTick, 2500);
  setInterval(applyNight, 60*1000);
  setInterval(pixelShift, 4*60*1000);
  let lastDay = FMT_DATE.format(new Date());
  setInterval(()=>{
    const d = FMT_DATE.format(new Date());
    if(d !== lastDay){
      lastDay = d; tickDates(); tickOccasion(); renderPanel(false); schoolNext();
      later(() => { loadPhotoIndex().then(() => applyBackground(true)); loadPrayers(); if(NEEDS_MATCHES) loadMatches(); if(USES('shows')) loadWeek(); loadWeather(); });
    }
  }, 60*1000);
}

function addCardStyle(){
  if(CONFIG.cardStyle !== 'current') document.documentElement.classList.add(CONFIG.cardStyle === 'boxes' ? 'pbx' : OLD_LOOK ? 'cso' : 'cs-' + CONFIG.cardStyle);
}

function bootWidget(){
  document.documentElement.classList.add('widget');
  if(_Q.get('row') === '1') document.documentElement.classList.add('row');
  if(CONFIG.lowram) document.documentElement.classList.add('lowram');

  restoreSnap();
  setTimeout(saveSnap, 15*1000);
  setInterval(saveSnap, 60*1000);
  addEventListener('pagehide', saveSnap);

    CARDS.forEach(c => { if(c.eff === 'matches') c.ul.__h = null; });

  if(USES('adhkar') || USES('prayers') || USES('prayerrow')){ loadPrayers(); periodic(loadPrayers, 6*3600*1000); }

  setInterval(() => { if(riyadhDayNumber() !== lastDay){ lastDay = riyadhDayNumber(); renderPanel(false); if(USES('prayers') || USES('prayerrow') || USES('adhkar')) later(loadPrayers); } }, 60*1000);
  reveal();
}

document.addEventListener('keydown', e=>{
  if(e.key === 'f' || e.key === 'F'){
    if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
    else document.exitFullscreen().catch(()=>{});
  }
});
