// every number on the screen goes through ar() or a formatter built on NU, so CONFIG.digits decides them all
const LATIN = CONFIG.digits === 'latin', NU = LATIN ? 'latn' : 'arab';
const GREG = 'ar-SA-u-ca-gregory-nu-' + NU;
const AR = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
const ar = s => LATIN ? String(s) : String(s).replace(/[0-9]/g, d => AR[+d]);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');

// Formatters are made once: building an Intl.DateTimeFormat costs far more than using one, and these run in every redraw and tick.
const FMT_ALL = new Intl.DateTimeFormat('en-GB',{
  timeZone: CONFIG.timezone, hour12:false,
  year:'numeric', month:'2-digit', day:'2-digit',
  hour:'2-digit', minute:'2-digit', second:'2-digit'
});
const FMT_HM = new Intl.DateTimeFormat('en-GB',{timeZone:CONFIG.timezone,hour:'2-digit',minute:'2-digit',hour12:false});   // the city's clock
const FMT_DATE = new Intl.DateTimeFormat('en-CA',{timeZone:CONFIG.timezone});   // YYYY-MM-DD in the city
// #months=levant: every Gregorian month the page writes in the Levant's names (MonthNames.java on the home screen says the same)
const LEVANT_MONTHS = {'يناير':'كانون الثاني', 'فبراير':'شباط', 'مارس':'آذار', 'أبريل':'نيسان', 'مايو':'أيار', 'يونيو':'حزيران',
  'يوليو':'تموز', 'أغسطس':'آب', 'سبتمبر':'أيلول', 'أكتوبر':'تشرين الأول', 'نوفمبر':'تشرين الثاني', 'ديسمبر':'كانون الأول'};
const LEVANT_RE = new RegExp(Object.keys(LEVANT_MONTHS).join('|'), 'g');
const gm = s => CONFIG.months === 'levant' ? String(s).replace(LEVANT_RE, m => LEVANT_MONTHS[m]) : s;
const gregFmt = opts => { const f = new Intl.DateTimeFormat(GREG, opts); return {format: d => gm(f.format(d))}; };   // a Gregorian date with a month name
const FMT_DAY_MONTH = gregFmt({timeZone:CONFIG.timezone,weekday:'long',day:'numeric',month:'long'});   // «السبت ٢٤ أكتوبر»
const FMT_WEEKDAY = new Intl.DateTimeFormat(GREG,{timeZone:CONFIG.timezone,weekday:'long'});
const hmParts = d => FMT_HM.formatToParts(d).reduce((a,x)=>(a[x.type]=x.value,a),{});
function riyadhParts(d = new Date()){
  const f = FMT_ALL.formatToParts(d).reduce((a,p)=>(a[p.type]=p.value,a),{});
  return { y:+f.year, mo:+f.month, d:+f.day, h:(+f.hour)%24, mi:+f.minute, s:+f.second };
}
// how far the city's clock is ahead of UTC at that moment, in ms (Riyadh +3 h all year; Cairo changes with summer time)
function tzOffsetMs(ms){
  const p = riyadhParts(new Date(ms));
  return Date.UTC(p.y, p.mo - 1, p.d, p.h, p.mi, p.s) - Math.floor(ms / 1000) * 1000;
}
// Every time of day on the screen is written here, so #clock=24 changes them all: {t:'٧:٣٠', u:'م', h:'٧'} (12-hour), {t:'١٩:٣٠', u:''} (24-hour).
function timeParts(h, mi){
  h %= 24;   // 24:30 (an Isha after midnight) is 12:30 ص, or 00:30
  if(CONFIG.clock24) return {t: `${ar(pad(h))}:${ar(pad(mi))}`, u: ''};
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return {t: `${ar(h12)}:${ar(pad(mi))}`, u: h < 12 ? 'ص' : 'م', h: ar(h12)};
}
function fmtTime(h, mi){
  const x = timeParts(h, mi);
  return x.u ? x.t + ' ' + x.u : x.t;
}

// An identical write still restyles and repaints, so the timers below write only what changed.
function setText(el, v){ if(el.textContent !== v) el.textContent = v; }
function setHTML(el, h, force){ if(force || el.__h !== h){ el.__h = h; el.innerHTML = h; return true; } return false; }

function tickClock(){
  const p = riyadhParts();
  const h12 = p.h % 12 === 0 ? 12 : p.h % 12, h24 = CONFIG.clock24;
  // one box per digit: browsers ignore letter-spacing on Arabic digits, and ٤ reaches into the next digit
  const digits = s => [...s].map(ch => '<i>' + ch + '</i>').join('');
  const key = (h24 ? p.h : h12) + ':' + p.mi;
  if(key === tickClock.last) return;   // ticks every second, redraws once a minute
  tickClock.last = key;
  document.getElementById('ck-h').innerHTML = digits(ar(h24 ? pad(p.h) : h12));   // 24-hour: «٠٧», still one box per digit
  document.getElementById('ck-m').innerHTML = digits(ar(pad(p.mi)));
  const ap = document.getElementById('ck-ap');
  if(h24) ap.style.display = 'none';   // no ص or م on a 24-hour clock
  else setText(ap, p.h < 12 ? 'ص' : 'م');
  if(CONFIG.yearStrip) renderYearStrip();   // the day may have turned; the clock's width may have changed
}

// National Day (23 September, shown 21-25) and Founding Day (22 February, shown 20-24), by the Riyadh date.
// n = the year count shown; today = the day itself. Null when off or outside the days.
const NATIONAL = [
  {mo:9, d:23, name:'اليوم الوطني السعودي', short:'اليوم الوطني', since:1930, unit:''},
  {mo:2, d:22, name:'يوم التأسيس', short:'يوم التأسيس', since:1727, unit:' عامًا'},
];
function nationalNow(){
  if(CONFIG.national === 'off') return null;
  const p = riyadhParts();
  for(const e of NATIONAL){
    const diff = Math.round((Date.UTC(p.y, p.mo-1, p.d) - Date.UTC(p.y, e.mo-1, e.d)) / 86400000);
    if(Math.abs(diff) <= 2) return {...e, today: diff === 0, n: p.y - e.since};
  }
  return null;
}

// «فرق التاريخ الهجري»: the instant to give the Umm al-Qura calendar (formatted in the city's zone) so that it answers for the city's day
// plus CONFIG.hijri days. At 0 it is `d` itself; otherwise noon of that day (the time of day does not matter to a date).
function hijriAt(d){
  const k = CONFIG.hijri;
  if(!k) return d;
  const p = riyadhParts(d);
  const t = Date.UTC(p.y, p.mo - 1, p.d + k, 12);   // noon of the target day: a spring-forward at midnight cannot move it off its day
  return new Date(t - tzOffsetMs(t));
}
// the same for a date held as UTC noon of a day (formatted with timeZone UTC): whole days, no summer time there
const hijriUtc = d => CONFIG.hijri ? new Date(d.getTime() + CONFIG.hijri*86400000) : d;

function tickDates(){
  const now = new Date();
  const nat = nationalNow(), nl = document.getElementById('natline');
  document.documentElement.classList.toggle('nat', !!nat);
  nl.hidden = !nat;
  if(nat) setText(nl, nat.name + ' ' + ar(nat.n) + nat.unit);
  try{
    const hf = new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura-nu-' + NU,{
      timeZone: CONFIG.timezone, weekday:'long', day:'numeric', month:'long', year:'numeric'
    });
    let h;
    if(!CONFIG.hijri) h = hf.format(now);
    else{   // the day, month and year move; the weekday is today's
      const wd = hf.formatToParts(now).find(x => x.type === 'weekday');
      h = hf.formatToParts(hijriAt(now)).map(x => x.type === 'weekday' && wd ? wd.value : x.value).join('');
    }
    h = h.replace(/\s*هـ\s*$/,'').replace(/،\s*$/,'');
    setText(document.getElementById('hijri'), h + ' هـ');
  }catch(e){}
  try{
    setText(document.getElementById('greg'), gregFmt({
      timeZone: CONFIG.timezone, weekday:'long', day:'numeric', month:'long', year:'numeric'
    }).format(now));
  }catch(e){}
}

const PRAYER_KEYS = ['Fajr','Dhuhr','Asr','Maghrib','Isha'];
const PRAYER_NAMES = {Fajr:'الفجر',Dhuhr:'الظهر',Asr:'العصر',Maghrib:'المغرب',Isha:'العشاء'};
let PRAYERS = [];

let DAY_TIMES = null;
// «تعديل وقت الصلاة»: the five prayers moved by their minutes (CONFIG.prayerAdj); everything on the page that shows or acts on a prayer
// time reads PRAYERS and DAY_TIMES, so this is the one place. The sunrise stays. A time past midnight (an Isha at «24:10») stays absolute.
function adjustedTimes(t){
  if(!CONFIG.prayerAdj.some(Boolean)) return t;
  const out = Object.assign({}, t);
  PRAYER_KEYS.forEach((k, i) => {
    const d = CONFIG.prayerAdj[i], [h, mi] = String(t[k]).split(':').map(Number);
    if(!d || !isFinite(h) || !isFinite(mi)) return;
    const m = Math.max(0, h * 60 + mi + d);
    out[k] = pad(Math.floor(m / 60)) + ':' + pad(m % 60);
  });
  return out;
}
// «5:12» and «05:12 (+03)» are 05:12; anything else is null
function clockText(v){
  const m = /^\s*(\d{1,2}):(\d{2})/.exec(v == null ? '' : String(v));
  if(!m) return null;
  const h = +m[1], mi = +m[2];
  return h < 24 && mi < 60 ? pad(h) + ':' + pad(mi) : null;
}
// An Aladhan answer for that day (DD-MM-YYYY) whole, or null: five valid times and the day asked. An Isha before Maghrib is after midnight: «24:10»
function checkedTimings(j, want){
  const t = j && j.data && j.data.timings, got = j && j.data && j.data.date && j.data.date.gregorian && j.data.date.gregorian.date;
  if(!t || got !== want) return null;   // fail closed: an answer that does not say it is today's (a cached or captive page) is not used
  const out = {};
  for(const k of PRAYER_KEYS){ if(!(out[k] = clockText(t[k]))) return null; }
  out.Sunrise = clockText(t.Sunrise) || undefined;
  const mins = k => { const [h, mi] = out[k].split(':').map(Number); return h * 60 + mi; };
  if(mins('Isha') < mins('Maghrib')) out.Isha = pad(Math.floor((mins('Isha') + 1440) / 60)) + ':' + pad(mins('Isha') % 60);
  // the times of one day come in this order; an answer that has them otherwise is not used
  for(let i = 1; i < PRAYER_KEYS.length; i++) if(mins(PRAYER_KEYS[i]) <= mins(PRAYER_KEYS[i - 1])) return null;
  return out;
}
function buildPrayers(t){
  t = adjustedTimes(t);
  // all fields are checked before anything is published; a bad one throws
  const list = PRAYER_KEYS.map(k => {
    const m = /^(\d{1,2}):(\d{2})$/.exec(String(t[k]));
    if(!m || +m[2] > 59) throw new Error('prayer time ' + k);
    return {key:k, name:PRAYER_NAMES[k], h:+m[1], mi:+m[2]};
  });
  DAY_TIMES = t;
  PRAYERS = list;
}

// By Aladhan's id, as PrayerMath.METHODS in the launcher: Fajr/Isha angles, or Isha minutes after Maghrib (+30 in Ramadan for 4 alone), the
// Maghrib angle, minutes added to sunrise/Dhuhr/Asr/Maghrib. Sources: aladhan.com/calculation-methods, Batoul Apps adhan (Dubai margins)
const PRAYER_METHODS = {
  0:  {fajr:16,   isha:14,   ishaMin:0,  maghrib:4,    tune:[0,0,0,0]},      // Ja'fari (Leva, Qum)
  4:  {fajr:18.5, isha:0,    ishaMin:90, maghrib:.833, tune:[0,0,0,0]},      // Umm al-Qura
  8:  {fajr:19.5, isha:0,    ishaMin:90, maghrib:.833, tune:[0,0,0,0]},      // Gulf (Bahrain; Oman by #pm=gulf)
  9:  {fajr:18,   isha:17.5, ishaMin:0,  maghrib:.833, tune:[0,0,0,0]},      // Kuwait
  10: {fajr:18,   isha:0,    ishaMin:90, maghrib:.833, tune:[0,0,0,0]},      // Qatar
  16: {fajr:18.2, isha:18.2, ishaMin:0,  maghrib:.833, tune:[-3,3,3,3]},     // Dubai (the UAE)
  5:  {fajr:19.5, isha:17.5, ishaMin:0,  maghrib:.833, tune:[0,0,0,0]},      // Egypt, and Syria, Lebanon, Palestine (no Aladhan method of their own; praytimes.org: Egyptian for Syria and Lebanon)
  23:  {fajr:18, isha:18, ishaMin:0, maghrib:.833, tune:[0,0,0,5]},  // Jordan (the Ministry of Awqaf): Maghrib 5 minutes after sunset
  21:  {fajr:19, isha:17, ishaMin:0, maghrib:.833, tune:[0,5,0,5]},  // Morocco (the Awqaf ministry): Dhuhr and Maghrib +5
  19:  {fajr:18, isha:17, ishaMin:0, maghrib:.833, tune:[0,0,0,0]},  // Algeria (Ministry of Religious Affairs)
  18:  {fajr:18, isha:18, ishaMin:0, maghrib:.833, tune:[0,0,0,0]},  // Tunisia (Ministry of Religious Affairs)
  // 100 is ours (Aladhan has none): Oman's ministry, fitted to its 2026 timetable (PrayerMath.java says more)
  100: {fajr:18, isha:18, ishaMin:0, maghrib:.833, tune:[0,5,5,5]},
};
function computePrayers(){
  const p = riyadhParts(), lat = CONFIG.latitude, lng = CONFIG.longitude;
  const M = PRAYER_METHODS[CONFIG.prayerMethod] || PRAYER_METHODS[4];
  const noonUtc = Date.UTC(p.y,p.mo-1,p.d,12), tz = tzOffsetMs(noonUtc - tzOffsetMs(noonUtc)) / 3600000;   // the city's offset at its local noon (a change of clocks the same day does not move the whole day)
  const rad = d => d*Math.PI/180, deg = r => r*180/Math.PI;
  const fix = (a,b) => { a = a - b*Math.floor(a/b); return a < 0 ? a + b : a; };
  const jd0 = Date.UTC(p.y,p.mo-1,p.d)/86400000 + 2440587.5 - lng/(15*24);
  const sun = t => {
    const D = jd0 + t - 2451545;
    const g = fix(357.529 + .98560028*D, 360), q = fix(280.459 + .98564736*D, 360);
    const L = fix(q + 1.915*Math.sin(rad(g)) + .020*Math.sin(rad(2*g)), 360);
    const e = 23.439 - .00000036*D;
    const RA = fix(deg(Math.atan2(Math.cos(rad(e))*Math.sin(rad(L)), Math.cos(rad(L))))/15, 24);
    return {decl: deg(Math.asin(Math.sin(rad(e))*Math.sin(rad(L)))), eqt: q/15 - RA};
  };
  const noon = t => fix(12 - sun(t/24).eqt, 24);
  const angleTime = (angle, t, ccw) => {
    const d = sun(t/24).decl, n = noon(t);
    const c = (-Math.sin(rad(angle)) - Math.sin(rad(d))*Math.sin(rad(lat))) / (Math.cos(rad(d))*Math.cos(rad(lat)));
    const T = deg(Math.acos(Math.max(-1, Math.min(1, c))))/15;
    return n + (ccw ? -T : T);
  };
  const asrTime = t => {
    const d = sun(t/24).decl;
    const a = -deg(Math.atan(1/(1 + Math.tan(rad(Math.abs(lat - d))))));
    return angleTime(a, t, false);
  };
  const adj = h => h + tz - lng/15;
  const fajr = adj(angleTime(M.fajr, 5, true)), dhuhr = adj(noon(12)), asr = adj(asrTime(13));
  const sunrise = adj(angleTime(.833, 6, true));
  const maghrib = adj(angleTime(M.maghrib, 18, false));
  const hm = h => { const m = Math.round(fix(h, 24)*60) % 1440; return pad(Math.floor(m/60)) + ':' + pad(m%60); };
  // Isha stays absolute: past midnight it reads «24:30»
  const abs = m => pad(Math.floor(m/60)) + ':' + pad(m%60);
  const [tSun, tDhr, tAsr, tMag] = M.tune;
  const magM = Math.round(maghrib*60) + tMag;
  const ishaM = M.ishaMin ? magM + M.ishaMin + (CONFIG.prayerMethod === 4 && hijriMonthNow(true) === 9 ? 30 : 0)
                          : Math.max(magM, Math.round(adj(angleTime(M.isha, 18, false))*60));
  const at = (h, d) => hm(h + d/60);
  return {Fajr:hm(fajr), Sunrise:at(sunrise, tSun), Dhuhr:at(dhuhr, tDhr), Asr:at(asr, tAsr), Maghrib:at(maghrib, tMag), Isha:abs(ishaM)};
}

let PRAYERS_DAY = '';   // DD-MM-YYYY|api or |calc: the day and source of the times
async function loadPrayers(){
  const p = riyadhParts(), want = `${pad(p.d)}-${pad(p.mo)}-${p.y}`;
  const url = `https://api.aladhan.com/v1/timings/${want}`
            + `?latitude=${CONFIG.latitude}&longitude=${CONFIG.longitude}`
            + `&method=${CONFIG.prayerMethod}&timezonestring=${encodeURIComponent(CONFIG.timezone)}`;
  try{
    if(CONFIG.prayerMethod >= 100) throw 0;   // not an Aladhan method: computed only
    const r = await fetchT(url, 12000);
    const t = checkedTimings(await r.json(), want);
    if(!t) throw 0;
    buildPrayers(t);
    PRAYERS_DAY = want + '|api';
  }catch(e){
    if(!PRAYERS.length || PRAYERS_DAY.slice(0, 10) !== want){   // today's times already here are kept
      try{ buildPrayers(computePrayers()); PRAYERS_DAY = want + '|calc'; }catch(_){}
    }
  }
  tickPrayer();
  tickOccasion();   // Ramadan mode needs the prayer times
  renderPanel(false, 'prayers', 'adhkar', 'prayerrow', 'nextprayer');
}

const UNIT = {
  day: {one:'يوم', two:'يومين', few:'أيام', many:'يوم'},
  hour:{one:'ساعة', two:'ساعتين', few:'ساعات', many:'ساعة'},
  min: {one:'دقيقة', two:'دقيقتين', few:'دقائق', many:'دقيقة'}
};
function qty(n,u){
  if(n === 2) return u.two;
  if(n >= 3 && n <= 10) return `${ar(n)} ${u.few}`;
  return `${ar(n)} ${u.many}`;
}
function humanRemaining(sec){
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), out = [];
  if(h) out.push(qty(h,UNIT.hour));
  if(m || !h) out.push(qty(m,UNIT.min));
  return out.join(' و ');
}
function shortRemaining(ms){
  const d = Math.floor(ms/86400000), h = Math.floor((ms%86400000)/3600000);
  const out = [];
  if(d) out.push(qty(d,UNIT.day));
  if(h && out.length < 2) out.push(qty(h,UNIT.hour));
  if(!out.length) out.push(qty(Math.max(1, Math.ceil(ms/60000)), UNIT.min));
  return out.join(' و ');
}

function isFriday(){
  return new Intl.DateTimeFormat('en-US',{timeZone:CONFIG.timezone,weekday:'short'}).format(new Date()) === 'Fri';
}
function prayerName(x){ return x.key === 'Dhuhr' && isFriday() ? 'الجمعة' : x.name; }

// ---- the bar before the adhan: the last 10 minutes «أذان المغرب بعد ٨ دقائق», then to the iqama «إقامة المغرب بعد ١٢ دقيقة» (CONFIG.iqama;
// none for a Friday's Dhuhr, «أذان الجمعة»). #adhanbar=0 turns it off.
const ADHAN_BAR_MIN = 10;
// «٤ دقائق»: what is left to an adhan, in the same words at the same second on the bar and in the panel below (whole minutes of the
// rounded second; never less than one)
const untilAdhan = leftMin => humanRemaining(Math.max(60, Math.round(leftMin * 60)));
// while the adhan plays in the launcher (the screensaver only: window.UrtvNative.adhan() answers {"live":true,"prayer":4,"any":false}, "" otherwise)
// the bar names it and says how to stop it: «أذان المغرب  ·  أي زر يوقف الأذان» (the default; «اختيار: إيقاف الأذان» when «إيقاف الأذان بأي زر» is off). The same words
// as the launcher's bar (AdhanBarText.playing). Any key (or only OK, when the setting is off) is handled by the app, which also keeps the dream open.
let ADHAN_LIVE = null;
const ADHAN_PRAYER_NAMES = {0:'الفجر', 2:'الظهر', 3:'العصر', 4:'المغرب', 5:'العشاء'};
function adhanLiveText(){
  if(!ADHAN_LIVE) return '';
  const n = ADHAN_LIVE.prayer === 2 && isFriday() ? 'الجمعة' : ADHAN_PRAYER_NAMES[ADHAN_LIVE.prayer];
  return (n ? 'أذان ' + n : 'الأذان') + '  ·  ' + (ADHAN_LIVE.any ? 'أي زر يوقف الأذان' : 'اختيار: إيقاف الأذان');
}
function adhanLiveTick(){
  if(CONFIG.widget || !CONFIG.adhanBar || !(window.UrtvNative && window.UrtvNative.adhan)) return;
  // asked every 3 s whenever the app answers (a call to the app's provider, about a millisecond): an adhan started by hand has no time to wait for
  let s = null;
  try{ const raw = window.UrtvNative.adhan(); s = raw ? JSON.parse(raw) : null; }catch(e){}
  ADHAN_LIVE = s && s.live && typeof s.prayer === 'number' && isFinite(s.prayer) ? {prayer: +s.prayer, any: !!s.any} : null;
  tickAdhanBar();
}
function adhanBarText(){
  if(!CONFIG.adhanBar) return '';
  if(ADHAN_LIVE) return adhanLiveText();
  if(!PRAYERS.length) return '';
  const p = riyadhParts(), mins = p.h*60 + p.mi + p.s/60;
  for(const x of PRAYERS){
    const at = x.h*60 + x.mi, toAdhan = at - mins;
    if(toAdhan > 0 && toAdhan <= ADHAN_BAR_MIN) return 'أذان ' + prayerName(x) + ' بعد ' + untilAdhan(toAdhan);
    const gap = x.key === 'Dhuhr' && isFriday() ? 0 : (CONFIG.iqama[x.key] || 0);
    if(mins >= at && mins < at + gap) return 'إقامة ' + prayerName(x) + ' بعد ' + humanRemaining(Math.max(60, Math.ceil(at + gap - mins)*60));
  }
  return '';
}
function tickAdhanBar(){
  const bar = document.getElementById('adbar'), t = adhanBarText();
  if(!bar) return;
  bar.hidden = !t;
  if(t) setText(bar, t);
}

function tickPrayer(){
  tickAdhanBar();
  const elL=document.getElementById('prayer-label'),
        elN=document.getElementById('prayer-name'),
        elT=document.getElementById('prayer-time'),
        elC=document.getElementById('prayer-count'),
        panel=document.querySelector('.p-prayer');
  if(!PRAYERS.length) return;
  const p = riyadhParts();
  const mins = p.h*60 + p.mi + p.s/60;
  const fill = document.getElementById('pbar-fill');
  if(CONFIG.prayerBar && fill) fill.style.width = (prayerBarFraction(mins) * 100).toFixed(1) + '%';
  elN.hidden = false;   // the sunrise panel hides the name (its label already says «الشروق»)

  // between adhan and iqama: show the iqama countdown
  const cur = PRAYERS.find(x=>{
    const at = x.h*60 + x.mi;
    const gap = (x.key === 'Dhuhr' && isFriday()) ? 0 : (CONFIG.iqama[x.key] || 0);
    return mins >= at && mins < at + gap;
  });
  if(cur){
    const left = (cur.h*60 + cur.mi + CONFIG.iqama[cur.key]) - mins;
    if(!panel.classList.contains('now')) panel.classList.add('now');
    setText(elL, 'حان الآن');
    setText(elN, prayerName(cur));
    setText(elT, fmtTime(cur.h, cur.mi));
    setHTML(elC, 'الإقامة بعد <b>' + humanRemaining(Math.max(60, Math.ceil(left)*60)) + '</b>');
    return;
  }

  if(panel.classList.contains('now')) panel.classList.remove('now');
  if(CONFIG.sunrise && sunrisePanel(mins, elL, elN, elT, elC)) return;
  setText(elL, 'الصلاة القادمة');
  let next = PRAYERS.find(x => (x.h*60+x.mi) > mins);
  const leftM = next ? (next.h*60 + next.mi) - mins
                     : (PRAYERS[0].h*60 + PRAYERS[0].mi) + 1440 - mins;
  if(!next) next = PRAYERS[0];
  setText(elN, prayerName(next));
  setText(elT, fmtTime(next.h, next.mi));
  setHTML(elC, 'بعد <b>' + untilAdhan(leftM) + '</b>');
}

// #prayerbar=1: how far the time has come from one prayer to the next, as one measure all day (the iqama is inside it, so the bar never
// jumps back when the iqama ends); with #sunrise=1 the sunrise is one of the points, as the panel counts to it
function prayerBarFraction(mins){
  const at = PRAYERS.map(x => x.h*60 + x.mi);
  if(CONFIG.sunrise && DAY_TIMES && DAY_TIMES.Sunrise){ const [h, m] = String(DAY_TIMES.Sunrise).split(':').map(Number); at.push(h*60 + m); }
  at.sort((a, b) => a - b);
  const last = at.filter(t => t <= mins).pop(), next = at.find(t => t > mins);
  const from = last !== undefined ? last : at[at.length-1] - 1440, to = next !== undefined ? next : at[0] + 1440;
  return Math.max(0, Math.min(1, (mins - from) / Math.max(1, to - from)));
}

// #sunrise=1 (from PR #28): after Fajr's iqama the panel counts to the sunrise («الشروق» · «٦:٠٥ ص» · «بعد ٢٣ دقيقة»), and for half an hour
// after it says how long ago it was; then the Dhuhr countdown as always. The sunrise is not a prayer: the label says «الشروق», not «الصلاة
// القادمة». True when it painted the panel.
const SUNRISE_AFTER_MIN = 30;
function sunrisePanel(mins, elL, elN, elT, elC){
  const fajr = PRAYERS.find(x => x.key === 'Fajr');
  if(!DAY_TIMES || !DAY_TIMES.Sunrise || !fajr) return false;
  const [sh, sm] = String(DAY_TIMES.Sunrise).split(':').map(Number), at = sh*60 + sm, from = fajr.h*60 + fajr.mi + (CONFIG.iqama.Fajr || 0);
  if(mins >= from && mins < at){
    setText(elL, 'الشروق'); elN.hidden = true; setText(elT, fmtTime(sh, sm));   // «الشروق» once: the label, then the time
    setHTML(elC, 'بعد <b>' + untilAdhan(at - mins) + '</b>');
    return true;
  }
  const ago = mins - at;
  if(ago >= 0 && ago < SUNRISE_AFTER_MIN){
    setText(elL, 'الشروق'); elN.hidden = true; setText(elT, fmtTime(sh, sm));
    setHTML(elC, ago < 1 ? 'الآن' : 'قبل <b>' + humanRemaining(Math.max(60, Math.floor(ago) * 60)) + '</b>');
    return true;
  }
  return false;
}

// ---- «المناسبة القادمة»: the card in the middle of the bottom row follows the Hijri year ----
// All the wording is here. hm/hd: the Hijri month and day it begins (Umm al-Qura); days: how long it lasts;
// name: the label; year: the Hijri year follows the name; today: the big text on its days;
// note: a small second line while counting down. Ramadan itself shows iftar and suhoor (see tickOccasion).
const OCCASIONS = [
  {hm:9,  hd:1,  days:30, name:'رمضان',             year:true, today:'رمضان مبارك'},
  {hm:10, hd:1,  days:3,  name:'عيد الفطر',          today:'عيد مبارك'},
  {hm:12, hd:1,  days:1,  name:'عشر ذي الحجة',       today:'اليوم أول أيام العشر'},
  {hm:12, hd:9,  days:1,  name:'يوم عرفة',           today:'اليوم يوم عرفة'},
  {hm:12, hd:10, days:4,  name:'عيد الأضحى',         today:'عيد مبارك'},
  {hm:1,  hd:1,  days:1,  name:'رأس السنة الهجرية',  today:'اليوم رأس السنة الهجرية'},
  {hm:1,  hd:10, days:1,  name:'عاشوراء',            today:'اليوم عاشوراء', note:'ويُستحب صيام التاسع'},
];
const OCC_TEXT = {unit:'يوم', expected:'متوقّع'};   // the moon decides the day, so the date is only expected

// Today's occasion, or the next one with the days left and its day: one pass over the coming year, once a day.
let OCC_CACHE = {day:'', val:null};
function occasionNow(){
  const dayKey = FMT_DATE.format(new Date());
  if(OCC_CACHE.day === dayKey) return OCC_CACHE.val;
  const fmt = new Intl.DateTimeFormat('en-u-ca-islamic-umalqura',{timeZone:CONFIG.timezone,year:'numeric',month:'numeric',day:'numeric'});
  const hijri = d => fmt.formatToParts(hijriAt(d)).reduce((a,x) => (a[x.type] = +x.value.replace(/[^0-9]/g,''), a), {});
  const base = Date.now();
  let val = null, found = {};
  for(let i = 0; i < 400 && !val; i++){
    const d = new Date(base + i*86400000), h = hijri(d);
    if(i === 0){
      const o = OCCASIONS.find(o => h.month === o.hm && h.day >= o.hd && h.day < o.hd + o.days);
      if(o){ val = {o, today:true, hy:h.year}; break; }
    }
    OCCASIONS.forEach(o => {
      if(i > 0 && h.month === o.hm && h.day === o.hd && !found[o.name]){
        const p = riyadhParts(d);
        found[o.name] = {o, days:i, hy:h.year, y:p.y, mo:p.mo, d:p.d};
      }
    });
    if(Object.keys(found).length === OCCASIONS.length) break;
  }
  if(!val) val = Object.values(found).sort((a, b) => a.days - b.days)[0] || null;
  OCC_CACHE = {day: dayKey, val};
  return val;
}

// `raw`: the calendar's own month, without «فرق التاريخ الهجري»: prayer times never follow the offset (only what is shown does)
function hijriMonthNow(raw){
  const at = raw ? new Date() : hijriAt(new Date());
  try{
    const m = +new Intl.DateTimeFormat('en-u-ca-islamic-umalqura',{timeZone:CONFIG.timezone,month:'numeric'}).format(at).replace(/[^0-9]/g,'');
    if(m >= 1 && m <= 12) return m;
  }catch(e){}
  return tabularHijriMonth(at);   // fail closed: no Umm al-Qura calendar here is not «not Ramadan»
}
// The Hijri month by the tabular (arithmetic) Islamic calendar, for a browser without Umm al-Qura's: the city's date as a Julian day,
// then the civil Hijri date. It can be a day off Umm al-Qura at a month's turn, never a month.
function tabularHijriMonth(d){
  const p = riyadhParts(d), a = Math.floor((14 - p.mo) / 12), y = p.y + 4800 - a, mo = p.mo + 12 * a - 3;
  const jd = p.d + Math.floor((153 * mo + 2) / 5) + 365 * y + Math.floor(y / 4) - Math.floor(y / 100) + Math.floor(y / 400) - 32045;
  let l = jd - 1948440 + 10632;
  const n = Math.floor((l - 1) / 10631);
  l = l - 10631 * n + 354;
  const j = Math.floor((10985 - l) / 5316) * Math.floor(50 * l / 17719) + Math.floor(l / 5670) * Math.floor(43 * l / 15238);
  l = l - Math.floor((30 - j) / 15) * Math.floor(17719 * j / 50) - Math.floor(j / 16) * Math.floor(15238 * j / 43) + 29;
  return Math.floor(24 * l / 709);
}
function tickOccasion(){
  const elL=document.getElementById('occ-label'),
        elD=document.getElementById('occ-days'),
        elS=document.getElementById('occ-sub');

  // ---- the national day itself: a greeting instead of the countdown ----
  const nat = nationalNow();
  if(nat && nat.today){
    setText(elL, nat.short);
    setHTML(elD, '<span class="txt">كل عام والوطن بخير</span>');
    setText(elS, '');
    return;
  }

  // ---- Ramadan mode: iftar / suhoor instead of the countdown ----
  if(hijriMonthNow() === 9 && PRAYERS.length){
    const rp = riyadhParts();
    const mins = rp.h*60 + rp.mi + rp.s/60;
    const fajr = PRAYERS.find(p=>p.key==='Fajr');
    const maghrib = PRAYERS.find(p=>p.key==='Maghrib');
    const fajrM = fajr.h*60 + fajr.mi, maghribM = maghrib.h*60 + maghrib.mi;
    let label, targetM;
    if(mins < fajrM){ label = 'الإمساك'; targetM = fajrM; }
    else if(mins < maghribM){ label = 'الإفطار'; targetM = maghribM; }
    else { label = 'الإمساك'; targetM = fajrM + 1440; }
    const th = Math.floor((targetM % 1440) / 60), tm = targetM % 60;
    setText(elL, label);
    const at = timeParts(th, tm);
    setHTML(elD, at.t + (at.u ? ' <span class="unit">' + at.u + '</span>' : ''));
    setHTML(elS, 'بعد <b>' + humanRemaining(Math.max(0, Math.round((targetM - mins)*60))) + '</b>');
    return;
  }

  // ---- the occasion's day, or the countdown to the next one ----
  const oc = occasionNow();
  if(!oc){ setText(elL, ''); setText(elD, '—'); setText(elS, ''); return; }
  const o = oc.o;
  setText(elL, o.name + (o.year ? ' ' + ar(oc.hy) : ''));
  if(oc.today){
    setHTML(elD, '<span class="txt">' + esc(o.today) + '</span>');
    setText(elS, '');
    return;
  }
  setHTML(elD, ar(oc.days) + ' <span class="unit">' + OCC_TEXT.unit + '</span>');
  setHTML(elS, esc(gregFmt({timeZone:'UTC',weekday:'long',day:'numeric',month:'long'})
      .format(new Date(Date.UTC(oc.y, oc.mo-1, oc.d, 12))).replace('،','') + ' · ' + OCC_TEXT.expected)
    + (o.note ? '<div class="note">' + esc(o.note) + '</div>' : ''));
}

function translit(en){
  const map = {sh:'ش',kh:'خ',th:'ث',dh:'ذ',gh:'غ',ch:'تش',ph:'ف',ck:'ك',qu:'كو',ou:'و',oo:'و',ee:'ي',
    a:'ا',b:'ب',c:'ك',d:'د',e:'ي',f:'ف',g:'ج',h:'ه',i:'ي',j:'ج',k:'ك',l:'ل',m:'م',n:'ن',o:'و',p:'ب',
    q:'ق',r:'ر',s:'س',t:'ت',u:'و',v:'ف',w:'و',x:'كس',y:'ي',z:'ز'};
  const start = {a:'أ',e:'إ',i:'إ',o:'أو',u:'أ'};
  const word = w => {
    if(hasArabic(w) || !/[A-Za-z0-9]/.test(w)) return w;
    const lw = w.toLowerCase();
    if(TL_WORDS[lw] !== undefined) return TL_WORDS[lw];
    if(/^[A-Z]{2,4}$/.test(w)) return lw.split('').map(c=>TL_LETTERS[c]).join(' ');   // CP, PSG
    if(/^al-/.test(lw)) return 'ال' + word(w.slice(3));
    let out = '', x = lw.replace(/(.)\1/g,'$1');
    for(let i = 0; i < x.length;){
      const two = i+1 < x.length ? map[x.slice(i,i+2)] : undefined;
      if(i === 0 && start[x[0]] && !two){ out += start[x[0]]; i++; continue; }
      if(two){ out += two; i += 2; continue; }
      const ch = x[i];
      if(ch === 'e' && i > 0){ i++; continue; }                         // short or silent e
      if(ch === 'c' && /[eiy]/.test(x[i+1] || '')){ out += 'س'; i++; continue; }
      out += /[0-9]/.test(ch) ? ar(ch) : (map[ch] || '');
      i++;
    }
    return out;
  };
  return String(en).replace(/&/g,' و ').replace(/\bAl (?=[A-Z])/g,'Al-')
    .split(/(\s+)/).map(word).join('').replace(/\s{2,}/g,' ').trim();
}

async function wikidataArabic(en, kind){
  const api = 'https://www.wikidata.org/w/api.php?format=json&origin=*';
  const r = await fetchT(`${api}&action=wbsearchentities&type=item&limit=7&language=en&search=${encodeURIComponent(en)}`, 10000);
  const hits = ((await r.json()).search || []).filter(h => AR_KIND[kind].test(h.description || ''));
  if(!hits.length) return '';
  const r2 = await fetchT(`${api}&action=wbgetentities&props=labels&languages=ar&ids=${hits.slice(0,3).map(h=>h.id).join('|')}`, 10000);
  const ents = (await r2.json()).entities || {};
  for(const h of hits.slice(0,3)){
    const l = ents[h.id] && ents[h.id].labels && ents[h.id].labels.ar;
    if(l && l.value) return l.value.replace(/\s*\([^)]*\)\s*/g,' ').replace(/^(نادي|فريق)\s+/,'').trim();
  }
  return '';
}

  if(kind === 'team'){

    if(k) return k;
  }
  const key = kind + ':' + en;
  if(AR_NAMES[key] !== undefined) return AR_NAMES[key] || translit(en);
  if(!AR_PENDING.has(key) && !(Date.now() - (AR_FAIL[key] || 0) < AR_RETRY_MS)){
    AR_PENDING.add(key);
    arQueue = arQueue.then(async ()=>{            // one lookup at a time
      try{
        AR_NAMES[key] = await wikidataArabic(en, kind);   // '' = Wikidata has none: keep the transliteration
        delete AR_FAIL[key];
        try{ localStorage.setItem('arNames', JSON.stringify(AR_NAMES)); }catch(e){}
        if(AR_NAMES[key]){ renderMatches(); renderPanel(false, 'matches'); }
      }catch(e){                                     // offline: try again in an hour, not at every redraw
        AR_FAIL[key] = Date.now();
        try{ localStorage.setItem('arFail', JSON.stringify(AR_FAIL)); }catch(_){}
      }
      AR_PENDING.delete(key);
      await sleep(CONFIG.queueGapMs);
    });
  }
  return translit(en);
}
const teamAr = (s, id) => arName(s, 'team', id);

async function fetchNext(id){
  const r = await fetchT(`https://www.thesportsdb.com/api/v1/json/${CONFIG.sportsKey}/eventsnext.php?id=${id}`, 12000);
  if(!r.ok) throw 0;
  const j = await r.json();
  if(j && j.events) NEXT_LIST[id] = j.events;
  return ((j && j.events) || [])[0] || null;
}
function toDate(ev){
  const s = ev.strTimestamp || `${ev.dateEvent}T${ev.strTime || '00:00:00'}`;
  return new Date(s.endsWith('Z') ? s : s+'Z');
}

// one slot per picked team: a result from the last 24h, else a fixture this week, else hidden
// A game is over once its status says so, or 2.5 h after kick-off; its score stays up for a day after that.
const FINAL = ['FT','AET','PEN','MATCH FINISHED'];
// how long a game lasts, by sport, before it counts as over without a final status
const DUR_H = {Soccer:2.5, Basketball:3, 'American Football':3.75};
const durMs = ev => (DUR_H[ev.strSport] || 2.5) * 3600000;
function finishedRecently(ev, now){
  if(!ev || ev.intHomeScore == null || ev.intAwayScore == null) return false;
  const k = toDate(ev).getTime(), end = k + durMs(ev);
  const over = FINAL.includes((ev.strStatus || '').toUpperCase()) ? now >= k : now >= end;
  return over && now - end < 86400000;
}
// A game past its end with no result in the data (the CI file is refreshed every 6 h and the API is slow to post a score): it stays,
// at its own time among the results and with no score, for a day after its end. Asked for once, 6 h after kick-off (loadLive).
function pendingResult(ev, now){
  if(!ev || ev.intHomeScore != null && ev.intAwayScore != null) return false;
  const st = (ev.strStatus || '').toUpperCase(), k = toDate(ev).getTime(), end = k + durMs(ev);
  return !FINAL.includes(st) && !CALLED_OFF.test(st) && !isNaN(k) && now >= end && now - end < 86400000;
}
// the order of the screen: results (and a past game with no result yet) in time order, then live, then the rest by time
const gameRank = (ev, now) => finishedRecently(ev, now) || pendingResult(ev, now) ? 0 : now >= toDate(ev).getTime() ? 1 : 2;
const byRank = (a, b) => a.r - b.r || a.t - b.t;
// Keep a score seen at the final whistle: the free API's "last games" list can lag, and "next game"
// moves on to the following fixture right away. Saved, so a restart within the day still shows it.
const KEPT = (()=>{ try{ return JSON.parse(localStorage.getItem('keptResults') || '{}'); }catch(e){ return {}; } })();
function keepResult(id, ev){
  if(!finishedRecently(ev, Date.now())) return;
  KEPT[id] = [ev, ...(KEPT[id] || []).filter(x => x.idEvent !== ev.idEvent && finishedRecently(x, Date.now()))];
  try{ localStorage.setItem('keptResults', JSON.stringify(KEPT)); }catch(e){}
}
function resultsFor(id){
  const seen = new Set();
  return [...(RESULTS[id] || []), ...(KEPT[id] || []), MATCHES[id]]
    .filter(ev => ev && ev.idEvent && !seen.has(ev.idEvent) && seen.add(ev.idEvent));
}

// «السبت ٢٤ أكتوبر · ٩:١٦ م»: the small line under an upcoming game, in the slot and in the card beside the clock
function matchWhen(d){
  const p = hmParts(d);
  return FMT_DAY_MONTH.format(d).replace('،','')
    + ' · ' + fmtTime(+p.hour % 24, +p.minute);
}

// «الخميس ٢٢ أكتوبر»: the day of a finished game
const matchDay = d => FMT_DAY_MONTH.format(d).replace('،','');
const FMT_DM = gregFmt({timeZone:CONFIG.timezone,day:'numeric',month:'long'});
// the short form of matchWhen: «الجمعة ٩:٠٠ م» for a game this week, «٢٤ أكتوبر» for any other (and for a game already played)
function matchWhenShort(d, now, done){
  const p = hmParts(d), ahead = d - now;
  return !done && ahead > 0 && ahead < 6 * 86400000 ? FMT_WEEKDAY.format(d) + ' ' + fmtTime(+p.hour % 24, +p.minute) : FMT_DM.format(d);
}

// the final score of a finished game: «الهلال 2 - 1 النصر» and «النتيجة النهائية · السبت»
function resultBlock(done){
  const day = FMT_WEEKDAY.format(toDate(done));
  return `<div class="mblock">`
    + `<div class="big"><span><span class="tm">${esc(teamAr(done.strHomeTeam, done.idHomeTeam))}</span> <span class="sc">${ar(+done.intHomeScore)} - ${ar(+done.intAwayScore)}</span> <span class="tm">${esc(teamAr(done.strAwayTeam, done.idAwayTeam))}</span></span></div>`
    + `<div class="sub">النتيجة النهائية · ${day}</div></div>`;
}
// a game under way or due within the week; '' for any other
function gameBlock(ev, now, big){
  const home = esc(teamAr(ev.strHomeTeam, ev.idHomeTeam)), away = esc(teamAr(ev.strAwayTeam, ev.idAwayTeam));
  const d = toDate(ev), diff = d - now;
  if(pendingResult(ev, now))   // over, no result yet: the teams and when they played
    return `<div class="mblock"><div class="big"><span><span class="tm">${home}</span> × <span class="tm">${away}</span></span></div><div class="sub">${matchWhen(d)}</div></div>`;
  if(diff < -durMs(ev) || diff > CONFIG.weekWindowDays * 86400000) return '';   // in progress stays on screen
  const p = hmParts(d);
  const clk = ar(fmtTime(+p.hour % 24, +p.minute));
  const live = diff <= 0 && ev.intHomeScore != null && ev.intAwayScore != null;
  // «بعد ٣ أيام» and under it the date and time, small: «السبت ٢٤ أكتوبر · ٩:١٦ م»
  const dateLine = matchWhen(d);
  const sub = diff > 0 ? `بعد ${shortRemaining(diff)}</div><div class="sub when">${dateLine}` : `<span class="live">مباشر</span> · ${liveStatus(ev, clk)}`;
  const mid = live ? ` <span class="sc">${ar(+ev.intHomeScore)} - ${ar(+ev.intAwayScore)}</span> ` : ' × ';
  return `<div class="mblock${big ? ' lvb' : ''}">`
       + `<div class="big"><span><span class="tm">${home}</span>${mid}<span class="tm">${away}</span></span></div>`
       + `<div class="sub">${sub}</div>`
       + `</div>`;
}
// -> {t, html} or null. t (kick-off) puts a league's games and the teams' in one time order.
function matchSlot(id, now, shown){
  const done = resultsFor(id).filter(ev => finishedRecently(ev, now)).sort((a,b)=>toDate(b)-toDate(a))[0];
  if(done){
    if(shown.has(done.idEvent)) return null;          // both teams in the same game
    shown.add(done.idEvent);
    return {t: toDate(done).getTime(), r: 0, html: resultBlock(done)};
  }
  const ev = MATCHES[id];
  if(!ev || shown.has(ev.idEvent)) return null;
  const html = gameBlock(ev, now);
  if(!html) return null;
  shown.add(ev.idEvent);
  return {t: toDate(ev).getTime(), r: gameRank(ev, now), html};
}

// ---------- whole leagues: #leagues= ----------
// CI writes each league's games of the coming week and the last day into one small file (.github/tools/league_fixtures.py,
// branch data-leagues); the page downloads one file per followed league every 30 minutes and no more: that is the
// whole cost of a league, however many clubs it has. A game in progress is refreshed by lookupevent.php like a followed
// team's (loadLive), at most LEAGUE_LIVE_MAX of them at a time.
const LEAGUE_BASE = 'https://raw.githubusercontent.com/tshi-dev/UrTV/data-leagues/leagues/';
const LEAGUE_LIVE_MAX = 6;
const leagueSlug = n => String(n).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');   // team_ids.slug()
let LEAGUE_DATA = (()=>{ try{ return JSON.parse(localStorage.getItem('leagueData') || '{}') || {}; }catch(e){ return {}; } })();   // name -> its file
const STALE_ASK_H = 6, STALE_ASKED = new Set();   // a past game with no result: asked for once, 6 h after its kick-off
let LIVE_PATCH = {};   // idEvent -> {at, ev}: lookupevent's newer word on a game, used while newer than the league's file
async function loadLeagues(){
  let got = 0;
  await Promise.all(CONFIG.leagues.map(async name => {
    try{
      const r = await fetchT(LEAGUE_BASE + leagueSlug(name) + '.json', 12000);
      if(!r.ok) return;
      const j = await r.json();
      if(j && Array.isArray(j.events)){ LEAGUE_DATA[name] = {updated: j.updated, events: j.events}; got++; }
    }catch(e){}
  }));
  if(got) try{ localStorage.setItem('leagueData', JSON.stringify(LEAGUE_DATA)); }catch(e){}
  return got;
}
// every game of the followed leagues, once each (two leagues can list one game), with a live update laid over the file's
function leagueGames(){
  const seen = new Set(), out = [];
  CONFIG.leagues.forEach(name => {
    const d = LEAGUE_DATA[name];
    if(!d) return;
    const at = Date.parse(d.updated) || 0;
    (d.events || []).forEach(ev => {
      if(!ev || !ev.idEvent || seen.has(ev.idEvent) || isNaN(toDate(ev))) return;
      seen.add(ev.idEvent);
      const p = LIVE_PATCH[ev.idEvent];
      out.push(p && p.at > at ? Object.assign({}, ev, p.ev) : ev);
    });
  });
  return out;
}
const CALLED_OFF = /^(CANC|POSTP|ABAN|SUSP|WO)/i;
// The league's games the screen shows: a result of the last day, a game under way, a game of the coming week.
// -> [{t, ev, done}] in time order; shown holds the ids already taken by a followed team, so no game appears twice.
function leagueShow(now, shown){
  return leagueGames().filter(ev => !CALLED_OFF.test(ev.strStatus || '') && !shown.has(ev.idEvent)).map(ev => {
    const done = finishedRecently(ev, now);
    const html = done ? resultBlock(ev) : FINAL.includes((ev.strStatus || '').toUpperCase()) ? '' : gameBlock(ev, now);
    return html ? {t: toDate(ev).getTime(), r: gameRank(ev, now), ev, done, html} : null;
  }).filter(Boolean).sort(byRank);
}

function liveStatus(ev, clk){
  const st = (ev.strStatus || '').toUpperCase();
  if(st === 'HT') return 'استراحة';
  if(['FT','AET','PEN'].includes(st)) return 'انتهت';
  const m = parseInt(ev.strProgress, 10);
  return isNaN(m) || (ev.strSport && ev.strSport !== 'Soccer') ? `بدأت ${clk}` : `الدقيقة ${ar(m)}`;   // minutes are football's
}

// while a picked team is playing, refresh that event every 2 minutes; so is a game of a followed league (a few at most)
const loadLive = guarded('live', async function(){
  const now = Date.now();
  let asked = false;
  const live = ev => { const k = toDate(ev).getTime(); return ev && ev.idEvent && now >= k - 5*60000 && now <= k + durMs(ev); };
  const own = new Set(Object.values(MATCHES).filter(Boolean).map(ev => ev.idEvent));   // already asked for as a team's
  const look = async ev => {
    asked = true;
    try{
      const r = await fetchT(`https://www.thesportsdb.com/api/v1/json/${CONFIG.sportsKey}/lookupevent.php?id=${ev.idEvent}`, 10000);
      const j = await r.json();
      const fresh = (j.events || [])[0];
      return fresh && fresh.idEvent === ev.idEvent ? fresh : null;
    }catch(e){ return null; }
  };
  const theirs = CONFIG.leagues.length ? leagueGames().filter(ev => live(ev) && !own.has(ev.idEvent)).slice(0, LEAGUE_LIVE_MAX) : [];
  // a game 6 h past kick-off with no result: ask once; the answer (or none) is what the screen shows from then on
  const stale = matchEvents().filter(ev => !STALE_ASKED.has(ev.idEvent) && now - toDate(ev).getTime() > STALE_ASK_H * 3600000 && pendingResult(ev, now)).slice(0, LEAGUE_LIVE_MAX);
  stale.forEach(ev => STALE_ASKED.add(ev.idEvent));
  const jobs = [   // one lookup at a time, a pause between
    ...Object.entries(MATCHES).map(([id, ev]) => async () => {
      if(!live(ev)) return;
      const fresh = await look(ev);
      if(fresh){ MATCHES[id] = Object.assign({}, ev, fresh); keepResult(id, MATCHES[id]); }
    }),
    ...theirs.map(ev => async () => {
      const fresh = await look(ev);
      if(fresh) LIVE_PATCH[ev.idEvent] = {at: Date.now(), ev: fresh};
    }),
    ...stale.map(ev => async () => {
      const fresh = await look(ev);
      if(!fresh) return;
      LIVE_PATCH[ev.idEvent] = {at: Date.now(), ev: fresh};   // a league's copy
      const mend = list => (list || []).map(x => x && x.idEvent === ev.idEvent ? Object.assign({}, x, fresh) : x);
      Object.keys(MATCHES).forEach(id => { MATCHES[id] = mend([MATCHES[id]])[0]; });   // a followed team's copies
      Object.keys(NEXT_LIST).forEach(id => { NEXT_LIST[id] = mend(NEXT_LIST[id]); });
      Object.keys(RESULTS).forEach(id => { RESULTS[id] = mend(RESULTS[id]); });
    }),
  ];
  for(const job of jobs){
    const before = asked;
    await job();
    if(asked !== before && job !== jobs[jobs.length - 1]) await sleep(CONFIG.queueGapMs);
  }
  if(asked) renderMatches();   // outside a match window nothing was asked, nothing changed
});

// ---------- other sports: Formula 1, UFC, boxing (events, not teams) ----------
// Each has TheSportsDB leagues, found by CI (assets/shared/events.json); the next events of each are asked for every
// 30 minutes with the matches, and shown beside the followed teams' games: the event's name, not «فريق × فريق».
const EVENT_LEAGUES = {"f1": [{"id": "4370", "name": "Formula 1"}], "ufc": [{"id": "4443", "name": "UFC"}], "boxing": [{"id": "4445", "name": "Boxing"}]};
let EVENT_NEXT = {};   // key -> upcoming events, as the leagues answered
const EVENT_DUR_H = {f1:2.5, ufc:6, boxing:5};
const EVENT_TAG = {f1:'', ufc:'', boxing:'ملاكمة'};
const COUNTRY_AR = {'saudi arabia':'السعودية','bahrain':'البحرين','qatar':'قطر','united arab emirates':'الإمارات','uae':'الإمارات',
  'australia':'أستراليا','japan':'اليابان','china':'الصين','united states':'الولايات المتحدة','usa':'الولايات المتحدة',
  'italy':'إيطاليا','monaco':'موناكو','canada':'كندا','spain':'إسبانيا','austria':'النمسا','united kingdom':'بريطانيا',
  'great britain':'بريطانيا','england':'بريطانيا','hungary':'المجر','belgium':'بلجيكا','netherlands':'هولندا',
  'azerbaijan':'أذربيجان','singapore':'سنغافورة','mexico':'المكسيك','brazil':'البرازيل','france':'فرنسا','germany':'ألمانيا',
  'portugal':'البرتغال','turkey':'تركيا','russia':'روسيا','south korea':'كوريا الجنوبية','malaysia':'ماليزيا','india':'الهند',
  'argentina':'الأرجنتين','egypt':'مصر','morocco':'المغرب'};
// the place in «X Grand Prix» as Arabic writes it (the country, or the city for Miami, Las Vegas, Monaco…)
const GP_AR = {'saudi arabian':'السعودية','saudi arabia':'السعودية','bahrain':'البحرين','australian':'أستراليا','japanese':'اليابان',
  'chinese':'الصين','miami':'ميامي','emilia romagna':'إميليا رومانيا','emilia-romagna':'إميليا رومانيا','monaco':'موناكو',
  'canadian':'كندا','spanish':'إسبانيا','barcelona':'إسبانيا','austrian':'النمسا','british':'بريطانيا','hungarian':'المجر',
  'belgian':'بلجيكا','dutch':'هولندا','italian':'إيطاليا','azerbaijan':'أذربيجان','singapore':'سنغافورة','united states':'الولايات المتحدة',
  'american':'الولايات المتحدة','mexico city':'مدينة المكسيك','mexican':'المكسيك','mexico':'المكسيك','sao paulo':'ساو باولو',
  'brazilian':'البرازيل','brazil':'البرازيل','las vegas':'لاس فيغاس','qatar':'قطر','abu dhabi':'أبوظبي','french':'فرنسا',
  'portuguese':'البرتغال','styrian':'ستيريا','70th anniversary':'الذكرى السبعين','eifel':'آيفل','turkish':'تركيا','russian':'روسيا'};
const SESSIONS = [[/sprint\s*(qualifying|shootout)/i, 'تأهل السبرنت'], [/sprint/i, 'السبرنت'],
  [/(?:free\s*)?practice\s*(\d)|\bfp\s*(\d)/i, null], [/qualifying|\bquali\b/i, 'التأهل'], [/race|grand prix/i, 'السباق']];
const foldKey = s => String(s || '').normalize('NFKD').replace(/[̀-ͯ]+/g,'').toLowerCase().replace(/\s+/g,' ').trim();
const arDigits = s => String(s).replace(/[0-9]/g, d => AR[+d]);
const trl = s => String(s || '').split(/(\s+)/).map(w => /[A-Za-z]/.test(w) ? translit(w) : w).join('');   // names of people

// one TheSportsDB event of league key -> {title, tag, country, t, dur, dateOnly}
// (F1: «United States Grand Prix Practice 1»; UFC: «UFC 333 Volkanovski vs Evloev», «UFC Fight Night 291 A vs B»;
// boxing: «Dalton Smith vs Alberto Puello», usually with no time of day: «00:00:00»)
function eventInfo(key, ev){
  const name = String(ev.strEvent || ev.strEventAlternate || '').trim();
  let title = '', session = '', head = '', pre = '', card = '';   // head: the slot's big line (HTML); pre: under it, small; card: the row beside the clock (HTML)
  if(key === 'f1'){
    const gp = name.match(/^(.*?)\s*grand prix/i);
    const place = gp ? foldKey(gp[1].replace(/\bformula\s*1\b/i,'').replace(/\b20\d\d\b/,'')) : '';
    const rest = name.replace(/^.*?grand prix/i,'');
    for(const [rx, label] of SESSIONS){
      const m = (rest || name).match(rx);
      if(!m) continue;
      session = label || 'التجارب الحرة ' + arDigits(m[1] || m[2] || '');
      break;
    }
    if(!session) session = 'السباق';
    const gpName = gp ? 'جائزة ' + (GP_AR[place] || trl(gp[1].trim())) + ' الكبرى' : trl(name);
    title = gpName + ' · ' + session;
    // the session goes under it, so the big line stays short; tighter still: «جائزة السعودية»
    head = gp ? `<span class="tm" data-short="${esc(gpName.replace(/ الكبرى$/, ''))}">${esc(gpName)}</span>` : esc(gpName);
    pre = session;
    card = head + ' · ' + esc(session);
  }else{
    let prefix = '', rest = name;
    const u = key === 'ufc' ? name.match(/^UFC(\s+Fight\s+Night)?\s*(\d+)?\s*[:\-]?\s*(.*)$/i) : null;
    if(u){ prefix = 'UFC' + (u[1] ? ' فايت نايت' : '') + (u[2] ? ' ' + arDigits(u[2]) : ''); rest = u[3]; }
    let pair = ev.strHomeTeam && ev.strAwayTeam ? [ev.strHomeTeam, ev.strAwayTeam] : rest.split(/\s+vs\.?\s+/i);
    const body = pair.length === 2 ? trl(pair[0]) + ' × ' + trl(pair[1]) : trl(rest);
    title = arDigits([prefix, body].filter(Boolean).join(' · '));
    // the fighters on the big line, each with the family name as the short form fitMatches may need
    const who = n => { const w = trl(n).trim(), last = w.split(/\s+/).pop();
      return `<span class="tm"${last !== w ? ` data-short="${esc(last)}"` : ''}>${esc(w)}</span>`; };
    head = arDigits(pair.length === 2 ? who(pair[0]) + ' × ' + who(pair[1]) : esc(body));
    pre = arDigits(prefix);
    card = [pre && esc(pre), head].filter(Boolean).join(' · ');
  }
  const c = foldKey(ev.strCountry);
  const country = COUNTRY_AR[c] || (c ? trl(ev.strCountry) : '');
  const dateOnly = !ev.strTime || /^00:00(:00)?$/.test(ev.strTime);   // no time of day known: only the day is told
  let t = toDate(ev).getTime();
  if(dateOnly && !isNaN(t)) t -= tzOffsetMs(t);   // t is that day's midnight in UTC: it starts at midnight in the city's time zone
  return {title, head, pre, card, tag: EVENT_TAG[key], country: title.includes(country) ? '' : country, t,
          dur: dateOnly ? 24*3600000 : EVENT_DUR_H[key] * 3600000, dateOnly};
}
// the events of key still to come (or running) within the window, soonest first
function eventsOf(key, now){
  const over = e => /^(FT|AET|PEN|FINISHED|MATCH FINISHED|CANCELLED|POSTPONED)$/i.test(e.strStatus || '');
  return (EVENT_NEXT[key] || []).filter(e => e && e.idEvent && !over(e))
    .map(e => ({e, i: eventInfo(key, e)}))
    .filter(x => !isNaN(x.i.t) && now < x.i.t + x.i.dur && x.i.t - now <= CONFIG.eventWindowDays * 86400000)
    .sort((a, b) => a.i.t - b.i.t);
}
function eventWhen(i, now){
  const p = hmParts(new Date(i.t));
  const clk = i.dateOnly ? '' : ar(fmtTime(+p.hour % 24, +p.minute));
  const sameDay = FMT_DATE.format(new Date(i.t + (i.dateOnly ? 3600000 : 0))) === FMT_DATE.format(new Date(now));
  const dayName = sameDay ? 'اليوم' : FMT_WEEKDAY.format(new Date(i.t + (i.dateOnly ? 3600000 : 0)));
  if(i.dateOnly) return {live:false, text: sameDay ? 'اليوم' : dayName, row: dayName};
  if(now >= i.t) return {live:true, text: `<span class="live">مباشر</span> · بدأ ${clk}`, row: '<span class="live">مباشر</span>'};
  return {live:false, text: `${dayName} · ${clk}`, row: `${dayName} ${clk}`};
}
function eventSlot(key, now){
  const x = eventsOf(key, now)[0];
  if(!x) return '';
  const w = eventWhen(x.i, now);
  const about = [x.i.pre, x.i.tag, x.i.country].filter(Boolean).map(esc).join(' · ');
  return `<div class="mblock"><div class="big"><span>${x.i.head}</span></div>`
       + (about ? `<div class="sub">${about}</div><div class="sub when">${w.text}</div>` : `<div class="sub">${w.text}</div>`) + `</div>`;
}
function eventRows(now){   // for the card: a Formula 1 weekend's sessions, else the next event of each
  const rows = [];
  for(const key of CONFIG.events) eventsOf(key, now).slice(0, key === 'f1' ? 4 : 1).forEach(x => {

// Every followed team with something to show, two at a time; the page turns every 15 s.
let MATCH_PAGE = 0, MATCH_PAGES = 1;
// Two games a page. Two games whose names do not fit side by side even at the smallest size and the short names
// (a league has such pairs: «كهرباء الإسماعيلية × الاتحاد السكندري») are learnt here and shown one to a page from then on.
const NARROW = new Set();
const pairKey = (a, b) => [a, b].map(h => (h.match(/class="tm"[^>]*>[^<]*/g) || [h]).join('|')).join('||');
function packPages(slots, per){
  const pages = [];
  for(let i = 0; i < slots.length;){
    const two = per > 1 && i + 1 < slots.length && !NARROW.has(pairKey(slots[i], slots[i + 1]));
    pages.push(slots.slice(i, i + (two ? per : 1)));
    i += two ? per : 1;
  }
  return pages;
}
// loading, failed and empty are three different things: «لا مباريات» only after an answer that had none
function matchesEmptyText(){
  return MATCHES_LOADED ? 'لا مباريات هذا الأسبوع' : MATCH_FAIL_AT ? 'تعذّر التحديث' : 'جارٍ التحميل…';
}
// when the last refresh failed and older games are on screen: «آخر تحديث …», else ''
const matchesStaleNote = () => MATCH_OK_AT && MATCH_FAIL_AT > MATCH_OK_AT ? fmtAgo(MATCH_OK_AT) : '';
function renderMatches(turn){
  if(!SLOT_MATCHES) return;
  const now = Date.now(), shown = new Set();
  let games = CONFIG.teamIds.map(id => matchSlot(id, now, shown)).filter(Boolean);
  if(CONFIG.leagues.length) games = [...games, ...leagueShow(now, shown)].sort(byRank);   // one order
  const live = focusGames(now, true);   // a followed team is playing: that game alone, big, until it ends
  const slots = live.length ? live.map(ev => gameBlock(ev, now, true))
    : [...games.map(g => g.html), ...CONFIG.events.map(k => eventSlot(k, now))].filter(Boolean);
  const row = document.getElementById('match-row');
  if(!slots.length){
    if(!MATCHES_LOADED && row.firstElementChild && !row.querySelector('.none-week')) return;   // the saved games stay until the first answer
    setHTML(row, `<div class="none-week">${matchesEmptyText()}</div>`);
    return;
  }
  const per = live.length ? 1 : CONFIG.matchesPerPage;
  let pages = packPages(slots, per);
  if(turn) MATCH_PAGE++;
  MATCH_PAGE %= pages.length;
  const draw = () => {
    const page = pages[MATCH_PAGE];
    if(!setHTML(row, page.join(''), turn && pages.length > 1)) return true;   // fitted again only when rewritten
    if(fitMatches(row) || page.length < 2) return true;
    NARROW.add(pairKey(page[0], page[1]));
    return false;
  };
  if(!draw()){ pages = packPages(slots, per); draw(); }
  MATCH_PAGES = pages.length;
  if(turn && pages.length > 1){ row.classList.remove('flip'); void row.offsetWidth; row.classList.add('flip'); }
}

const FIT_STEPS = [1, .92, .85, .78, .72];
const FIT_RANGE = document.createRange();
function fits(sp){   // to the fraction of a pixel: scrollWidth rounds, and a name short by 0.4 px still got «…»
  FIT_RANGE.selectNodeContents(sp);
  const cs = getComputedStyle(sp);
  return FIT_RANGE.getBoundingClientRect().width <= sp.getBoundingClientRect().width - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) + .05;
}
const shorten = sp => sp.querySelectorAll('.tm').forEach(t => { const n = t.querySelector('.nm') || t, s = t.dataset.short || TEAM_SHORT[n.textContent.trim()]; if(s) n.textContent = s; });
function fitMatches(row){
  const spans = [...row.querySelectorAll('.mblock .big > span')];
  const size = k => spans.forEach(sp => { sp.style.fontSize = k === 1 ? '' : k + 'em'; });
  const step = () => FIT_STEPS.find(k => { size(k); return spans.every(fits); });
  if(step()) return true;
  spans.forEach(shorten);
  if(step()) return true;
  size(FIT_STEPS[FIT_STEPS.length - 1]);
  return false;   // the caller may show these games apart
}
// A game is one line (clubs, crests, score, date, «بعد …»), and never ends in «…». When it is too long for the card the steps are, in this
// order: no crests on that row (the full names stay), the clubs' short names, the date's short form, a slightly smaller size. Every step starts from the full
// row again (the names and the date keep their full form in data-full), so a card that gets smaller redoes it.
const rowCut = row => {
  const r = row.getBoundingClientRect();
  return [...row.children].some(c => { const b = c.getBoundingClientRect(); return b.width && (b.left < r.left - .05 || b.right > r.right + .05); });   // as strict as fits(): a game over by half a pixel is still cut
};
function fitGameRow(li){
  const row = li.firstElementChild;
  if(!row || !row.classList.contains('mr')) return;
  const names = row.querySelectorAll('.nm'), when = row.querySelector('.mwhen');
  names.forEach(n => { if(n.dataset.full === undefined) n.dataset.full = n.textContent; n.textContent = n.dataset.full; });
  if(when){ if(when.dataset.full === undefined) when.dataset.full = when.textContent; when.textContent = when.dataset.full; }
  row.style.fontSize = '';
  row.classList.remove('nocr');
  const size = (steps = FIT_STEPS) => steps.find(k => { row.style.fontSize = k === 1 ? '' : k + 'em'; return !rowCut(row); });
  if(size([1])) return;
  row.classList.add('nocr');   // this row only: the full names are kept, the crests go (a row that fits with its crests keeps them)
  if(size([1])) return;
  shorten(row);
  if(size([1])) return;
  if(when && when.dataset.s) when.textContent = when.dataset.s;
  if(size()) return;
  size([...FIT_STEPS, .64, .56, .5]);   // a narrow card: smaller still, never two lines
}
function shortenRows(ul){
  const games = [...ul.querySelectorAll('li.mg')];
  games.forEach(fitGameRow);
  const k = Math.min(1, ...games.map(li => parseFloat(li.firstElementChild.style.fontSize) || 1));   // the games of a card share one size
  if(k < 1) games.forEach(li => { li.firstElementChild.style.fontSize = k + 'em'; });
  ul.querySelectorAll('li:not(.mg)').forEach(li => {
    const sp = li.firstElementChild;   // the other sports' rows (a race weekend, the next event): the names, then smaller, never «…»
    if(!sp || !sp.matches('span') || fits(sp)) return;
    shorten(sp);
    if(!fits(sp)) sp.querySelectorAll('img.cr').forEach(i => i.remove());
    if(!fits(sp)) FIT_STEPS.slice(1).find(k => { sp.style.fontSize = k + 'em'; return fits(sp); });
  });
}

// All the fasting wording is here. FAST_NAMES: the big text per day; the small line below says when.
const FAST_NAMES = {
  ramadan:'صيام رمضان', arafah:'يوم عرفة', tasua:'تاسوعاء', ashura:'عاشوراء', white:'الأيام البيض',
  mon:'صيام الإثنين', thu:'صيام الخميس', shawwal:'ست من شوال',
};
const FAST_WHEN = {
  today:'اليوم', tomorrow:'غدًا', in2:'بعد يومين',
  few:n => 'بعد ' + ar(n) + ' أيام', many:n => 'بعد ' + ar(n) + ' يومًا',
  ramadanDay:n => 'اليوم ' + ar(n) + ' من رمضان',
};
const FAST_TODAY_UNTIL = 18;   // from this hour (Riyadh) today's fast is behind us: look from tomorrow on

// What is recommended on a Hijri day (month hm, day hd, weekday wd, 0 = Sunday), best reason first.
// Always [] on the days fasting is forbidden: the two Eids and the three days of Tashreeq.
function fastReasons(hm, hd, wd){
  if((hm === 10 && hd === 1) || (hm === 12 && hd >= 10 && hd <= 13)) return [];
  const out = [];
  if(hm === 9) return ['ramadan'];
  if(hm === 12 && hd === 9) out.push('arafah');
  if(hm === 1 && hd === 9) out.push('tasua');
  if(hm === 1 && hd === 10) out.push('ashura');
  if(hd >= 13 && hd <= 15) out.push('white');
  if(wd === 1) out.push('mon');
  if(wd === 4) out.push('thu');
  if(hm === 10 && hd >= 2) out.push('shawwal');
  return out;
}
const FAST_HIJRI = new Intl.DateTimeFormat('en-u-ca-islamic-umalqura', {timeZone:'UTC', month:'numeric', day:'numeric'});
// The next day to fast from `now`: {key, days (0 = today), day (Hijri), wd, date (UTC noon)}, or null.
function fastingNext(now){
  const p = riyadhParts(now), base = Date.UTC(p.y, p.mo - 1, p.d, 12);
  for(let i = 0; i < 12; i++){
    const date = new Date(base + i*86400000);
    const h = FAST_HIJRI.formatToParts(hijriUtc(date)).reduce((a, x) => (a[x.type] = +x.value.replace(/[^0-9]/g, ''), a), {});
    const why = fastReasons(h.month, h.day, date.getUTCDay());
    if(!why.length || (i === 0 && p.h >= FAST_TODAY_UNTIL && why[0] !== 'ramadan')) continue;
    return {key:why[0], days:i, day:h.day, wd:date.getUTCDay(), date};
  }
  return null;
}

// days from today (Riyadh) to the countdown's date, or null: none set, or it has passed
function countdownDays(){
  if(!CONFIG.cd) return null;
  const p = riyadhParts(), n = (Date.parse(CONFIG.cd + 'T00:00:00Z') - Date.UTC(p.y, p.mo - 1, p.d)) / 86400000;
  return n >= 0 ? n : null;
}

  return CONFIG.slot === 'fasting' ? 'fasting' : SLOT_MATCHES ? 'matches' : 'weather';

function slotHTML(s){
  if(s === 'weather'){
    const today = FMT_DATE.format(new Date());
    const days = FORECAST.filter(d => d.date > today).slice(0, 3);   // the next three days (a saved forecast may be old)
    if(!days.length) return null;

  if(s === 'fasting'){

    const when = f.key === 'ramadan' && f.days === 0 ? FAST_WHEN.ramadanDay(f.day)
      : f.days === 0 ? FAST_WHEN.today
      : f.days === 1 ? FAST_WHEN.tomorrow + ' ' + dayName(f.date)
      : f.days === 2 ? FAST_WHEN.in2

        + (staleMark(v) ? `${v.pct === null ? '' : ' · '}<span class="old">${staleMark(v)}</span>` : '')); }).join('');
  }
  if(s === 'countdown'){

  }

}

// never invent a direction: unknown hides the marker
function paintDir(t, up, label){
  const chEl = document.getElementById(t.chg);
  if(up === null || up === undefined){ chEl.style.display='none'; chEl.hidden = true; setText(chEl, ''); return; }
  chEl.hidden = false; chEl.style.display='';

// price (in the market's own unit, or null) and the day's change in percent (or null); only what is known is shown.
// at = when the price was fetched: the last one stays on screen when a refresh fails, dimmed and marked with that time.
const MK_LAST = (()=>{ try{ return JSON.parse(localStorage.getItem(LS.mk) || '{}') || {}; }catch(e){ return {}; } })();   // market -> {price, pct, at, bad}
const saveMarkets = () => { try{ localStorage.setItem(LS.mk, JSON.stringify(MK_LAST)); }catch(e){} };
function paintMarket(t, price, pct, at){
  const okP = typeof price === 'number' && isFinite(price) && price > 0;
  const okC = typeof pct === 'number' && isFinite(pct);
  if(okP || okC){ MK_LAST[t.key] = {price: okP ? price : null, pct: okC ? pct : null, at: at || Date.now()}; if(CONFIG.slot === 'markets') renderSlot(); }
  if(!PRICES){ paintDir(t, okC ? pct >= 0 : null); return; }
  const px = document.getElementById(t.px);
  if(okP){ px.hidden = false; setText(px, num(price, t.dec)); } else { px.hidden = true; setText(px, ''); }
  paintDir(t, okC ? pct >= 0 : null, okC ? num(Math.abs(pct), 2) + (LATIN ? '%' : '٪') : '');
}
// the dim state of each market and the line under them: «آخر تحديث ٣:١٥ م» (the oldest price that is not current), or «غير محدّث»
function paintMkUp(){
  if(!CONFIG.mkBar) return;
  const known = TICKERS.filter(t => MK_LAST[t.key]);
  if(!known.length) return;
  known.forEach(t => { const m = document.getElementById(t.chg); if(m && m.parentNode) m.parentNode.classList.toggle('old', !!staleMark(MK_LAST[t.key])); });
  const up = document.getElementById('mk-up');
  if(!up) return;
  const stale = known.filter(t => staleMark(MK_LAST[t.key])).map(t => MK_LAST[t.key]).sort((a, b) => (a.at || 0) - (b.at || 0));
  up.hidden = false;
  up.classList.toggle('old', stale.length > 0);
  setText(up, stale.length ? staleMark(stale[0]) : fmtAgo(Math.max(...known.map(t => MK_LAST[t.key].at || 0))));
}

// The deadline covers the answer's headers and its body: the timer stops when the body has been read (or the request failed),
// so a server that sends headers and then stalls ends in an error like a slow one. The answer has what the callers use:
// ok, status, json(), text(), blob().
async function fetchT(url, ms){
  const c = new AbortController(); const id = setTimeout(()=>c.abort(), ms||12000);
  let r;
  try{ r = await fetch(url,{cache:'no-store', signal:c.signal}); }
  catch(e){ clearTimeout(id); throw e; }
  if(!r.ok) clearTimeout(id);   // nobody reads the body of an error
  const body = kind => async () => { try{ return await r[kind](); }finally{ clearTimeout(id); } };
  return {ok:r.ok, status:r.status, json:body('json'), text:body('text'), blob:body('blob')};
}

// ---- prices. First the file CI keeps (.github/tools/market_prices.py, branch data-markets): one download holds every market and the
// common stocks, so the TVs do not each ask Yahoo. A symbol that is not in it, or a file older than 3 hours, is asked of Yahoo itself.
const MARKET_URL = 'https://raw.githubusercontent.com/tshi-dev/UrTV/data-markets/markets/markets.json';
const MARKET_TRUST_MS = 3*3600000;
let MARKET_FILE = null;   // {updated, quotes: {symbol: {p, v, c, t}}}
async function loadMarketFile(){
  try{
    const r = await fetchT(MARKET_URL, 12000);
    if(r.ok){ const j = await r.json(); if(j && j.quotes && Date.parse(j.updated)) MARKET_FILE = j; }
  }catch(e){}                                  // offline: the copy from before, which fileQuote() trusts for 3 hours only
}
function fileQuote(sym){
  const q = MARKET_FILE && MARKET_FILE.quotes[sym], at = q ? Date.parse(q.t) : 0;
  return q && typeof q.p === 'number' && Date.now() - at < MARKET_TRUST_MS ? {p:q.p, v:q.v || null, c:q.c || [], at} : null;
}

// Yahoo has no CORS headers: try it directly (works inside the app), then through public CORS gateways. The gateways are for a network
// or CORS error (a TypeError) only: an answer, 404 for a symbol that does not exist or 429 for too many requests, is final, and
// the gateways would only repeat the request. A symbol that answered 404 is not asked again for a day.
const YH_404 = (()=>{ try{ return JSON.parse(localStorage.getItem('yh404') || '{}') || {}; }catch(e){ return {}; } })();
const YH_404_MS = 86400000;
async function yahooChart(sym, q = 'interval=1d&range=5d'){
  if(Date.now() - (YH_404[sym] || 0) < YH_404_MS) throw 0;
  const gone = () => { YH_404[sym] = Date.now(); try{ localStorage.setItem('yh404', JSON.stringify(YH_404)); }catch(e){} throw 0; };
  const direct = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(sym)}?${q}`;
  const routes = [
    [direct, 7000, j => j, false],
    ['https://api.allorigins.win/get?url=' + encodeURIComponent(direct), 15000, w => JSON.parse(w.contents), true],
    ['https://corsproxy.io/?url=' + encodeURIComponent(direct), 12000, j => j, true],
  ];
  for(const [url, ms, unwrap, proxy] of routes){
    let r;
    try{ r = await fetchT(url, ms); }
    catch(e){ if(e instanceof TypeError) continue; throw 0; }   // blocked or offline: the next route; a timeout is not that
    if(!r.ok){ if(proxy) continue; if(r.status === 404) gone(); throw 0; }
    let j;
    try{ j = unwrap(await r.json()); }catch(e){ continue; }
    if(j && j.chart && j.chart.result) return j;
    if(j && j.chart && j.chart.error && j.chart.error.code === 'Not Found') gone();
  }
  throw 0;
}

// What one symbol is now, from its own source: {p: price, v: the close before (or null), c: the day's closes, pct: the day's change when the
// source says it, at: now}, or null. intra = 15-minute closes of today (the stocks card draws them); else the daily closes of five days
// (the markets line only needs the change).
async function directQuote(j){
  try{
    if(j.cg){                                  // crypto: CoinGecko, CORS friendly
      const r = await fetchT(`https://api.coingecko.com/api/v3/simple/price?ids=${j.cg}&vs_currencies=usd&include_24hr_change=true`, 10000);
      if(!r.ok) throw 0;
      const c = (await r.json())[j.cg];
      if(!c || typeof c.usd !== 'number') throw 0;
      return {p:c.usd, v:null, c:[], pct:c.usd_24h_change != null ? c.usd_24h_change : (c.usd_24hr_change != null ? c.usd_24hr_change : null), at:Date.now()};
    }
    const res = (await yahooChart(j.key, j.intra ? 'interval=15m&range=1d' : 'interval=1d&range=5d')).chart.result[0];
    const price = res.meta.regularMarketPrice;
    if(typeof price !== 'number') throw 0;
    let c = ((res.indicators.quote[0] || {}).close || []).filter(x => typeof x === 'number');
    const was = res.meta.chartPreviousClose || res.meta.previousClose || null;
    if(!j.intra) return {p:price, v:c.length >= 2 ? c[c.length-2] : was, c:[], at:Date.now()};
    if(c.length > 30){ const n = Math.ceil(c.length / 30); c = c.filter((x, i) => i % n === 0 || i === c.length - 1); }
    return {p:price, v:was, c, at:Date.now()};
  }catch(e){ return null; }
}

// How old a price is, for the screen: '' while it is current, else «آخر تحديث ٣:١٥ م» (its fetch time), and «غير محدّث» past 24 hours.
const DAY_MS = 86400000;
function staleMark(v){
  if(!v) return '';
  const old = v.at && Date.now() - v.at > DAY_MS;
  if(!v.bad && !old) return '';
  return v.at && !old ? fmtAgo(v.at) : 'غير محدّث';
}

// One tick for the markets line and the stocks card: each symbol once (a stock on both is asked once), one request at a time.
const WITH_LINE = !CONFIG.widget && (CONFIG.mkBar || CONFIG.slot === 'markets');   // no line in the launcher's page; hidden = no requests (unless the slot shows them)
const loadMarkets = guarded('markets', async function(){
  const jobs = new Map();   // Yahoo symbol -> {key, cg, intra, tk: its markets, sk: its stocks}
  const job = (key, cg, intra) => {
    let j = jobs.get(key);
    if(!j) jobs.set(key, j = {key, cg, intra:false, tk:[], sk:[]});
    j.intra = j.intra || intra;
    return j;
  };
  if(WITH_LINE) TICKERS.forEach(t => job(t.fk, t.cg, false).tk.push(t));
  if(USES('stocks')) CONFIG.stocks.forEach(k => job(isSA(k) ? k + '.SR' : k, null, true).sk.push(k));
  if(!jobs.size) return;
  await loadMarketFile();
  let asked = 0;
  for(const j of jobs.values()){
    let q = fileQuote(j.key);
    if(!q){ if(asked++) await sleep(CONFIG.queueGapMs); q = await directQuote(j); }
    for(const t of j.tk){
      if(q) paintMarket(t, typeof q.p === 'number' ? q.p * (t.mul || 1) : null,
        typeof q.pct === 'number' ? q.pct : q.v ? (q.p - q.v) / q.v * 100 : null, q.at);
      else if(MK_LAST[t.key]) MK_LAST[t.key].bad = 1;                       // offline or refused: the last price stays, marked
      else if(!document.getElementById(t.chg).textContent) paintDir(t, null);
    }
    for(const k of j.sk){
      if(q) STOCKS[k] = {p:q.p, v:q.v, c:q.c, at:q.at};
      else if(STOCKS[k]) STOCKS[k].bad = 1;
    }
  }
  if(CONFIG.stocks.length && USES('stocks')){
    try{ localStorage.setItem(LS.stocks, JSON.stringify(STOCKS)); }catch(e){}
    renderPanel(false, 'stocks');
  }
  if(WITH_LINE){ saveMarkets(); paintMkUp(); if(CONFIG.slot === 'markets') renderSlot(); }
});
const loadStocks = loadMarkets, loadTickers = loadMarkets;

const SKIP_TYPES = ['News','Talk Show','Sports','Game Show'];
let WEEK_OK_AT = 0, WEEK_FAIL_AT = 0;   // the last refresh that kept its answer, and the last one that failed (0 = never)
// TVmaze, one request at a time CONFIG.weekGapMs apart. null = no answer (a failed request), [] = an answer with nothing in it.
const loadWeek = guarded('week', async function(){
  const F = CONFIG.shows, seen = new Set(), out = [];
  let asked = 0, failed = 0, answered = 0;
  const ask = async url => {
    if(asked++) await sleep(CONFIG.weekGapMs);
    try{ const r = await fetchT(url, 12000); if(!r.ok) throw 0; const j = await r.json(); answered++; return j; }
    catch(e){ failed++; return null; }
  };
  const days = [];
  for(let i=0;i<7;i++) days.push(FMT_DATE.format(new Date(Date.now()+i*86400000)));
  const inWeek = d => d && d >= days[0] && d <= days[6];
  const add = (s, e, picked) => {
    if(!s || !s.name || seen.has(s.name)) return;
    seen.add(s.name);
    const prem = e.number === 1;
    out.push({
      name: s.name,
      ep: e.season ? (prem ? `الموسم ${ar(e.season)}` : `الموسم ${ar(e.season)} · ح ${ar(e.number)}`) : '',
      date: e.airdate || '',
      rating: (s.rating && s.rating.average) || 0,
      prem, picked
    });
  };

  // shows picked one by one: their next episode, if it airs this week
  for(const id of F.ids){
    const s = await ask(`https://api.tvmaze.com/shows/${id}?embed=nextepisode`);
    const e = s && s._embedded && s._embedded.nextepisode;
    if(e && inWeek(e.airdate)) add(s, e, true);
  }

  // the schedule, narrowed by genre and language; skipped when only picked shows were chosen
  if(!F.ids.length || F.genres.length || F.langs.length){
    const lists = [];
    for(const dt of days){
      lists.push(await ask(`https://api.tvmaze.com/schedule/web?date=${dt}`));
      for(const c of F.countries) lists.push(await ask(`https://api.tvmaze.com/schedule?country=${encodeURIComponent(c)}&date=${dt}`));
    }
    lists.filter(Array.isArray).reduce((all, list) => all.concat(list), []).forEach(e => {
      const s = e.show || (e._embedded && e._embedded.show) || {};
      if(s.type && SKIP_TYPES.includes(s.type)) return;
      if(s.genres && s.genres.includes('Soap')) return;   // no daytime soaps
      if(!e.number || e.number < 1) return;
      if(e.season && e.season > 15) return;               // keep it to real series
      if(((s.rating && s.rating.average) || 0) < F.minRating) return;
      if(F.genres.length && !(s.genres || []).some(g => F.genres.includes(g))) return;
      if(F.langs.length && !F.langs.includes(s.language)) return;
      add(s, e, false);
    });
  }

  // The pool is replaced only when every day answered: a list made of some days is a wrong list. With no list yet, some is better than none.
  const whole = answered > 0 && failed === 0;
  if(!whole && !(answered > 0 && !WEEK_POOL.length && out.length)){
    WEEK_FAIL_AT = Date.now();
    if(!WEEK_OK_AT) setTimeout(loadWeek, CONFIG.retryMs);   // a first load that failed tries again soon
    renderPanel(false, 'shows');
    return;
  }
  WEEK_POOL = out.sort((a,b)=> (b.picked - a.picked) || (b.prem - a.prem) || a.date.localeCompare(b.date)).slice(0, 50);
  CARDS.forEach(c => { if(c.kind === 'shows') c.page = 0; });
  WEEK_OK_AT = Date.now(); WEEK_FAIL_AT = 0;
  WEEK_LOADED = true;
  renderPanel(false, 'shows');
});

const WEEK_ROWS = 5;
const MATCH_ROWS = 4;   // the games card: each game takes two lines (teams, date and time)
let WEEK_POOL = [], WEEK_LOADED = false;

// «جديد المسلسلات»: this card's page of the pool (card.page counts pages of card.cap, or WEEK_ROWS, rows)
function renderWeekPage(card, animate){
  const ul = card.ul;
  if(!WEEK_POOL.length){
    if(!WEEK_LOADED && !WEEK_FAIL_AT) return;   // the saved list stays until the first answer
    if(!WEEK_LOADED && ul.firstElementChild && !ul.firstElementChild.classList.contains('empty')) return;
    ul.classList.remove('flip');
    setHTML(ul, `<li class="empty">${WEEK_LOADED ? 'لا جديد هذا الأسبوع' : 'تعذّر التحديث'}</li>`);
    return;
  }
  const per = card.cap || WEEK_ROWS, start = (card.page * per) % WEEK_POOL.length;
  const rows = [];
  for(let i = 0; i < Math.min(per, WEEK_POOL.length); i++){
    rows.push(WEEK_POOL[(start + i) % WEEK_POOL.length]);
  }
  setHTML(ul, rows.map(o=>{
    const dt = o.date ? new Intl.DateTimeFormat(GREG,{timeZone:CONFIG.timezone,weekday:'short'}).format(new Date(o.date+'T12:00:00Z')) : '';
    return `<li><span>${esc(o.name)}</span>`
         + (o.ep?`<span class="ep">${ar(o.ep)}</span>`:'')
         + (o.rating ? `<span class="rt">${ar(o.rating.toFixed(1)).replace('.', LATIN ? '.' : '٫')}</span>` : '')
         + (dt?`<span class="dt">${dt}</span>`:'') + '</li>';
  }).join(''), animate);
  ul.classList.remove('flip');
  if(animate){ void ul.offsetWidth; ul.classList.add('flip'); }
}

// The launcher's «المهام» card is a button (#live=1): the page draws its mic mark and its ring; Android owns the focus and OK.
// setLiveFocus(true|false) is called by the launcher when the card gets or loses the focus; liveRect() says where the card is

const MIC_MARK = '<span class="micmark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11z"/></svg></span>';

const PANEL_TITLE = {today:'يومك', shows:'هذا الأسبوع', prayers:'مواقيت اليوم', nextprayer:'الصلاة القادمة', forecast:'الأيام القادمة', hourly:'الساعات القادمة', matches:CONFIG.leagues.length ? 'المباريات' : 'مباريات فرقك', tasks:'المهام', year:'السنة'};
