// the text's size steps down with its length (characters): up to 180 as it was, then three smaller steps
const quoteSize = n => n > 420 ? ' q3' : n > 300 ? ' q2' : n > 180 ? ' q1' : '';
// the tafsir cut at a word, «…» after it, until it fits three lines (the build already limits its length); on a card
// that is already full (a long verse on a small screen) fewer lines, none at all if not even one fits
function fitTafsir(ul){
  const el = ul.querySelector('li.tafsir');
  if(!el) return;
  const full = el.textContent.replace(/…$/, ''), words = full.split(' '), was = el.textContent !== full;
  const card = ul.closest('.week'), bar = document.querySelector('.bottom');
  const lines = () => Math.round(el.getBoundingClientRect().height / parseFloat(getComputedStyle(el).lineHeight));
  const crowded = () => { const c = card.getBoundingClientRect(); return c.height > .42 * innerHeight || c.bottom > bar.getBoundingClientRect().top - 4; };
  for(let max = 3; max > 0; max--){
    let n = words.length;
    el.textContent = full + (was ? '…' : '');
    while(lines() > max && n > 1){
      n--;
      el.textContent = words.slice(0, n).join(' ').replace(/[\s،,:؛.]+$/, '') + '…';
    }
    if(!crowded()) return;
  }
  el.remove();
}
// A card in a small place (the launcher's second or third) asks for a text no longer than card.maxLen: the first that short from the
// day's own, going on from it; none that short, the shortest.
function pickShort(list, at, len, card){
  card = card || {};
  card.len = len(list[at % list.length]);
  if(!card.maxLen) return list[at % list.length];
  let best = list[at % list.length];
  for(let k = 0; k < list.length; k++){
    const x = list[(at + k) % list.length];
    if(len(x) <= card.maxLen){ best = x; break; }
    if(len(x) < len(best)) best = x;
  }
  card.len = len(best);
  return best;
}
function quoteOfDay(card){
  const n = riyadhDayNumber(), half = Math.floor(n / 2);
  if(VERSES.length && n % 2 === 0){
    const v = pickShort(VERSES, half, x => x.text.length, card);
    return {title:'آية اليوم', rows:[`<li class="quote quran${v.text.length > 330 ? ' q4' : quoteSize(v.text.length)}"><span class="orn">﴿</span><span class="qt">${esc(v.text)}</span><span class="orn">﴾</span></li>`, `<li class="src">${esc(v.surah)} · ${ar(v.ayah)}</li>`]
      .concat(CONFIG.tafsir && v.tafsir ? [`<li class="tafsir">${esc(v.tafsir)}</li>`] : [])};
  }
  const h = pickShort(HADITH, half, x => x.parts.reduce((m, [, t]) => m + t.length, 0), card);
  const saw = s => s.replace(/ﷺ/g, '<span class="saw">ﷺ</span>').replace(/[﴿﴾]/g, m => `<span class="orn">${m}</span>`);
  const body = h.parts.map(([k, t]) => k === 'q' ? `«${saw(esc(t))}»` : `<span class="nar">${saw(esc(t))}</span>`).join(' ');
  return {title:'حديث اليوم', rows:[`<li class="quote hadith${quoteSize(h.parts.reduce((n, [, t]) => n + t.length, 0))}">${body}</li>`, `<li class="src">${esc(h.source)}</li>`]};
}

function adhkarWindow(){
  if(!DAY_TIMES) return '';
  const p = riyadhParts(), now = p.h * 60 + p.mi;
  const at = k => { const [h, mi] = String(DAY_TIMES[k]).split(':').map(Number); return h * 60 + mi; };
  if(now >= at('Fajr') && now < at('Dhuhr')) return 'morning';
  if(now >= at('Asr') && now < at('Maghrib')) return 'evening';
  const late = ADHKAR.some(d => d.when === 'night') ? 'night' : 'late';   // after midnight it is still the night before
  if(now >= at('Isha') || now < at('Fajr')) return late;
  return '';
}
function adhkarNext(card){
  card.ad.t = 0;
  card.ad.i++;
  renderCard(card, card.ad.n > 1);
  fitCards();
}
function adhkarNextWindow(){
  const at = k => { const [h, mi] = String(DAY_TIMES[k]).split(':').map(Number); return fmtTime(h, mi); };
  const p = riyadhParts(), now = p.h * 60 + p.mi, mins = k => { const [h, mi] = String(DAY_TIMES[k]).split(':').map(Number); return h * 60 + mi; };
  return !DAY_TIMES ? ['أذكار الصباح والمساء', 'في أوقاتها، من الفجر ومن العصر', '']
    : now < mins('Asr') ? ['أذكار المساء', 'مع العصر ' + at('Asr'), 'evening'] : ['الآيتان من آخر سورة البقرة', 'بعد العشاء ' + at('Isha'), 'night'];
}
function adhkarWait(){

}

  if(key !== ad.mode){ ad.mode = key; ad.i = 0; clearTimeout(ad.t); ad.t = 0; }
  let i = ad.i % list.length;

  const d = list[i];
  card.len = d.text.length;
  ad.n = list.length;
  if(!ad.t) ad.t = setTimeout(() => adhkarNext(card), Math.min(60, 20 + .1 * d.text.length) * 1000);
  const dots = Math.min(list.length, 12), on = Math.floor(i * dots / list.length);

    title,

    rows: [`<li class="quote${d.quran ? ' quran' : ''}${d.text.length > 560 ? ' q4' : quoteSize(d.text.length)}">${text}</li>`,
           `<li class="adf"><span class="s">${esc(ar(d.virtue ? `${d.virtue.text} · ${d.virtue.source.replace(' · ', ' ')}` : d.source))}</span><span class="c">${ADHKAR_COUNT[d.count] || ar(d.count) + ' مرة'}</span>`
           + `<span class="d">${Array.from({length: dots}, (_, k) => k === on ? '<i class="on"></i>' : '<i></i>').join('')}</span></li>`],
  };
}

const WX_CODES = {
  0:'صافي',1:'صافي غالباً',2:'غائم جزئياً',3:'غائم',45:'ضباب',48:'ضباب متجمد',
  51:'رذاذ',53:'رذاذ',55:'رذاذ كثيف',56:'رذاذ متجمد',57:'رذاذ متجمد',
  61:'مطر خفيف',63:'مطر',65:'مطر غزير',66:'مطر متجمد',67:'مطر متجمد',
  71:'ثلج خفيف',73:'ثلج',75:'ثلج كثيف',77:'حبيبات ثلج',
  80:'زخات خفيفة',81:'زخات مطر',82:'زخات غزيرة',85:'زخات ثلج',86:'زخات ثلج',
  95:'عواصف رعدية',96:'عواصف مصحوبة ببرد',99:'عواصف قوية'
};
// When the current reading was fetched, and the last dust reading (µg/m³): both are kept on the device. A reading older than 3 hours is
// not shown as «now» (the temperature, the word and the day's range at the top left go blank until a new one arrives).
const WX_STALE_MS = 3*3600000;
let WX = {at: 0, pm: 0, pmAt: 0, vis: null};
try{ WX = Object.assign(WX, JSON.parse(localStorage.getItem(LS.wx) || '{}')); }catch(e){}
const saveWx = () => { try{ localStorage.setItem(LS.wx, JSON.stringify(WX)); }catch(e){} };
function wxExpire(){
  if(Date.now() - WX.at < WX_STALE_MS) return;
  ['wx-temp', 'wx-desc', 'wx-dust', 'wx-range', 'wx-src'].forEach(id => { const el = document.getElementById(id); if(el) setText(el, ''); });
}
// «Open-Meteo · قبل ١٥ د»: where the weather comes from and how old the reading is (kept up to date with the clock, no request)
function wxAgeText(ms){
  const m = Math.floor(ms / 60000);
  return m < 1 ? 'الآن' : m < 60 ? 'قبل ' + ar(m) + ' د' : 'قبل ' + ar(Math.floor(m / 60)) + ' س';
}
function wxSource(){
  const el = document.getElementById('wx-src');
  if(!el) return;
  const fresh = WX.at && Date.now() - WX.at < WX_STALE_MS;
  setText(el, fresh ? 'Open-Meteo · ' + wxAgeText(Date.now() - WX.at) : '');
  // #wxmore=1: «رطوبة ٤٥٪، رياح ١٢ كم/س» («،», not «·»: beside «٪» it reads as «٠») from the same reading (none of it when the reading is stale or did not have it)
  const more = document.getElementById('wx-more');
  if(!more) return;
  const parts = [];
  if(CONFIG.wxMore && fresh && typeof WX.hum === 'number') parts.push('رطوبة ' + ar(Math.round(WX.hum)) + '٪');
  if(CONFIG.wxMore && fresh && typeof WX.wind === 'number') parts.push('رياح ' + ar(Math.round(WX.wind)) + ' كم/س');
  setText(more, parts.join('، '));
  more.hidden = !parts.length;
}
async function loadWeather(){
  const q = `latitude=${CONFIG.latitude}&longitude=${CONFIG.longitude}&timezone=${encodeURIComponent(CONFIG.timezone)}`;
  try{
    // the hours card asks in the same request: its hourly values, and sunrise and sunset for the day or night icon
    const hours = USES('hourly');
    const r = await fetchT(`https://api.open-meteo.com/v1/forecast?${q}&current=temperature_2m,weather_code,visibility${CONFIG.wxMore ? ',relative_humidity_2m,wind_speed_10m' : ''}`
                         + `&daily=temperature_2m_max,temperature_2m_min,weather_code${hours ? ',sunrise,sunset' : ''}&forecast_days=5`
                         + (hours ? '&hourly=temperature_2m,weather_code' : ''), 12000);
    if(!r.ok) throw 0;
    const j = await r.json();
    WX.at = Date.now(); WX.vis = typeof j.current.visibility === 'number' ? j.current.visibility : null;
    // off, the values are not asked: none kept, so turning it on offline shows nothing old as if it were now
    WX.hum = CONFIG.wxMore && typeof j.current.relative_humidity_2m === 'number' ? j.current.relative_humidity_2m : null;
    WX.wind = CONFIG.wxMore && typeof j.current.wind_speed_10m === 'number' ? j.current.wind_speed_10m : null;
    saveWx();
    setText(document.getElementById('wx-temp'), ar(Math.round(j.current.temperature_2m)) + '°');
    const d = document.getElementById('wx-desc');
    setText(d, WX_CODES[j.current.weather_code] || '');
    wxSource();
    const hi = j.daily && j.daily.temperature_2m_max && j.daily.temperature_2m_max[0];
    const lo = j.daily && j.daily.temperature_2m_min && j.daily.temperature_2m_min[0];
    setText(document.getElementById('wx-range'),
      (hi != null && lo != null) ? `${ar(Math.round(hi))}° / ${ar(Math.round(lo))}°` : '');
    const dl = j.daily || {};
    FORECAST = (dl.time || []).map((t, i) => ({date:t, code:dl.weather_code && dl.weather_code[i],
      hi:dl.temperature_2m_max && dl.temperature_2m_max[i], lo:dl.temperature_2m_min && dl.temperature_2m_min[i]})).filter(x => x.hi != null && x.lo != null);
    try{ localStorage.setItem(LS.forecast, JSON.stringify(FORECAST)); }catch(e){}
    if(hours){
      const hr = j.hourly || {}, from = hourKey();
      HOURLY = (hr.time || []).map((t, i) => ({t, code:hr.weather_code && hr.weather_code[i], temp:hr.temperature_2m && hr.temperature_2m[i]})).filter(x => x.t > from && x.temp != null).slice(0, 12);
      SUN = {};
      (dl.time || []).forEach((d, i) => { const up = dl.sunrise && dl.sunrise[i], down = dl.sunset && dl.sunset[i]; if(up && down) SUN[d] = [up.slice(11, 16), down.slice(11, 16)]; });
      try{ localStorage.setItem(LS.hourly, JSON.stringify({h:HOURLY, s:SUN})); }catch(e){}
    }
    renderPanel(false, 'forecast', 'hourly');
    if(slotNow() === 'weather') renderSlot();
  }catch(e){ return; }   // keep the last reading; with none only the city shows

  // the dust is told beside the condition (never instead of it): PM10 in µg/m³
  try{
    const r = await fetchT(`https://air-quality-api.open-meteo.com/v1/air-quality?${q}&current=pm10,dust`, 12000);
    if(!r.ok) throw 0;
    const c = (await r.json()).current || {};
    WX.pm = Math.max(c.pm10 || 0, c.dust || 0); WX.pmAt = Date.now(); saveWx();
  }catch(e){}                                  // no answer: the last dust reading stands, not a clear sky
  setText(document.getElementById('wx-dust'), Date.now() - WX.pmAt < WX_STALE_MS ? dustWord(WX.pm, WX.vis) : '');
}
// The air-quality model (CAMS) can put thousands of µg/m³ of dust over Riyadh for days while the sky is clear and the visibility is
// 20 km (issue #29): the dust is said only when the visibility agrees, under 10 km for «غبار» and under 3 km for «غبار كثيف».
// No visibility in the answer: the thresholds alone, as before.
function dustWord(pm, vis){
  if(!(pm >= 150)) return '';
  if(vis == null) return pm >= 400 ? 'غبار كثيف' : 'غبار';
  if(vis >= 10000) return '';
  return pm >= 400 && vis < 3000 ? 'غبار كثيف' : 'غبار';
}

// night dimming: transparent by day, dark after 21:00 and before 07:00
function applyNight(){
  const p = riyadhParts();
  const h = p.h + p.mi/60;
  const MAX = 0.46;
  let o = 0;
  if(h >= 23 || h < 5)      o = MAX;
  else if(h >= 21)          o = MAX * (h - 21) / 2;
  else if(h < 7)            o = MAX * (7 - h) / 2;
  const el = document.getElementById('dimmer');
  const v = Math.max(0, Math.min(MAX, o)).toFixed(2);
  if(el && el.style.opacity !== v) el.style.opacity = v;
}

// gentle pixel shift so static text never burns into the panel
const SHIFT_SEQ = [[0,0],[3,2],[0,4],[-3,2],[-3,-2],[0,-4],[3,-2]];
let shiftTick = 0;
function pixelShift(){
  shiftTick = (shiftTick + 1) % SHIFT_SEQ.length;
  const [dx,dy] = SHIFT_SEQ[shiftTick];
  const st = document.querySelector('.stage');
  if(st) st.style.transform = `translate(${dx}px,${dy}px)`;
}

// Background photos: the hosted set in photos/ (photos/index.json in the repo). A hosted photo is used only
// once it has loaded; offline, or if it fails, a bundled one is shown, so the screen is never empty.
const PHOTO_BASE = 'https://raw.githubusercontent.com/tshi-dev/UrTV/master/photos/';
let REMOTE_BGS = (()=>{ try{ return JSON.parse(localStorage.getItem('photoIndex') || '[]'); }catch(e){ return []; } })();

// The owner's own photos: the app answers OWN_BASE N.jpg (1..CONFIG.own) from its own folder, never from the network.
const OWN_BASE = 'https://own.urtv.invalid/';
const OWN_ONLY = () => CONFIG.own > 0 && CONFIG.ownMode === 'only';
const ownPhotos = () => Array.from({length: CONFIG.own}, (_, k) => ({url: OWN_BASE + (k + 1) + '.jpg', b: {}}));   // no credit: they are not ours

async function loadPhotoIndex(){

    }

let REVEALED = false;
function reveal(){
  if(REVEALED) return;
  REVEALED = true;
  // fonts may still be arriving (tv.html loads them as files): wait for them, briefly
  const fonts = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
  Promise.race([fonts, new Promise(r => setTimeout(r, 800))])
    .then(() => document.documentElement.classList.add('ready'));
}

function showBackground(url, b){
  const ph = document.querySelector('.photo');
  reveal();
  if(!ph) return;
  const next = "url('" + url + "')";
  if(ph.style.backgroundImage === next) return;   // same photo: no reload, no new movement
  ph.style.backgroundImage = next;
  ph.style.setProperty('--dim', (1 - (b.d || 0.95)).toFixed(2));
  ph.classList.remove('settle'); void ph.offsetWidth; ph.classList.add('settle');
  cardBlurLater(url);
  const cr = document.getElementById('credit');
  if(cr) cr.textContent = b.c ? 'الصورة: ' + b.c : '';
}

// ---- card style blur: a copy of the photo behind the card, blurred once per photo, never a live backdrop-filter ----
// Made only after the photo has settled (it drifts for 60 s, then holds still) and thrown away when the photo
// changes, so nothing repaints while the screen is idle. Any failure leaves the card on its plain tint.
const CARD_FILTER = {   // blur px, then the CSS filter functions, as in the approved designs
  dark1:[6,'saturate(140%)'], glass1:[9,'saturate(170%) brightness(.62)'],
  dark3:[6,'saturate(140%)'], glass3:[9,'saturate(160%) brightness(.55)'],
};
const CARD = {cv:null, t:0, url:'', since:0};   // cv: the copies drawn, one per card beside the clock (two for the small clock's pair)
function cardRelease(){
  clearTimeout(CARD.t); CARD.t = 0;
  document.querySelectorAll('.week > canvas.bl').forEach(cv => { cv.width = 0; cv.remove(); });   // every card's, also one left half made
  CARD.cv = null;
}
function cardBlurLater(url){
  CARD.url = url; CARD.since = Date.now();
  cardRelease();
  if(!CARD_FILTER[CONFIG.cardStyle]) return;
  const calm = !window.matchMedia || matchMedia('(prefers-reduced-motion: no-preference)').matches;   // else it never drifts
  CARD.t = setTimeout(cardBlurNow, calm ? 61000 : 0);
}
function cardBlurNow(){
  CARD.t = 0;
  const f = CARD_FILTER[CONFIG.cardStyle], cards = CARDS.map(c => c.el), url = CARD.url;
  if(!f || !cards.length || !url || CONFIG.panel === 'none') return;
  try{
    const img = new Image();
    img.onload = () => {
      try{
        if(url !== CARD.url || CARD.cv) return;   // the photo changed while this loaded
        CARD.cv = cards.map(card => {
          const W = innerWidth, H = innerHeight, r = card.getBoundingClientRect(), K = .25;   // a quarter size is plenty under a blur
          const [sx, sy] = SHIFT_SEQ[shiftTick];   // the stage's burn-in shift moves the card, not the photo
          const cv = document.createElement('canvas');
          cv.width = Math.max(1, Math.round(r.width * K)); cv.height = Math.max(1, Math.round(r.height * K));
          const g = cv.getContext('2d');
          const patch = () => g.setTransform(K, 0, 0, K, -(r.left - sx) * K, -(r.top - sy) * K);   // canvas = the card's patch of the screen
          patch();
          if(g.filter !== undefined) g.filter = `blur(${f[0] * K}px) ${f[1]}`;
          // where .photo draws it: cover, centred at 26%, then its final scale(1.03) about the centre
          const iw = img.naturalWidth, ih = img.naturalHeight, s = Math.max(W / iw, H / ih), dw = iw * s, dh = ih * s;
          g.translate(W / 2, H / 2); g.scale(1.03, 1.03); g.translate(-W / 2, -H / 2);
          g.drawImage(img, (W - dw) * .5, (H - dh) * .26, dw, dh);
          g.filter = 'none';
          patch();
          g.fillStyle = `rgba(0,0,0,${document.querySelector('.photo').style.getPropertyValue('--dim') || .05})`;   // the photo's own darkness
          g.fillRect(0, 0, W, H);
          const v = g.createLinearGradient(0, 0, 0, H);   // the vertical part of .veil, the part that reaches the card
          v.addColorStop(0, 'rgba(3,10,7,.62)'); v.addColorStop(.22, 'rgba(3,10,7,.30)'); v.addColorStop(.46, 'rgba(3,10,7,.12)');
          v.addColorStop(.74, 'rgba(3,10,7,.42)'); v.addColorStop(1, 'rgba(2,6,4,.88)');
          g.fillStyle = v; g.fillRect(0, 0, W, H);
          g.translate(.22 * W, .34 * H); g.scale(1.2 * W, .85 * H);   // and its soft shade at 22% 34%
          const rg = g.createRadialGradient(0, 0, 0, 0, 0, 1);
          rg.addColorStop(0, 'rgba(3,14,9,.42)'); rg.addColorStop(.58, 'rgba(3,14,9,0)');
          g.fillStyle = rg; g.fillRect(-1, -1, 2, 2);
          cv.className = 'bl';
          card.insertBefore(cv, card.firstChild);
          requestAnimationFrame(() => requestAnimationFrame(() => cv.classList.add('on')));
          return cv;
        });
      }catch(e){ cardRelease(); }
      img.onload = null; img.src = '';
    };
    img.src = url;
  }catch(e){}
}
// a resized screen moves the card over the photo: draw the copy again (at once, the photo has settled)
let CARD_RESIZE = 0;
addEventListener('resize', () => {
  clearTimeout(CARD_RESIZE);
  CARD_RESIZE = setTimeout(() => {
    if(!CARD_FILTER[CONFIG.cardStyle] || !CARD.url) return;
    const wait = Math.max(0, 61000 - (Date.now() - CARD.since));
    cardRelease();
    CARD.t = setTimeout(cardBlurNow, wait);
  }, 400);
});

// Every 4 days a new random set of 5 hosted photos (same draw as the launcher: Park-Miller generator seeded
// by the 4-day period), rotating every CONFIG.photoMinutes (30 unless the owner changed it). Only the photo on screen is downloaded.
const PHOTO_SET = 5, PHOTO_PERIOD_DAYS = 4;
function riyadhDayNumber(){
  const p = riyadhParts();
  return Math.floor(Date.UTC(p.y, p.mo - 1, p.d) / 86400000);
}
function photoSet(n){
  const period = Math.floor(riyadhDayNumber() / PHOTO_PERIOD_DAYS);
  let seed = (period % 2147483646) + 1;
  const pick = [];
  for(let guard = 0; pick.length < Math.min(PHOTO_SET, n) && guard < 1000; guard++){
    seed = (seed * 48271) % 2147483647;
    const k = seed % n;
    if(!pick.includes(k)) pick.push(k);
  }
  return pick;
}
// One of the owner's photos is due. The app answers it from disk, yet on a cold start that can take more than the 1.2 s the page gives
// a hosted photo, and a photo of ours must not show first (only) or in its place (mix). So it is waited for, up to OWN_WAIT_MS; one that
// fails gives way to the next of theirs; none loads, or none in time: a bundled one, so the screen is never empty (theirs still replace
// it when they arrive).
const OWN_WAIT_MS = 6000;
let BG_SLOT = -1, PREFETCHED = false, BG_TURN = 0;
function showOwn(pick, own, local){
  const at = own.indexOf(pick), order = own.slice(at).concat(own.slice(0, at)), turn = ++BG_TURN;
  const bundled = () => { if(turn === BG_TURN && !document.querySelector('.photo').style.backgroundImage) showBackground(local.u, local); };
  const t = setTimeout(bundled, OWN_WAIT_MS);
  const next = i => {
    if(i >= order.length){ clearTimeout(t); bundled(); return; }
    const img = new Image();
    img.onload = () => { clearTimeout(t); if(turn === BG_TURN) showBackground(order[i].url, order[i].b); };
    img.onerror = () => next(i + 1);
    img.src = order[i].url;
  };
  next(0);
}
function applyBackground(force){
  try {
    const p = riyadhParts();
    const slotMin = CONFIG.photoMinutes;   // divides 1440, so slots count on across midnight
    const slot = riyadhDayNumber() * (1440 / slotMin) + Math.floor((p.h * 60 + p.mi) / slotMin);
    if(slot === BG_SLOT && !force) return;
    BG_SLOT = slot; BG_TURN++;   // a photo of theirs still on its way for an earlier turn is dropped
    const only = OWN_ONLY(), own = ownPhotos();
    const set = !only && REMOTE_BGS.length ? photoSet(REMOTE_BGS.length).map(k => REMOTE_BGS[k]) : [];
    const local = BGS[slot % BGS.length];
    // what rotates: ours (the hosted set, else the bundled photos once the owner has some), then the owner's; only = theirs alone
    let pool = own;
    if(!only){
      const ours = set.length ? set.map(b => ({url: PHOTO_BASE + b.f, b})) : own.length ? BGS.map(b => ({url: b.u, b, bundled: true})) : [];
      pool = ours.concat(own);
    }
    if(!pool.length){ showBackground(local.u, local); return; }
    const pick = pool[slot % pool.length], url = pick.url, b = pick.b;
    if(own.includes(pick)){ showOwn(pick, own, local); return; }
    if(pick.bundled){ showBackground(url, b); return; }
    // First photo: wait briefly for the hosted one (the app serves it from disk at once) so the screen
    // doesn't flash a bundled photo first; slow network → bundled one, swapped when the hosted one arrives.
    let done = false;
    const fallback = () => { if(!done && !document.querySelector('.photo').style.backgroundImage) showBackground(local.u, local); };
    const t = setTimeout(fallback, 1200);
    const img = new Image();
    img.onload = () => { done = true; clearTimeout(t); showBackground(url, b); };
    img.onerror = () => { clearTimeout(t); fallback(); done = true; };
    img.src = url;
    // fetch the rest of the set once, quietly, so the app has each one on disk before its turn
    if(!PREFETCHED && set.length){ PREFETCHED = true; setTimeout(() => set.forEach(x => { new Image().src = PHOTO_BASE + x.f; }), 20000); }
  } catch(e) {}
}

// Last painted panels, shown at once on the next start while fresh data loads.
const SNAP_KEY = LS.snap;   // 'snap6:' + the link; bump when the panels' markup changes
const SNAP_SEL = ['.markets', '#match-row'];
let SNAP_LAST = null;   // what is stored now: the panels rarely change, so most saves have nothing to write
const noCrestData = h => (h || '').replace(/ src="data:[^"]*"/g, '');   // the crests are kept apart
function saveSnap(){
  const s = JSON.stringify([SNAP_SEL.map(q => noCrestData((document.querySelector(q)||{}).innerHTML)),
    CARDS.map(c => [c.kind, noCrestData(c.ul.innerHTML), c.hd.innerHTML])]);
  if(s === SNAP_LAST) return;
  try{ localStorage.setItem(SNAP_KEY, s); SNAP_LAST = s; }catch(e){}
}
function restoreSnap(){
  try{
    SNAP_LAST = localStorage.getItem(SNAP_KEY);
    const v = JSON.parse(SNAP_LAST || 'null');
    if(!v) return;
    SNAP_SEL.forEach((q, i) => { const el = document.querySelector(q); if(el && v[0][i]) el.innerHTML = v[0][i]; });
    CARDS.forEach((c, i) => {   // a card gets only what its own kind drew
      const saved = v[1][i];
      if(saved && saved[0] === c.kind){ c.ul.innerHTML = saved[1]; c.hd.innerHTML = saved[2]; fillCrests(c.ul); }
    });
  }catch(e){}
}

// What the cards need to be redrawn on, one place for the screensaver and the launcher: pages turn every 25 s, the clock-driven kinds
// every 15 s (prayers, the row, the hours, the smart card, «يومك»), the windows and markets every minute.
function cardTimers(){
  const clocked = ['prayers', 'hourly', 'prayerrow', 'nextprayer', 'smart', 'today'];
  setInterval(() => renderPanel(false, ...clocked), 15000);
  setInterval(() => {
    for(const c of CARDS){
      if(c.eff === 'shows' && WEEK_POOL.length > (c.cap || WEEK_ROWS)){ c.page++; renderCard(c, true); }
      else if(c.eff === 'matches'){ c.page++; renderCard(c, matchRows(c).length > (c.cap || MATCH_ROWS)); }
      else if(c.eff === 'stocks' && CONFIG.stocks.length > (c.cap || WEEK_ROWS)){ c.page++; renderCard(c, true); }
      else if(c.eff === 'tasks' && CONFIG.tasks.length > (c.cap || WEEK_ROWS)){ c.page++; renderCard(c, true); }
    }
    fitCards();
  }, 25*1000);
  setInterval(() => renderPanel(false, 'adhkar', 'stocks', ...clocked), 60*1000);   // a window may have opened; a market opened or closed
}

// Drops what this page no longer needs from localStorage, at boot. Only the families named here are looked at (other keys are not
// this function's to judge): a copy keyed by a whole link, which an older version left behind for each setting change, goes at once;
// a copy for another city, symbol list or link goes after two weeks without being used; of the link-keyed snapshots the newest 6 stay.
const LS_FAMILIES = ['forecast:', 'hourly:', 'wx:', 'stocks:', 'mk:', 'matchesOk:'], LS_IDLE_MS = 14*DAY_MS, LS_SNAPS = 6;
function pruneStorage(){
  try{
    const now = Date.now(), mine = new Set(Object.values(LS));
    let seen = {};
    try{ seen = JSON.parse(localStorage.getItem('lsSeen') || '{}') || {}; }catch(e){}
    mine.forEach(k => { seen[k] = now; });
    const snaps = [];
    localStorage.removeItem('matchesOk');   // (one version kept it for every link at once)
    for(let i = localStorage.length - 1; i >= 0; i--){
      const k = localStorage.key(i);
      if(!k || mine.has(k)) continue;
      const fam = LS_FAMILIES.find(f => k.startsWith(f));
      if(fam && k.charAt(fam.length) === '#'){ localStorage.removeItem(k); delete seen[k]; continue; }   // keyed by a whole link: the old way
      if(fam || k.startsWith('snap6:')){
        if(!seen[k]) seen[k] = now;
        if(now - seen[k] > LS_IDLE_MS){ localStorage.removeItem(k); delete seen[k]; }
        else if(k.startsWith('snap6:')) snaps.push(k);
      }
    }
    snaps.concat(mine.has(LS.snap) ? [LS.snap] : []).sort((a, b) => (seen[b] || 0) - (seen[a] || 0)).slice(LS_SNAPS).forEach(k => {
      if(k !== LS.snap){ localStorage.removeItem(k); delete seen[k]; }
    });
    for(const k in seen) if(localStorage.getItem(k) === null && !mine.has(k)) delete seen[k];
    localStorage.setItem('lsSeen', JSON.stringify(seen));
  }catch(e){}
}

// «يُتلى الآن» (the screensaver only): the app answers window.UrtvNative.nowPlaying() with {"title":"سورة الكهف","who":"ماهر المعيقلي"} while the
// Quran or a station plays in the launcher, and "" otherwise. Asked once at the start and then every minute, and the card goes when the
// answer is empty. The words go in as text. One line: a long one steps down in size (never «…»).
function nowPlayingTick(){
  const card = document.getElementById('np');
  if(!card || CONFIG.widget) return;   // the launcher's cards never carry it
  let s = null;
  try{ const raw = window.UrtvNative && window.UrtvNative.nowPlaying(); s = raw ? JSON.parse(raw) : null; }catch(e){}
  const title = s && typeof s.title === 'string' ? s.title.trim() : '', who = s && typeof s.who === 'string' ? s.who.trim() : '';
  if(!title){ card.hidden = true; return; }
  setText(document.getElementById('np-t'), title);
  setText(document.getElementById('np-w'), who);
  document.getElementById('np-s').hidden = !who;
  card.hidden = false;
  const line = document.getElementById('np-l');
  FIT_STEPS.concat([.64, .56]).find(k => { line.style.fontSize = k === 1 ? '' : k + 'em'; return card.getBoundingClientRect().width <= innerWidth * .42; });
}

function boot(){
  pruneStorage();
  if(CONFIG.widget){ bootWidget(); return; }
  buildCards();
  if(document.fonts) document.fonts.ready.then(() => {   // widths change once the fonts are in
    fitYearStrip();
    fitMatches(document.getElementById('match-row'));
    if(MATCHES_LOADED) CARDS.forEach(c => { if(c.eff === 'matches') c.ul.__h = null; });   // whole names again where they now fit
    renderPanel(false, 'matches');
  });
  if(CONFIG.slot === 'none') document.documentElement.classList.add('slot-none');
  if(!SLOT_MATCHES) document.getElementById('match-row').textContent = '';   // not «لا شيء هذا الأسبوع»: that is the matches slot's
  if(CONFIG.cardStyle !== 'current') document.documentElement.classList.add('cs-' + CONFIG.cardStyle);
  if(CONFIG.clockSize !== 'large') document.documentElement.classList.add('ck-' + CONFIG.clockSize);
  // the small clock's column: its widest time of day in ems, every minute measured in Thmanyah Display (١٢:٣٣ م is 2.60 of them, 10:00 م
  // in Latin digits 3.25), so the cards beside it and the panels under it never move
  if(CONFIG.clockSize === 'small') document.documentElement.style.setProperty('--ckk', LATIN ? '3.26' : '2.62');
  buildMarkets();
  restoreSnap();
  // #wxmore=1: its line under the city, once (the saved copy of the top left may bring one back: keep that one); off, none at all
  const wxMoreEl = document.getElementById('wx-more');
  if(CONFIG.wxMore && !wxMoreEl) document.getElementById('wx-src').insertAdjacentHTML('beforebegin', '<div class="wxmore" id="wx-more" hidden></div>');
  if(!CONFIG.wxMore && wxMoreEl) wxMoreEl.remove();
  paintMkUp(); wxExpire(); wxSource();
  setTimeout(saveSnap, 15*1000);   // the dream can be killed before pagehide
  setInterval(saveSnap, 60*1000);
  addEventListener('pagehide', saveSnap);
  // the parts of the choices that are off by default are made only when chosen: off, the page is as it was, element for element
  if(CONFIG.prayerBar) document.getElementById('prayer-count').insertAdjacentHTML('afterend', '<div class="pbar" id="pbar"><i id="pbar-fill"></i></div>');
  const wxCity = document.getElementById('wx-city');
  if(wxCity) wxCity.textContent = CONFIG.city;
  const cs = document.getElementById('clock-sub');
  if(cs) cs.textContent = clockSubText();
  const cn = document.getElementById('citynote');
  if(cn && CONFIG.cityNote){   // Location.note in the app says the same in the settings' top row
    cn.textContent = 'المدينة: ' + CONFIG.city + '. لتغييرها: الإعدادات ثم الموقع';   // words, not «←» (not in Thmanyah) nor «‹›» (mirrored or not by the renderer)
    cn.hidden = false;
    setTimeout(() => { cn.hidden = true; }, 10*60*1000);
  }
  document.title = 'شاشة تلفزيونك';
  applyBackground(true);
  loadPhotoIndex().then(() => applyBackground(true));
  setInterval(() => applyBackground(false), 60*1000);
  tickClock(); tickDates(); tickOccasion(); renderSlot();
  loadMarkets();
  renderPanel(false, ...CARD_KINDS.filter(k => k !== 'shows'));   // shows: its own data arrives with prayers, weather, matches
  if(NEEDS_MATCHES) loadMatches();
  loadPrayers(); if(USES('shows')) loadWeek(); loadWeather();
  applyNight(); pixelShift();

  nowPlayingTick();
  setInterval(nowPlayingTick, 60*1000);
  setInterval(adhanLiveTick, 3000);
  setInterval(tickClock, 1000);
  setInterval(()=>{ tickDates(); tickPrayer(); tickOccasion(); wxExpire(); wxSource(); if(!SLOT_MATCHES) renderSlot(); }, 15000);
  if(SLOT_MATCHES){   // the matches timers run only while the slot shows matches
    setInterval(() => renderMatches(false), 60000);
    // 15 s a page (two games), 10 s once a league makes more than 3 pages: a round of 9 games passes in 50 s, not 75
    const turn = () => { renderMatches(true); setTimeout(turn, CONFIG.leagues.length && MATCH_PAGES > 3 ? CONFIG.matchPageFastMs : CONFIG.matchPageMs); };
    setTimeout(turn, CONFIG.matchPageMs);
  }
  if(NEEDS_MATCHES){ periodic(loadLive, 2*60000); periodic(loadMatches, 30*60*1000); }
  periodic(loadPrayers, 6*3600*1000);
  periodic(loadMarkets, 15*60*1000);
  if(USES('shows')) periodic(loadWeek, 6*3600*1000);
  periodic(loadWeather, 30*60*1000);
  cardTimers();
  setInterval(applyNight, 60*1000);
  setInterval(pixelShift, 4*60*1000);
  let lastDay = FMT_DATE.format(new Date());
  setInterval(()=>{
    const d = FMT_DATE.format(new Date());
    if(d !== lastDay){
      lastDay = d; tickDates(); tickOccasion(); renderPanel(false);
      later(() => { loadPhotoIndex().then(() => applyBackground(true)); loadPrayers(); if(NEEDS_MATCHES) loadMatches(); if(USES('shows')) loadWeek(); loadWeather(); });   // each TV at its own minute
    }
  }, 60*1000);
}

// The launcher's cards: the chosen ones only (up to three), refreshed like on the screensaver, nothing else loaded.
function bootWidget(){
  document.documentElement.classList.add('widget');
  if(CONFIG.cardStyle !== 'current') document.documentElement.classList.add('cs-' + CONFIG.cardStyle);   // «شكل البطاقة» applies to each of them
  buildCards();
  restoreSnap();
  setTimeout(saveSnap, 15*1000);
  setInterval(saveSnap, 60*1000);
  addEventListener('pagehide', saveSnap);
  if(document.fonts) document.fonts.ready.then(() => {   // widths change once the fonts are in: the cards are fitted again
    CARDS.forEach(c => { if(c.eff === 'matches') c.ul.__h = null; });
    if(CARDS.length > 1) renderPanel(false); else renderPanel(false, 'matches');
  });
  if(USES('shows')){ loadWeek(); periodic(loadWeek, 6*3600*1000); }
  renderPanel(false, ...CARD_KINDS.filter(k => k !== 'shows'));
  if(USES('adhkar') || USES('prayers') || USES('prayerrow')){ loadPrayers(); periodic(loadPrayers, 6*3600*1000); }
  if(USES('forecast') || USES('hourly')){ loadWeather(); periodic(loadWeather, 30*60*1000); }
  if(USES('matches')){ loadMatches(); periodic(loadMatches, 30*60*1000); periodic(loadLive, 2*60000); }
  if(USES('stocks')){ loadMarkets(); periodic(loadMarkets, 15*60*1000); }
  cardTimers();
  let lastDay = riyadhDayNumber();
  setInterval(() => { if(riyadhDayNumber() !== lastDay){ lastDay = riyadhDayNumber(); renderPanel(false); if(USES('prayers') || USES('prayerrow') || USES('adhkar')) later(loadPrayers); } }, 60*1000);
  reveal();
}

document.addEventListener('keydown', e=>{
  if(e.key === 'f' || e.key === 'F'){
    if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
    else document.exitFullscreen().catch(()=>{});
  }
});

boot();
</script>
