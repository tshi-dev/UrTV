name: Photo cut-outs for the glass clock

# 4.4 «الساعة: زجاجية خلف الصورة»: the cut-out (the scenery, the sky transparent) of each of our photos, made here with a depth model and a
# soft matte, never on a TV; every photo goes through the gate (FIT / FRONT-ONLY / REJECT, masks/gate.json) and only FIT ones checked by eye
# (.github/tools/photo_masks_ok.txt) are put on the data-masks branch to be copied into urtv-data masks/. «الحرمين» is never cut.
# Run by hand with review: true to get every FIT cut-out, the review sheet and the check renders as an artifact.
on:
  workflow_dispatch:
    inputs:
      review:
        description: "every cut-out that passes, with the review sheet (an artifact; nothing pushed)"
        type: boolean
        default: false
  push:
    branches: [master, next]
    paths: ['.github/tools/photo_masks.py', '.github/tools/photo_masks_ok.txt', 'photos/packs.json']

permissions:
  contents: write

jobs:
  masks:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: pip install numpy==2.5.5 scipy==1.18.1 opencv-python-headless==4.14.0.94 Pillow==13.0.0 onnxruntime==1.32.0
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/work/depth_anything_v2_vits_dynamic.onnx
          key: depth-anything-v2-small-46c4e8ee
      - name: Review sheet
        if: ${{ inputs.review }}
        run: python3 -I .github/tools/photo_masks.py review --work "$RUNNER_TEMP/work" --all
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.review }}
        with:
          name: masks-review
          path: review
      - name: Cut-outs
        if: ${{ !inputs.review }}
        run: python3 -I .github/tools/photo_masks.py "$RUNNER_TEMP/masks" --work "$RUNNER_TEMP/work"
      - name: Push to data-masks
        if: ${{ !inputs.review }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # a work branch writes its own branch, so it never changes the one urtv-data is copied from
          B=data-masks; case "$GITHUB_REF_NAME" in master|next) ;; *) B=data-masks-work ;; esac
          if git fetch -q origin "$B"; then git checkout -q -B "$B" FETCH_HEAD; else git checkout -q --orphan "$B"; fi
          git rm -rfq --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          mkdir masks && cp -r "$RUNNER_TEMP/masks/." masks/
          git add masks
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -qm "Photo cut-outs for the glass clock"
          git push origin "$B"
