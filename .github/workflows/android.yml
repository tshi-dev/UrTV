name: Build APKs

on:
  push:
    branches: [master, next]   # next: a test build in apk-next, before anything reaches apk-latest
    paths: ['src/**', 'assets/**', 'android/**', 'VERSION', '.github/workflows/android.yml']
    # a release whose last commit touches none of these builds nothing (4.1's first try): its merge then needs a change here or in VERSION
    # 4.2 too: a fix after the release merge that touches only .github/tools (the cities generator) builds nothing, and its own build is this line, and so is the veil test's CI tolerance after it
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # master publishes to apk-latest, which every installed TV updates from: the same checks as checks.yml must pass first.
  # next builds without waiting (apk-next is a test build); a skipped checks job counts as passed there.
  checks:
    if: github.ref_name == 'master'
    uses: ./.github/workflows/checks.yml
    secrets: inherit

  # the release gate (docs/dev/RELEASE.md): every guard of docs/dev/REGRESSIONS.md and the API surface diff against the last release;
  # a new UI-thread path to a cross-process call stops the publish. Master only, as checks.
  regressions:
    if: github.ref_name == 'master'
    uses: ./.github/workflows/regressions.yml
    with:
      release: true   # and docs/dev/reviews/<VERSION>.md has no blocker or high open
    secrets: inherit

  apk:
    needs: [checks, regressions]
    if: ${{ !cancelled() && (needs.checks.result == 'success' || needs.checks.result == 'skipped') && (needs.regressions.result == 'success' || needs.regressions.result == 'skipped') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Thmanyah's licence allows its files only inside a built product: they live in the private
      # tshi-dev/urtv-fonts and are put in place here, never committed to this repository
      - uses: actions/checkout@v4
        with:
          repository: tshi-dev/urtv-fonts
          token: ${{ secrets.FONTS_TOKEN }}
          path: .fonts-private
      - name: Private fonts
        run: |
          cp .fonts-private/web/*.woff2 assets/fonts/
          mkdir -p android/launcher/src/main/assets/fonts
          cp .fonts-private/android/*.otf android/launcher/src/main/assets/fonts/
          rm -rf .fonts-private

      # the name people read (VERSION at the repository root, «4.0»): the release names and bodies use it; the apps read the same file in Gradle
      - name: Version
        id: ver
        run: |
          name=$(tr -d '[:space:]' < VERSION)
          echo "$name" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?$' || { echo "::error::VERSION must be like 4.0 or 4.3.2 (major.minor, or major.minor.patch)"; exit 1; }
          echo "name=$name" >> "$GITHUB_OUTPUT"
          # the tag keeps the two-part shape the updater and the scripts read (v4.3.<build>); only the name people read has the patch (4.3.2)
          echo "tag=$(echo "$name" | cut -d. -f1-2)" >> "$GITHUB_OUTPUT"

      - name: Build the page
        run: python3 src/build.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # the signing key lives only in the repository's secrets (made once with .github/tools/make_signing_key.py)
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::ANDROID_KEYSTORE_B64 and ANDROID_KEYSTORE_PASSWORD must both be in the repository's secrets"; exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Build APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          URTV_BRANCH: ${{ github.ref_name }}   # the screensaver fetches its page from the branch it was built from
          URTV_PIN_RECOVERY: ${{ secrets.PIN_RECOVERY_RECORD }}   # the PIN recovery code's salted record, never the code; unset = none (AGENTS.md)
        run: gradle -p android assembleRelease --no-daemon

      - name: Rename
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk urtv-screensaver.apk
          cp android/launcher/build/outputs/apk/release/launcher-release.apk urtv-home.apk
          cp android/extras/build/outputs/apk/release/extras-release.apk urtv-extras.apk   # 4.3.3 «إضافات تلفزيونك»: the optional add-on (the accessibility service)
          cp android/rescue/build/outputs/apk/release/rescue-release.apk urtv-rescue.apk   # 4.4 «إنقاذ تلفزيونك»: one button that puts the TV back as it was (its own Downloader code)
          echo "3.${{ github.run_number }}" > version.txt   # EXACTLY "3.<run>": every app that ever shipped (3.142 and after) reads the newest build from here, whatever the apps are called now; /releases/latest ends in apk-latest, not in a number

      # apksigner, not keytool: the home APK has no v1 (JAR) signature, so keytool sees no signer in it
      - name: Which key signed them
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for f in urtv-screensaver.apk urtv-home.apk urtv-extras.apk urtv-rescue.apk; do
            echo "$f:"; "$apksigner" verify --print-certs "$f" | grep -m2 -E 'certificate (DN|SHA-256)'
          done
          # 4.4 beta 3: each APK's size in bytes (the add-on's before and after its wireless-debugging libraries; any size change shows here)
          for f in urtv-screensaver.apk urtv-home.apk urtv-extras.apk urtv-rescue.apk; do echo "apk size: $f $(stat -c %s "$f") bytes"; done

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            urtv-screensaver.apk
            urtv-home.apk
            urtv-extras.apk
            urtv-rescue.apk

      # the notes of apk-latest and of the numbered release: the top of this version's CHANGELOG section (about 15 lines), the build,
      # and each APK's SHA-256. Only the notes and the titles are for people: the tags, the asset names and version.txt stay as they are
      # (the updater reads version.txt and the tag /releases/latest points to, never a title or a body).
      - name: Release notes
        if: github.ref_name == 'master'
        env:
          NAME: ${{ steps.ver.outputs.name }}
        run: |
          {
            echo "## What's new in ${NAME}"
            echo
            # this version's section of the CHANGELOG (or the newest one if it has none yet), without its heading, cut to 15 lines
            awk -v v="$NAME" '
              /^## / { n++; if (want == "" && $2 == v) want = n }
              { sec[n] = sec[n] $0 "\n" }
              END { k = (want != "" ? want : 1); printf "%s", sec[k] }' CHANGELOG.md \
              | sed '1d' | sed '/./,$!d' | head -n 15
            echo
            echo "All the changes: [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/CHANGELOG.md)"
            echo
            echo "Both apps at version ${NAME} (build ${GITHUB_RUN_NUMBER}), built from ${GITHUB_SHA}."
            echo
            echo "**SHA-256**"
            echo
            echo '```'
            sha256sum urtv-screensaver.apk urtv-home.apk urtv-extras.apk urtv-rescue.apk
            echo '```'
          } > release-notes.md
          cat release-notes.md

      # fixed download links: .../releases/download/apk-latest/urtv-screensaver.apk and urtv-home.apk
      - name: Publish to the apk-latest release
        if: github.ref_name == 'master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: UrTV ${{ steps.ver.outputs.name }} (latest)
          body_path: release-notes.md
          fail_on_unmatched_files: true   # a name that matches nothing (a typo) must stop the publish, not publish without it
          files: |
            urtv-screensaver.apk
            urtv-home.apk
            urtv-extras.apk
            urtv-rescue.apk
            version.txt
          make_latest: true

      # and every build kept under its own tag (v4.3.N: the version and the build; the release is titled «UrTV 4.3.2 (build N)», so no two titles match): APK_TAG=v4.3.N optimize/install.sh all (the older ones are v3.N)
      - name: Publish to the numbered release
        if: github.ref_name == 'master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.tag }}.${{ github.run_number }}
          name: UrTV ${{ steps.ver.outputs.name }} (build ${{ github.run_number }})
          body_path: release-notes.md
          fail_on_unmatched_files: true   # a name that matches nothing (a typo) must stop the publish, not publish without it
          files: |
            urtv-screensaver.apk
            urtv-home.apk
            urtv-extras.apk
            urtv-rescue.apk
          make_latest: false

      # next: one test release, replaced by each build; install with APK_TAG=apk-next optimize/install.sh all
      # version.txt is what «تحديث تلفزيوني» reads on the test channel (optimize/saver.sh updatechannel next)
      - name: Publish to the apk-next test release
        if: github.ref_name == 'next'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-next
          name: Test build from next
          body: "Both apps at version ${{ steps.ver.outputs.name }} (build ${{ github.run_number }}), built from next at ${{ github.sha }}. For testing only."
          fail_on_unmatched_files: true   # a name that matches nothing (a typo) must stop the publish, not publish without it
          files: |
            urtv-screensaver.apk
            urtv-home.apk
            urtv-extras.apk
            urtv-rescue.apk
            version.txt
          prerelease: true
          make_latest: false
