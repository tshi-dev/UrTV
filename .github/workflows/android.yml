name: Build APKs

on:
  push:
    branches: [master, next]   # next: a test build in apk-next, before anything reaches apk-latest
    paths: ['src/**', 'assets/**', 'android/**', 'VERSION', '.github/workflows/android.yml']
    # a release whose last commit touches none of these builds nothing (4.1's first try): its merge then needs a change here or in VERSION
    # 4.2 too: a fix after the release merge that touches only .github/tools (the cities generator) builds nothing, and its own build is this line, and so is the veil test's CI tolerance after it
  workflow_dispatch:
    inputs:
      pp_test:
        description: "work/pp-test only: build the Play Protect test variants A and B of the home app and publish them to the apk-test pre-release ('yes')"
        required: false
        default: ''

permissions:
  contents: write

jobs:
  # master publishes to apk-latest, which every installed TV updates from: the same checks as checks.yml must pass first.
  # next builds without waiting (apk-next is a test build); a skipped checks job counts as passed there.
  checks:
    if: github.ref_name == 'master'
    uses: ./.github/workflows/checks.yml
    secrets: inherit

  apk:
    needs: checks
    if: ${{ !cancelled() && (needs.checks.result == 'success' || needs.checks.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Thmanyah's licence allows its files only inside a built product: they live in the private
      # tshi-dev/urtv-fonts and are put in place here, never committed to this repository
      - uses: actions/checkout@v4
        with:
          repository: tshi-dev/urtv-fonts
          token: ${{ secrets.FONTS_TOKEN }}
          path: .fonts-private
      - name: Private fonts
        run: |
          cp .fonts-private/web/*.woff2 assets/fonts/
          mkdir -p android/launcher/src/main/assets/fonts
          cp .fonts-private/android/*.otf android/launcher/src/main/assets/fonts/
          rm -rf .fonts-private

      # the name people read (VERSION at the repository root, «4.0»): the release names and bodies use it; the apps read the same file in Gradle
      - name: Version
        id: ver
        run: |
          name=$(tr -d '[:space:]' < VERSION)
          echo "$name" | grep -Eq '^[0-9]+\.[0-9]+$' || { echo "::error::VERSION must be like 4.0 (major.minor)"; exit 1; }
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Build the page
        run: python3 src/build.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # the signing key lives only in the repository's secrets (made once with .github/tools/make_signing_key.py)
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::ANDROID_KEYSTORE_B64 and ANDROID_KEYSTORE_PASSWORD must both be in the repository's secrets"; exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Build APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          URTV_BRANCH: ${{ github.ref_name }}   # the screensaver fetches its page from the branch it was built from
          URTV_PIN_RECOVERY: ${{ secrets.PIN_RECOVERY_RECORD }}   # the PIN recovery code's salted record, never the code; unset = none (AGENTS.md)
        run: gradle -p android assembleRelease --no-daemon

      - name: Rename
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk urtv-screensaver.apk
          cp android/launcher/build/outputs/apk/release/launcher-release.apk urtv-home.apk
          echo "3.${{ github.run_number }}" > version.txt   # EXACTLY "3.<run>": every app that ever shipped (3.142 and after) reads the newest build from here, whatever the apps are called now; /releases/latest ends in apk-latest, not in a number

      # apksigner, not keytool: the home APK has no v1 (JAR) signature, so keytool sees no signer in it
      - name: Which key signed them
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for f in urtv-screensaver.apk urtv-home.apk; do
            echo "$f:"; "$apksigner" verify --print-certs "$f" | grep -m2 -E 'certificate (DN|SHA-256)'
          done

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            urtv-screensaver.apk
            urtv-home.apk

      # Play Protect test builds (work/pp-test, never merged): the home app as A (no accessibility services) and B (A, and no install/uninstall
      # permissions), the same applicationId and key, published ONLY to the apk-test pre-release; never apk-latest/apk-next, no version.txt
      - name: Play Protect test builds
        if: inputs.pp_test == 'yes' && github.ref_name == 'work/pp-test'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          URTV_BRANCH: master   # the page the home's card reads: the live one
          URTV_PIN_RECOVERY: ${{ secrets.PIN_RECOVERY_RECORD }}
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          aapt2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          for v in A B; do
            gradle -p android :launcher:assembleRelease -PppTest=$v --no-daemon
            cp android/launcher/build/outputs/apk/release/launcher-release.apk urtv-home-test-$v.apk
            "$aapt2" dump xmltree --file AndroidManifest.xml urtv-home-test-$v.apk > manifest-$v.txt
            if grep -Eq 'SleepService|TypeService' manifest-$v.txt; then echo "::error::test $v still declares an accessibility service"; exit 1; fi
            if [ $v = B ] && grep -Eq 'REQUEST_INSTALL_PACKAGES|REQUEST_DELETE_PACKAGES' manifest-$v.txt; then echo "::error::test B still asks to install or delete"; exit 1; fi
            grep -Eq 'versionName.*-test-'$v manifest-$v.txt || { echo "::error::test $v has no -test-$v versionName"; exit 1; }
            "$apksigner" verify --print-certs urtv-home-test-$v.apk | grep -m2 -E 'certificate (DN|SHA-256)'
            sha256sum urtv-home-test-$v.apk | tee urtv-home-test-$v.apk.sha256
            grep -E 'uses-permission|android:name\(.*(Service|Receiver)' manifest-$v.txt | sed 's/^ *//' | sort | uniq | head -80
          done

      - name: Publish the test builds to apk-test (a pre-release, nothing else)
        if: inputs.pp_test == 'yes' && github.ref_name == 'work/pp-test'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-test
          target_commitish: ${{ github.sha }}
          name: Play Protect test builds (not for general use)
          body: "Home app ${{ steps.ver.outputs.name }}-test-A and -test-B (build ${{ github.run_number }}), built from work/pp-test at ${{ github.sha }} with the release key. A: without the two accessibility services; B: also without installing or uninstalling other apps. For one test only; the normal update replaces them."
          fail_on_unmatched_files: true
          files: |
            urtv-home-test-A.apk
            urtv-home-test-A.apk.sha256
            urtv-home-test-B.apk
            urtv-home-test-B.apk.sha256
          prerelease: true
          make_latest: false

      # fixed download links: .../releases/download/apk-latest/urtv-screensaver.apk and urtv-home.apk
      - name: Publish to the apk-latest release
        if: github.ref_name == 'master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Latest APKs
          body: "Both apps at version ${{ steps.ver.outputs.name }} (build ${{ github.run_number }}), built from ${{ github.sha }}"
          fail_on_unmatched_files: true   # a name that matches nothing (a typo) must stop the publish, not publish without it
          files: |
            urtv-screensaver.apk
            urtv-home.apk
            version.txt
          make_latest: true

      # and every build kept under its own tag (v4.0.N: the version and the build, only in the URL; the release is titled «UrTV 4.0», the build is in the body): APK_TAG=v4.0.N optimize/install.sh all (the older ones are v3.N)
      - name: Publish to the numbered release
        if: github.ref_name == 'master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}.${{ github.run_number }}
          name: UrTV ${{ steps.ver.outputs.name }}
          body: "Both apps at version ${{ steps.ver.outputs.name }} (build ${{ github.run_number }}), built from ${{ github.sha }}"
          fail_on_unmatched_files: true   # a name that matches nothing (a typo) must stop the publish, not publish without it
          files: |
            urtv-screensaver.apk
            urtv-home.apk
          make_latest: false

      # next: one test release, replaced by each build; install with APK_TAG=apk-next optimize/install.sh all
      # version.txt is what «تحديث تلفزيوني» reads on the test channel (optimize/saver.sh updatechannel next)
      - name: Publish to the apk-next test release
        if: github.ref_name == 'next'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-next
          name: Test build from next
          body: "Both apps at version ${{ steps.ver.outputs.name }} (build ${{ github.run_number }}), built from next at ${{ github.sha }}. For testing only."
          fail_on_unmatched_files: true   # a name that matches nothing (a typo) must stop the publish, not publish without it
          files: |
            urtv-screensaver.apk
            urtv-home.apk
            version.txt
          prerelease: true
          make_latest: false
