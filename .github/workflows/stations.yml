name: Stations

# UrTV's stations-check.yml: each live Quran station of the launcher's list (android/launcher/src/main/assets/quran/stations.json of
# tshi-dev/UrTV at APP_REF) probed with ffprobe and 30 s of audio read with ffmpeg; the table and the candidates' report (stations/).
# UrTV ran it when the list changed; here, weekly (Mondays 05:17, a push to UrTV cannot start a workflow of this repository) and by hand.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: write

env:
  APP_REF: master

concurrency:
  group: stations
  cancel-in-progress: false

jobs:
  stations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CANDIDATES: >-
        https://stream.radiojar.com/0tpy1h0kxtzuv
        https://cdn.mp3quran.net/audio/badr-turki/r1/001.mp3
        https://cdn.mp3quran.net/audio/muhammad-ayyub/r1/001.mp3
        https://radio.xecod.com/station/quran-cairo
        https://radio.xecod.com/listen/quran-cairo
    steps:
      - uses: actions/checkout@v4
      - run: tools/inputs.sh android/launcher/src/main/assets/quran/stations.json
      - run: python3 -u .github/tools/find_streams.py || true
      - run: sudo timeout 600 apt-get update -qq && sudo timeout 600 apt-get install -y -qq ffmpeg
        timeout-minutes: 12
      - run: python3 -u .github/tools/aloula_probe.py || true
      - run: python3 -u .github/tools/check_stations.py $CANDIDATES
      - name: Publish stations
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 tools/publish.py --put stations:stations -m "Live stations check"
