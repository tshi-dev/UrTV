name: Check the live stations

# Does every live station of assets/quran/stations.json still play (.github/tools/check_stations.py)? The stream hosts are unreachable from the
# dev container; CI probes each with ffprobe, reads 30 s of audio with ffmpeg, and pushes the table to the data-stations branch (one commit,
# replaced each run). The addresses in CANDIDATES are possible replacements, checked the same way. Run by hand, or when the stations change.
on:
  workflow_dispatch:
  push:
    branches: [master, next, 'work/**']
    paths:
      - 'android/launcher/src/main/assets/quran/stations.json'
      - '.github/tools/check_stations.py'
      - '.github/workflows/stations-check.yml'
      - '.github/tools/find_streams.py'

permissions:
  contents: write

concurrency:
  group: stations-check
  cancel-in-progress: false

jobs:
  stations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CANDIDATES: >-
        https://stream.radiojar.com/0tpy1h0kxtzuv
    steps:
      - uses: actions/checkout@v4
      - run: python3 -u .github/tools/find_streams.py || true   # a report of candidates (radio-browser, mp3quran), nothing changed
      - run: sudo timeout 600 apt-get update -qq && sudo timeout 600 apt-get install -y -qq ffmpeg   # a stuck mirror once held a run for 30 min
        timeout-minutes: 12
      - run: python3 -u .github/tools/check_stations.py $CANDIDATES
      - name: Push to data-stations
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan data-stations
          git rm -rfq --cached .
          git add -f stations
          git commit -qm "Live stations check"
          git push -f origin data-stations
