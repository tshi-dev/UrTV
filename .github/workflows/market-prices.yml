name: Market prices

# The last price of every market and stock the screen offers (.github/tools/market_prices.py), one small JSON pushed to the
# branch data-markets, which the page reads first from raw.githubusercontent.com. Every 15 minutes while an exchange is open
# (Tadawul Sun-Thu 10:00-15:00 Riyadh = 07:00-12:00 UTC; the US 09:30-16:00 New York time = 13:30-20:00 UTC in summer time,
# 14:30-21:00 in winter, so the timer covers 13:00-21:00 UTC and the script decides what is open), and every 30 minutes
# otherwise, for gold, silver, Brent, Bitcoin and XRP, which are checked each run. GitHub delays timers on busy hours; the data is that much older.
# A public repository's standard runners are free; each run takes about a minute: about 2,600 minutes a month (see the report).
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 7-11 * * 0-4'
    - cron: '0 12 * * 0-4'
    - cron: '*/15 13-20 * * 1-5'
    - cron: '0 21 * * 1-5'
    - cron: '7,37 * * * *'
  push:
    branches: [master, next]
    paths:
      - '.github/tools/market_prices.py'
      - '.github/workflows/market-prices.yml'

permissions:
  contents: write

concurrency:
  group: market-prices
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: The file of the last run, kept for a symbol that fails this time
        run: |
          mkdir -p prev
          git fetch --depth=1 origin data-markets 2>/dev/null && git archive FETCH_HEAD | tar -x -C prev || true
      - id: run
        run: python3 -u .github/tools/market_prices.py
        env:
          MARKETS_PREV: prev/markets
      - name: Push to data-markets
        if: steps.run.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan data-markets
          git rm -rfq --cached .
          git add -f markets
          git commit -qm "Market prices"
          git push -f origin data-markets
