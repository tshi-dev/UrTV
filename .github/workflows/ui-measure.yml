name: UI measure

# docs/ui/STUDY.md's audit: what the person sees when the home changes look (preset, background, apps' way, clock, layout), measured on an Android TV
# emulator with screenrecord: the time to the new look, blank or flash frames, the frames in between, whether the home was recreated, the focus.
# Runs on a push to work/45-ui-measure* only (and by hand); never blocks anything. The videos, sheets and report are the run's artifact.
on:
  push:
    branches: ['work/45-ui-measure*']
    paths: ['.github/ui/**', '.github/workflows/ui-measure.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-measure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tshi-dev/urtv-fonts
          token: ${{ secrets.FONTS_TOKEN }}
          path: .fonts-private
      - name: Private fonts
        run: |
          cp .fonts-private/web/*.woff2 assets/fonts/
          mkdir -p android/launcher/src/main/assets/fonts
          cp .fonts-private/android/*.otf android/launcher/src/main/assets/fonts/
          rm -rf .fonts-private
      - name: Build the page
        run: python3 src/build.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APKs
        run: gradle -p android assembleDebug --no-daemon
      - name: Stub apps for the favourites
        run: |
          pip install pillow numpy
          bash .github/screens/make_stubs.sh stubs 8
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # animations ON: the transitions are what is measured
      - name: Record the switches on an Android TV emulator
        timeout-minutes: 55
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash .github/ui/measure.sh android/app/build/outputs/apk/debug/app-debug.apk android/launcher/build/outputs/apk/debug/launcher-debug.apk ui-out
      - name: Read the frames
        if: always()
        run: |
          sudo timeout 600 apt-get update -qq && sudo timeout 600 apt-get install -y -qq ffmpeg
          python3 .github/ui/frames.py ui-out | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-measure
          path: ui-out
