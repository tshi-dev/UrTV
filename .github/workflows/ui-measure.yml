name: UI measure

# docs/ui/STUDY.md's audit: what the person sees when the home changes look (preset, background, apps' way, clock, layout), measured on an Android TV
# emulator with screenrecord: the time to the new look, blank or flash frames, the frames in between, whether the home was recreated, the focus.
# Runs on a push to work/45-ui-measure* and work/45-ui (and by hand). 4.5: the owner's budgets are checked (frames.py --budget: no blank frame,
# a change from outside within 3 s, after Back settled within 1.2 s, at the emulator's scale); a case over them fails the run.
on:
  push:
    branches: ['work/45-ui-measure*', 'work/45-ui']
    paths: ['android/**', '.github/ui/**', '.github/workflows/ui-measure.yml']
  workflow_dispatch:

permissions:
  contents: write   # the pictures go to the data-ui-measure branch (never master or next)

concurrency:
  group: ui-measure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tshi-dev/urtv-fonts
          token: ${{ secrets.FONTS_TOKEN }}
          path: .fonts-private
      - name: Private fonts
        run: |
          cp .fonts-private/web/*.woff2 assets/fonts/
          mkdir -p android/launcher/src/main/assets/fonts
          cp .fonts-private/android/*.otf android/launcher/src/main/assets/fonts/
          rm -rf .fonts-private
      - name: Build the page
        run: python3 src/build.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APKs
        run: gradle -p android assembleDebug --no-daemon
      - name: Stub apps for the favourites
        run: |
          pip install pillow==13.0.0 numpy==2.3.4 imageio-ffmpeg==0.6.0
          bash .github/screens/make_stubs.sh stubs 8
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # animations ON: the transitions are what is measured
      - name: Record the switches on an Android TV emulator
        timeout-minutes: 55
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash .github/ui/measure.sh android/app/build/outputs/apk/debug/app-debug.apk android/launcher/build/outputs/apk/debug/launcher-debug.apk ui-out
      - name: Read the frames
        if: always()
        run: |
          python3 .github/ui/frames.py ui-out --budget | tee -a "$GITHUB_STEP_SUMMARY"; exit ${PIPESTATUS[0]}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-measure
          path: ui-out
      # the sheets, the last frames and the report on a data branch, so they can be read without the artifact store
      - name: Publish to data-ui-measure
        if: always()
        run: |
          set -e
          work=$(mktemp -d); run="run-${GITHUB_RUN_NUMBER}"
          git clone --quiet --depth 5 --branch data-ui-measure "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" "$work" || {
            git init --quiet "$work"; git -C "$work" checkout --quiet -b data-ui-measure
            git -C "$work" remote add origin "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"; }
          mkdir -p "$work/$run"
          cp ui-out/*-sheet.jpg ui-out/*.txt ui-out/report.* "$work/$run"/ 2>/dev/null || true
          python3 -c "import sys; from PIL import Image; [Image.open(f).convert('RGB').resize((960, 540)).save(sys.argv[1] + '/' + f.split('/')[-1][:-4] + '.jpg', quality=85) for f in sys.argv[2:]]" "$work/$run" $(ls ui-out/*-end.png ui-out/start.png ui-out/panel-*.png ui-out/settings-*.png ui-out/look-*.png ui-out/apps-*.png 2>/dev/null)
          cd "$work"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --quiet -m "UI measure run ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})" || true
          git push origin data-ui-measure
