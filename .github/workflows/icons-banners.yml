name: Icon banners (one shot)

# docs/mockups/icons: the family's TV banners carry the app's name in Thmanyah, which only CI has (the private fonts repository). This job
# draws them once with .github/tools/icons/banners.js, checks them with tests/icons_family_test.py, and commits the PNGs and the manifests to
# this branch; the same commit removes this file, so it never runs again and never reaches beta 4.
on:
  push:
    branches: ['work/44-icons']
    paths: ['.github/workflows/icons-banners.yml']

permissions:
  contents: write   # this branch only (never master or next)

concurrency:
  group: icons-banners
  cancel-in-progress: false

jobs:
  banners:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Thmanyah's licence allows its files only inside a built product: they live in the private
      # tshi-dev/urtv-fonts and are put in place here, never committed to this repository
      - uses: actions/checkout@v4
        with:
          repository: tshi-dev/urtv-fonts
          token: ${{ secrets.FONTS_TOKEN }}
          path: .fonts-private
      - name: Private fonts
        run: |
          cp .fonts-private/web/*.woff2 assets/fonts/
          rm -rf .fonts-private
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - run: pip install pillow==13.0.0
      - name: Draw the banners
        run: node .github/tools/icons/banners.js
      - name: Check them
        run: python3 tests/icons_family_test.py
      - name: Commit the banners and the manifests (and remove this one-shot job)
        run: |
          git rm -q .github/workflows/icons-banners.yml
          git checkout -- assets/fonts 2>/dev/null || true
          git add android/*/src/main/res/drawable-*/banner.png android/*/src/main/AndroidManifest.xml docs/mockups/icons/*/res/drawable-*/banner.png
          git status --short
          if git ls-files --others --exclude-standard assets/fonts | grep -q . || git diff --cached --name-only | grep -qiE 'woff|otf|ttf'; then echo '!! a font file would be committed'; exit 1; fi
          git -c user.name=tshi-dev -c user.email=272740088+tshi-dev@users.noreply.github.com commit -q -m "Icons: the family's banners in Thmanyah (drawn in CI by .github/tools/icons/banners.js), the rescue's banner no longer its stretched icon"
          git push origin HEAD:work/44-icons
