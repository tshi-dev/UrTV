name: Playback soak

# R-454 (a report: «the screen froze after a day of Quran»): the radio and a recitation play in turns for hours on an Android TV emulator, and the home's
# memory (PSS) and threads are sampled every 5 minutes (tester/soak/soak.sh); tester/soak/judge.py fails the job when either grows, the home's process
# changed (a crash, a kill) or an ANR was logged. Manual only: it takes hours (a GitHub job stops at 6 h). The samples and the verdict are the artifact.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'branch or sha to soak (the apps are built from it)'
        default: ''
      hours:
        description: 'hours of playback (2 to 5)'
        default: '4'

permissions:
  contents: read

concurrency:
  group: soak
  cancel-in-progress: false

jobs:
  soak:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      # Thmanyah comes from the private fonts repository, as in android.yml: built in, never committed
      - uses: actions/checkout@v4
        with:
          repository: tshi-dev/urtv-fonts
          token: ${{ secrets.FONTS_TOKEN }}
          path: .fonts-private
      - name: Private fonts
        run: |
          cp .fonts-private/web/*.woff2 assets/fonts/
          mkdir -p android/launcher/src/main/assets/fonts
          cp .fonts-private/android/*.otf android/launcher/src/main/assets/fonts/
          rm -rf .fonts-private

      - name: Hours
        env:
          HOURS: ${{ inputs.hours }}
        run: |
          case "$HOURS" in 2|3|4|5) ;; *) echo "!! hours must be 2 to 5"; exit 1;; esac

      - name: Build the page
        run: python3 src/build.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APKs
        env:
          URTV_BRANCH: ${{ inputs.ref || github.ref_name }}
        run: gradle -p android assembleDebug --no-daemon

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Radio and recitation for hours on an Android TV emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none
          script: bash tester/soak/soak.sh android/app/build/outputs/apk/debug/app-debug.apk android/launcher/build/outputs/apk/debug/launcher-debug.apk soak-out ${{ inputs.hours }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soak
          path: soak-out
