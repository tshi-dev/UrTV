name: Quran Radio probe

# Why station 0 (Saudi Quran Radio, SBA's HLS) stutters on the TV (.github/tools/hls_probe.py): its playlists, variants and segments, five minutes of
# live play per variant, ffmpeg on the same and on other candidate addresses. The report goes to the data-quran-probe branch (one commit, replaced).
on:
  workflow_dispatch:
  push:
    branches: ['work/quran-radio']
    paths: ['.github/tools/hls_probe.py', '.github/workflows/quran-radio-probe.yml']

permissions:
  contents: write

concurrency:
  group: quran-radio-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CANDIDATES: >-
        https://stream.radiojar.com/0tpy1h0kxtzuv
        https://edge.mixlr.com/channel/rwumx
    steps:
      - uses: actions/checkout@v4
      - name: ffmpeg (the runner's own, else a static build from pip; a stuck apt mirror held the first run for 10 min)
        timeout-minutes: 8
        run: |
          if ! command -v ffmpeg > /dev/null || ! command -v ffprobe > /dev/null; then
            pip install -q static-ffmpeg && static_ffmpeg_paths > /dev/null && d=$(python3 -c "import static_ffmpeg.run as r; import os; print(os.path.dirname(r.get_or_fetch_platform_executables_else_raise()[0]))") && echo "$d" >> "$GITHUB_PATH"
          fi
      - run: python3 -u .github/tools/hls_probe.py $CANDIDATES
      - name: Push to data-quran-probe
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan data-quran-probe
          git rm -rfq --cached .
          [ -d probe ] || exit 0
          git add -f probe
          git commit -qm "Quran Radio probe"
          git push -f origin data-quran-probe
