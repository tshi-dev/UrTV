<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>League v2 mockups</title>
<!-- Mockup only (4.5 league design study). Not shipped. The real page uses Thmanyah; this file falls back to a stand-in Arabic font for the
     screenshots. Colours, sizes (1080p lengths × --u), the focus ring and the cards are #mp's own (src/template.html, «المباريات»).
     No flex gap, inset, clamp or min() in the new parts (R10, WebView 66): spacing is margins. Sample data, not real results. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=block">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html{--u:1px}
  html,body{background:#F4F2EC;font-family:'Thmanyah','IBM Plex Sans Arabic',sans-serif;overflow:hidden}
  /* #mp's light tokens, as they are */
  #root{--fi:#1B1F1D;--fs:#5E635F;--fgr:#1B8354;--fam:#8A5600;--fring:#1B8354;--fln:#E4E1D8;--fbg:#fff;--rowf:#EEF6F1;--fw:#2E9E63;--fd:#C2C5BF;--fl:var(--flo);--rln:#D9D5CA;--zeb:#F8F7F3;--mine:#EFEDE6;--dlg:#F7F6F1;--btn:#fff;--pri:#21915F;
    --veil:rgba(244,242,236,.72);--shd:rgba(40,36,24,.18);--flo:#B3261E;
    /* new: three zone colours, chosen to stay apart for the common colour-blindness types and on a washed-out TV panel */
    --z1:#1B8354;--z2:#2F6FB3;--z3:#B3261E;--sq:#E9E6DD}
  html.dark,html.dark body{background:#17181B}
  html.dark #root{--fi:#FFFFFF;--fs:#DADCE0;--fgr:#8FE0B4;--fam:#F0B35A;--fring:#8FE0B4;--fln:rgba(255,255,255,.16);--fbg:#202227;--rowf:rgba(143,224,180,.14);--fw:#1B8354;--fd:#4A4D53;--fl:var(--flo);--rln:rgba(255,255,255,.24);--zeb:rgba(255,255,255,.035);--mine:rgba(255,255,255,.08);--dlg:#1D1F24;--btn:#2A2D33;--pri:#1B8354;
    --veil:rgba(0,0,0,.66);--shd:rgba(0,0,0,.5);--flo:#FF9A8F;--z1:#5CC48E;--z2:#7FB0E8;--z3:#FF8A7E;--sq:rgba(255,255,255,.1)}
  .pg{position:fixed;top:0;right:0;bottom:0;left:0;padding:calc(var(--u)*56) calc(var(--u)*120) calc(var(--u)*56);color:var(--fi);display:flex;flex-direction:column;font-size:calc(var(--u)*28)}
  .num{unicode-bidi:isolate}

  /* ---- header: the league, the round, the next game's countdown (a fixed box: the numbers change, nothing around them moves) */
  .hd{display:flex;justify-content:space-between;align-items:flex-end}
  .hd h1{font-size:calc(var(--u)*50);font-weight:700;line-height:1.1}
  .hd .sub{color:var(--fs);font-size:calc(var(--u)*26);margin-top:calc(var(--u)*6)}
  .hd .sub b{color:var(--fi);font-weight:500}
  .nx{width:calc(var(--u)*520);text-align:left;direction:rtl}
  .nx .k{color:var(--fs);font-size:calc(var(--u)*24);text-align:left}
  .nx .v{font-size:calc(var(--u)*30);font-weight:500;text-align:left;margin-top:calc(var(--u)*4)}
  .nx .t{color:var(--fgr);font-size:calc(var(--u)*26);font-weight:500;text-align:left;margin-top:calc(var(--u)*2)}

  /* ---- the tabs: #mp-days as it is */
  .tabs{list-style:none;display:flex;border-bottom:1px solid var(--fln);margin-top:calc(var(--u)*12)}
  .tabs li{padding:calc(var(--u)*10) calc(var(--u)*24);color:var(--fs);border-bottom:calc(var(--u)*4) solid transparent;border-radius:calc(var(--u)*12) calc(var(--u)*12) 0 0;white-space:nowrap;margin-left:calc(var(--u)*8)}
  .tabs li.on{color:var(--fgr);font-weight:700;border-bottom-color:var(--fgr)}
  .tabs li.f{box-shadow:inset 0 0 0 calc(var(--u)*3) var(--fring)}
  .tabs .hint{margin-right:auto;margin-left:0;border:0;color:var(--fs);font-size:calc(var(--u)*24);align-self:center}

  .f{box-shadow:inset 0 0 0 calc(var(--u)*3) var(--fring)!important;background:var(--rowf)!important}
  .card{background:var(--fbg);border:1px solid var(--fln);border-radius:calc(var(--u)*24)}
  h2{font-size:calc(var(--u)*30);font-weight:700;margin-bottom:calc(var(--u)*12);display:flex;justify-content:space-between;align-items:baseline}
  h2 i{font-style:normal;font-weight:400;color:var(--fs);font-size:calc(var(--u)*24)}

  /* ---- the live strip: one card per game on now, the minute in the live colour, the score in the middle */
  .live{display:flex;margin-top:calc(var(--u)*16)}
  .lv{flex:1;padding:calc(var(--u)*10) calc(var(--u)*24);margin-left:calc(var(--u)*20);border-radius:calc(var(--u)*20)}
  .lv:last-child{margin-left:0}
  .lv .m{color:var(--flo);font-size:calc(var(--u)*24);font-weight:500;display:flex;justify-content:space-between}
  .lv .m i{font-style:normal;color:var(--fs);font-weight:400}
  .lv .s{flex:1;display:flex;align-items:center;justify-content:space-between;margin-right:calc(var(--u)*20)}
  .lv{display:flex;align-items:center}
  .lv .s span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:calc(var(--u)*28)}
  .lv .s span:last-child{text-align:left}
  .lv .s b{font-size:calc(var(--u)*40);font-weight:700;padding:0 calc(var(--u)*20);direction:ltr;unicode-bidi:isolate}

  .cols{flex:1;min-height:0;display:flex;margin-top:calc(var(--u)*8)}
  .cols > div + div{margin-right:calc(var(--u)*28)}

  /* ---- the table */
  .tb{list-style:none;padding:calc(var(--u)*8) calc(var(--u)*20) calc(var(--u)*18)}
  .tr{display:flex;align-items:center;height:calc(var(--u)*38);padding:0 calc(var(--u)*14);border-radius:0;position:relative}
  .tr + .tr{border-top:1px solid var(--rln)}
  .tr.zb{background:var(--zeb)}
  /* the zones (the owner, 19 Nov): no colour at all; a plain full-width line under the last place of a zone, its places and name in plain muted text at the line's start */
  .tr.zl{height:calc(var(--u)*30);border-top:0;color:var(--fs);font-size:calc(var(--u)*24);padding:0 calc(var(--u)*8)}
  .tr.zl span{white-space:nowrap;padding-left:calc(var(--u)*16)}
  .tr.zl::after{content:'';flex:1;height:1px;background:var(--fs);opacity:.6}
  .tr.zl + .tr{border-top:0}
  .tr.zl.bare{height:calc(var(--u)*12)}
  .tr.th{height:calc(var(--u)*38);color:var(--fs);font-size:calc(var(--u)*24);border-top:0}
  .tr.mine{background:var(--mine)}   /* the followed club: bold and a flat fill a step darker than the zebra, no outline (the owner) */
  .tr.mine .nm{font-weight:700}
  .tr .rk{width:calc(var(--u)*44);text-align:center;font-weight:500}
  .tr .mv{width:calc(var(--u)*52);margin-left:calc(var(--u)*12);text-align:center;font-size:inherit;white-space:nowrap}
  .mv.up{color:var(--fgr)}.mv.dn{color:var(--flo)}.mv.eq{color:var(--fs)}
  .bd{width:calc(var(--u)*34);height:calc(var(--u)*34);border-radius:50%;background:var(--sq);color:var(--fs);font-size:calc(var(--u)*24);font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 calc(var(--u)*10) 0 calc(var(--u)*12);flex:none}
  .tr .nm{flex:1;min-width:0;display:flex;align-items:baseline;white-space:nowrap}
  .tr .nm span{overflow:hidden;text-overflow:ellipsis}
  .tr .nm em{flex:none;font-style:normal;color:var(--flo);font-size:calc(var(--u)*24);font-weight:500;margin-right:calc(var(--u)*10)}
  .tr .c{width:calc(var(--u)*56);text-align:center;color:var(--fs)}
  .tr .c.w{width:calc(var(--u)*70)}
  .tr .pt{width:calc(var(--u)*64);text-align:center;font-weight:700}
  .tr .pt.ptl{color:var(--flo)}
  .tr.th .pt{font-weight:400}
  .tr .fo{width:calc(var(--u)*210);overflow:hidden;display:flex;justify-content:center;align-items:baseline;direction:ltr}
  .tr .fo.fh{direction:rtl;text-align:center;line-height:1.1;white-space:normal}
  .tr.th{height:auto;min-height:calc(var(--u)*38);padding-top:calc(var(--u)*4);padding-bottom:calc(var(--u)*4)}
  .fdot{display:inline-block;width:calc(var(--u)*6 + 8px);height:calc(var(--u)*6 + 8px);border-radius:50%;margin-left:calc(var(--u)*10);vertical-align:middle;flex:none}   /* the owner: colour only; 14 px at 1080p, 12 at 720p */
  .fdot.w{background:var(--fw)}.fdot.d{background:var(--fd)}.fdot.l{background:var(--fl)}
  /* «مربعات»: small square boxes, colour only, a little larger than the dots (16 px at 1080p, 14 at 720p), square corners, a gap */
  .fbox{display:inline-flex;align-items:center;justify-content:center;width:calc(var(--u)*6 + 10px);height:calc(var(--u)*6 + 10px);border-radius:0;font-style:normal;margin-left:calc(var(--u)*10);flex:none}
  .fbox.w{background:var(--fw)}.fbox.d{background:var(--fd)}.fbox.l{background:var(--fl)}
  /* «مربعات بحروف»: the same square boxes with ف ت خ inside; the letter at the 16 px floor at 720p in a 32 box (21 px there), five of them inside the dots' own column (210) */
  .fbox.fbl{width:calc(var(--u)*32);height:calc(var(--u)*32);margin-left:calc(var(--u)*8);color:#fff;font-size:calc(var(--u)*24);font-weight:700}
  .fbox.fbl.d{color:#1B1F1D}
  .ft .fbox{margin:calc(var(--u)*8) 0 0}

  .tr.gapr{height:calc(var(--u)*30);color:var(--fs);font-size:calc(var(--u)*24);border-top:0}
  .tr.gapr span{white-space:nowrap;padding-left:calc(var(--u)*16)}
  .tr.gapr::after{content:'';flex:1;height:1px;background:var(--fs);opacity:.6}
  .tr.gapr + .tr{border-top:0}


  /* ---- a game row (the round, the results): the day, the clubs, the time or the score */
  .gl{list-style:none;padding:calc(var(--u)*6) calc(var(--u)*10)}
  .gd{color:var(--fs);font-size:calc(var(--u)*24);padding:calc(var(--u)*8) calc(var(--u)*12) calc(var(--u)*2)}
  .gr{display:flex;align-items:center;min-height:calc(var(--u)*54);padding:0 calc(var(--u)*12);border-radius:calc(var(--u)*12)}
  .gr + .gr{border-top:1px solid var(--fln)}
  .gr .a,.gr .b{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:calc(var(--u)*26)}
  .gr .b{text-align:left}
  .gr .x{width:calc(var(--u)*104);text-align:center;font-size:calc(var(--u)*24);color:var(--fs);direction:ltr;unicode-bidi:isolate;white-space:nowrap}
  .gr .x.sc{color:var(--fi);font-weight:700;font-size:calc(var(--u)*28)}
  .gr .x.on{color:var(--flo);font-weight:700;font-size:calc(var(--u)*28)}
  .gr .x small{display:block;font-size:calc(var(--u)*24);font-weight:500;line-height:1}
  .gr .w{font-weight:700}

  /* scorers */
  .sc-l{list-style:none;padding:calc(var(--u)*6) calc(var(--u)*10)}
  .sc-r{display:flex;align-items:center;min-height:calc(var(--u)*58);padding:0 calc(var(--u)*12)}
  .sc-r + .sc-r{border-top:1px solid var(--fln)}
  .sc-r .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:calc(var(--u)*26)}
  .sc-r .n i{display:block;font-style:normal;color:var(--fs);font-size:calc(var(--u)*24)}
  .sc-r b{font-size:calc(var(--u)*30);width:calc(var(--u)*48);text-align:center}
  .more{color:var(--fgr);font-size:calc(var(--u)*24);padding:calc(var(--u)*10) calc(var(--u)*12);text-align:center}

  .legend{display:flex;align-items:center;color:var(--fs);font-size:calc(var(--u)*24);margin-top:calc(var(--u)*14)}
  .legend span{display:flex;align-items:center;margin-left:calc(var(--u)*32)}
  .legend i{width:calc(var(--u)*18);height:calc(var(--u)*18);border-radius:calc(var(--u)*4);margin-left:calc(var(--u)*10);display:inline-block}
  .keys{margin-right:auto!important;margin-left:0!important}

  /* ---- the round navigator: the whole season in one row of squares */
  .rn{margin-top:calc(var(--u)*24)}
  .rn .cap{display:flex;justify-content:space-between;align-items:baseline}
  .rn .cap b{font-size:calc(var(--u)*40);font-weight:700}
  .rn .cap span{color:var(--fs);font-size:calc(var(--u)*24)}
  .rs{list-style:none;display:flex;margin-top:calc(var(--u)*14)}
  .rs li{width:calc(var(--u)*44);height:calc(var(--u)*48);margin-left:calc(var(--u)*4.4);border-radius:calc(var(--u)*8);display:flex;align-items:center;justify-content:center;font-size:calc(var(--u)*26);color:var(--fi);flex:none}
  .rs li.pl{color:var(--fs)}
  .rs li.now{font-weight:700;color:var(--fi);font-size:calc(var(--u)*30)}
  .rs li.sel{font-weight:700;color:var(--fgr);box-shadow:inset 0 0 0 calc(var(--u)*3) var(--fring)}
  .gg{display:flex;flex-wrap:wrap;margin-top:calc(var(--u)*14);align-content:flex-start}
  .gc{width:calc((100% - var(--u)*40) / 3);margin-bottom:calc(var(--u)*10);padding:calc(var(--u)*8) calc(var(--u)*24);border-radius:calc(var(--u)*20)}
  .gc{margin-left:calc(var(--u)*20)}.gc:nth-child(3n){margin-left:0}
  .gc .d{color:var(--fs);font-size:calc(var(--u)*24);display:flex;justify-content:space-between}
  .gc .d i{font-style:normal}
  .gc .s{display:flex;align-items:center;margin-top:calc(var(--u)*6)}
  .gc .s > span{flex:1;display:flex;align-items:center;white-space:nowrap;font-size:calc(var(--u)*28)}
  .gc .s > span:last-child{flex-direction:row-reverse}
  .gc .s > span .bd{margin:0 0 0 calc(var(--u)*14)}
  .gc .s > span:last-child .bd{margin:0 calc(var(--u)*14) 0 0}
  .gc .s b{width:calc(var(--u)*130);text-align:center;font-size:calc(var(--u)*30);color:var(--fs);font-weight:500;direction:ltr;unicode-bidi:isolate}

  /* ---- the club's quick view: a sheet on the left, the table's ranks and names stay in sight */
  .veil{position:fixed;top:0;right:0;bottom:0;left:0;background:var(--veil)}
  .sheet{position:fixed;top:calc(var(--u)*36);bottom:calc(var(--u)*36);left:calc(var(--u)*72);width:calc(var(--u)*820);background:var(--dlg);border:1px solid var(--fln);border-radius:calc(var(--u)*32);
    box-shadow:0 30px 80px var(--shd);padding:calc(var(--u)*36) calc(var(--u)*44);display:flex;flex-direction:column;color:var(--fi);font-size:calc(var(--u)*28)}
  .sh-h{display:flex;align-items:center}
  .sh-h .bd{width:calc(var(--u)*96);height:calc(var(--u)*96);font-size:calc(var(--u)*40);margin:0 0 0 calc(var(--u)*28)}
  .sh-h b{display:block;font-size:calc(var(--u)*46);font-weight:700;line-height:1.15}
  .sh-h span{display:block;color:var(--fs);font-size:calc(var(--u)*26);margin-top:calc(var(--u)*4)}
  .stats{margin-top:calc(var(--u)*22);font-size:calc(var(--u)*30)}
  .stats div{display:flex;justify-content:space-between;padding:calc(var(--u)*10) 0}
  .stats div + div{border-top:1px solid var(--fln)}
  .stats b{font-weight:700}
  .stats i{font-style:normal;color:var(--fs)}
  .sh-t{font-size:calc(var(--u)*24);color:var(--fs);margin:calc(var(--u)*22) 0 calc(var(--u)*10)}
  .nxg{padding:calc(var(--u)*14) calc(var(--u)*24);display:flex;align-items:center;justify-content:space-between}
  .nxg b{font-size:calc(var(--u)*30);font-weight:500}
  .nxg span{color:var(--fgr);font-weight:500;font-size:calc(var(--u)*24);text-align:left}
  .nxg span i{display:block;font-style:normal;color:var(--fs);font-weight:400;font-size:calc(var(--u)*24)}
  .btns{display:flex;margin-top:auto}
  .btns button{flex:1;font:inherit;font-size:calc(var(--u)*26);color:var(--fi);background:var(--btn);border:1px solid var(--fln);border-radius:calc(var(--u)*16);padding:calc(var(--u)*20) calc(var(--u)*12);margin-left:calc(var(--u)*16);outline:none}
  .btns button:last-child{margin-left:0}
  .btns button.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
  .btns button.fr{box-shadow:0 0 0 calc(var(--u)*3) var(--dlg),0 0 0 calc(var(--u)*6) var(--fring)}
  .peek{color:var(--fs);font-size:calc(var(--u)*24);text-align:center;margin-top:calc(var(--u)*14)}
  /* ---- the club page (v2): a header with the badge and the place, the form tiles and the next game, then the table around it, the coming games, the titles */
  .ch{display:flex;align-items:center}
  .ch .bd{width:calc(var(--u)*104);height:calc(var(--u)*104);font-size:calc(var(--u)*44);margin:0 0 0 calc(var(--u)*28)}
  .ch h1{font-size:calc(var(--u)*56);font-weight:700;line-height:1.1}
  .ch .sub{color:var(--fs);font-size:calc(var(--u)*26);margin-top:calc(var(--u)*4)}
  .ch .sub b{color:var(--fi);font-weight:500}
  .row2{display:flex;margin-top:calc(var(--u)*22)}
  .fts{display:flex}
  .ft{width:calc(var(--u)*128);margin-left:calc(var(--u)*14);text-align:center}
  .ft b{display:block;color:var(--fi);font-size:calc(var(--u)*34);font-weight:700;unicode-bidi:isolate}   /* the audit: no fill; RTL: the club's own goals first */
  .ft .fdot{margin:calc(var(--u)*8) 0 0}

  .ft span{display:block;color:var(--fs);font-size:calc(var(--u)*24);margin-top:calc(var(--u)*6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ncard{flex:1;margin-right:calc(var(--u)*28);padding:calc(var(--u)*16) calc(var(--u)*28);display:flex;align-items:center;justify-content:space-between}
  .ncard .k{color:var(--fs);font-size:calc(var(--u)*24)}
  .ncard .v{font-size:calc(var(--u)*34);font-weight:700;margin-top:calc(var(--u)*4)}
  .ncard .t{text-align:left;color:var(--fgr);font-weight:500;font-size:calc(var(--u)*28)}
  .ncard .t i{display:block;font-style:normal;color:var(--fs);font-weight:400;font-size:calc(var(--u)*24)}
  .hon{list-style:none;padding:calc(var(--u)*6) calc(var(--u)*10)}
  .hon li{display:flex;align-items:center;justify-content:space-between;min-height:calc(var(--u)*64);padding:0 calc(var(--u)*12)}
  .hon li + li{border-top:1px solid var(--fln)}
  .hon li span{font-size:calc(var(--u)*26)}
  .hon li i{font-style:normal;color:var(--fs);font-size:calc(var(--u)*24);text-align:left}
  .hon li i b{display:block;color:var(--fi);font-weight:500;font-size:calc(var(--u)*24)}
  .src{color:var(--fs);font-size:calc(var(--u)*24);margin-top:calc(var(--u)*8)}
  .no-f{box-shadow:none!important}
  html.large .gfa{display:none}
  html.large .champcol{display:none}   /* the agreed rule: at 720p with the large font the champions card leaves the first screen (it is a tab) */
  .pg:not(.full) .tb{padding-bottom:calc(var(--u)*12)}

  .pg.full .tr{height:calc(var(--u)*38)}
  .pg.full .tr.zl{height:calc(var(--u)*28)}
  .pg.full .tr.th{height:calc(var(--u)*36)}
  .pg.full .legend{margin-top:calc(var(--u)*8)}
</style>
</head>
<body>
<div id="root"></div>
<script>
// Sample data (Roshn Saudi League 2026-27 shape: 18 clubs, 34 rounds). Not real results.
const D = s => String(s).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
const CLUBS = [
  // name, w, d, l, gf, ga, last 5 (oldest first), move since last round, zone, live minute (playing now)
  ['الهلال',9,1,1,27,9,'wwdww',0,1],['النصر',8,2,1,29,12,'wwwdw',0,1],['الاتحاد',7,2,2,22,13,'lwwdw',1,1],['القادسية',7,1,3,21,12,'wwlww',-1,2],
  ['الأهلي',6,3,2,19,11,'dwdwl',0,0],['التعاون',6,2,3,17,13,'wlwwd',2,0,"٦٧'"],['الاتفاق',5,3,3,16,14,'dlwwd',0,0],['الشباب',5,2,4,15,14,'lwdlw',-2,0,"٦٧'"],
  ['نيوم',4,4,3,14,14,'ddwlw',3,0,"٣٤'"],['الفتح',4,3,4,13,15,'wldlw',-1,0,"٣٤'"],['الخليج',4,2,5,15,18,'lwlwd',0,0],['الفيحاء',2,4,5,11,13,'ddlld',-1,0],
  ['الحزم',2,3,6,12,17,'lldwl',1,0],['الرياض',2,2,7,10,18,'llwll',-1,0],['ضمك',2,2,7,9,18,'wlldl',0,0],['الخلود',1,4,6,10,17,'dlldl',0,3],
  ['الأخدود',1,4,6,8,19,'ldlll',1,3],['النجمة',1,2,8,7,24,'llwll',-1,3]];
const MINE = 'الاتفاق';
// zones (the owner, 19 Nov): a plain 1 px line BEFORE the first place of a zone, its name in muted text at the line, so the label always
// sits above the rows it names; an unnamed line closes a zone that the next rows are not in
const ZSTART = {1: 'دوري أبطال آسيا للنخبة', 4: 'دوري أبطال آسيا ٢', 5: '', 16: 'الهبوط'};
const zl = b => ZSTART[b] ? `<li class="tr zl"><span>${ZSTART[b]}</span></li>` : '<li class="tr zl bare"></li>';
function rows(items, full, ringAt){   // items: [club, index] or 'gapN' (N hidden places, a muted line of its own)
  let last = 0, out = '';
  const bs = Object.keys(ZSTART).map(Number);
  items.forEach(x => {
    if(typeof x === 'string'){
      const n = +x.slice(3);
      bs.filter(b => b > last && b <= last + n && ZSTART[b]).forEach(b => { out += zl(b); });   // a named zone starting in the hidden stretch: above it
      out += gapRow(n); last += n; return;
    }
    const r = x[1] + 1;
    bs.filter(b => b > last && b <= r).forEach(b => { out += zl(b); });
    out += row(x[0], x[1], full, ringAt === x[1]).replace('<li class="tr', (x[1] % 2) ? '<li class="tr zb' : '<li class="tr');
    last = r;
  });
  return out.replace(/(<li class="tr zl[^"]*">(?:<span>[^<]*<\/span>)?<\/li>)+$/, '');   // never a zone line as the last thing before the card's bottom edge (the UI session)
}
const FL = {w:'ف', d:'ت', l:'خ'};
const FSTYLE = (location.hash.match(/(dots|boxletters|boxes)/) || [, 'dots'])[1];   // the setting: dots | boxes | boxes-letters
const dot = c => FSTYLE === 'boxes' ? `<i class="fbox ${c}"></i>` : FSTYLE === 'boxletters' ? `<i class="fbox fbl ${c}">${FL[c]}</i>` : `<i class="fdot ${c}"></i>`;
const form = (s, next) => '<span class="fo" style="align-items:center">' + s.split('').map(dot).join('') + '</span>';
const mv = m => m > 0 ? `<span class="mv up num">+${D(m)}</span>` : m < 0 ? `<span class="mv dn num">−${D(-m)}</span>` : '<span class="mv eq">–</span>';   // the audit: signed numbers, no arrows
const badge = n => '';   // the real crest loads at runtime (TheSportsDB); the mockups draw none, and nothing stands in for it while it loads
function row(c, i, full, ring){
  const [n, w, d, l, gf, ga, fo, m, z, live] = c, p = w + d + l, pts = w * 3 + d, gd = gf - ga;
  const cls = ['tr', n === MINE ? 'mine' : '', ring ? 'f' : ''].join(' ');
  const nm = `<span class="nm"><span>${n}</span>${live ? `<em>${full ? 'مباشر ' : ''}${live}</em>` : ''}</span>`;
  const mid = full
    ? `<span class="c">${D(p)}</span><span class="c">${D(w)}</span><span class="c">${D(d)}</span><span class="c">${D(l)}</span><span class="c gfa">${D(gf)}</span><span class="c gfa">${D(ga)}</span><span class="c w num">${gd > 0 ? '+' : ''}${D(gd)}</span>`
    : `<span class="c">${D(p)}</span><span class="c w num">${gd > 0 ? '+' : ''}${D(gd)}</span>`;
  return `<li class="${cls}"><span class="rk">${D(i + 1)}</span>${mv(m)}${badge(n)}${nm}${mid}<span class="pt${live ? ' ptl' : ''}">${D(pts)}</span>${form(fo)}</li>`;
}
const head = full => `<li class="tr th"><span class="rk">#</span><span class="mv"></span><span class="nm">النادي</span>`
  + (full ? '<span class="c">لعب</span><span class="c">فاز</span><span class="c">تعادل</span><span class="c">خسر</span><span class="c gfa">له</span><span class="c gfa">عليه</span><span class="c w">الفارق</span>' : '<span class="c">لعب</span><span class="c w">الفارق</span>')
  + '<span class="pt">نقاط</span><span class="fo fh">آخر خمس مباريات</span></li>';
const gapRow = n => `<li class="tr gapr"><span>${n === 1 ? 'نادٍ آخر' : D(n) + ' أندية أخرى'}، موافق: الجدول كاملًا</span></li>`;
const legend = extra => '<div class="legend">' + ''
  + '<span><span class="mv up" style="margin-left:6px">▲</span>عن الجولة الماضية</span>' + (extra || '') + '</div>';

const HEAD = (tab, hint) => `<div class="hd"><div><h1>دوري روشن السعودي</h1><div class="sub"><b>الجولة ١١ من ٣٤</b>  موسم ٢٠٢٦-٢٠٢٧</div></div>
  <div class="nx"><div class="k">المباراة القادمة الليلة</div><div class="v">النصر – الأهلي، ٩:٠٠ م</div><div class="t">بعد ساعة و٤٢ دقيقة</div></div></div>
  <ul class="tabs">${['الرئيسية','الترتيب','المباريات','الهدّافون','الأبطال','الأندية'].map((t, i) => `<li class="${i === tab ? 'on' : ''}">${t}</li>`).join('')}${hint ? `<li class="hint">${hint}</li>` : ''}</ul>`;

const LIVE = [['الشباب','١ : ١','التعاون',"٦٧'",'الشوط الثاني'],['الفتح','٠ : ٢','نيوم',"٣٤'",'الشوط الأول']];
function gr(a, x, b, kind, small){
  const win = kind === 'sc' && x.split(':').map(s => s.trim());
  return `<li class="gr"><span class="a">${a}</span><span class="x ${kind || ''}">${x}${small ? (/^DOT/.test(small) ? `<small>${dot(small[3])}</small>` : `<small>${small}</small>`) : ''}</span><span class="b">${b}</span></li>`;
}
const SCORERS = [['كريستيانو رونالدو','النصر',11],['ماركوس ليوناردو','الهلال',9],['كريم بنزيما','الاتحاد',8],['إيفان توني','الأهلي',8]];

const SCREENS = {
  clubpage(){
    const t = CLUBS.map((c, i) => [c, i]), me = 1;   // النصر, 2nd
    const tiles = [['٢ : ٠','w','الخليج'],['١ : ١','d','الأهلي'],['٣ : ١','w','الفتح'],['٢ : ٠','w','ضمك'],['٤ : ٠','w','الرياض']];   // oldest first; newest on the right, next to the next game
    return `<div class="pg">
      <div class="hd"><div class="ch">${badge('النصر').replace('class="bd"', 'class="bd"')}<div><h1>النصر</h1><div class="sub"><b>الثاني في دوري روشن السعودي</b>  ٢٦ نقطة من ١١ مباراة</div></div></div>
        <div class="nx"><div class="k">آخر بطولة</div><div class="v">دوري روشن ٢٠٢٥-٢٠٢٦</div></div></div>
      <ul class="tabs"><li class="on">النادي</li><li>المباريات</li><li>النتائج</li><li>البطولات</li><li>المواجهات</li><li>أزل النصر من فرقي</li><li class="hint">موافق يفتح، يمين ويسار بين الأقسام</li></ul>
      <div class="row2">
        <div><h2>آخر خمس مباريات <i>الأحدث يمينًا</i></h2><div class="fts">${tiles.reverse().map(x => `<div class="ft"><b>${x[0]}</b><span>${x[2]}</span>${dot(x[1])}</div>`).join('')}</div></div>
        <div class="ncard card"><div><div class="k">المباراة القادمة، الجولة ١١</div><div class="v">النصر – الأهلي</div></div><div class="t">الليلة ٩:٠٠ م<i>بعد ساعة و٤٢ دقيقة</i></div></div>
      </div>
      <div class="cols">
        <div style="width:calc(var(--u)*760)"><h2>في الترتيب <i>موافق: الجدول كاملًا</i></h2>
          <ul class="tb card">${head(false)}${rows(t.slice(0, 6), false, me)}</ul></div>
        <div style="width:calc(var(--u)*470)"><h2>المباريات القادمة</h2>
          <ul class="gl card"><li class="gd">الجولة ١١، السبت ٢١ نوفمبر</li>${gr('النصر','٩:٠٠ م','الأهلي')}<li class="gd">الجولة ١٢، الجمعة ٢٨ نوفمبر</li>${gr('القادسية','٨:٠٠ م','النصر')}
            <li class="gd">الجولة ١٣، الخميس ٤ ديسمبر</li>${gr('النصر','٨:٣٠ م','الخلود')}<li class="gd">دوري أبطال آسيا للنخبة، الثلاثاء ٩ ديسمبر</li>${gr('الغرافة','٧:٠٠ م','النصر')}</ul></div>
        <div style="flex:1;min-width:0"><h2>البطولات</h2>
          <ul class="hon card"><li><span>دوري روشن</span><i>آخرها <b style="display:inline">٢٠٢٥-٢٠٢٦</b></i></li><li><span>كأس الملك</span><i>آخرها <b style="display:inline">٢٠٢٢-٢٠٢٣</b></i></li>
            <li><span>هدّاف الدوري</span><i>٢٠٢٥-٢٠٢٦: <b style="display:inline">رونالدو</b></i></li></ul>
          <div class="src">ما نعرف موسمه فقط، من ويكي بيانات ونتائج المباريات</div></div>
      </div></div>`;
  },
  home(){
    const t = CLUBS.map((c, i) => [c, i]);
    const pick = [...t.slice(0, 4), 'gap1', t[5], t[6], t[7], 'gap7', ...t.slice(15)];
    return `<div class="pg">${HEAD(0, 'موافق يفتح، يمين ويسار بين الأقسام')}
      <div class="live">${LIVE.map((g, i) => `<div class="lv card${i === 0 ? ' f' : ''}"><div class="m"><span>مباشر ${g[3]}</span></div><div class="s"><span>${g[0]}</span><b>${g[1]}</b><span>${g[2]}</span></div></div>`).join('')}
        <div class="lv card"><div class="m" style="color:var(--fs)"><span>انتهت</span></div><div class="s"><span>الخليج</span><b style="color:var(--fi)">٢ : ٢</b><span>الفيحاء</span></div></div></div>
      <div class="cols">
        <div style="width:calc(var(--u)*800)"><h2>الترتيب <i>مباشر: يتغير مع النتائج</i></h2>
          <ul class="tb card">${head(false)}${rows(pick, false, -1)}</ul></div>
        <div style="width:calc(var(--u)*470)"><h2>الجولة ١١ <i>يمين ويسار: الجولات</i></h2>
          <ul class="gl card"><li class="gd">اليوم، السبت ٢١ نوفمبر</li>
            ${gr('الشباب','١ : ١','التعاون','on',"٦٧'")}${gr('الفتح','٠ : ٢','نيوم','on',"٣٤'")}${gr('النصر','٩:٠٠ م','الأهلي')}
            <li class="gd">غدًا، الأحد ٢٢ نوفمبر</li>${gr('الاتفاق','٦:٠٠ م','الرياض')}${gr('الأخدود','٨:٣٠ م','الخلود')}
            <li class="gd">أمس، الجمعة ٢٠ نوفمبر</li>${gr('الهلال','٣ : ١','الحزم','sc')}${gr('ضمك','٠ : ١','القادسية','sc')}</ul></div>
        <div class="champcol" style="flex:1;min-width:0"><h2>الأبطال</h2>
          <ul class="hon card"><li><span>٢٠٢٥-٢٠٢٦: النصر</span></li><li><span>٢٠٢٤-٢٠٢٥: الاتحاد</span></li><li><span>٢٠٢٣-٢٠٢٤: الهلال</span></li><li class="more" style="justify-content:center">كل الأبطال</li></ul>
          <h2 style="margin-top:calc(var(--u)*22)">هدّاف الموسم الماضي</h2>
          <ul class="hon card"><li style="flex-direction:column;align-items:flex-start;justify-content:center;padding:calc(var(--u)*8) calc(var(--u)*12)"><span>٢٠٢٥-٢٠٢٦: رونالدو</span><i>النصر، ٢٥ هدفًا</i></li></ul></div>
      </div></div>`;
  },
  rounds(){
    const R = 12, now = 11;
    const games = [['الخميس ٢٧ نوفمبر','٦:٠٠ م','الخلود','الفتح'],['الخميس ٢٧ نوفمبر','٨:٣٠ م','الاتحاد','الشباب'],['الجمعة ٢٨ نوفمبر','٥:٤٠ م','الفيحاء','ضمك'],
      ['الجمعة ٢٨ نوفمبر','٨:٠٠ م','القادسية','النصر'],['الجمعة ٢٨ نوفمبر','٨:٠٠ م','نيوم','الخليج'],['السبت ٢٩ نوفمبر','٥:٤٠ م','الرياض','الأخدود'],
      ['السبت ٢٩ نوفمبر','٦:٠٠ م','الحزم','الاتفاق'],['السبت ٢٩ نوفمبر','٨:٣٠ م','الأهلي','الهلال'],['السبت ٢٩ نوفمبر','٩:٠٠ م','النجمة','التعاون']];
    return `<div class="pg">${HEAD(2, 'يمين ويسار: جولة قبل وبعد')}
      <div class="rn"><div class="cap"><b>الجولة ${D(R)}</b><span>من الخميس ٢٧ إلى السبت ٢٩ نوفمبر، ٩ مباريات، بعد ٦ أيام</span></div>
        <ul class="rs">${Array.from({length: 34}, (_, i) => i + 1).map(n => `<li class="${n < now ? 'pl' : ''}${n === now ? ' now' : ''}${n === R ? ' sel' : ''}">${D(n)}</li>`).join('')}</ul>
        <div class="legend" style="margin-top:calc(var(--u)*10)"><span>الباهتة لُعبت، والعريضة الجارية الآن</span><span class="keys">أسفل: المباريات، موافق على مباراة: بطاقتها</span></div></div>
      <div class="gg">${games.map((g, i) => `<div class="gc card"><div class="d"><span>${g[0]}</span><i>${i === 7 ? 'قمة الجولة' : ''}</i></div>
        <div class="s"><span>${badge(g[2])}${g[2]}</span><b>${g[1]}</b><span>${badge(g[3])}${g[3]}</span></div></div>`).join('')}</div></div>`;
  },
  table(ring){
    // focused: the page's header and tabs step aside (Back brings them back), the 18 rows fit on one screen without a scroll
    return `<div class="pg full"><div class="hd" style="align-items:flex-end;border-bottom:1px solid var(--fln)"><h1 style="font-size:calc(var(--u)*40);margin-bottom:calc(var(--u)*8)">الترتيب <span style="font-weight:400;color:var(--fs);font-size:calc(var(--u)*26)">بعد الجولة ١٠</span></h1>
      <ul class="tabs" style="margin:0 calc(var(--u)*40) 0 auto;border:0">${['الكل','على أرضه','خارج أرضه','قبل المباريات الجارية'].map((t, i) => `<li class="${i === 0 ? 'on' : ''}" style="font-size:calc(var(--u)*24)">${t}</li>`).join('')}</ul><span style="color:var(--fs);font-size:calc(var(--u)*24);margin-bottom:calc(var(--u)*12)">موافق: نظرة سريعة</span></div>
      <ul class="tb card" style="margin-top:calc(var(--u)*10)">${head(true)}${rows(CLUBS.map((c, i) => [c, i]), true, ring || 6)}</ul></div>`;
  },
  club(){
    return SCREENS.table(6) + `<div class="veil"></div><div class="sheet">
      <div class="sh-h">${badge('الاتفاق')}<div><b>الاتفاق</b><span>المركز ٧، ١٨ نقطة، لعب ١١</span></div></div>
      <div class="stats"><div><span><i>فاز</i> <b class="num">٥</b>، <i>تعادل</i> <b class="num">٣</b>، <i>خسر</i> <b class="num">٣</b>، <i>له</i> <b class="num">١٦</b>، <i>عليه</i> <b class="num">١٤</b></span></div></div>
      <div class="sh-t">المباراة القادمة</div>
      <div class="nxg card"><b>الاتفاق – الرياض</b><span>غدًا ٦:٠٠ م<i>الجولة ١١، بعد يوم و٣ ساعات</i></span></div>
      <div class="sh-t">آخر النتائج</div>
      <ul class="gl card">${gr('الاتفاق','٢ : ٠','الحزم','sc','DOTw')}${gr('الشباب','١ : ١','الاتفاق','sc','DOTd')}${gr('الاتفاق','٣ : ١','الفيحاء','sc','DOTw')}</ul>
      <div class="btns" style="margin-top:calc(var(--u)*22)"><button class="pri fr">صفحة النادي</button><button>المواجهات</button><button>أزل من فرقي</button></div>
      <div class="peek">أعلى وأسفل: النادي الذي فوقه وتحته، رجوع: الجدول</div></div>`;
  }
};
const scr = (location.hash.slice(1) || 'home').split(',');
if(scr.includes('dark')) document.documentElement.classList.add('dark');
// #…,large: Android's large font (×1.15) shown as the whole page ×1.15 (an over-estimate: the real setting grows the text, not the gaps);
// the full table then drops «له / عليه» first (the UI session), and scrolls with the ring when it still does not fit
if(scr.includes('large')) document.documentElement.classList.add('large');
document.documentElement.style.setProperty('--u', (innerWidth / 1920 * (scr.includes('large') ? 1.15 : 1)) + 'px');
document.getElementById('root').innerHTML = SCREENS[scr[0]]();
</script>
</body>
</html>
