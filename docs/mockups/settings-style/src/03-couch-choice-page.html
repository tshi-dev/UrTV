<!doctype html><html lang="ar"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>body{background:radial-gradient(ellipse at 80% 0%,#3b2a1b,#0c0b0b 65%);padding:60px 80px}
.side{position:absolute;right:80px;top:60px;width:560px}.side h1{font-size:54px;margin-bottom:26px}.sec{font-size:30px;padding:14px 22px;border-radius:14px;margin-bottom:6px}.sec.on{background:rgba(255,255,255,.13)}
.main{position:absolute;left:80px;top:60px;width:1150px}.crumb{font-size:22px;color:var(--dim)}.main h2{font-size:48px;margin:6px 0 24px}
.r{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.08);border-radius:14px;padding:22px 26px;font-size:28px;margin-bottom:10px}
.r small{display:block;font-size:21px;color:var(--dim);margin-top:4px}.r.f{background:#fff;color:#111}.r.f small{color:#555}.tick{font-size:30px;color:var(--green)}.r.f .tick{color:#1a8f3c}
.note{position:absolute;left:80px;bottom:56px;width:1150px;font-size:23px;color:var(--gold);line-height:1.6}</style></head><body>
<div class="side"><h1>الإعدادات</h1><div class="sec">اللغة</div><div class="sec">الموقع والطقس</div><div class="sec on">المظهر</div><div class="sec">التطبيقات</div></div>
<div class="main"><div class="crumb">المظهر</div><h2>شكل شاشة الإعدادات</h2>
 <div class="r"><span>أزرار<small>أقسام كبيرة بأزرار، كما في ٤٫٣</small></span><span class="tick"></span></div>
 <div class="r f"><span>كنبة<small>قائمة جانبية وصفوف مضغوطة</small></span><span class="tick">✓</span></div>
</div>
<div class="note">الاختيار يفتح الإعدادات من جديد بالشكل الآخر، والتركيز على نفس الصف. خيار ثالث «tvOS» يُضاف هنا بعد ما يُعتمد تصميمه ويُبنى، وقبلها لا يظهر.</div>
</body></html>
