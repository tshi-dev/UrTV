<div class="box"><h1>إعداد تلفزيوني</h1>
<p>نجهّز تلفزيونك بنفسه، بدون كمبيوتر.</p>
<p class="small" style="margin-top:22px">قبل أي تغيير نقول لك وش بنسوي.</p>
<div class="actions"><div class="btn f">جهّز كل شي</div><div class="btn quiet">English</div></div></div>
<div class="cap">البداية: سطر واحد وزر واحد. اللغة زر هادئ. لو فيه إعداد ما كمل: «جهّز كل شي» يكمّله (سطر واحد يقول هذا بدل الثاني).</div>
