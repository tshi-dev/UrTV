<!doctype html><html lang="ar"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
.bg{filter:brightness(.7)}
.clock{position:absolute;top:70px;left:0;right:0;text-align:center;font-size:260px;font-weight:600;line-height:1}
.date{position:absolute;top:350px;left:0;right:0;text-align:center;font-size:48px;color:var(--fg)}
.next{position:absolute;top:426px;left:0;right:0;text-align:center;font-size:40px;color:var(--gold)}
.apps{position:absolute;left:0;right:0;bottom:120px;display:flex;gap:48px;justify-content:center}
.app{width:440px;height:250px;border-radius:30px;background:#f6f5f2;color:#151515;display:grid;place-items:center;font-size:60px;font-weight:700;box-shadow:0 10px 28px rgba(0,0,0,.28)}
.app.f{transform:scale(1.08);box-shadow:0 30px 70px rgba(0,0,0,.6)}
.app.q{background:#203328;color:#f4f2ee}.app.tv{background:#2a2219;color:#e8c46a}
</style></head><body>
<div class="bg"></div><div class="shade"></div>
<div class="clock">٨:٤٥</div>
<div class="date">السبت ١٨ جمادى الآخرة</div>
<div class="next">العشاء بعد ٢٠ دقيقة</div>
<div class="apps"><div class="app tv f">تلفزيونك</div><div class="app q">القرآن</div><div class="app">YouTube</div></div>
<div class="cap">«بسيط»: خط كبير، ثلاث تطبيقات، والصلاة الجاية سطر واحد.</div>
</body></html>
