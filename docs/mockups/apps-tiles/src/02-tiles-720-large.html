<!doctype html><html lang=ar><head><meta charset=utf-8><style>@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}html,body{width:1280px;height:720px;overflow:hidden;font-family:'IBM Plex Sans Arabic';direction:rtl;color:#f4f2ee;

.lite{background:#ECE9E3}
.f{transform:scale(1.12);outline:4px solid #fff;outline-offset:4px;box-shadow:0 18px 40px rgba(0,0,0,.5);z-index:2}
.cap{position:absolute;right:56px;font-size:26px;font-weight:600}.sub{position:absolute;right:56px;font-size:20px;color:rgba(244,242,238,.7)}
.name{position:absolute;left:0;right:0;text-align:center;font-size:26px;font-weight:600}
.note{position:absolute;right:56px;left:56px;bottom:22px;font-size:20px;color:#e8c46a;line-height:1.6}
