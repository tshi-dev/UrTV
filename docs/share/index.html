<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UrTV · أرسل الملخص</title>
<!-- Opened from the QR code optimize/share.sh shows: the summary travels in the address after #, so it never
     reaches a server until the owner presses «أرسل»: then it goes to the author's Google Form (anonymous, no
     account), a row in the author's sheet. -->
<style>
  :root { --bg: #f6f4ef; --card: #fff; --ink: #1c1b19; --muted: #6b665d; --line: #e4dfd5; --accent: #0f6b4f; --on-accent: #fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151513; --card: #1f1e1b; --ink: #f1eee7; --muted: #a9a398; --line: #34322d; --accent: #3fae86; --on-accent: #0c1712; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }   /* .go sets display: block, which would beat it */
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; }
  main { max-width: 34rem; margin: 0 auto; padding: 24px 16px 40px; }
  h1 { font-size: 1.35rem; margin: 0 0 .25rem; }
  p { margin: .25rem 0 1rem; color: var(--muted); }
  button.go { width: 100%; border: 0; cursor: pointer; font-family: inherit; }
  button.go:disabled { opacity: .6; }
  .go { display: block; text-align: center; text-decoration: none; background: var(--accent); color: var(--on-accent);
        font-weight: 700; font-size: 1.1rem; padding: 16px; border-radius: 14px; }
  .done { text-align: center; color: var(--accent); font-weight: 600; min-height: 1.6em; margin: .6rem 0 1rem; }
  pre { direction: ltr; text-align: left; white-space: pre-wrap; word-break: break-word; background: var(--card);
        border: 1px solid var(--line); border-radius: 12px; padding: 14px; font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; margin: 0; }
  .empty { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  label { display: block; font-weight: 600; margin: 0 0 .4rem; }
  textarea { width: 100%; min-height: 6.5rem; background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 12px;
             padding: 12px; font: inherit; resize: vertical; margin: 0 0 .3rem; }
  .hint { font-size: .9rem; margin: 0 0 1rem; }
</style>
</head>
<body>
<main>
  <h1>ملخص تركيب تلفزيونك</h1>
  <p>شكراً إنك تشاركه: يساعد صاحب المشروع يحسّن التركيب للكل. ما فيه أي شي شخصي.</p>
  <div id="ready" hidden>
    <!-- 4.3 B10: the report says what happened in the owner's own words (required): a summary alone does not say what went wrong -->
    <label for="words" id="words-label">وش صار؟ اكتب المشكلة بكلماتك</label>
    <textarea id="words" maxlength="500" placeholder="مثال: الأذان ما اشتغل الفجر، أو الفلاشة ما تنقرى"></textarea>
    <p class="hint" id="words-hint">مطلوب: سطر واحد يكفي. لا تكتب كلمة سر الواي فاي أو رقم جوالك.</p>
    <button class="go" id="send" type="button" disabled>أرسل</button>
    <div class="done" id="done" role="status"></div>
    <pre id="text"></pre>
  </div>
  <div class="empty" id="none" hidden>ما وصل ملخص مع الرابط. امسح الكود اللي على شاشة الكمبيوتر مرة ثانية.</div>
</main>
<script>
  // the author's Google Form: its id, and its one question's (the same in optimize/share.py)
  var FORM_ID = "1FAIpQLSfDJFfy1NgiB-ZMXoBI29n_KTdYnGadn1-iOqXJOxaQJEr-ZQ", FORM_FIELD = "1457112794";
  var text = "";
  // the # holds the text packed («z.» + raw deflate in base64url: the app's SetupReport.pack, share.py's pack) or, from older apps, quoted
  function unpack(hash) {
    if (hash.indexOf("z.") !== 0) return Promise.resolve(decodeURIComponent(hash));
    var b64 = hash.slice(2).replace(/-/g, "+").replace(/_/g, "/");
    while (b64.length % 4) b64 += "=";
    var bin = atob(b64), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    return new Response(stream).text();
  }
  var MIN_WORDS = 5;
  // the owner's words already came with the summary (optimize/share.sh --owner): then the box is optional
  function hasOwner(t) { var i = t.indexOf("From the owner:"); return i >= 0 && t.slice(i + 15).replace(/^\s+/, "").split("\n")[0].trim().length >= MIN_WORDS; }
  // «UrTV Player feature request, …»: a request, not a problem; the Player sends no words of its own, so the person types theirs (the same minimum as a problem's)
  function isRequest(t) { return /^UrTV Player feature request, /.test(t); }
  function words() { return document.getElementById("words").value.replace(/\s+/g, " ").trim(); }
  function ready() { document.getElementById("send").disabled = !(hasOwner(text) || words().length >= MIN_WORDS); }
  function show(t) {
    text = t || "";
    if (text) {
      document.getElementById("text").textContent = text;
      document.getElementById("ready").hidden = false;
      if (isRequest(text) && !hasOwner(text)) {
        document.getElementById("words-label").textContent = "وش تبي نضيف أو نغيّر؟ اكتب طلبك بكلماتك";
        document.getElementById("words").placeholder = "مثال: أبي أقدر أبدّل الصوت من الجوال";
      }
      if (hasOwner(text)) { document.getElementById("words-label").textContent = "تبي تضيف شي؟ (اختياري)"; document.getElementById("words-hint").textContent = "كلامك وصل مع الملخص."; }
      document.getElementById("words").addEventListener("input", ready);
      ready();
    } else {
      document.getElementById("none").hidden = false;
    }
  }
  try { unpack(location.hash.slice(1)).then(show, function () { show(""); }); } catch (e) { show(""); }
  document.getElementById("send").addEventListener("click", function () {
    var button = this, done = document.getElementById("done");
    if (!hasOwner(text) && words().length < MIN_WORDS) { done.textContent = isRequest(text) ? "اكتب طلبك أولاً" : "اكتب وش صار أولاً"; return; }
    button.disabled = true;
    var w = words();
    done.textContent = "يرسل…";
    var body = new URLSearchParams();
    body.append("entry." + FORM_FIELD, w ? text.replace(/\n*$/, "") + "\n\nFrom the owner:\n" + w.slice(0, 500) + "\n" : text);
    // Google answers without CORS headers: the reply can't be read, but a network failure still shows up
    fetch("https://docs.google.com/forms/d/e/" + FORM_ID + "/formResponse", { method: "POST", mode: "no-cors", body: body })
      .then(function () { done.textContent = "تم الإرسال ✓ شكراً لك"; button.hidden = true; })
      .catch(function () { done.textContent = "ما انرسل: تأكد من الإنترنت وجرّب مرة ثانية"; button.disabled = false; });
  });
</script>
</body>
</html>
