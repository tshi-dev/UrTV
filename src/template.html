<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- the build: UTC time (YYYYMMDDHHMMSS) of the newest commit of the page's sources, put in by src/build.py. The app loads the page with the newer stamp (its own
     copy or a downloaded one), never by file time, and does not keep a download whose stamp is older than its own (Updater, PageStamp). -->
<meta name="urtv-build" content="__BUILD__">
<title>شاشة تلفزيونك</title>
<style>
  @font-face{font-family:'Thmanyah';font-weight:300;font-style:normal;font-display:block;src:url("__F_LIGHT__") format("woff2")}
  @font-face{font-family:'Thmanyah';font-weight:400;font-style:normal;font-display:block;src:url("__F_REGULAR__") format("woff2")}
  @font-face{font-family:'Thmanyah';font-weight:500;font-style:normal;font-display:block;src:url("__F_MEDIUM__") format("woff2")}
  /* ﷺ and ﴿﴾ only (2 KB subset of Noto Naskh Arabic, OFL): Thmanyah has no glyph for them */
  @font-face{font-family:'NotoMarks';font-style:normal;font-weight:400;src:url("__F_MARKS__") format("woff2")}
  /* the Quran text only (verse of the day, Quranic adhkar), with the KFGQPC Uthmani text made for it: assets/fonts/UthmanicHafs-NOTICE.txt */
  @font-face{font-family:'UthmanicHafs';font-weight:400;font-style:normal;font-display:block;src:url("__F_HAFS__") format("woff2")}
  @font-face{font-family:'ThmanyahDisplay';font-weight:700;font-style:normal;font-display:block;src:url("__F_DISPLAY__") format("woff2")}

  :root{
    --sand:#F6EFE0;
    --dim:#C3B8A2;
    --gold:#DCB86F;
    --gold-2:#D6AF6B;
    --gold-3:#E0BA74;
    --gold-hi:#FFE9B8;
    --gold-rgb:220,184,111;
    --green-lt:#57D294;
    --red:#EE6A50;
  }
  /* National Day and Founding Day (see nationalNow()): the gold accents turn Saudi green, light enough to read on the dark photos */
  html.nat{--gold:#34B872;--gold-2:#2FAE6B;--gold-3:#4CCB88;--gold-hi:#CDF3DD;--gold-rgb:52,184,114}
  *{margin:0;padding:0;box-sizing:border-box}
  /* Hidden until the clock, the saved panels and the photo are in place, then one fade in: no half-built
     frames. The delayed animation shows it anyway if the script ever fails. */
  body{opacity:0;animation:reveal .3s 2.5s forwards}
  html.ready body{opacity:1;animation:none;transition:opacity .3s ease}
  @keyframes reveal{to{opacity:1}}
  /* card-only mode for the launcher */
  html.widget,html.widget body{background:transparent}
  html.widget .photo,html.widget .veil,html.widget .grain,html.widget .top-veil,html.widget .bottom-veil,
  html.widget .dimmer,html.widget #credit,html.widget .top,html.widget .clockwrap,html.widget .bottom{display:none}
  html.widget .stage{height:auto;padding:0;display:block;transition:none}
  /* the launcher's cards, up to three: one fills the box; two side by side (the first on the right, as Arabic reads);
     three: two side by side and the third the full width under them. At 1920 a pair is about 560 + 540 px with a 22 px gap. */
  html.widget .mid{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--cg,clamp(8px,2vw,22px));align-items:start}
  html.widget .mid.n2,html.widget .mid.n3{grid-template-columns:minmax(0,560fr) minmax(0,540fr)}
  html.widget .mid .week.w3{grid-column:1/-1}
  html.widget .week{width:100%}
  html.widget .week.boxes{padding:max(1.7vh,10px) max(1.4vw,14px)}   /* the prayer boxes keep a clear, even distance from the card's edge */
  html,body{
    height:100%;overflow:hidden;background:#040E09;color:var(--sand);
    font-family:'Thmanyah',system-ui,sans-serif;
    -webkit-user-select:none;user-select:none;cursor:none;
  }

  .photo{
    position:fixed;inset:0;z-index:0;
    background-image:none;
    background-color:#040E09;
    background-size:cover;
    background-position:center 26%;
    background-repeat:no-repeat;
    transform:scale(1.03);   /* edges stay covered while it settles */
  }
  /* each photo's darkness as a plain black layer: same look as filter:brightness, nothing to recompute */
  .photo::after{content:'';position:absolute;inset:0;background:#000;opacity:var(--dim,.05)}
  .veil{
    position:fixed;inset:0;z-index:1;
    background:
      linear-gradient(180deg,rgba(3,10,7,.62) 0%,rgba(3,10,7,.30) 22%,rgba(3,10,7,.12) 46%,rgba(3,10,7,.42) 74%,rgba(2,6,4,.88) 100%),
      radial-gradient(120% 85% at 22% 34%,rgba(3,14,9,.42) 0%,rgba(3,14,9,0) 58%);
  }
  /* photo credits live in PHOTO-CREDITS.md on GitHub, not on screen */
  #credit{display:none;
    position:fixed;left:26px;bottom:6px;z-index:4;
    font-size:10px;letter-spacing:.02em;
    color:rgba(246,239,224,.30);pointer-events:none;
  }
  .grain{
    position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.05;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='.55'/></svg>");
  }
  .top-veil{
    position:fixed;left:0;top:0;width:56vw;height:34vh;z-index:3;pointer-events:none;
    background:radial-gradient(120% 100% at 0% 0%,rgba(2,9,6,.82) 0%,rgba(2,9,6,.42) 45%,rgba(2,9,6,0) 76%);
  }
  .bottom-veil{
    position:fixed;left:0;right:0;bottom:0;height:30vh;z-index:3;pointer-events:none;
    background:linear-gradient(180deg,rgba(2,7,4,0) 0%,rgba(2,7,4,.55) 42%,rgba(2,6,4,.86) 100%);
  }

  .stage{
    position:relative;z-index:5;height:100vh;
    padding:3.1vh 3.6vw 5.4vh;
    display:grid;grid-template-rows:auto 1fr auto;gap:1.5vh;
    /* never wider than the screen: from 10 to 12 o'clock the clock has four digits, and beside a card of long nowrap rows
       the column grew past the edge and pushed the bottom row off screen at 1280 and 960 */
    grid-template-columns:minmax(0,1fr);
  }

  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:2.5vw}

  .up{color:var(--green-lt)}.down{color:var(--red)}

  .week{
    width:min(760px,48vw);max-width:100%;justify-self:end;   /* gives way to a wide clock (see .stage) */
    background:rgba(4,14,9,.60);   /* no backdrop blur: over a moving photo it is redone every frame */
    border:1px solid rgba(var(--gold-rgb),.16);
    border-radius:12px;
    padding:1.7vh 1.4vw;
  }
  .week .hd{
    display:flex;align-items:center;gap:.7em;margin-bottom:1vh;
    font-size:calc(clamp(12px,1vw,18px)*var(--z,1));font-weight:500;letter-spacing:0;color:var(--gold-2);
  }
  .week .hd::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(var(--gold-rgb),.5),transparent)}
  .week ul{list-style:none;display:flex;flex-direction:column;gap:0}
  .week li{
    display:flex;align-items:baseline;gap:1.05em;
    font-size:calc(clamp(14px,1.16vw,22px)*var(--z,1));font-weight:400;color:#F6EEDC;
    white-space:nowrap;line-height:1.3;
    padding:.8vh 0;border-bottom:1px solid rgba(var(--gold-rgb),.13);
  }
  .week li:last-child{border-bottom:none}
  .week li span:first-child{flex:0 1 auto;max-width:68%;overflow:hidden;text-overflow:ellipsis;padding-bottom:.3em;margin-bottom:-.3em}
  .week li .ep{flex:0 0 auto;color:#9FB8A8;font-size:.74em;font-variant-numeric:tabular-nums}
  .week li .rt{flex:0 0 auto;color:var(--gold-3);font-size:.74em;font-variant-numeric:tabular-nums}
  .week li .mwhen{display:block;font-style:normal;margin-top:.15em;font-size:.68em;font-weight:300;color:#A79C85;overflow:hidden;text-overflow:ellipsis}
  /* a game is one line, on the launcher's card and the screensaver's: the clubs with their crests beside the score, then the date, then
     «بعد …», «انتهت» or «مباشر». Too long for the card: fitGameRow() takes the clubs' short names, the date's short form, a smaller step */
  .week li .mwhen{display:block;font-style:normal;font-size:.68em;font-weight:300;color:#A79C85}
  .week li.mg{display:block;padding:calc(.8vh + 3px) 0}
  .week li.mg .mr{display:flex;align-items:center;gap:.75em;white-space:nowrap;max-width:none;overflow:visible;padding:0;margin:0}
  .week li.mg .mr > *{flex:0 0 auto;max-width:none;overflow:visible;text-overflow:clip;padding:0;margin:0}
  .week li.mg .mr .mwhen{flex:1 0 auto;text-align:center;font-size:.84em}
  .week li.mg .mr .dt{margin-inline-start:auto;min-width:0;font-size:.84em;text-align:left}
  .week li.mg .mr.nocr img.cr, .week li.mg .mr.nocr .crgap{display:none}
  .week li.mg .tm{display:inline-flex;align-items:center;gap:.32em}
  .week li .tm .nm{max-width:none;overflow:visible;text-overflow:clip;padding:0;margin:0}   /* a name is never cut by the first-name rule above */
  .week li.mg .tm .cr{margin:0}
  .week li.mg .sc{font-variant-numeric:tabular-nums;color:var(--gold-hi);font-weight:600}
  .week li .dt{flex:1 1 auto;color:#9C9279;font-size:.72em;min-width:3.2em;text-align:left}
  .week li .tm .cr{width:1.25em;height:1.25em;object-fit:contain;vertical-align:middle;margin-block:-.25em}
  .week li .tm .crgap{display:inline-block;flex:0 0 auto;width:1.25em;height:1.25em}   /* a club with no crest, beside clubs that have one */
  .week li .tm .cr:not([src]){visibility:hidden}   /* a restored row waits for its picture: the same room */
  .week ul.flip li{animation:weekIn .5s ease both}
  .week ul.flip li:nth-child(2){animation-delay:.06s}
  .week ul.flip li:nth-child(3){animation-delay:.12s}
  .week ul.flip li:nth-child(4){animation-delay:.18s}
  .week ul.flip li:nth-child(5){animation-delay:.24s}
  @keyframes weekIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .week li.task::before{content:'';flex:0 0 auto;width:.4em;height:.4em;border-radius:50%;background:var(--gold);align-self:center}
  .week li.task span{max-width:100%;min-width:0}
  /* «مواقيت اليوم»: the six times as boxes, three and three, larger than a list's rows; the next one lit, the past ones dimmed. Even room
     round every box and round the grid, so it sits symmetrical in the card (renderCard puts .pgrid on the list) */
  .week ul.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:calc(1.2vh + 6px) calc(.9vw + 6px);padding:calc(.5vh + 2px) 0 calc(.3vh + 2px)}
  .week ul.pgrid li{flex-direction:column;align-items:center;justify-content:center;gap:.3em;white-space:nowrap;text-align:center;
    padding:calc(1.7vh + 6px) .5em;border:1px solid rgba(var(--gold-rgb),.24);border-radius:calc(10px + .5vw);background:rgba(255,255,255,.045);
    font-size:calc(clamp(18px,1.7vw,32px)*var(--z,1))}
  .week ul.pgrid li:last-child{border-bottom:1px solid rgba(var(--gold-rgb),.24)}
  .week ul.pgrid li span:first-child{max-width:none;overflow:visible;padding:0;margin:0;font-weight:500}
  .week ul.pgrid li .dt{flex:none;min-width:0;text-align:center;font-size:.82em;color:#CFC5AD;font-variant-numeric:tabular-nums}
  .week ul.pgrid li.past{color:#8F8670;background:rgba(255,255,255,.02);border-color:rgba(var(--gold-rgb),.12)}
  .week ul.pgrid li.past .dt{color:#8A826D}
  .week ul.pgrid li.next{background:rgba(var(--gold-rgb),.18);border-color:rgba(var(--gold-rgb),.55);color:var(--gold-hi)}
  .week ul.pgrid li.next .dt{color:var(--gold-3)}
  /* «الساعات القادمة»: the next six hours in one row, the earliest on the right */
  .week li.hrs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:.3em;white-space:normal;border-bottom:none;padding:1.2vh 0 .5vh;align-items:start;text-align:center}
  .week li.hrs .hc{display:flex;flex-direction:column;align-items:center;gap:.4em;min-width:0}
  .week li.hrs .hc b{font-weight:400;font-size:.78em;color:#B9AE96;white-space:nowrap}
  .week li.hrs .hc svg{width:1.9em;height:1.9em;fill:none;stroke:var(--gold-3);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
  .week li.hrs .hc i{font-style:normal;font-variant-numeric:tabular-nums;font-size:1.05em;white-space:nowrap}
  /* «الصلوات في صف»: the five prayers side by side, the next one lit */
  .week li.prow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.3em;white-space:normal;border-bottom:none;padding:.9vh 0 .3vh;text-align:center;align-items:stretch}
  .week li.prow .pc{display:flex;flex-direction:column;align-items:center;gap:.3em;padding:.55em .1em;border-radius:.7em;min-width:0}
  .week li.prow .pc b{font-weight:500;white-space:nowrap}
  .week li.prow .pc i{font-style:normal;font-size:.8em;color:#B9AE96;white-space:nowrap;font-variant-numeric:tabular-nums}
  .week li.prow .pc.past{color:#8F8670}
  .week li.prow .pc.past i{color:#7F775F}
  .week li.prow .pc.next{background:rgba(var(--gold-rgb),.18);box-shadow:inset 0 0 0 1px rgba(var(--gold-rgb),.45);color:var(--gold-hi)}
  .week li.prow .pc.next i{color:var(--gold-3)}
  /* the same game in the card: «مباشر · الدقيقة ٦٧» over the two names with the score between, one line (fitLive) */
  .week li.lv{display:block;white-space:normal;text-align:center;border-bottom:none;padding:.5vh 0 .2vh}
  .week li.lv .lvm{font-size:.8em;color:#E6DCC4;margin-bottom:.35em}
  .week li.lv .lvt{display:flex;align-items:center;justify-content:center;gap:.55em;white-space:nowrap;overflow:hidden;
    font-size:calc(clamp(21px,2vw,38px)*var(--z,1)*var(--k,1));font-weight:500;line-height:1.35}
  .week li.lv .lvt > *{flex:0 0 auto}   /* nothing shrinks: what does not fit is measured and stepped down (fitLive) */
  .week li.lv .lvt .tm{display:inline-flex;align-items:center}
  .week li.lv .lvt .tm .cr{flex:0 0 auto}
  .week li.lv .lvt .tm{gap:.35em}
  .week li.lv .lvt .tm .cr{width:1.35em;height:1.35em;margin:0}
  .week li.lv .sc{color:var(--gold-hi);font-size:1.25em;font-weight:700;font-variant-numeric:tabular-nums;padding:0 .1em}
  /* «الصلاة القادمة»: the name lit, its time, and the time left (as large and as bright as the time: the most useful part); the line
     may wrap between them, never inside one */
  .week li.np{display:flex;flex-wrap:wrap;align-items:baseline;gap:.15em .5em;white-space:normal;border-bottom:none;padding:1.2vh 0 .6vh}
  .week li.np > *{flex:0 0 auto;max-width:none;overflow:visible;text-overflow:clip;padding:0;margin:0;white-space:nowrap}
  .week li.np b{font-weight:500;color:var(--gold-hi)}
  .week li.np .t{font-variant-numeric:tabular-nums}
  /* «يومك»: a small name, then the thing itself (it may wrap, never «…»), then when */
  .week li.td{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.1em .8em;align-items:baseline;white-space:normal}
  .week li.td > span{max-width:none;overflow:visible;text-overflow:clip;padding:0;margin:0}   /* not the list rows' first-name rule */
  .week li.td .k{font-size:.74em;color:#9C9279;white-space:nowrap}
  .week li.td .v{color:#F6EEDC;min-width:0;line-height:1.35}
  .week li.td .r{font-size:.74em;color:var(--gold-3);white-space:nowrap}
  .week li.past{color:#8F8670}
  .week li.next{color:var(--gold-hi)}
  .week li.next .dt{color:var(--gold-3)}
  .week li.quote{white-space:normal;display:block;font-size:calc(clamp(17px,1.5vw,29px)*var(--z,1));line-height:1.75;
    border-bottom:none;padding:.4vh 0 0;color:#FFF7E6}
  /* Thmanyah draws ﴿﴾ as small angle marks: they come from the NotoMarks subset */
  .week li.quote .orn{font-family:'NotoMarks','Noto Naskh Arabic',serif;color:var(--gold-2);
    font-size:1.05em;padding:0 .15em}
  /* ﷺ is not in Thmanyah either: NotoMarks, in gold like the verse brackets so it reads as ornament */
  .week li.quote .saw{font-family:'NotoMarks','Noto Naskh Arabic',serif;color:var(--gold-2);font-size:1.6em;line-height:1;vertical-align:-.1em}
  /* the Uthmanic Hafs face is small for its size and its marks stack high: larger, with more leading */
  .week li.quote .qt{font-family:'UthmanicHafs','Thmanyah',serif;font-size:1.32em}
  .week li.quote.quran{line-height:1.95}
  .week li.quote.quran.q1{font-size:calc(clamp(13px,1.3vw,25px)*var(--z,1));line-height:1.85}   /* the Hafs face is wide: a lower floor than the other cards' */
  .week li.quote.quran.q2{line-height:1.8}
  .week li.quote.quran.q3,.week li.quote.quran.q4{line-height:1.55}   /* the longest verses, on the smallest screens, must still fit the card */
  /* «التفسير الميسر» under the verse (#tafsir=1): small and dim, three lines at most (fitTafsir) */
  .week li.tafsir{white-space:normal;display:block;border-bottom:none;padding:.5vh 0 0;line-height:1.65;
    font-size:calc(clamp(11px,.92vw,17px)*var(--z,1));color:#B9AE96}
  /* a full hadith: the isnad and the narration small and muted, the Prophet's words ﷺ at full size */
  .week li.quote.hadith{font-size:calc(clamp(15px,1.3vw,25px)*var(--z,1));line-height:1.7}
  /* long texts a step smaller (by length, see quoteSize()), so the card never grows past the clock row */
  .week li.quote.q1{font-size:calc(clamp(15px,1.3vw,25px)*var(--z,1))}
  .week li.quote.q2{font-size:calc(clamp(14px,1.16vw,22px)*var(--z,1))}
  .week li.quote.q3{font-size:calc(clamp(13px,1.04vw,20px)*var(--z,1))}
  .week li.quote.q4{font-size:calc(clamp(11px,.88vw,17px)*var(--z,1))}   /* the adhkar card's longest, the end of al-Baqara with harakat */
  .week li.quote.hadith.q1{font-size:calc(clamp(14px,1.16vw,22px)*var(--z,1))}
  .week li.quote.hadith.q2{font-size:calc(clamp(13px,1.04vw,20px)*var(--z,1))}
  .week li.quote.hadith.q3{font-size:calc(clamp(12px,.94vw,18px)*var(--z,1))}
  .week li.quote .nar{font-size:.66em;color:#B9AE96}
  .week li.quote .nar .saw{font-size:1.45em}
  .week li.src{border-bottom:none;padding:.6vh 0 0;font-size:calc(clamp(12px,.95vw,18px)*var(--z,1));color:var(--gold-2)}
  /* «أذكار الصباح والمساء»: the header takes a line icon and the window's end; the footer holds source, count and dots */
  .week .hd::after{order:1}
  .week .hd svg{flex:0 0 auto;width:1.5em;height:1.5em;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
  .week .hd .until{order:2;font-size:.9em;font-weight:400;letter-spacing:0;color:#9C9279;white-space:nowrap}
  .week.stocks,html[class] .week.stocks{padding:calc(max(18px,2.2222vh)*var(--z,1)) !important} 
  .week .hd .until.near{order:0;margin-inline-start:.2em}   /* «السوق مغلق» right after «الأسهم» on the header line, not at the card's far end over the first column */
  .week li.stk{align-items:center;gap:.8em}
  .week li.stk .nm{flex:1 1 auto;min-width:0;max-width:none;overflow:hidden;text-overflow:ellipsis;padding-bottom:.3em;margin-bottom:-.3em}
  .week li.stk.old{opacity:.6}
  .week li.stk .cl{font-size:.64em;color:#9C9279;margin-inline-start:.6em}
  .week li.stk svg{flex:0 0 auto;width:4.4em;height:1.1em;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
  .week li.stk svg polyline{vector-effect:non-scaling-stroke}
  .week li.stk .px{flex:0 0 auto;min-width:3.6em;text-align:left;font-variant-numeric:tabular-nums;direction:ltr}
  .week li.stk .chg{flex:0 0 auto;min-width:4.9em;text-align:left;font-size:.74em;font-variant-numeric:tabular-nums}
  .week li.stk .up{color:#79D6A0}
  .week li.stk .down{color:#EE8B70}
  .week li.adw{border-bottom:none;color:#E6DCC4}   /* «مع العصر ٣:٠٠ م»: the adhkar card waiting beside the verse card */
  .week li.adf{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:.8em;align-items:center;
    border-bottom:none;padding:.6vh 0 0;font-size:calc(clamp(12px,.95vw,18px)*var(--z,1));color:var(--gold-2)}
  .week li.adf .s{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-bottom:.3em;margin-bottom:-.3em}
  .week li.adf .c{color:#B9AE96;font-size:.92em;white-space:nowrap}
  .week li.adf .d{justify-self:end;display:flex;gap:.4em}
  .week li.adf .d i{width:.48em;height:.48em;border-radius:50%;background:rgba(var(--gold-rgb),.26)}
  .week li.adf .d i.on{background:var(--gold-3)}
  /* «السنة»: one dot a day in a single SVG; the days gone rise from dim to gold, today is the brightest with a halo */
  .week li.yr{display:block;white-space:normal;border-bottom:none;padding:.3vh 0 0;text-align:center}
  .week li.yr .yn{font-size:1.3em;font-weight:500;color:var(--gold-hi);line-height:1.1;font-variant-numeric:tabular-nums}
  .week li.yr svg{display:block;width:calc(100%*var(--z,1));height:auto;margin:.6vh auto .5vh}
  .week li.yr .on{fill:rgb(var(--gold-rgb))}
  .week li.yr .off{fill:rgb(var(--gold-rgb));fill-opacity:.14}
  .week li.yr .now{fill:var(--gold-hi)}
  .week li.yr .halo{fill:rgb(var(--gold-rgb))}
  .week li.yr .yt{font-size:.74em;color:#B9AE96;line-height:1.4}
  .week li.yr .yt b{font-weight:500;color:var(--gold-3)}
  @media (prefers-reduced-motion:no-preference){
    .week li.yr.fill .r{animation:yrIn .7s ease both;animation-delay:calc(var(--i) * 70ms)}
    @keyframes yrIn{from{opacity:0}to{opacity:1}}
  }
  .week .empty{color:#9A9078;font-size:calc(clamp(14px,1.1vw,21px)*var(--z,1));font-weight:300;margin-top:1vh}

  /* ===== card styles (#cardstyle=; the default keeps the plain card above) =====
     The blur is never a live backdrop-filter: a pre-blurred copy of the photo is drawn once per photo
     (cardBlurNow) into canvas.bl. Layers inside the card, back to front: canvas.bl, ::before the tint,
     ::after the highlights, then the content. Until the canvas exists the card is just its tint. */
  html[class*="cs-"] .week{position:relative;isolation:isolate;background:none}
  html[class*="cs-"] .week::before,html[class*="cs-"] .week::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none}
  html[class*="cs-"] .week::before{z-index:-2}
  html[class*="cs-"] .week::after{z-index:-1}
  .week canvas.bl{position:absolute;inset:0;width:100%;height:100%;z-index:-3;border-radius:inherit;pointer-events:none;
    opacity:0;transition:opacity .8s ease}
  .week canvas.bl.on{opacity:1}
  .week .frm,.week .dia{display:none}

  html.cs-dark1 .week{border-radius:26px;border-color:rgba(246,239,224,.10)}
  html.cs-dark1 .week::before{background:rgba(8,14,10,.52)}
  html.cs-dark1 .week::after{box-shadow:inset -3px 0 0 var(--gold)}   /* a thin gold line on the edge facing the clock */

  html.cs-glass1 .week{border-radius:34px;border-color:rgba(255,255,255,.22);box-shadow:0 24px 60px rgba(0,0,0,.35)}
  html.cs-glass1 .week::before{background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.04) 45%,rgba(255,255,255,.02) 60%,rgba(255,255,255,.10))}
  html.cs-glass1 .week::after{background:radial-gradient(60% 40% at 85% 0%,rgba(255,255,255,.22),transparent 70%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -1px 0 rgba(255,255,255,.08),inset 1px 0 0 rgba(255,255,255,.12)}

  /* framed: an inner gold frame with a diamond on its top and bottom edge, the header centred. The diamond is a square turned
     45°, centred on the frame line, so it reaches (inset + 0.71 × its side) into the card: 15 px at 540, 20 px at 1080, under
     the card's padding (17 / 26 px) with the text after it. The padding itself stays as the other styles': at 960×540 the
     longest verses, four games and the year's dots need the room (on a TV the title sat under the top diamond and the last
     line over the bottom one, with bigger diamonds) */
  html.cs-dark3 .week,html.cs-glass3 .week{padding:calc(1.7vh + 8px) calc(1.4vw + 8px)}
  /* the launcher's box is short: the header must clear the diamond on the top edge whatever its height (vh is the box's) */
  html.widget.cs-dark3 .week,html.widget.cs-glass3 .week{padding:calc(24px*var(--z,1)) calc(1.4vw + 8px) calc(18px*var(--z,1))}
  html.widget.cs-dark3 .week .frm,html.widget.cs-glass3 .week .frm{inset:calc(12px*var(--z,1))}
  html.widget.cs-dark3 .week .dia,html.widget.cs-glass3 .week .dia{width:calc(18px*var(--z,1));height:calc(18px*var(--z,1))}
  html.widget.cs-dark3 .week .dia.t,html.widget.cs-glass3 .week .dia.t{top:calc(12px*var(--z,1))}
  html.widget.cs-dark3 .week .dia.b,html.widget.cs-glass3 .week .dia.b{bottom:calc(12px*var(--z,1))}
  html.cs-dark3 .week .frm,html.cs-glass3 .week .frm{display:block;position:absolute;inset:calc(5px + .4vh);z-index:0;pointer-events:none;
    border:1px solid rgba(var(--gold-rgb),.55);border-radius:14px}
  html.cs-dark3 .week .dia,html.cs-glass3 .week .dia{display:block;position:absolute;left:50%;width:calc(8px + .6vh);height:calc(8px + .6vh);z-index:0;
    pointer-events:none;border:1px solid rgba(var(--gold-rgb),.75)}
  html.cs-dark3 .week .dia.t,html.cs-glass3 .week .dia.t{top:calc(5px + .4vh);transform:translate(-50%,-50%) rotate(45deg)}
  html.cs-dark3 .week .dia.b,html.cs-glass3 .week .dia.b{bottom:calc(5px + .4vh);transform:translate(-50%,50%) rotate(45deg)}
  html.cs-dark3 .week .hd,html.cs-glass3 .week .hd{justify-content:center}
  html.cs-dark3 .week .hd::after,html.cs-glass3 .week .hd::after{display:none}

  html.cs-dark3 .week{border-radius:22px;border-color:transparent}
  html.cs-dark3 .week::before{background:rgba(7,22,15,.62)}
  html.cs-dark3 .week .dia{background:#07160F}

  html.cs-glass3 .week{border-radius:30px;border-color:rgba(255,255,255,.20);box-shadow:0 24px 60px rgba(0,0,0,.35)}
  html.cs-glass3 .week::before{background:linear-gradient(135deg,rgba(120,200,150,.20),rgba(20,60,40,.10) 50%,rgba(var(--gold-rgb),.12))}
  html.cs-glass3 .week::after{box-shadow:inset 0 1px 0 rgba(255,255,255,.40),inset 0 -1px 0 rgba(255,255,255,.06)}
  html.cs-glass3 .week .dia{background:rgb(30,60,44)}

  /* «يُتلى الآن»: a small card at the top centre while the Quran or a radio station plays; it takes the style of the card beside the clock
     (the rules above are on .week) and sits over the stage, out of its grid */
  .stage > .week.np{position:absolute;top:calc(3.1vh + 4px);left:50%;transform:translateX(-50%);width:max-content;max-width:none;
    padding:1.1vh 1.5vw;z-index:6}
  .week.np[hidden],html.widget .week.np{display:none}
  .np .npl{position:relative;z-index:1;display:flex;align-items:center;gap:.6em;white-space:nowrap;font-size:clamp(13px,1.1vw,21px);color:#F6EEDC;line-height:1.35}
  .np .npk{color:var(--gold-2);font-weight:500}
  .np .nps{color:rgba(var(--gold-rgb),.6)}
  .np b{font-weight:500}
  .np .npw{color:#CFC5AD;font-weight:300}
  .np .npe{display:inline-flex;align-items:flex-end;gap:.16em;height:.95em}
  .np .npe i{width:.2em;border-radius:1px;background:var(--gold)}
  .np .npe i:nth-child(1){height:45%}.np .npe i:nth-child(2){height:100%}.np .npe i:nth-child(3){height:70%}
  html.cs-dark3 .stage > .week.np,html.cs-glass3 .stage > .week.np{padding:calc(1.1vh + 8px) calc(1.5vw + 8px)}

  .dates{text-align:right;flex-shrink:0}
  .hijri{font-size:clamp(19px,1.86vw,37px);font-weight:500;color:var(--sand);line-height:1.3}
  .natline{margin-top:.55vh;font-size:clamp(12px,1.06vw,21px);font-weight:500;color:var(--gold)}
  .natline[hidden]{display:none}
  .greg{margin-top:.55vh;font-size:clamp(12px,1.06vw,21px);font-weight:300;color:var(--dim)}
  /* starts at the screen edge, under the first letters, and fades toward the middle */
  .rule{margin-top:1.2vh;width:clamp(100px,9vw,190px);height:1px;margin-left:auto;margin-right:0;
    background:linear-gradient(270deg,var(--gold),rgba(var(--gold-rgb),0))}

  /* the card keeps its width on the left; the clock is centred in the space between it and the right edge */
  .mid{display:grid;grid-template-columns:1fr minmax(0,auto);align-items:center;gap:4.5vw}   /* the clock keeps its width; the card takes what is left */
  .clockwrap{display:flex;flex-direction:column;align-items:center;justify-self:center;position:relative}
  /* the slim year strip hangs under the clock's own block, out of the layout: the clock never moves for it (it hides when
     the room under the clock is too small, see fitYearStrip()). 4 px dots with 2 px gaps at 960 wide, 8 and 4 at 1920. No words
     under it: the dots say the day; the big year card keeps its «اليوم ٢٩٦ من ٣٦٥» line */
  .ystrip{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:1.3vh;
    display:flex;flex-direction:column;align-items:center;--yp:calc(100vw/160)}
  .ystrip[hidden]{display:none}
  .ystrip svg{display:block;width:calc(53*var(--yp));height:calc(7*var(--yp));overflow:visible}
  .ystrip .on{fill:rgb(var(--gold-rgb))}
  .ystrip .off{fill:rgb(var(--gold-rgb));fill-opacity:.16}
  .ystrip .halo{fill:#FFFDF6}
  .ystrip .now{fill:#FFFDF6;filter:drop-shadow(0 0 3px rgba(255,236,190,.9))}
  html.widget .ystrip{display:none}
  /* the launcher's «المهام» card is live (OK opens the list, the mic ready): a small mic mark in its corner, and a ring while it has the
     focus. The ring is inside the card: the WebView's box would cut an outline off at its edge. Nothing here changes the card's size. */
  html.widget .week.live{position:relative}
  html.widget .week .micmark{display:none}
  html.widget .week.live .micmark{display:flex;align-items:center;justify-content:center;position:absolute;left:calc(12px*var(--z,1));top:calc(8px*var(--z,1));
    width:calc(24px*var(--z,1));height:calc(24px*var(--z,1));border-radius:50%;background:rgba(var(--gold-rgb),.2);border:1px solid rgba(var(--gold-rgb),.7)}
  html.widget .week .micmark svg{width:62%;height:62%;fill:var(--gold-hi)}
  html.widget .week.live .hd{padding-left:calc(32px*var(--z,1))}
  html.widget .week.live.lf,html.widget .week.tap.lf{box-shadow:inset 0 0 0 3px var(--gold-hi),inset 0 0 22px rgba(255,233,184,.22)!important;border-color:var(--gold-hi)!important}
  html.widget .week.live.lf .micmark{background:var(--gold-hi)}
  html.widget .week.live.lf .micmark svg{fill:#1A1409}
  .clock{
    display:flex;align-items:baseline;justify-content:center;direction:ltr;
    font-family:'ThmanyahDisplay','Thmanyah',serif;
    font-weight:700;
    font-size:clamp(120px,min(17vw,31vh),345px);line-height:.92;letter-spacing:.022em;
    color:#FFFDF6;font-variant-numeric:tabular-nums;
    text-shadow:0 4px 70px rgba(0,0,0,.65), 0 0 130px rgba(255,236,190,.12);
  }
  /* «حجم الساعة» (#clocksize=): large is the clock above, centred in its space, and nothing here touches it. A smaller clock is
     not the large layout with a hole in it: the screen is laid out again around two straight edges, the right one (the date,
     the clock and its city line, the next prayer) and the left one (the markets, the card, the bottom-left slot).
     medium: the clock and its city line move to the right edge, the card grows to min(1000px, 56vw) on the left edge, and the
       gutter between them is the page's own side margin (3.6vw).
     small: three columns from the middle row to the bottom row. The right one is as wide as the clock at its widest time
       (--ckk, so nothing moves at 10 o'clock) and holds the clock over the next prayer; the other two hold the card over the
       occasion and the slot: one card on the left edge, as wide as beside the medium clock, or the card and a second one
       (#panel2=) as a pair of the same height, a column each. The Hijri date, the headline beside a small clock, is a step larger. */
  /* the three sizes as 1 : .75 : .55 of the large clock's clamp(120px, min(17vw, 31vh), 345px): a size you can tell apart */
  html.ck-medium .clock{font-size:clamp(90px,min(12.75vw,23.25vh),259px)}
  html.ck-small{--ckf:clamp(66px,min(9.35vw,17.05vh),190px);--ckc:calc(var(--ckf) * var(--ckk,3.26))}   /* --ckk: the widest time, in ems (boot) */
  html.ck-small .clock{font-size:var(--ckf)}
  html.ck-medium .mid{gap:3.6vw}
  html.ck-medium .mid > .clockwrap,html.ck-small .mid > .clockwrap{justify-self:start;align-items:flex-start}
  html.ck-medium .ystrip,html.ck-small .ystrip{left:auto;right:0;transform:none}
  html.ck-medium .mid > .week{width:min(1000px,56vw)}
  html.ck-small .hijri{font-size:clamp(21px,2.1vw,42px)}
  html.ck-small .mid{grid-template-columns:minmax(var(--ckc),auto) minmax(0,1fr) minmax(0,1fr);grid-template-rows:1fr auto 1fr;gap:0 2.4vw}
  html.ck-small .mid > .clockwrap{grid-column:1;grid-row:1/-1;align-self:center}
  html.ck-small .mid > .week{grid-row:2;width:auto;max-width:none;justify-self:stretch}
  html.ck-small .mid.n1 > .week{grid-column:2/-1;justify-self:end;width:min(1000px,56vw);max-width:100%}   /* one card: as wide as beside the medium clock */
  html.ck-small .mid.n2:not(.fit) > .week{align-self:stretch}
  /* the pair is one height: a shorter list spreads its rows down its card instead of leaving the lower part empty, and a verse or
     a dhikr does not end on one word alone */
  html.ck-small .mid.n2 > .week{display:flex;flex-direction:column}
  html.ck-small .mid.n2:not(.fit) > .week > ul:not(.pgrid){flex:1;justify-content:space-evenly}
  html.ck-small .mid.n2 > .week li.quote{text-wrap:pretty}
  /* a dhikr's foot in a narrow card: the source on its own line (two if it must, never «…»), the count and the dots under it */
  html.ck-small .mid.n2 > .week li.adf{grid-template-columns:auto minmax(0,1fr);row-gap:.35em}
  html.ck-small .mid.n2 > .week li.adf .s{grid-column:1/-1;white-space:normal;text-overflow:clip;overflow:visible;line-height:1.35}
  html.ck-small .mid.n2 > .week li.adf .d{flex-wrap:wrap;row-gap:.3em}
  @media (min-aspect-ratio:5/4){
    html.ck-small:not(.slot-none) .bottom{grid-template-columns:var(--ckc) minmax(0,1fr) minmax(0,1fr)}
  }
  .clock .d{unicode-bidi:isolate}
  .clock .d i{font-style:normal}
  .clock .d i + i{margin-left:var(--digit-gap,.09em)}
  .clock .sep{
    font-size:.46em;align-self:center;transform:translateY(-.08em);color:var(--gold);opacity:.9;padding:0 .1em;
  }
  .clock .ampm{
    font-size:.28em;font-weight:500;color:var(--gold);
    align-self:flex-start;margin-top:.12em;margin-inline-end:.25em;
  }
  /* «إظهار الثواني» (#seconds=1): small, on the minutes' baseline after them; each digit in a box of its own fixed width, so the
     clock is as wide at :11 as at :58 and nothing around it moves when a second turns (the small clock's column counts them, --ckk) */
  .clock .sec{font-size:.28em;font-weight:500;color:var(--gold);margin-inline-start:.3em;white-space:nowrap}
  .clock .sec i{font-style:normal;display:inline-block;width:.62em;text-align:center}
  .subline{
    margin-top:1.4vh;display:flex;align-items:center;gap:.7em;
    font-size:clamp(12px,1.02vw,20px);font-weight:300;letter-spacing:0;color:#D8CDB6;
  }
  /* the first starts while no city was ever set (#citynote=1): one quiet line under the city, gone after ten minutes */
  .citynote{margin-top:1vh;font-size:clamp(14px,1.1vw,21px);font-weight:400;color:#D8CDB6}
  .citynote[hidden]{display:none}
  .subline .dot{width:5px;height:5px;border-radius:50%;background:var(--gold);opacity:.9}

  .bottom{
    display:grid;grid-template-columns:1fr .9fr 1.3fr;
    gap:2.4vw;align-items:start;
    border-top:1px solid rgba(var(--gold-rgb),.30);
    padding-top:2.1vh;
  }
  .panel{min-width:0}
  .panel .label{
    font-size:clamp(12px,.98vw,18px);font-weight:500;letter-spacing:0;
    color:var(--gold-2);margin-bottom:.8vh;white-space:nowrap;
  }
  .panel .big{
    display:flex;align-items:baseline;gap:.4em;flex-wrap:nowrap;white-space:nowrap;min-width:0;line-height:1.1;
    font-weight:700;font-family:'ThmanyahDisplay','Thmanyah',serif;font-size:clamp(22px,2vw,42px);color:var(--sand);
  }
  .panel .num{color:#FFFCF2;font-size:1.12em;font-variant-numeric:tabular-nums;font-weight:500}
  .panel .unit{font-size:.56em;font-weight:500;color:var(--gold)}
  .panel .sub{
    margin-top:.85vh;font-size:clamp(12px,1vw,19px);font-weight:300;color:#C6BBA4;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-bottom:.3em;margin-bottom:-.3em;
  }
  .panel .sub b{color:#F0E6D0;font-weight:500}
  .panel .sub.when{margin-top:.3vh;font-size:.86em;color:#A79C85}

  .p-prayer{text-align:right}
  /* #prayerbar=1: from the last prayer to the next (or to the iqama, or the sunrise), filling from the right as the text reads */
  .pbar{height:3px;margin-top:.9vh;overflow:hidden;border-radius:99px;background:rgba(var(--gold-rgb),.18);direction:rtl}
  .pbar[hidden]{display:none}
  .pbar i{display:block;width:0;height:100%;border-radius:inherit;background:var(--gold);transition:width .5s linear}
  .p-prayer .big{justify-content:flex-start}
  #prayer-name[hidden]{display:none}
  .p-mid{text-align:center}
  .p-mid .big{display:block;text-align:center;line-height:1.06}
  .p-mid .num{font-size:1.3em;line-height:1}
  .p-mid .txt{display:inline-block;max-width:100%;white-space:normal;font-size:.5em;line-height:1.3}
  .panel .sub .note{font-size:.9em;color:#A79C85;margin-top:.2vh}
  .p-mid .unit{font-size:.46em;font-weight:500;color:var(--gold-2);letter-spacing:0;display:inline;vertical-align:.5em}
  .p-match{text-align:left}
  .p-match .big{justify-content:flex-end}
  .p-match .sub{white-space:normal;line-height:1.4;max-width:100%;font-size:clamp(11px,.88vw,17px)}
  .p-match .sub.when{font-size:clamp(10px,.78vw,15px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}   /* under «بعد …», a step smaller, one line */

  .mrow{display:flex;flex-direction:row;gap:1.6vw;align-items:flex-end;justify-content:flex-end;min-width:0}
  .mblock{text-align:left;flex:0 1 auto;min-width:0;max-width:100%}
  .mblock:not(:last-child){padding-inline-end:1.6vw;border-inline-end:1px solid rgba(var(--gold-rgb),.25)}
  .mrow:has(.mblock + .mblock) .big{font-size:clamp(18px,1.6vw,34px)}
  .mblock .big{justify-content:flex-end;min-width:0}
  .mrow.flip .mblock{animation:weekIn .5s ease both}
  .mrow.flip .mblock + .mblock{animation-delay:.08s}
  /* a followed team's game under way: its score big, «مباشر» and the minute under it */
  .mblock.lvb .big{font-size:clamp(30px,3.1vw,64px)}
  .mblock.lvb .sc{color:var(--gold-hi);font-size:1.12em}
  .mblock.lvb .sub{font-size:clamp(15px,1.35vw,28px);color:#E6DCC4}
  .mblock .big > span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;
    padding-bottom:.3em;margin-bottom:-.3em;    /* room for the dots under ي, ج… */
    padding-inline:.15em;margin-inline:-.15em;max-width:calc(100% + .3em)}  /* and for a final ر or ن past the ends */
  .none-week{font-size:clamp(26px,2.5vw,54px);font-weight:700;font-family:'ThmanyahDisplay','Thmanyah',serif;color:#A79C85}

  /* A new photo settles in over a minute, then holds still: an endless drift kept the TV redrawing
     the whole screen 60 times a second, for hours. */
  @keyframes settle{
    from{transform:scale(1.055) translate3d(-.55%,-.4%,0)}
    to{transform:scale(1.03) translate3d(0,0,0)}
  }
  @media (prefers-reduced-motion:no-preference){.photo.settle{animation:settle 60s ease-out both}}

  /* ===== top left: weather and markets, set like the date block on the right (no boxes) ===== */
  .markets{text-align:left;flex-shrink:0}
  .wxline{display:flex;align-items:baseline;gap:.5em;justify-content:flex-end;line-height:1.3;
    font-size:clamp(19px,1.86vw,37px);font-weight:500;color:var(--sand)}
  .wxt{font-family:'ThmanyahDisplay','Thmanyah',serif;font-weight:700;color:#FFFCF2;direction:ltr;
    font-variant-numeric:tabular-nums}
  .wxdust{color:#E8B86A;font-size:.82em}   /* the dust, beside the condition and not instead of it */
  .wxdust:not(:empty)::before{content:'·';margin-inline-end:.5em;color:rgba(214,175,107,.7)}
  .wxmore{margin-top:.3vh;font-size:clamp(11px,.92vw,18px);font-weight:300;color:var(--dim);white-space:nowrap}
  .wxmore[hidden]{display:none}
  .wxsrc{margin-top:.3vh;font-size:clamp(10px,.86vw,17px);font-weight:300;color:var(--dim);opacity:.8;white-space:nowrap}
  .wxsrc:empty{display:none}
  .wxsub{margin-top:.55vh;font-size:clamp(12px,1.06vw,21px);font-weight:300;color:var(--dim);white-space:nowrap}
  .wxr:not(:empty)::before{content:'  ·  ';white-space:pre;color:rgba(214,175,107,.7)}
  .wxt:empty,.wxd:empty,.wxr:empty,.wxdust:empty{display:none}
  .rule.l{margin-left:0;margin-right:auto;background:linear-gradient(90deg,var(--gold),rgba(var(--gold-rgb),0))}
  .mk{margin-top:1.2vh;display:flex;justify-content:flex-end;gap:1.6em;white-space:nowrap;
    font-size:clamp(12px,1.06vw,21px);font-weight:400;color:#D8CDB6}
  .mk[hidden],.mkup[hidden]{display:none}

  /* ---- the football home (#football=1, docs/PROPOSALS-NOV2.md §1): 1080p lengths × --u; the cards end by y 572, the open row by 824 */
  html.fb .stage{display:none}
  html.fb{--fi:#fff;--fs:rgba(255,255,255,.74);--fgr:#8FE0B4;--fam:#F5C26B;--fbg:rgba(14,16,18,.44);--fln:rgba(255,255,255,.22);--fhl:rgba(255,255,255,.12);--fring:#8FE0B4}

    padding:calc(var(--u)*24);overflow:hidden;transition:box-shadow .15s ease-out}

     hugging the ×, the note / mark last. Crest 40, 24 between crest and name, 32 each side of the ×; a name takes two lines, no word broken. */

    display:flex;flex-direction:column;justify-content:space-between;font-size:calc(var(--u)*24)}
