// one TheSportsDB event of league key -> {title, tag, country, t, dur, dateOnly}
// (F1: «United States Grand Prix Practice 1»; UFC: «UFC 333 Volkanovski vs Evloev», «UFC Fight Night 291 A vs B»;
// boxing: «Dalton Smith vs Alberto Puello», usually with no time of day: «00:00:00»)
function eventInfo(key, ev){
  const name = String(ev.strEvent || ev.strEventAlternate || '').trim();
  let title = '', session = '', head = '', pre = '', card = '';   // head: the slot's big line (HTML); pre: under it, small; card: the row beside the clock (HTML)
  if(key === 'f1'){
    const gp = name.match(/^(.*?)\s*grand prix/i);
    const place = gp ? foldKey(gp[1].replace(/\bformula\s*1\b/i,'').replace(/\b20\d\d\b/,'')) : '';
    const rest = name.replace(/^.*?grand prix/i,'');
    for(const [rx, label] of SESSIONS){
      const m = (rest || name).match(rx);
      if(!m) continue;
      session = label || 'التجارب الحرة ' + arDigits(m[1] || m[2] || '');
      break;
    }
    if(!session) session = 'السباق';
    const gpName = gp ? 'جائزة ' + (GP_AR[place] || trl(gp[1].trim())) + ' الكبرى' : trl(name);
    title = gpName + ' · ' + session;
    // the session goes under it, so the big line stays short; tighter still: «جائزة السعودية»
    head = gp ? `<span class="tm" data-short="${esc(gpName.replace(/ الكبرى$/, ''))}">${esc(gpName)}</span>` : esc(gpName);
    pre = session;
    card = head + ' · ' + esc(session);
  }else{
    let prefix = '', rest = name;
    const u = key === 'ufc' ? name.match(/^UFC(\s+Fight\s+Night)?\s*(\d+)?\s*[:\-]?\s*(.*)$/i) : null;
    if(u){ prefix = 'UFC' + (u[1] ? ' فايت نايت' : '') + (u[2] ? ' ' + arDigits(u[2]) : ''); rest = u[3]; }
    let pair = ev.strHomeTeam && ev.strAwayTeam ? [ev.strHomeTeam, ev.strAwayTeam] : rest.split(/\s+vs\.?\s+/i);
    const body = pair.length === 2 ? trl(pair[0]) + ' × ' + trl(pair[1]) : trl(rest);
    title = arDigits([prefix, body].filter(Boolean).join(' · '));
    // the fighters on the big line, each with the family name as the short form fitMatches may need
    const who = n => { const w = trl(n).trim(), last = w.split(/\s+/).pop();
      return `<span class="tm"${last !== w ? ` data-short="${esc(last)}"` : ''}>${esc(w)}</span>`; };
    head = arDigits(pair.length === 2 ? who(pair[0]) + ' × ' + who(pair[1]) : esc(body));
    pre = arDigits(prefix);
    card = [pre && esc(pre), head].filter(Boolean).join(' · ');
  }
  const c = foldKey(ev.strCountry);
  const country = COUNTRY_AR[c] || (c ? trl(ev.strCountry) : '');
  const dateOnly = !ev.strTime || /^00:00(:00)?$/.test(ev.strTime);   // no time of day known: only the day is told
  let t = toDate(ev).getTime();
  if(dateOnly && !isNaN(t)) t -= tzOffsetMs(t);   // t is that day's midnight in UTC: it starts at midnight in the city's time zone
  return {title, head, pre, card, tag: EVENT_TAG[key], country: title.includes(country) ? '' : country, t,
          dur: dateOnly ? 24*3600000 : EVENT_DUR_H[key] * 3600000, dateOnly};
}
// the events of key still to come (or running) within the window, soonest first
function eventsOf(key, now){
  const over = e => /^(FT|AET|PEN|FINISHED|MATCH FINISHED|CANCELLED|POSTPONED)$/i.test(e.strStatus || '');
  return (EVENT_NEXT[key] || []).filter(e => e && e.idEvent && !over(e))
    .map(e => ({e, i: eventInfo(key, e)}))
    .filter(x => !isNaN(x.i.t) && now < x.i.t + x.i.dur && x.i.t - now <= CONFIG.eventWindowDays * 86400000)
    .sort((a, b) => a.i.t - b.i.t);
}
function eventWhen(i, now){
  const p = hmParts(new Date(i.t));
  const clk = i.dateOnly ? '' : ar(fmtTime(+p.hour % 24, +p.minute));
  const sameDay = FMT_DATE.format(new Date(i.t + (i.dateOnly ? 3600000 : 0))) === FMT_DATE.format(new Date(now));
  const dayName = sameDay ? 'اليوم' : FMT_WEEKDAY.format(new Date(i.t + (i.dateOnly ? 3600000 : 0)));
  if(i.dateOnly) return {live:false, text: sameDay ? 'اليوم' : dayName, row: dayName};
  if(now >= i.t) return {live:true, text: `<span class="live">مباشر</span> · بدأ ${clk}`, row: '<span class="live">مباشر</span>'};
  return {live:false, text: `${dayName} · ${clk}`, row: `${dayName} ${clk}`};
}
function eventSlot(key, now){
  const x = eventsOf(key, now)[0];
  if(!x) return '';
  const w = eventWhen(x.i, now);
  const about = [x.i.pre, x.i.tag, x.i.country].filter(Boolean).map(esc).join(' · ');
  return `<div class="mblock"><div class="big"><span>${x.i.head}</span></div>`
       + (about ? `<div class="sub">${about}</div><div class="sub when">${w.text}</div>` : `<div class="sub">${w.text}</div>`) + `</div>`;
}
function eventRows(now){   // for the card: a Formula 1 weekend's sessions, else the next event of each
  const rows = [];
  for(const key of CONFIG.events) eventsOf(key, now).slice(0, key === 'f1' ? 4 : 1).forEach(x => {
    const w = eventWhen(x.i, now);
    rows.push({t: x.i.t, html: `<li><span>${x.i.card}</span><span class="dt">${w.row}</span></li>`});
  });
  return rows;
}
async function loadEvents(){
  let asked = 0;
  for(const key of CONFIG.events){
    const got = [];
    let answered = false;
    for(const l of EVENT_LEAGUES[key] || []){   // one league at a time
      if(asked++) await sleep(CONFIG.queueGapMs);
      try{
        const r = await fetchT(`https://www.thesportsdb.com/api/v1/json/${CONFIG.sportsKey}/eventsnextleague.php?id=${l.id}`, 10000);
        if(!r.ok) continue;
        const j = await r.json(); answered = true;
        got.push(...(j.events || []));
      }catch(e){}
    }
    if(answered) EVENT_NEXT[key] = got;   // a failed refresh keeps the last events
  }
  renderMatches();
  renderPanel(false, 'matches');
}

// Every followed team with something to show, two at a time; the page turns every 15 s.
let MATCH_PAGE = 0, MATCH_PAGES = 1;
// Two games a page. Two games whose names do not fit side by side even at the smallest size and the short names
// (a league has such pairs: «كهرباء الإسماعيلية × الاتحاد السكندري») are learnt here and shown one to a page from then on.
const NARROW = new Set();
const pairKey = (a, b) => [a, b].map(h => (h.match(/class="tm"[^>]*>[^<]*/g) || [h]).join('|')).join('||');
function packPages(slots, per){
  const pages = [];
  for(let i = 0; i < slots.length;){
    const two = per > 1 && i + 1 < slots.length && !NARROW.has(pairKey(slots[i], slots[i + 1]));
    pages.push(slots.slice(i, i + (two ? per : 1)));
    i += two ? per : 1;
  }
  return pages;
}
// loading, failed and empty are three different things: «لا مباريات» only after an answer that had none
function matchesEmptyText(){
  return MATCHES_LOADED ? 'لا مباريات هذا الأسبوع' : MATCH_FAIL_AT ? 'تعذّر التحديث' : 'جارٍ التحميل…';
}
// when the last refresh failed and older games are on screen: «آخر تحديث …», else ''
const matchesStaleNote = () => MATCH_OK_AT && MATCH_FAIL_AT > MATCH_OK_AT ? fmtAgo(MATCH_OK_AT) : '';
function renderMatches(turn){
  if(!SLOT_MATCHES) return;
  const now = Date.now(), shown = new Set();
  let games = CONFIG.teamIds.map(id => matchSlot(id, now, shown)).filter(Boolean);
  if(CONFIG.leagues.length) games = [...games, ...leagueShow(now, shown)].sort(byRank);   // one order
  const live = focusGames(now, true);   // a followed team is playing: that game alone, big, until it ends
  const slots = live.length ? live.map(ev => gameBlock(ev, now, true))
    : [...games.map(g => g.html), ...CONFIG.events.map(k => eventSlot(k, now))].filter(Boolean);
  const row = document.getElementById('match-row');
  if(!slots.length){
    if(!MATCHES_LOADED && row.firstElementChild && !row.querySelector('.none-week')) return;   // the saved games stay until the first answer
    setHTML(row, `<div class="none-week">${matchesEmptyText()}</div>`);
    return;
  }
  const per = live.length ? 1 : CONFIG.matchesPerPage;
  let pages = packPages(slots, per);
  if(turn) MATCH_PAGE++;
  MATCH_PAGE %= pages.length;
  const draw = () => {
    const page = pages[MATCH_PAGE];
    if(!setHTML(row, page.join(''), turn && pages.length > 1)) return true;   // fitted again only when rewritten
    if(fitMatches(row) || page.length < 2) return true;
    NARROW.add(pairKey(page[0], page[1]));
    return false;
  };
  if(!draw()){ pages = packPages(slots, per); draw(); }
  MATCH_PAGES = pages.length;
  if(turn && pages.length > 1){ row.classList.remove('flip'); void row.offsetWidth; row.classList.add('flip'); }
}

// Two games side by side leave little room: «مانشستر سيتي» came out «مانشستر سـ…». A game always stays on one line:
// the row steps down in size until every game fits; still too long, the long club names take their usual short
// form (only then); still too long, renderMatches shows the two games one to a page; the ellipsis stays a last
// resort for a single game. Both games keep one size.
const TEAM_SHORT = {
  'مانشستر سيتي':'السيتي', 'مانشستر يونايتد':'اليونايتد', 'ريال مدريد':'الريال', 'أتلتيكو مدريد':'أتلتيكو',
  'باريس سان جيرمان':'باريس', 'بايرن ميونخ':'بايرن', 'بوروسيا دورتموند':'دورتموند', 'بوروسيا مونشنغلادباخ':'مونشنغلادباخ',
  'باير ليفركوزن':'ليفركوزن', 'آينتراخت فرانكفورت':'فرانكفورت', 'نوتنغهام فورست':'فورست', 'كريستال بالاس':'بالاس',
  'وولفرهامبتون':'وولفز', 'سبورتينغ لشبونة':'سبورتينغ', 'لوس أنجلوس جالاكسي':'جالاكسي', 'البنك الأهلي المصري':'البنك الأهلي',
  ...__TEAMS_SHORT__,   // NBA and NFL: the nickname without the city («ليكرز»), made by src/build.py from teams.json
};
const FIT_STEPS = [1, .92, .85, .78, .72];
const FIT_RANGE = document.createRange();
function fits(sp){   // to the fraction of a pixel: scrollWidth rounds, and a name short by 0.4 px still got «…»
  FIT_RANGE.selectNodeContents(sp);
  const cs = getComputedStyle(sp);
  return FIT_RANGE.getBoundingClientRect().width <= sp.getBoundingClientRect().width - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) + .05;
}
const shorten = sp => sp.querySelectorAll('.tm').forEach(t => { const n = t.querySelector('.nm') || t, s = t.dataset.short || TEAM_SHORT[n.textContent.trim()]; if(s) n.textContent = s; });
function fitMatches(row){
  const spans = [...row.querySelectorAll('.mblock .big > span')];
  const size = k => spans.forEach(sp => { sp.style.fontSize = k === 1 ? '' : k + 'em'; });
  const step = () => FIT_STEPS.find(k => { size(k); return spans.every(fits); });
  if(step()) return true;
  spans.forEach(shorten);
  if(step()) return true;
  size(FIT_STEPS[FIT_STEPS.length - 1]);
  return false;   // the caller may show these games apart
}
// A game is one line (clubs, crests, score, date, «بعد …»), and never ends in «…». When it is too long for the card the steps are, in this
// order: no crests on that row (the full names stay), the clubs' short names, the date's short form, a slightly smaller size. Every step starts from the full
// row again (the names and the date keep their full form in data-full), so a card that gets smaller redoes it.
const rowCut = row => {
  const r = row.getBoundingClientRect();
  return [...row.children].some(c => { const b = c.getBoundingClientRect(); return b.width && (b.left < r.left - .05 || b.right > r.right + .05); });   // as strict as fits(): a game over by half a pixel is still cut
};
function fitGameRow(li){
  const row = li.firstElementChild;
  if(!row || !row.classList.contains('mr')) return;
  const names = row.querySelectorAll('.nm'), when = row.querySelector('.mwhen');
  names.forEach(n => { if(n.dataset.full === undefined) n.dataset.full = n.textContent; n.textContent = n.dataset.full; });
  if(when){ if(when.dataset.full === undefined) when.dataset.full = when.textContent; when.textContent = when.dataset.full; }
  row.style.fontSize = '';
  row.classList.remove('nocr');
  const size = (steps = FIT_STEPS) => steps.find(k => { row.style.fontSize = k === 1 ? '' : k + 'em'; return !rowCut(row); });
  if(size([1])) return;
  row.classList.add('nocr');   // this row only: the full names are kept, the crests go (a row that fits with its crests keeps them)
  if(size([1])) return;
  shorten(row);
  if(size([1])) return;
  if(when && when.dataset.s) when.textContent = when.dataset.s;
  if(size()) return;
  size([...FIT_STEPS, .64, .56, .5]);   // a narrow card: smaller still, never two lines
}
function shortenRows(ul){
  const games = [...ul.querySelectorAll('li.mg')];
  games.forEach(fitGameRow);
  const k = Math.min(1, ...games.map(li => parseFloat(li.firstElementChild.style.fontSize) || 1));   // the games of a card share one size
  if(k < 1) games.forEach(li => { li.firstElementChild.style.fontSize = k + 'em'; });
  ul.querySelectorAll('li:not(.mg)').forEach(li => {
    const sp = li.firstElementChild;   // the other sports' rows (a race weekend, the next event): the names, then smaller, never «…»
    if(!sp || !sp.matches('span') || fits(sp)) return;
    shorten(sp);
    if(!fits(sp)) sp.querySelectorAll('img.cr').forEach(i => i.remove());
    if(!fits(sp)) FIT_STEPS.slice(1).find(k => { sp.style.fontSize = k + 'em'; return fits(sp); });
  });
}

async function fetchLast(id){

// One request at a time, CONFIG.queueGapMs apart, and never two runs at once (a slow answer would pile them up).
const loadMatches = guarded('matches', async function(){
  // never throw away a good fixture or result on a failed refresh
  let answered = 0, asked = 0;
  const leagues = CONFIG.leagues.length ? loadLeagues() : 0;   // a file on GitHub, not the sports server
  const step = async () => { if(asked++) await sleep(CONFIG.queueGapMs); };
  const failed = [];
  for(const id of CONFIG.teamIds){
    let got = 0;
    await step();
    try{
      const ev = await fetchNext(id); answered++; got++;
      if(ev){ if(MATCHES[id] && MATCHES[id].idEvent !== ev.idEvent) keepResult(id, MATCHES[id]); MATCHES[id] = ev; }
    }catch(e){}
    await step();
    try{ const l = await fetchLast(id); answered++; got++; if(l.length) RESULTS[id] = l; }catch(e){}
    if(!got) failed.push(id);
  }
  if(failed.length && !MATCH_RETRIED){ MATCH_RETRIED = true; setTimeout(loadMatches, 20000); }   // a team the server refused is asked again once
  answered += await leagues;
  if(!answered && (CONFIG.teamIds.length || CONFIG.leagues.length)){   // no answer: keep what is shown, and say so when there is nothing else
    MATCH_FAIL_AT = Date.now();
    if(!MATCHES_LOADED) setTimeout(loadMatches, CONFIG.retryMs);   // a first load that failed tries again soon, then the normal period
    renderMatches(); renderPanel(false, 'matches'); renderSlot();
    return;
  }
  MATCHES_LOADED = true; MATCH_OK_AT = Date.now(); MATCH_FAIL_AT = 0; saveTeamData();
  try{ localStorage.setItem(LS.matches, String(MATCH_OK_AT)); }catch(e){}
  renderMatches();
  renderPanel(false, 'matches');
  loadCrests();
  loadLive();   // a game already under way gets its score now, not at the next 2-minute tick
  if(CONFIG.events.length) await loadEvents();   // the other sports, after the games, one league at a time
});

const _nf = {};
function num(v, dec){
  const k = dec + NU;
  return (_nf[k] || (_nf[k] = new Intl.NumberFormat('ar-SA-u-nu-' + NU, {minimumFractionDigits:dec, maximumFractionDigits:dec}))).format(v);

// ---- the bottom-left slot: matches, weather, fasting, a countdown, or nothing (#slot=) ----
// Matches are the default; with no team or other sport followed the slot shows the weather instead of an empty line.
const SLOT_MATCHES = CONFIG.slot === 'matches' && (CONFIG.teamIds.length > 0 || CONFIG.leagues.length > 0 || CONFIG.events.length > 0);   // teams, leagues or other sports
const NEEDS_MATCHES = SLOT_MATCHES || USES('matches');   // the slot or a card
const SLOT_LABEL = {matches:'المباريات', weather:'الطقس', fasting:'الصيام', countdown:'عدّ تنازلي', markets:'الأسواق'};

// All the fasting wording is here. FAST_NAMES: the big text per day; the small line below says when.
const FAST_NAMES = {
  ramadan:'صيام رمضان', arafah:'يوم عرفة', tasua:'تاسوعاء', ashura:'عاشوراء', white:'الأيام البيض',
  mon:'صيام الإثنين', thu:'صيام الخميس', shawwal:'ست من شوال',
};
const FAST_WHEN = {
  today:'اليوم', tomorrow:'غدًا', in2:'بعد يومين',
  few:n => 'بعد ' + ar(n) + ' أيام', many:n => 'بعد ' + ar(n) + ' يومًا',
  ramadanDay:n => 'اليوم ' + ar(n) + ' من رمضان',
};
const FAST_TODAY_UNTIL = 18;   // from this hour (Riyadh) today's fast is behind us: look from tomorrow on

// What is recommended on a Hijri day (month hm, day hd, weekday wd, 0 = Sunday), best reason first.
// Always [] on the days fasting is forbidden: the two Eids and the three days of Tashreeq.
function fastReasons(hm, hd, wd){
  if((hm === 10 && hd === 1) || (hm === 12 && hd >= 10 && hd <= 13)) return [];
  const out = [];
  if(hm === 9) return ['ramadan'];
  if(hm === 12 && hd === 9) out.push('arafah');
  if(hm === 1 && hd === 9) out.push('tasua');
  if(hm === 1 && hd === 10) out.push('ashura');
  if(hd >= 13 && hd <= 15) out.push('white');
  if(wd === 1) out.push('mon');
  if(wd === 4) out.push('thu');
  if(hm === 10 && hd >= 2) out.push('shawwal');
  return out;
}
const FAST_HIJRI = new Intl.DateTimeFormat('en-u-ca-islamic-umalqura', {timeZone:'UTC', month:'numeric', day:'numeric'});
// The next day to fast from `now`: {key, days (0 = today), day (Hijri), wd, date (UTC noon)}, or null.
function fastingNext(now){
  const p = riyadhParts(now), base = Date.UTC(p.y, p.mo - 1, p.d, 12);
  for(let i = 0; i < 12; i++){
    const date = new Date(base + i*86400000);
    const h = FAST_HIJRI.formatToParts(hijriUtc(date)).reduce((a, x) => (a[x.type] = +x.value.replace(/[^0-9]/g, ''), a), {});
    const why = fastReasons(h.month, h.day, date.getUTCDay());
    if(!why.length || (i === 0 && p.h >= FAST_TODAY_UNTIL && why[0] !== 'ramadan')) continue;
    return {key:why[0], days:i, day:h.day, wd:date.getUTCDay(), date};
  }
  return null;
}

// days from today (Riyadh) to the countdown's date, or null: none set, or it has passed
function countdownDays(){
  if(!CONFIG.cd) return null;
  const p = riyadhParts(), n = (Date.parse(CONFIG.cd + 'T00:00:00Z') - Date.UTC(p.y, p.mo - 1, p.d)) / 86400000;
  return n >= 0 ? n : null;
}
// what the slot shows now: matches with no team, and a countdown that has passed, show the weather
function slotNow(){
  if(CONFIG.slot === 'none') return 'none';
  if(CONFIG.slot === 'countdown' && countdownDays() !== null) return 'countdown';
  if(CONFIG.slot === 'markets') return 'markets';
  return CONFIG.slot === 'fasting' ? 'fasting' : SLOT_MATCHES ? 'matches' : 'weather';
}
const slotBlock = (big, sub, when) => `<div class="mblock"><div class="big"><span>${big}</span></div>`
  + (sub ? `<div class="sub${when ? ' when' : ''}">${sub}</div>` : '') + '</div>';
const dayName = d => new Intl.DateTimeFormat(GREG, {timeZone:'UTC', weekday:'long'}).format(d);

// the HTML for a slot; null = nothing to say, keep what was shown last
function slotHTML(s){
  if(s === 'weather'){
    const today = FMT_DATE.format(new Date());
    const days = FORECAST.filter(d => d.date > today).slice(0, 3);   // the next three days (a saved forecast may be old)
    if(!days.length) return null;
    return days.map(d => slotBlock(dayName(new Date(d.date + 'T12:00:00Z')) + ' <span class="num">' + ar(Math.round(d.hi)) + '°</span>',
      esc(WX_CODES[d.code] || ''), true)).join('');
  }
  if(s === 'fasting'){
    const f = fastingNext(new Date());
    if(!f) return null;
    const when = f.key === 'ramadan' && f.days === 0 ? FAST_WHEN.ramadanDay(f.day)
      : f.days === 0 ? FAST_WHEN.today
      : f.days === 1 ? FAST_WHEN.tomorrow + ' ' + dayName(f.date)
      : f.days === 2 ? FAST_WHEN.in2
      : f.days <= 10 ? FAST_WHEN.few(f.days) : FAST_WHEN.many(f.days);
    return slotBlock(FAST_NAMES[f.key], when);
  }
  if(s === 'markets'){   // the chosen markets with price and change, whatever the top-left shows; nothing known yet = keep
    const known = TICKERS.filter(t => MK_LAST[t.key]).slice(0, 3);
    if(!known.length) return null;
    return known.map(t => { const v = MK_LAST[t.key];
      return slotBlock(esc(t.name) + (v.price ? ' <span class="num">' + num(v.price, t.dec) + '</span>' : ''),
        (v.pct === null ? '' : `<span class="${v.pct >= 0 ? 'up' : 'down'}">${v.pct >= 0 ? '▲' : '▼'} ${num(Math.abs(v.pct), 2)}${LATIN ? '%' : '٪'}</span>`)
        + (staleMark(v) ? `${v.pct === null ? '' : ' · '}<span class="old">${staleMark(v)}</span>` : '')); }).join('');
  }
  if(s === 'countdown'){
    const n = countdownDays();
    const name = CONFIG.cdName ? esc(CONFIG.cdName)
      : gregFmt({timeZone:'UTC', day:'numeric', month:'long'}).format(new Date(CONFIG.cd + 'T12:00:00Z'));
    return slotBlock(n === 0 ? 'اليوم' : '<span class="num">' + ar(n) + '</span> <span class="unit">يوم</span>', name);
  }
  return null;
}

// never invent a direction: unknown hides the marker

// price (in the market's own unit, or null) and the day's change in percent (or null); only what is known is shown.
// at = when the price was fetched: the last one stays on screen when a refresh fails, dimmed and marked with that time.
const MK_LAST = (()=>{ try{ return JSON.parse(localStorage.getItem(LS.mk) || '{}') || {}; }catch(e){ return {}; } })();   // market -> {price, pct, at, bad}
const saveMarkets = () => { try{ localStorage.setItem(LS.mk, JSON.stringify(MK_LAST)); }catch(e){} };
function paintMarket(t, price, pct, at){
  const okP = typeof price === 'number' && isFinite(price) && price > 0;
  const okC = typeof pct === 'number' && isFinite(pct);
  if(okP || okC){ MK_LAST[t.key] = {price: okP ? price : null, pct: okC ? pct : null, at: at || Date.now()}; if(CONFIG.slot === 'markets') renderSlot(); }

// the dim state of each market and the line under them: «آخر تحديث ٣:١٥ م» (the oldest price that is not current), or «غير محدّث»
function paintMkUp(){
  if(!CONFIG.mkBar) return;

  up.hidden = false;

// The deadline covers the answer's headers and its body: the timer stops when the body has been read (or the request failed),
// so a server that sends headers and then stalls ends in an error like a slow one. The answer has what the callers use:
// ok, status, json(), text(), blob().
async function fetchT(url, ms){
  const c = new AbortController(); const id = setTimeout(()=>c.abort(), ms||12000);
  let r;
  try{ r = await fetch(url,{cache:'no-store', signal:c.signal}); }
  catch(e){ clearTimeout(id); throw e; }
  if(!r.ok) clearTimeout(id);   // nobody reads the body of an error
  const body = kind => async () => { try{ return await r[kind](); }finally{ clearTimeout(id); } };
  return {ok:r.ok, status:r.status, json:body('json'), text:body('text'), blob:body('blob')};
}

// ---- prices. First the file CI keeps (.github/tools/market_prices.py, branch data-markets): one download holds every market and the
// common stocks, so the TVs do not each ask Yahoo. A symbol that is not in it, or a file older than 3 hours, is asked of Yahoo itself.
const MARKET_URL = 'https://raw.githubusercontent.com/tshi-dev/UrTV/data-markets/markets/markets.json';
const MARKET_TRUST_MS = 3*3600000;
let MARKET_FILE = null;   // {updated, quotes: {symbol: {p, v, c, t}}}
async function loadMarketFile(){
  try{
    const r = await fetchT(MARKET_URL, 12000);
    if(r.ok){ const j = await r.json(); if(j && j.quotes && Date.parse(j.updated)) MARKET_FILE = j; }
  }catch(e){}                                  // offline: the copy from before, which fileQuote() trusts for 3 hours only
}
function fileQuote(sym){
  const q = MARKET_FILE && MARKET_FILE.quotes[sym], at = q ? Date.parse(q.t) : 0;
  return q && typeof q.p === 'number' && Date.now() - at < MARKET_TRUST_MS ? {p:q.p, v:q.v || null, c:q.c || [], at} : null;
}

// Yahoo has no CORS headers: try it directly (works inside the app), then through public CORS gateways. The gateways are for a network
// or CORS error (a TypeError) only: an answer, 404 for a symbol that does not exist or 429 for too many requests, is final, and
// the gateways would only repeat the request. A symbol that answered 404 is not asked again for a day.
const YH_404 = (()=>{ try{ return JSON.parse(localStorage.getItem('yh404') || '{}') || {}; }catch(e){ return {}; } })();
const YH_404_MS = 86400000;
async function yahooChart(sym, q = 'interval=1d&range=5d'){
  if(Date.now() - (YH_404[sym] || 0) < YH_404_MS) throw 0;
  const gone = () => { YH_404[sym] = Date.now(); try{ localStorage.setItem('yh404', JSON.stringify(YH_404)); }catch(e){} throw 0; };
  const direct = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(sym)}?${q}`;
  const routes = [
    [direct, 7000, j => j, false],
    ['https://api.allorigins.win/get?url=' + encodeURIComponent(direct), 15000, w => JSON.parse(w.contents), true],
    ['https://corsproxy.io/?url=' + encodeURIComponent(direct), 12000, j => j, true],
  ];
  for(const [url, ms, unwrap, proxy] of routes){
    let r;
    try{ r = await fetchT(url, ms); }
    catch(e){ if(e instanceof TypeError) continue; throw 0; }   // blocked or offline: the next route; a timeout is not that
    if(!r.ok){ if(proxy) continue; if(r.status === 404) gone(); throw 0; }
    let j;
    try{ j = unwrap(await r.json()); }catch(e){ continue; }
    if(j && j.chart && j.chart.result) return j;
    if(j && j.chart && j.chart.error && j.chart.error.code === 'Not Found') gone();
  }
  throw 0;
}

// What one symbol is now, from its own source: {p: price, v: the close before (or null), c: the day's closes, pct: the day's change when the
// source says it, at: now}, or null. intra = 15-minute closes of today (the stocks card draws them); else the daily closes of five days
// (the markets line only needs the change).
async function directQuote(j){
  try{
    if(j.cg){                                  // crypto: CoinGecko, CORS friendly
      const r = await fetchT(`https://api.coingecko.com/api/v3/simple/price?ids=${j.cg}&vs_currencies=usd&include_24hr_change=true`, 10000);
      if(!r.ok) throw 0;
      const c = (await r.json())[j.cg];
      if(!c || typeof c.usd !== 'number') throw 0;
      return {p:c.usd, v:null, c:[], pct:c.usd_24h_change != null ? c.usd_24h_change : (c.usd_24hr_change != null ? c.usd_24hr_change : null), at:Date.now()};
    }
    const res = (await yahooChart(j.key, j.intra ? 'interval=15m&range=1d' : 'interval=1d&range=5d')).chart.result[0];
    const price = res.meta.regularMarketPrice;
    if(typeof price !== 'number') throw 0;
    let c = ((res.indicators.quote[0] || {}).close || []).filter(x => typeof x === 'number');
    const was = res.meta.chartPreviousClose || res.meta.previousClose || null;
    if(!j.intra) return {p:price, v:c.length >= 2 ? c[c.length-2] : was, c:[], at:Date.now()};
    if(c.length > 30){ const n = Math.ceil(c.length / 30); c = c.filter((x, i) => i % n === 0 || i === c.length - 1); }
    return {p:price, v:was, c, at:Date.now()};
  }catch(e){ return null; }
}

// How old a price is, for the screen: '' while it is current, else «آخر تحديث ٣:١٥ م» (its fetch time), and «غير محدّث» past 24 hours.
const DAY_MS = 86400000;
function staleMark(v){
  if(!v) return '';
  const old = v.at && Date.now() - v.at > DAY_MS;
  if(!v.bad && !old) return '';
  return v.at && !old ? fmtAgo(v.at) : 'غير محدّث';
}

// One tick for the markets line and the stocks card: each symbol once (a stock on both is asked once), one request at a time.
const WITH_LINE = !CONFIG.widget && (CONFIG.mkBar || CONFIG.slot === 'markets');   // no line in the launcher's page; hidden = no requests (unless the slot shows them)
const loadMarkets = guarded('markets', async function(){
  const jobs = new Map();   // Yahoo symbol -> {key, cg, intra, tk: its markets, sk: its stocks}
  const job = (key, cg, intra) => {
    let j = jobs.get(key);
    if(!j) jobs.set(key, j = {key, cg, intra:false, tk:[], sk:[]});
    j.intra = j.intra || intra;
    return j;
  };
  if(WITH_LINE) TICKERS.forEach(t => job(t.fk, t.cg, false).tk.push(t));
  if(USES('stocks')) CONFIG.stocks.forEach(k => job(isSA(k) ? k + '.SR' : k, null, true).sk.push(k));
  if(!jobs.size) return;
  await loadMarketFile();
  let asked = 0;
  for(const j of jobs.values()){
    let q = fileQuote(j.key);
    if(!q){ if(asked++) await sleep(CONFIG.queueGapMs); q = await directQuote(j); }
    for(const t of j.tk){
      if(q) paintMarket(t, typeof q.p === 'number' ? q.p * (t.mul || 1) : null,
        typeof q.pct === 'number' ? q.pct : q.v ? (q.p - q.v) / q.v * 100 : null, q.at);
      else if(MK_LAST[t.key]) MK_LAST[t.key].bad = 1;                       // offline or refused: the last price stays, marked
      else if(!document.getElementById(t.chg).textContent) paintDir(t, null);
    }
    for(const k of j.sk){
      if(q) STOCKS[k] = {p:q.p, v:q.v, c:q.c, at:q.at};
      else if(STOCKS[k]) STOCKS[k].bad = 1;
    }
  }
  if(CONFIG.stocks.length && USES('stocks')){
    try{ localStorage.setItem(LS.stocks, JSON.stringify(STOCKS)); }catch(e){}
    renderPanel(false, 'stocks');
  }
  if(WITH_LINE){ saveMarkets(); paintMkUp(); if(CONFIG.slot === 'markets') renderSlot(); }
});
const loadStocks = loadMarkets, loadTickers = loadMarkets;

const SKIP_TYPES = ['News','Talk Show','Sports','Game Show'];
let WEEK_OK_AT = 0, WEEK_FAIL_AT = 0;   // the last refresh that kept its answer, and the last one that failed (0 = never)
// TVmaze, one request at a time CONFIG.weekGapMs apart. null = no answer (a failed request), [] = an answer with nothing in it.
const loadWeek = guarded('week', async function(){
  const F = CONFIG.shows, seen = new Set(), out = [];
  let asked = 0, failed = 0, answered = 0;
  const ask = async url => {
    if(asked++) await sleep(CONFIG.weekGapMs);
    try{ const r = await fetchT(url, 12000); if(!r.ok) throw 0; const j = await r.json(); answered++; return j; }
    catch(e){ failed++; return null; }
  };
  const days = [];
  for(let i=0;i<7;i++) days.push(FMT_DATE.format(new Date(Date.now()+i*86400000)));
  const inWeek = d => d && d >= days[0] && d <= days[6];
  const add = (s, e, picked) => {
    if(!s || !s.name || seen.has(s.name)) return;
    seen.add(s.name);
    const prem = e.number === 1;
    out.push({
      name: s.name,
      ep: e.season ? (prem ? `الموسم ${ar(e.season)}` : `الموسم ${ar(e.season)} · ح ${ar(e.number)}`) : '',
      date: e.airdate || '',
      rating: (s.rating && s.rating.average) || 0,
      prem, picked
    });
  };

  // shows picked one by one: their next episode, if it airs this week
  for(const id of F.ids){
    const s = await ask(`https://api.tvmaze.com/shows/${id}?embed=nextepisode`);
    const e = s && s._embedded && s._embedded.nextepisode;
    if(e && inWeek(e.airdate)) add(s, e, true);
  }

  // the schedule, narrowed by genre and language; skipped when only picked shows were chosen
  if(!F.ids.length || F.genres.length || F.langs.length){
    const lists = [];
    for(const dt of days){
      lists.push(await ask(`https://api.tvmaze.com/schedule/web?date=${dt}`));
      for(const c of F.countries) lists.push(await ask(`https://api.tvmaze.com/schedule?country=${encodeURIComponent(c)}&date=${dt}`));
    }
    lists.filter(Array.isArray).reduce((all, list) => all.concat(list), []).forEach(e => {
      const s = e.show || (e._embedded && e._embedded.show) || {};
      if(s.type && SKIP_TYPES.includes(s.type)) return;
      if(s.genres && s.genres.includes('Soap')) return;   // no daytime soaps
      if(!e.number || e.number < 1) return;
      if(e.season && e.season > 15) return;               // keep it to real series
      if(((s.rating && s.rating.average) || 0) < F.minRating) return;
      if(F.genres.length && !(s.genres || []).some(g => F.genres.includes(g))) return;
      if(F.langs.length && !F.langs.includes(s.language)) return;
      add(s, e, false);
    });
  }

  // The pool is replaced only when every day answered: a list made of some days is a wrong list. With no list yet, some is better than none.
  const whole = answered > 0 && failed === 0;
  if(!whole && !(answered > 0 && !WEEK_POOL.length && out.length)){
    WEEK_FAIL_AT = Date.now();
    if(!WEEK_OK_AT) setTimeout(loadWeek, CONFIG.retryMs);   // a first load that failed tries again soon
    renderPanel(false, 'shows');
    return;
  }
  WEEK_POOL = out.sort((a,b)=> (b.picked - a.picked) || (b.prem - a.prem) || a.date.localeCompare(b.date)).slice(0, 50);
  CARDS.forEach(c => { if(c.kind === 'shows') c.page = 0; });
  WEEK_OK_AT = Date.now(); WEEK_FAIL_AT = 0;
  WEEK_LOADED = true;
  renderPanel(false, 'shows');
});

const WEEK_ROWS = 5;
const MATCH_ROWS = 4;   // the games card: each game takes two lines (teams, date and time)
let WEEK_POOL = [], WEEK_LOADED = false;

// «جديد المسلسلات»: this card's page of the pool (card.page counts pages of card.cap, or WEEK_ROWS, rows)
function renderWeekPage(card, animate){
  const ul = card.ul;
  if(!WEEK_POOL.length){
    if(!WEEK_LOADED && !WEEK_FAIL_AT) return;   // the saved list stays until the first answer
    if(!WEEK_LOADED && ul.firstElementChild && !ul.firstElementChild.classList.contains('empty')) return;
    ul.classList.remove('flip');
    setHTML(ul, `<li class="empty">${WEEK_LOADED ? 'لا جديد هذا الأسبوع' : 'تعذّر التحديث'}</li>`);
    return;
  }
  const per = card.cap || WEEK_ROWS, start = (card.page * per) % WEEK_POOL.length;
  const rows = [];
  for(let i = 0; i < Math.min(per, WEEK_POOL.length); i++){
    rows.push(WEEK_POOL[(start + i) % WEEK_POOL.length]);
  }
  setHTML(ul, rows.map(o=>{
    const dt = o.date ? new Intl.DateTimeFormat(GREG,{timeZone:CONFIG.timezone,weekday:'short'}).format(new Date(o.date+'T12:00:00Z')) : '';
    return `<li><span>${esc(o.name)}</span>`
         + (o.ep?`<span class="ep">${ar(o.ep)}</span>`:'')
         + (o.rating ? `<span class="rt">${ar(o.rating.toFixed(1)).replace('.', LATIN ? '.' : '٫')}</span>` : '')
         + (dt?`<span class="dt">${dt}</span>`:'') + '</li>';
  }).join(''), animate);
  ul.classList.remove('flip');
  if(animate){ void ul.offsetWidth; ul.classList.add('flip'); }
}

// The launcher's «المهام» card is a button (#live=1): the page draws its mic mark and its ring; Android owns the focus and OK.
// setLiveFocus(true|false) is called by the launcher when the card gets or loses the focus; liveRect() says where the card is

try{ FORECAST = JSON.parse(localStorage.getItem(LS.forecast) || '[]') || []; }catch(e){}
const PANEL_TITLE = {today:'يومك', shows:'هذا الأسبوع', prayers:'مواقيت اليوم', nextprayer:'الصلاة القادمة', forecast:'الأيام القادمة', hourly:'الساعات القادمة', matches:CONFIG.leagues.length ? 'المباريات' : 'مباريات فرقك', tasks:'المهام', year:'السنة'};

// ---- «يومك» (today): the day in one card: the next prayer, the next game of a followed team, the first open task, the next

function nextFollowedGame(now){
  const seen = new Set(), all = [];
  CONFIG.teamIds.forEach(id => [MATCHES[id], ...(NEXT_LIST[id] || [])].forEach(ev => {
    if(!ev || !ev.idEvent || seen.has(ev.idEvent)) return;

    if(isNaN(k) || FINAL.includes(st) || CALLED_OFF.test(st) || now >= k + durMs(ev) || k - now > CONFIG.weekWindowDays * 86400000) return;
    all.push({ev, k});
  }));
  all.sort((a, b) => a.k - b.k);
  return all.length ? all[0] : null;
}
const tdRow = (k, v, r) => `<li class="td"><span class="k">${k}</span><span class="v">${v}</span>${r ? `<span class="r">${r}</span>` : ''}</li>`;
function todayCard(){

  }
  const g = nextFollowedGame(now);
  if(g){

// ---- a followed team's game under way, big: its score, the minute and «مباشر» (item 2). The matches card and the bottom slot
// show it alone, with both crests where there are crests (on both match surfaces), until it ends; then they go back to the list.
function liveWhen(ev){   // «مباشر» and «الدقيقة ٦٧» / «استراحة» / «بدأت ٦:٣٠ م»
  const p = hmParts(toDate(ev));
  return `<span class="live">مباشر</span> · ${liveStatus(ev, ar(fmtTime(+p.hour % 24, +p.minute)))}`;
}
const liveScore = ev => ev.intHomeScore != null && ev.intAwayScore != null ? `<span class="sc">${ar(+ev.intHomeScore)} - ${ar(+ev.intAwayScore)}</span>` : '<span class="sc">×</span>';
function liveRow(ev){   // a row of the card: «الهلال [شعار] ٢ - ١ [شعار] النصر», the crests next to the score
  return `<li class="lv"><div class="lvm">${liveWhen(ev)}</div><div class="lvt"><span class="tm"><span class="nm">${esc(teamAr(ev.strHomeTeam, ev.idHomeTeam))}</span>${crestImg(ev, 'Home')}</span>`
    + `${liveScore(ev)}<span class="tm">${crestImg(ev, 'Away')}<span class="nm">${esc(teamAr(ev.strAwayTeam, ev.idAwayTeam))}</span></span></div></li>`;
}
// one line, always: the names step down in size, then take their short forms, then lose their crests (as the list's rows do)
function fitLive(ul){
  ul.querySelectorAll('.lvt').forEach(t => {
    const ok = () => t.scrollWidth <= t.clientWidth + .5;
    const step = (steps = FIT_STEPS) => steps.find(k => { t.style.setProperty('--k', k); return ok(); });
    if(step()) return;
    shorten(t);
    if(step()) return;
    t.querySelectorAll('img.cr').forEach(i => i.remove());
    step([...FIT_STEPS, .64, .56, .5]);   // a narrow card: smaller still, never two lines
  });
}

// ---- «البطاقة الذكية» (smart): the card for what matters now, picked again with every redraw (the clock timers draw it every 15 s,
// so a change shows within a minute); no request of its own, it shows what the other cards load. In this order:
//  1. a followed team's game is live, or starts within 60 minutes: the matches card, with that game;
//  2. within 15 minutes of a prayer: the prayers' row, with the minutes left in its title (before the adhkar: the last quarter
//     hour of the adhkar window is the wait for Dhuhr or Maghrib, and the prayer is what matters then);
//  3. the adhkar window (morning from Fajr to Dhuhr, evening from Asr to Maghrib): the adhkar card;
//  4. otherwise: the next hours' weather.
const SMART_GAME_MIN = 60, SMART_PRAYER_MIN = 15;
// the followed teams' games that are live now, or (not liveOnly) start within SMART_GAME_MIN minutes: [ev] in time order
function focusGames(now, liveOnly){
  const seen = new Set(), out = [];
  CONFIG.teamIds.forEach(id => [MATCHES[id], ...(NEXT_LIST[id] || [])].forEach(ev => {
    if(!ev || !ev.idEvent || seen.has(ev.idEvent)) return;
    seen.add(ev.idEvent);
    const k = toDate(ev).getTime(), st = (ev.strStatus || '').toUpperCase();
    if(isNaN(k) || FINAL.includes(st) || CALLED_OFF.test(st)) return;
    const live = now >= k && now < k + durMs(ev), soon = now < k && k - now <= SMART_GAME_MIN * 60000;
    if(live || (soon && !liveOnly)) out.push(ev);
  }));
  return out.sort((a, b) => toDate(a) - toDate(b));
}
function prayerSoon(minutes){   // is a prayer's adhan within that many minutes?
  const p = riyadhParts(), now = p.h * 60 + p.mi + p.s / 60;
  return PRAYERS.some(x => { const d = x.h * 60 + x.mi - now; return d > 0 && d <= minutes; });
}
function smartKind(now = Date.now()){
  if(CONFIG.teamIds.length && focusGames(now).length) return 'matches';
  if(prayerSoon(SMART_PRAYER_MIN)) return 'prayerrow';
  const w = adhkarWindow();
  if(w === 'morning' || w === 'evening') return 'adhkar';
  return 'hourly';
}


// the header: HTML when the kind has icons or a note in it, else its title (the two never share a stale copy)
function paintHd(hd, title, html){
  if(html) setHTML(hd, html); else { setText(hd, title); hd.__h = null; }
}

// Draw the cards of these kinds (none given = all). A kind may sit in a smart or «يومك» card, which follow the same data.
function renderPanel(animate, ...kinds){
  for(const c of CARDS){
    if(kinds.length && !kinds.includes(c.kind) && c.kind !== 'smart' && c.kind !== 'today') continue;
    renderCard(c, animate);
  }
  fitCards();
  if(CONFIG.football) fbRender();   // the football home and «المباريات» redraw with the cards' data
  if(CONFIG.matchPage) mpRender();
}

function renderCard(card, animate, keepSize){
  const ul = card.ul, hd = card.hd;
  const was = card.eff;
  card.eff = card.kind === 'smart' ? smartKind() : card.kind;
  const P = card.eff;
  ul.classList.toggle('pgrid', P === 'prayers');
  card.el.classList.toggle('boxes', P === 'prayers');
  if(P !== was){   // the smart card changed its mind: a fresh page of the new kind
    card.page = 0; card.skip = 0; card.maxLen = 0; ul.__h = null;
    if(was === 'adhkar'){ clearTimeout(card.ad.t); card.ad.t = 0; card.ad.mode = ''; }
  }
  if(!keepSize){ card.z = 1; card.cap = 0; card.maxLen = 0; card.zi = 0; card.ri = 0; card.el.style.removeProperty('--z'); }
  if(P === 'shows'){
    if(WEEK_OK_AT && WEEK_FAIL_AT > WEEK_OK_AT) paintHd(hd, '', `<span>${PANEL_TITLE.shows}</span><span class="until">${fmtAgo(WEEK_OK_AT)}</span>`);
    else paintHd(hd, PANEL_TITLE.shows);
    renderWeekPage(card, animate); return;
  }
  card.el.classList.toggle('stocks', P === 'stocks');   // 24 px of its own inside
  let rows = [];
  if(P === 'prayers') rows = prayerRows();
  else if(P === 'forecast') rows = forecastRows();
  else if(P === 'hourly') rows = hourlyRows();
  else if(P === 'prayerrow'){ const q = prayerRowCard(); paintHd(hd, q.title); rows = q.rows; }
  else if(P === 'nextprayer') rows = nextPrayerRows();
  else if(P === 'matches') rows = matchRows(card);
  else if(P === 'year') rows = [yearCard(card)];
  else if(P === 'today'){ const q = todayCard(); paintHd(hd, q.title); rows = q.rows; }
  else if(P === 'tasks') rows = CONFIG.tasks.map(t => `<li class="task"><span>${esc(t)}</span></li>`);
  else if(P === 'verse'){ const q = quoteOfDay(card); paintHd(hd, q.title); rows = q.rows; }
  else if(P === 'wisdom'){ const q = wisdomOfDay(); paintHd(hd, q.title); rows = q.rows; }
  else if(P === 'adhkar'){ const q = adhkarCard(card); paintHd(hd, q.title, q.hd); rows = q.rows; }
  else if(P === 'stocks'){ const q = stocksCard(); paintHd(hd, '', q.hd); rows = q.rows; }
  if(P === 'matches' && matchesStaleNote()) paintHd(hd, '', `<span>${PANEL_TITLE.matches}</span><span class="until">${matchesStaleNote()}</span>`);
  else if(PANEL_TITLE[P]) paintHd(hd, PANEL_TITLE[P]);
  if(!rows.length){
    if(P === 'matches' && !MATCHES_LOADED && ul.firstElementChild && !ul.firstElementChild.classList.contains('empty')) return;
    if(P === 'matches' && ul.firstElementChild && ul.firstElementChild.classList.contains('empty') && ul.firstElementChild.textContent === matchesEmptyText()) return;   // the saved games stay until the first answer
    ul.classList.remove('flip');
    setHTML(ul, `<li class="empty">${P === 'matches' ? matchesEmptyText() : P === 'tasks' ? 'لا مهام اليوم' : 'لا تتوفر بيانات الآن'}</li>`);
    return;
  }
  const per = card.cap || (P === 'matches' ? MATCH_ROWS : WEEK_ROWS);
  if((P === 'matches' || P === 'stocks' || P === 'tasks') && rows.length > per){        // page through, like the shows
    if(P === 'matches'){   // fixed pages, each game once a lap; the last holds what is left
      const pages = Math.ceil(rows.length / per), start = (card.page % pages) * per;
      rows = rows.slice(start, start + per);
    }else{
      const start = (card.page * per) % rows.length;
      rows = Array.from({length: per}, (_, i) => rows[(start + i) % rows.length]);
    }
  }
  const wrote = setHTML(ul, rows.join(''), animate);
  if(!keepSize){ card.base = rows.length; card.len0 = card.len || 0; }   // what full size holds: the rows of a page, the length of the text
  if(P === 'matches'){ fillCrests(ul); if(wrote){ shortenRows(ul); fitLive(ul); } }
  fitQuote(ul);
  if(CONFIG.tafsir) fitTafsir(ul);
  ul.classList.remove('flip');
  if(animate){ void ul.offsetWidth; ul.classList.add('flip'); }
}

// ---- sizing in the launcher. The cards share the box of the WebView (two or three of them). A card that does not fit steps
// down in text size, then in rows per page (a list), then picks a shorter text (a verse, a hadith, a dhikr); the one that is
// cut off or tallest goes first. One card keeps the box to itself and is never changed, as it always was.
// How a card gets smaller, one step at a time. Its text size comes from Z_STEPS (card.zi); a list may also give rows (card.ri
// of them gone: the pages are shorter, and every row still comes round), a verse or a dhikr ask for a shorter text (card.ri
// times a fifth shorter than the day's). A card that is too tall gives rows first, a quote comes down to .82 before a shorter
// text is looked for; one that is too wide (a name that would end in «…») can only give text size.
const Z_STEPS = [1, .94, .88, .82, .76, .7, .64];
function cardCut(card){   // a name or a cell wider than its place: it would end in «…» or run into the next
  for(const e of card.el.querySelectorAll('li, li *, .hd > span')){
    if(e.clientWidth > 0 && e.scrollWidth > e.clientWidth + 1) return true;
    // the screensaver's pair is measured to the fraction of a pixel (fits()): a source line over by half a pixel ended in «…» there
    if(!CONFIG.widget && e.clientWidth > 0 && e.scrollWidth >= e.clientWidth && getComputedStyle(e).textOverflow === 'ellipsis' && !fits(e)) return true;
  }
  return false;
}
// The screensaver's pair is read from the sofa: its text never goes below a floor (a row's text 2.1vh, every other line 1.45vh);
// at the floor a verse or a dhikr takes a shorter text and a list fewer rows, as the home screen's cards do, instead of a smaller size.
const PAIR_FLOOR = {row: .021, small: .0145};
// (a text that is smaller than its floor at full size is not made smaller at all)
function aboveFloor(c){
  const vh = innerHeight, z = parseFloat(c.el.style.getPropertyValue('--z')) || 1, px = e => parseFloat(getComputedStyle(e).fontSize);
  const under = (e, floor) => { const now = px(e); return now < Math.min(floor * vh, now / z) - .05; };
  for(const li of c.ul.children) if(li.textContent.trim() && under(li, PAIR_FLOOR.row)) return false;
  for(const e of c.el.querySelectorAll('.hd, li *')) if(e.children.length === 0 && e.textContent.trim() && under(e, PAIR_FLOOR.small)) return false;
  return true;
}
function shrinkCard(c, tooWide){   // false when there is no step left
  if(!CONFIG.widget){   // the pair: a smaller size only while it stays above the floor; else the other ways
    const zi = c.zi;
    if(c.zi < Z_STEPS.length - 1){
      c.zi++; c.el.style.setProperty('--z', Z_STEPS[c.zi]);
      const ok = aboveFloor(c);
      c.zi = zi; c.el.style.setProperty('--z', Z_STEPS[zi]);
      if(!ok) return shrinkByContent(c);
    }else return shrinkByContent(c);
  }
  const list = LISTS.includes(c.eff), quote = c.eff === 'verse' || c.eff === 'adhkar', zLeft = c.zi < Z_STEPS.length - 1;
  if(tooWide){ if(!zLeft) return false; c.zi++; }
  else if(list && c.ri < c.base - 1) c.ri++;
  else if(quote && c.zi < 3) c.zi++;
  else if(quote && c.ri < 6) c.ri++;
  else if(zLeft) c.zi++;
  else return false;
  const cap = list && c.ri ? c.base - c.ri : 0, maxLen = quote && c.ri ? Math.max(20, Math.floor(c.len0 * Math.pow(.8, c.ri))) : 0;
  c.z = Z_STEPS[c.zi];
  c.el.style.setProperty('--z', c.z);
  if(c.eff === 'matches') shortenRows(c.ul);   // smaller text: a row may keep more of its names and date now
  if(cap !== c.cap || maxLen !== c.maxLen){ c.cap = cap; c.maxLen = maxLen; renderCard(c, false, true); }
  return true;
}
// at the pair's floor: fewer rows of a list, a shorter verse or dhikr; false when neither is left (the card is then as it is)
function shrinkByContent(c){
  const list = LISTS.includes(c.eff), quote = c.eff === 'verse' || c.eff === 'adhkar';
  if(list && c.ri < c.base - 1) c.ri++;
  else if(quote && c.ri < 6) c.ri++;
  else return false;
  const cap = list ? c.base - c.ri : 0, maxLen = quote ? Math.max(20, Math.floor(c.len0 * Math.pow(.8, c.ri))) : 0;
  if(cap !== c.cap || maxLen !== c.maxLen){ c.cap = cap; c.maxLen = maxLen; renderCard(c, false, true); }
  return true;
}
// The screensaver's pair beside the small clock (#panel2=) is fitted the same way: its box is the middle row, which may not push
// the bottom row down (and keeps 2vh of air); the pair is drawn the same height, so while it is fitted each card has its own.
function fitCards(){
  if(CARDS.length < 2) return;
  const mid = document.querySelector('.mid');
  const tooTall = CONFIG.widget ? () => mid.getBoundingClientRect().height > innerHeight + .5 : pairTooTall;
  mid.classList.add('fit');
  try{
    for(let g = 0; g < 120; g++){
      const tall = tooTall();
      const cut = CARDS.filter(cardCut);
      if(!tall && !cut.length) return;
      // the cut-off cards first; then, only if the box is too tall, the tallest that can still give something
      if(cut.some(c => shrinkCard(c, true))) continue;
      if(!tall || !CARDS.slice().sort((a, b) => b.el.offsetHeight - a.el.offsetHeight).some(c => shrinkCard(c))) return;
    }
  }finally{ mid.classList.remove('fit'); }
}
function pairTooTall(){
  const stage = document.querySelector('.stage'), cs = getComputedStyle(stage);
  const room = stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - 2 * parseFloat(cs.rowGap)
    - document.querySelector('.top').offsetHeight - document.querySelector('.bottom').offsetHeight - .02 * innerHeight;
  return Math.max(...CARDS.map(c => c.el.offsetHeight)) > room + .5;
}

// the year's numbers, shared by the card and the strip: the Gregorian year in Riyadh time, its days, today's number
function yearFacts(){
  const p = riyadhParts(new Date(Date.now())), y = p.y;
  const total = (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0 ? 366 : 365;
  const day = Math.round((Date.UTC(y, p.mo - 1, p.d) - Date.UTC(y, 0, 1)) / 864e5) + 1;
  const pct = Math.round(100 * day / total);
  return {y, total, day, pct, text: `اليوم <b>${ar(day)}</b> من ${ar(total)} · ${ar(pct)}${LATIN ? '%' : '٪'}`};
}

// ---- «السنة»: a dot for every day of this Gregorian year (Riyadh time). Drawn again only when the day changes.
function yearCard(card){
  const {y, total, day, pct, text} = yearFacts();
  const COLS = 36, ROWS = Math.ceil(total / COLS), PITCH = 10, R = 3.2;
  const rows = [];
  for(let r = 0; r < ROWS; r++){
    let g = '';
    for(let c = 0; c < COLS; c++){
      const n = r * COLS + c + 1;
      if(n > total) break;
      const cx = (COLS - 1 - c) * PITCH + PITCH / 2, cy = r * PITCH + PITCH / 2;   // right to left, like the page
      if(n < day) g += `<circle class="on" cx="${cx}" cy="${cy}" r="${R}" fill-opacity="${(.28 + .72 * n / day).toFixed(2)}"/>`;
      else if(n === day) g += `<circle class="halo" cx="${cx}" cy="${cy}" r="${R * 3}" fill-opacity=".12"/><circle class="halo" cx="${cx}" cy="${cy}" r="${R * 1.9}" fill-opacity=".28"/><circle class="now" cx="${cx}" cy="${cy}" r="${R * 1.15}"/>`;
      else g += `<circle class="off" cx="${cx}" cy="${cy}" r="${R}"/>`;
    }
    rows.push(`<g class="r" style="--i:${r}">${g}</g>`);
  }
  const anim = !card.yearShown;
  card.yearShown = true;
  const svg = `<svg viewBox="-10 -10 ${COLS * PITCH + 20} ${ROWS * PITCH + 20}" role="img" aria-label="${ar(day)} / ${ar(total)}">${rows.join('')}</svg>`;
  return `<li class="yr${anim ? ' fill' : ''}"><div class="yn">${ar(y)}</div>${svg}`
       + `<div class="yt">${text}</div></li>`;
}

// ---- the slim year strip under the clock (#yearstrip=1): 365/366 dots in 7 rows of 53, from the right, top row first;
// the passed days light up toward gold, today glows, the rest stay faint. No text line. Drawn again only when the day changes;
// fitYearStrip() runs after every clock redraw: no wider than the clock, hidden when the room under it is too small.
function renderYearStrip(){
  const el = document.getElementById('ystrip');
  if(!el || !CONFIG.yearStrip || CONFIG.widget) return;
  const {y, total, day} = yearFacts(), key = y + ':' + day + ':' + LATIN;
  if(el.dataset.key !== key){
    el.dataset.key = key;
    const COLS = 53, ROWS = 7, PITCH = 6, R = 2;   // the viewBox is 4 px dots and 2 px gaps; CSS scales it with the screen
    let g = '';
    for(let n = 1; n <= total; n++){
      const c = (n - 1) % COLS, r = Math.floor((n - 1) / COLS);
      const cx = (COLS - 1 - c) * PITCH + PITCH / 2, cy = r * PITCH + PITCH / 2;
      if(n < day) g += `<circle class="on" cx="${cx}" cy="${cy}" r="${R}" fill-opacity="${(.3 + .7 * n / day).toFixed(2)}"/>`;
      else if(n === day) g += `<circle class="halo" cx="${cx}" cy="${cy}" r="${R * 1.9}" fill-opacity=".25"/><circle class="now" cx="${cx}" cy="${cy}" r="${R * 1.1}"/>`;
      else g += `<circle class="off" cx="${cx}" cy="${cy}" r="${R}"/>`;
    }
    el.innerHTML = `<svg viewBox="0 0 ${COLS * PITCH} ${ROWS * PITCH}" role="img" aria-label="${ar(day)} / ${ar(total)}">${g}</svg>`;
  }
  fitYearStrip();
}
function fitYearStrip(){
  const el = document.getElementById('ystrip');
  if(!el || !CONFIG.yearStrip || CONFIG.widget) return;
  el.hidden = false; el.style.removeProperty('--yp');
  const clock = document.querySelector('.clock').getBoundingClientRect(), wrap = document.querySelector('.clockwrap').getBoundingClientRect();
  const bottom = document.querySelector('.bottom').getBoundingClientRect();
  let pitch = el.querySelector('svg').getBoundingClientRect().width / 53;   // 6 px at 960 wide
  if(pitch * 53 > clock.width) { pitch = clock.width / 53; el.style.setProperty('--yp', pitch + 'px'); }
  const h = el.getBoundingClientRect().height, room = bottom.top - wrap.bottom - 4;
  if(pitch < 3 || h + parseFloat(getComputedStyle(el).marginTop) > room) el.hidden = true;
}

function prayerRows(){
  if(!DAY_TIMES) return [];
  const p = riyadhParts(), mins = p.h * 60 + p.mi + p.s / 60;
  const names = {Fajr:'الفجر', Sunrise:'الشروق', Dhuhr:isFriday() ? 'الجمعة' : 'الظهر', Asr:'العصر', Maghrib:'المغرب', Isha:'العشاء'};
  // The lit box is the one the bottom panel names (tickPrayer): during the iqama wait the prayer that has just been called, else the next
  // of the five, and after Isha tomorrow's Fajr. The sunrise is not a prayer and is never lit. Before Fajr nothing is past.
  const at = k => { const [h, mi] = String(DAY_TIMES[k]).split(':').map(Number); return h * 60 + mi; };
  const cur = PRAYERS.find(x => { const gap = x.key === 'Dhuhr' && isFriday() ? 0 : (CONFIG.iqama[x.key] || 0); return mins >= at(x.key) && mins < at(x.key) + gap; });
  const lit = cur ? cur.key : (PRAYERS.find(x => at(x.key) > mins) || PRAYERS[0] || {}).key;
  const tomorrow = !cur && PRAYERS.length && !PRAYERS.some(x => at(x.key) > mins);
  return Object.keys(names).filter(k => DAY_TIMES[k]).map(k => {
    const [h, mi] = String(DAY_TIMES[k]).split(':').map(Number);
    const cls = k === lit ? 'next' : at(k) <= mins && !(tomorrow && k === lit) ? 'past' : '';
    return `<li class="${cls}"><span>${names[k]}</span><span class="dt">${fmtTime(h, mi)}</span></li>`;
  });
}

// the city's date as YYYY-MM-DD, and the one after it
const cityToday = (ms = Date.now()) => FMT_DATE.format(new Date(ms));
// A saved forecast can be days old: the rows are the days from today in the city's zone, named by their date («اليوم» is today's, not the
// first row), and a forecast that has no today is not shown (its first row would be named «اليوم»).
function forecastRows(){
  const today = cityToday(), tomorrow = new Date(Date.parse(today + 'T12:00:00Z') + DAY_MS).toISOString().slice(0, 10);
  const days = FORECAST.filter(d => d.date >= today).slice(0, 5);
  if(!days.some(d => d.date === today)) return [];
  return days.map(d => {
    const day = d.date === today ? 'اليوم' : d.date === tomorrow ? 'غداً'
      : new Intl.DateTimeFormat(GREG, {timeZone:'UTC', weekday:'long'}).format(new Date(d.date + 'T12:00:00Z'));
    return `<li><span>${day}</span><span class="ep">${WX_CODES[d.code] || ''}</span>`
         + `<span class="dt">${ar(Math.round(d.hi))}° / ${ar(Math.round(d.lo))}°</span></li>`;
  });
}

// ---- club crests on match cards: TheSportsDB's badge, which the events already carry
// (strHomeTeamBadge / strAwayTeamBadge, with idHomeTeam / idAwayTeam). No request of its own except the picture,
// once per club: kept as a 48 px copy in localStorage and fetched again only when the badge's address changes.
// The launcher's page is a file:// document and the badge host may send no Access-Control-Allow-Origin: fetch() is then refused (or
// the answer is no picture). The club keeps its address alone and the row shows a plain <img> of it, which needs no CORS.
const CRESTS_ON = USES('matches');
const CREST_PX = 48, CREST_KEEP = 60, CREST_PER_ROUND = 10;
let CRESTS = {};   // team id -> {u: badge address, d: data: URI of the small copy, none when only the address could be kept}
try{ CRESTS = JSON.parse(localStorage.getItem('crests') || '{}') || {}; }catch(e){}
function crestOf(ev, side){
  const u = String(ev['str' + side + 'TeamBadge'] || ''), id = String(ev['id' + side + 'Team'] || '');
  return /^https:\/\/[a-z0-9.-]+\.thesportsdb\.com\/\S+$/i.test(u) && /^\d+$/.test(id) ? {id, u} : null;
}
const crestImg = (ev, side) => {
  const c = CRESTS_ON && crestOf(ev, side);
  const k = c && CRESTS[c.id];
  if(!k) return '';   // no crest: the name alone
  return k.d ? `<img class="cr" data-t="${c.id}" alt="">`
    : `<img class="cr" data-t="${c.id}" src="${esc(k.u)}" width="${CREST_PX}" height="${CREST_PX}" loading="lazy" alt="">`;
};
function fillCrests(root){   // the rows carry the club's id only; the picture is put in here (a saved row has none)
  root.querySelectorAll('img.cr').forEach(i => {
    const c = CRESTS[i.dataset.t], src = c && (c.d || c.u);
    if(!src) return;
    if(!c.d) i.onerror = () => i.remove();   // an address that shows nothing (gone, or no picture): the name alone
    if(i.getAttribute('src') !== src) i.src = src;
  });
}
function crestShrink(blob){   // -> a data: URI no larger than CREST_PX, '' when it is not a picture
  return new Promise(done => {
    const url = URL.createObjectURL(blob), im = new Image();
    const end = v => { URL.revokeObjectURL(url); done(v); };
    im.onload = () => {
      try{
        const k = Math.min(1, CREST_PX / Math.max(im.naturalWidth, im.naturalHeight, 1)), c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(im.naturalWidth * k)); c.height = Math.max(1, Math.round(im.naturalHeight * k));
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        end(c.toDataURL('image/png'));
      }catch(e){ end(''); }
    };
    im.onerror = () => end('');
    im.src = url;
  });
}
async function crestFetch(u){   // the small size the API offers first; the plain file if it refuses the suffix
  for(const url of /\/(tiny|small|medium|preview)$/.test(u) ? [u] : [u + '/tiny', u]){
    try{
      const r = await fetchT(url, 10000);
      if(!r.ok) continue;
      const d = await crestShrink(await r.blob());
      if(d) return d;
    }catch(e){}
  }
  return '';
}
let CREST_BUSY = false;
async function loadCrests(){
  if(!CRESTS_ON || CREST_BUSY) return;
  CREST_BUSY = true;
  try{
    const want = {};
    for(const ev of matchEvents()) for(const side of ['Home', 'Away']){
      const c = crestOf(ev, side);
      if(c && !(CRESTS[c.id] && CRESTS[c.id].u === c.u)) want[c.id] = c.u;
    }
    let got = 0;
    for(const [id, u] of Object.entries(want).slice(0, CREST_PER_ROUND)){
      const d = await crestFetch(u);
      delete CRESTS[id]; CRESTS[id] = d ? {u, d} : {u}; got++;   // no copy: the address alone, asked for once
    }
    if(!got) return;
    Object.keys(CRESTS).slice(0, Math.max(0, Object.keys(CRESTS).length - CREST_KEEP)).forEach(k => delete CRESTS[k]);
    try{ localStorage.setItem('crests', JSON.stringify(CRESTS)); }catch(e){}
    renderPanel(false, 'matches');
  }finally{ CREST_BUSY = false; }
}

// ---- «الصلوات في صف»: the five prayers in one row, the next lit, and above it «المغرب بعد ١ س و ٥ د»
function shortHM(sec){   // «١ س و ٥ د», «٢ س», «٥ د»
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60);
  return [h ? ar(h) + ' س' : '', m || !h ? ar(Math.max(m, 1)) + ' د' : ''].filter(Boolean).join(' و ');
}
// ---- «الصلاة القادمة»: one line, «المغرب ٥:٢١ م، بعد ١ ساعة و ٩ دقائق», the calm one of the prayer cards (after Isha: tomorrow's Fajr)
function nextPrayerRows(){
  if(!PRAYERS.length) return [];
  const p = riyadhParts(), mins = p.h * 60 + p.mi + p.s / 60;
  let n = PRAYERS.find(x => x.h * 60 + x.mi > mins), tomorrow = false;
  if(!n){ n = PRAYERS[0]; tomorrow = true; }
  // in the words of the bar and of the screensaver's own «الصلاة القادمة» (untilAdhan): the same minutes at the same second
  const left = untilAdhan(n.h * 60 + n.mi + (tomorrow ? 1440 : 0) - mins);
  return [`<li class="np"><b>${prayerName(n)}</b><span class="t">${fmtTime(n.h, n.mi)}،</span><span class="r">بعد ${left}</span></li>`];   // «،», not «·»: beside «م» it reads as «٠»
}

function prayerRowCard(){
  if(!PRAYERS.length) return {title:'مواقيت اليوم', rows:[]};
  const p = riyadhParts(), mins = p.h * 60 + p.mi + p.s / 60;
  let next = PRAYERS.findIndex(x => x.h * 60 + x.mi > mins), tomorrow = false;
  if(next < 0){ next = 0; tomorrow = true; }   // after Isha the next is tomorrow's Fajr
  const n = PRAYERS[next], left = n.h * 60 + n.mi + (tomorrow ? 1440 : 0) - mins;
  return {
    title: `${prayerName(n)} بعد ${shortHM(Math.max(0, Math.round(left * 60)))}`,
    rows: ['<li class="prow">' + PRAYERS.map((x, i) =>
      `<div class="pc${i === next ? ' next' : tomorrow || x.h * 60 + x.mi <= mins ? ' past' : ''}"><b>${prayerName(x)}</b><i>${fmtTime(x.h, x.mi)}</i></div>`).join('') + '</li>'],
  };
}

function wxIcon(code, night){
  if(code <= 1) return night ? WX_SVG.moon : WX_SVG.sun;
  if(code === 2) return night ? WX_SVG.partnight : WX_SVG.part;
  if(code === 3) return WX_SVG.cloud;
  if(code === 45 || code === 48) return WX_SVG.fog;
  if(code >= 95) return WX_SVG.storm;
  if((code >= 71 && code <= 77) || code === 85 || code === 86) return WX_SVG.snow;

function isNight(t){   // sunrise and sunset of that day when known, else 06:00 to 18:00

// every followed team's games this week, plus results from the last day
function matchEvents(){
  const seen = new Set(), evs = [];
  CONFIG.teamIds.forEach(id => {
    const next = NEXT_LIST[id] || (MATCHES[id] ? [MATCHES[id]] : []);
    next.forEach(ev => { if(ev && ev.idEvent && !seen.has(ev.idEvent)){ seen.add(ev.idEvent); evs.push(MATCHES[id] && MATCHES[id].idEvent === ev.idEvent ? MATCHES[id] : ev); } });
    resultsFor(id).forEach(ev => { if(!seen.has(ev.idEvent)){ seen.add(ev.idEvent); evs.push(ev); } });
  });
  if(CONFIG.leagues.length) leagueGames().forEach(ev => {   // after the teams': a game both follow is the team's copy
    if(!seen.has(ev.idEvent) && !CALLED_OFF.test(ev.strStatus || '')){ seen.add(ev.idEvent); evs.push(ev); }
  });
  return evs;
}
// ... in time order
function matchRows(card){
  const now = Date.now();

  if(live.length) return live.map(ev => liveRow(ev));
  let evs = matchEvents();
  const smart = card && card.kind === 'smart';
  if(smart){ const ids = new Set(focusGames(now).map(ev => ev.idEvent)); evs = evs.filter(ev => ids.has(ev.idEvent)); }   // only the game that brought the smart card here
  const others = smart ? [] : eventRows(now);
  const shown = evs.map(ev => ({ev, t: toDate(ev).getTime(), r: gameRank(ev, now)}))
    .filter(x => finishedRecently(x.ev, now) || pendingResult(x.ev, now)
      || (now < x.t + durMs(x.ev) && !FINAL.includes((x.ev.strStatus || '').toUpperCase())
          && x.t - now <= CONFIG.weekWindowDays * 86400000))
    .sort(byRank);
  // a club with no crest keeps a crest-wide empty space, but only in a card where other rows have crests (the rows line up);
  // a card with no crest at all is as it was
  const anyCrest = shown.some(x => crestImg(x.ev, 'Home') || crestImg(x.ev, 'Away'));
  const crestOrGap = (ev, side) => crestImg(ev, side) || (anyCrest ? '<span class="crgap"></span>' : '');
  return [...shown
    .map(({ev, t, r}) => {
      const d = new Date(t), scored = ev.intHomeScore != null && ev.intAwayScore != null;
      const mid = scored && now >= t ? `<span class="sc">${ar(+ev.intHomeScore)} - ${ar(+ev.intAwayScore)}</span>` : '<span class="x">×</span>';
      const done = finishedRecently(ev, now), upcoming = !done && now < t, pending = r === 0 && !done;
      const when = done ? 'انتهت'
        : pending ? ''   // over with no result yet: no score, no «بعد …»
        : now >= t ? '<span class="live">مباشر</span>'
        : 'بعد ' + shortRemaining(t - now).split(' و ')[0];   // one unit: the date says the rest
      // the date is always there but for a game under way: the day and time of a game to come or one with no result yet, the day of a finished one
      const date = upcoming || pending ? matchWhen(d) : done ? matchDay(d) : '';
      const dateEl = date ? `<i class="mwhen" data-s="${esc(matchWhenShort(d, now, done))}">${date}</i>` : '';
      const club = (id, name, home) => `<span class="tm">${home ? '' : crestOrGap(ev, 'Away')}<span class="nm">${esc(teamAr(name, id))}</span>${home ? crestOrGap(ev, 'Home') : ''}</span>`;
      return {t, r, html: `<li class="mg"><span class="mr">${club(ev.idHomeTeam, ev.strHomeTeam, true)} ${mid} ${club(ev.idAwayTeam, ev.strAwayTeam, false)} ${dateEl} <span class="dt">${when}</span></span></li>`};
    }), ...others.map(o => ({...o, r: o.t <= now ? 1 : 2}))].sort(byRank).map(x => x.html);

  '5110':'كهرباء السعودية', '1150':'الإنماء', '1060':'ساب', '1010':'بنك الرياض', '1050':'السعودي الفرنسي', '1140':'البلاد',
  '1020':'الجزيرة', '1080':'العربي', '2280':'المراعي', '2380':'بترورابغ', '2310':'سبكيم', '2020':'سافكو', '2290':'ينساب',

// The exchanges keep their own hours whatever the city: Tadawul Sun-Thu 10:00-15:00 (Riyadh is UTC+3 all year); the US Mon-Fri 09:30-16:00 New York time (holidays are ignored)
const NY_CLOCK = new Intl.DateTimeFormat('en-US', {timeZone:'America/New_York', weekday:'short', hour:'2-digit', minute:'2-digit', hourCycle:'h23'});
function marketOpen(sa, ms = Date.now()){
  if(sa){ const d = new Date(ms + 3*3600000), day = d.getUTCDay(), m = d.getUTCHours() * 60 + d.getUTCMinutes(); return day <= 4 && m >= 600 && m < 900; }
  const p = NY_CLOCK.formatToParts(new Date(ms)).reduce((a, x) => (a[x.type] = x.value, a), {}), m = (+p.hour % 24) * 60 + +p.minute;
  return p.weekday !== 'Sat' && p.weekday !== 'Sun' && m >= 570 && m < 960;   // New York's own clock, summer time and winter time alike
}
let STOCKS = {};   // code -> {p: price, v: previous close or null, c: the day's closes, at: when it was fetched, bad: the last refresh failed}

// a small line of the day's closes, 60 x 16, drawn only when the card's markup changes
function spark(c, up){
  if(c.length < 2) return '<svg viewBox="0 0 60 16" preserveAspectRatio="none"></svg>';
  const lo = Math.min(...c), hi = Math.max(...c), span = hi - lo || 1;
  const pts = c.map((y, i) => (i * 60 / (c.length - 1)).toFixed(1) + ',' + (15 - (y - lo) / span * 14).toFixed(1)).join(' ');
  return `<svg viewBox="0 0 60 16" preserveAspectRatio="none" class="${up ? 'up' : 'down'}"><polyline points="${pts}"/></svg>`;
}

// verse one day, hadith the next. Verse texts come from the Quran API via CI (.github/tools/fetch_verses.py), never typed.
const VERSES = __VERSES__;   // assets/shared/verses.json
// hadith: only those .github/tools/verify_hadith.py found in the six books, each shown in full as the book has it,
// isnad and all: parts are ["n", narration] and ["q", the Prophet's words]; source is the book and its number
const HADITH = __HADITH__;   // assets/shared/hadith.json, through src/build.py
// the text's size steps down with its length (characters): up to 180 as it was, then three smaller steps
const quoteSize = n => n > 420 ? ' q3' : n > 300 ? ' q2' : n > 180 ? ' q1' : '';
// a long text steps down one size more (q1..q4) until the card has 4 px to spare under its 42% and above the bottom bar
function fitQuote(ul){
  const li = ul.querySelector('li.quote');
  if(!li || CONFIG.widget || CARDS.length > 1) return;   // the screensaver's one card beside the clock; the launcher's cards are fitted by fitCards
  const card = ul.closest('.week'), bar = document.querySelector('.bottom');
  if(!card || !bar) return;
  const crowded = () => { const c = card.getBoundingClientRect(); return c.height > .42 * innerHeight - 4 || c.bottom > bar.getBoundingClientRect().top - 8; };
  let at = ['q1', 'q2', 'q3', 'q4'].findIndex(k => li.classList.contains(k)) + 1;
  while(at < 4 && crowded()){
    if(at) li.classList.remove('q' + at);
    li.classList.add('q' + ++at);
  }
}
// the tafsir cut at a word, «…» after it, until it fits three lines (the build already limits its length); on a card
// that is already full (a long verse on a small screen) fewer lines, none at all if not even one fits
function fitTafsir(ul){
  const el = ul.querySelector('li.tafsir');
  if(!el) return;
  const full = el.textContent.replace(/…$/, ''), words = full.split(' '), was = el.textContent !== full;
  const card = ul.closest('.week'), bar = document.querySelector('.bottom');
  const lines = () => Math.round(el.getBoundingClientRect().height / parseFloat(getComputedStyle(el).lineHeight));
  const crowded = () => { const c = card.getBoundingClientRect(); return c.height > .42 * innerHeight || c.bottom > bar.getBoundingClientRect().top - 4; };
  for(let max = 3; max > 0; max--){
    let n = words.length;
    el.textContent = full + (was ? '…' : '');
    while(lines() > max && n > 1){
      n--;
      el.textContent = words.slice(0, n).join(' ').replace(/[\s،,:؛.]+$/, '') + '…';
    }
    if(!crowded()) return;
  }
  el.remove();
}
// A card in a small place (the launcher's second or third) asks for a text no longer than card.maxLen: the first that short from the
// day's own, going on from it; none that short, the shortest.
function pickShort(list, at, len, card){
  card = card || {};
  card.len = len(list[at % list.length]);
  if(!card.maxLen) return list[at % list.length];
  let best = list[at % list.length];
  for(let k = 0; k < list.length; k++){
    const x = list[(at + k) % list.length];
    if(len(x) <= card.maxLen){ best = x; break; }
    if(len(x) < len(best)) best = x;
  }
  card.len = len(best);
  return best;
}
// The verse card's turn: the day as always, or with #versemin=3 the 3-minute slot of the clock (even = a verse, odd = a hadith)
const quoteTurn = () => CONFIG.verseMin ? Math.floor(Date.now() / (CONFIG.verseMin * 60000)) : riyadhDayNumber();
function quoteOfDay(card){
  // both (the default): even turns a verse, odd a hadith, each list a step every two turns; verse or hadith alone: that list, a step every turn
  const n = quoteTurn(), kind = CONFIG.verseKind, half = kind === 'both' ? Math.floor(n / 2) : n;
  if(VERSES.length && (kind === 'verse' || (kind === 'both' && n % 2 === 0))){
    const v = pickShort(VERSES, half, x => x.text.length, card);
    return {title:CONFIG.verseMin ? 'آية كريمة' : 'آية اليوم', rows:[`<li class="quote quran${v.text.length > 330 ? ' q4' : quoteSize(v.text.length)}"><span class="orn">﴿</span><span class="qt">${esc(v.text)}</span><span class="orn">﴾</span></li>`, `<li class="src">${esc(v.surah)} · ${ar(v.ayah)}</li>`]
      .concat(CONFIG.tafsir && v.tafsir ? [`<li class="tafsir">${esc(v.tafsir)}</li>`] : [])};
  }
  const h = pickShort(HADITH, half, x => x.parts.reduce((m, [, t]) => m + t.length, 0), card);
  const saw = s => s.replace(/ﷺ/g, '<span class="saw">ﷺ</span>').replace(/[﴿﴾]/g, m => `<span class="orn">${m}</span>`);
  const body = h.parts.map(([k, t]) => k === 'q' ? `«${saw(esc(t))}»` : `<span class="nar">${saw(esc(t))}</span>`).join(' ');
  return {title:CONFIG.verseMin ? 'حديث شريف' : 'حديث اليوم', rows:[`<li class="quote hadith${quoteSize(h.parts.reduce((n, [, t]) => n + t.length, 0))}">${body}</li>`, `<li class="src">${esc(h.source)}</li>`]};
}

// «أذكار الصباح والمساء» (from حصن المسلم): only those .github/tools/verify_adhkar.py found in the six books or the Quran.
// Morning: Fajr to Dhuhr; evening: Asr to Maghrib; night (the end of al-Baqara): Isha to Fajr. Between them the «both» ones,
// under when the next begin («أذكار المساء · مع العصر ٣:٠٠ م»), never the verse or hadith of the day. A set with no dhikr
// (the night verse is too long for the screen) falls back to the evening ones, «late»: a dhikr always shows. One timer, 20 s + 0.1 s per character, at most 60 s.
const ADHKAR = __ADHKAR__;   // assets/shared/adhkar.json, through src/build.py
const ADHKAR_COUNT = {1:'مرة واحدة', 2:'مرتان', 3:'ثلاث مرات', 4:'أربع مرات', 7:'سبع مرات', 10:'عشر مرات', 33:'ثلاثاً وثلاثين مرة', 100:'مئة مرة'};
const ADHKAR_ICON = {
  morning:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/></svg>',
  evening:'<svg viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>',
  night:'<svg viewBox="0 0 24 24"><path d="M19 13.5A7.5 7.5 0 0 1 9.5 4.4a7.5 7.5 0 1 0 9.5 9.1z"/><path d="M16.5 3.5v3M15 5h3"/></svg>',
};
ADHKAR_ICON.late = ADHKAR_ICON.night;
const ADHKAR_HEAD = {morning:['أذكار الصباح', 'حتى الظهر'], evening:['أذكار المساء', 'حتى المغرب'], night:['الآيتان من آخر سورة البقرة', 'حتى الفجر'], late:['أذكار المساء', 'حتى الفجر']};
function adhkarWindow(){
  if(!DAY_TIMES) return '';
  const p = riyadhParts(), now = p.h * 60 + p.mi;
  const at = k => { const [h, mi] = String(DAY_TIMES[k]).split(':').map(Number); return h * 60 + mi; };
  if(now >= at('Fajr') && now < at('Dhuhr')) return 'morning';
  if(now >= at('Asr') && now < at('Maghrib')) return 'evening';
  const late = ADHKAR.some(d => d.when === 'night') ? 'night' : 'late';   // after midnight it is still the night before
  if(now >= at('Isha') || now < at('Fajr')) return late;
  return '';
}
function adhkarNext(card){
  card.ad.t = 0;
  card.ad.i++;
  renderCard(card, card.ad.n > 1);
  fitCards();
}
function adhkarNextWindow(){
  const at = k => { const [h, mi] = String(DAY_TIMES[k]).split(':').map(Number); return fmtTime(h, mi); };
  const p = riyadhParts(), now = p.h * 60 + p.mi, mins = k => { const [h, mi] = String(DAY_TIMES[k]).split(':').map(Number); return h * 60 + mi; };
  return !DAY_TIMES ? ['أذكار الصباح والمساء', 'في أوقاتها، من الفجر ومن العصر', '']
    : now < mins('Asr') ? ['أذكار المساء', 'مع العصر ' + at('Asr'), 'evening'] : ['الآيتان من آخر سورة البقرة', 'بعد العشاء ' + at('Isha'), 'night'];
}
function adhkarWait(){
  const [title, when] = adhkarNextWindow();
  return {title, hd: `<span>${title}</span>`, rows: [`<li class="adw"><span>${esc(when)}</span></li>`]};
}
function adhkarCard(card){
  const ad = card.ad, mode = adhkarWindow(), key = mode || 'between';
  const list = ADHKAR.filter(d => mode ? d.when === (mode === 'late' ? 'evening' : mode) || (d.when === 'both' && mode !== 'night') : d.when === 'both');
  if(!list.length){ clearTimeout(ad.t); ad.t = 0; ad.mode = ''; return adhkarWait(); }
  if(key !== ad.mode){ ad.mode = key; ad.i = 0; clearTimeout(ad.t); ad.t = 0; }
  let i = ad.i % list.length;
  if(card.maxLen) for(let k = 0; k < list.length && list[i].text.length > card.maxLen; k++){ ad.i++; i = ad.i % list.length; }
  const d = list[i];
  card.len = d.text.length;
  ad.n = list.length;
  if(!ad.t) ad.t = setTimeout(() => adhkarNext(card), Math.min(60, 20 + .1 * d.text.length) * 1000);
  const dots = Math.min(list.length, 12), on = Math.floor(i * dots / list.length);
  // the ayah-end signs of a surah carry their number inside the ornament in Arabic-Indic digits (the font draws only those inside it);
  // with Western digits chosen the number goes and the ornament stays empty, rather than a «1» outside the circle
  const qt = d.quran && LATIN ? d.text.replace(/(\u06DD)[\u0660-\u0669]+/g, '$1') : d.text;
  const text = d.quran ? `<span class="orn">﴿</span><span class="qt">${esc(qt)}</span><span class="orn">﴾</span>` : esc(d.text);
  const [title, until, icon] = mode ? [...ADHKAR_HEAD[mode], mode] : adhkarNextWindow();
  return {
    title,
    hd: `${ADHKAR_ICON[icon] || ''}<span>${title}</span><span class="until">${esc(until)}</span>`,
    rows: [`<li class="quote${d.quran ? ' quran' : ''}${d.text.length > 560 ? ' q4' : quoteSize(d.text.length)}">${text}</li>`,
           `<li class="adf"><span class="s">${esc(ar(d.virtue ? `${d.virtue.text} · ${d.virtue.source.replace(' · ', ' ')}` : d.source))}</span><span class="c">${ADHKAR_COUNT[d.count] || ar(d.count) + ' مرة'}</span>`
           + `<span class="d">${Array.from({length: dots}, (_, k) => k === on ? '<i class="on"></i>' : '<i></i>').join('')}</span></li>`],
  };
}

const WX_CODES = {
  0:'صافي',1:'صافي غالباً',2:'غائم جزئياً',3:'غائم',45:'ضباب',48:'ضباب متجمد',
  51:'رذاذ',53:'رذاذ',55:'رذاذ كثيف',56:'رذاذ متجمد',57:'رذاذ متجمد',
  61:'مطر خفيف',63:'مطر',65:'مطر غزير',66:'مطر متجمد',67:'مطر متجمد',
  71:'ثلج خفيف',73:'ثلج',75:'ثلج كثيف',77:'حبيبات ثلج',
