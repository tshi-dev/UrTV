<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark light">
<title>محفظتي</title>
<style>
/* «محفظتي» on the phone (docs/PROPOSALS-NOV2.md §7, notes/proposals/markets-portfolio-add-phone.png): its own page, so the main phone page keeps
   its 64 KB. The holdings come from the TV (/api/portfolio) only to a paired phone, only while the TV is editing them; nothing is kept here. */
:root { --bg:#17181b; --card:rgba(30,33,39,.92); --line:rgba(255,255,255,.1); --acc:#54c08a; --on:#54c08a; --text:#fff; --dim:#dadce0; --red:#ffc2b3; --ink:#14161a; --tile:rgba(255,255,255,.07); --sel:rgba(84,192,138,.16) }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --bg:#f6f4ef; --card:#fff; --line:#e3dfd5; --acc:#166a45; --on:#1b8354; --text:#1b1f1d; --dim:#545a57; --red:#8e2a10; --ink:#fff; --tile:#fff; --sel:#eef6f1 } }
:root[data-theme="light"] { --bg:#f6f4ef; --card:#fff; --line:#e3dfd5; --acc:#166a45; --on:#1b8354; --text:#1b1f1d; --dim:#545a57; --red:#8e2a10; --ink:#fff; --tile:#fff; --sel:#eef6f1 }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
@font-face{font-family:'Thmanyah';font-weight:400;font-display:swap;src:url(/fonts/Thmanyah-Regular.woff2) format("woff2")}
@font-face{font-family:'Thmanyah';font-weight:500 900;font-display:swap;src:url(/fonts/Thmanyah-Medium.woff2) format("woff2")}
html,body{margin:0;color:var(--text);background:var(--bg);font:16px/1.45 'Thmanyah',system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
body{max-width:560px;margin:0 auto;padding:24px 16px calc(32px + env(safe-area-inset-bottom))}
h1{font-size:24px;margin:16px 0 16px}
h2{font-size:17px;margin:0 0 8px}
p{margin:8px 0;color:var(--dim);font-size:14px}
.hidden{display:none !important}
button,input{font:inherit;color:var(--text);background:var(--tile);border:1px solid var(--line);border-radius:16px;padding:10px 16px}
button{cursor:pointer;min-height:48px;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button.main{width:100%;min-height:56px;background:var(--acc);border-color:var(--acc);color:var(--ink);font-weight:700;margin:16px 0 8px}
button.lnk{background:none;border:0;color:var(--acc);padding:8px 0;min-height:40px}
button.del{background:none;border:0;color:var(--dim);min-width:40px;padding:8px}
input{width:100%;min-height:52px;background:var(--tile)}
.num{direction:ltr;text-align:right}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:16px 0}
.list{background:var(--card);border:1px solid var(--line);border-radius:18px;margin:8px 0;overflow:hidden}
.list button{display:flex;width:100%;justify-content:space-between;align-items:center;gap:16px;border:0;border-radius:0;border-bottom:1px solid var(--line);background:none;text-align:start;padding:12px 16px}
.list button:last-child{border-bottom:0}
.list button.on{background:var(--sel);color:var(--acc);font-weight:700}
.list small{color:var(--dim);font-weight:400;font-size:13px}
.seg{display:flex;gap:0;border:1px solid var(--line);border-radius:16px;padding:4px;background:var(--card);margin:16px 0}
.seg button{flex:1;border:0;background:none;min-height:44px}
.seg button.on{background:var(--sel);color:var(--acc);border:1.5px solid var(--acc);font-weight:700}
.hd,.buy{display:grid;grid-template-columns:1fr 1fr 40px;gap:8px;align-items:center}
.hd{color:var(--dim);font-size:13px;padding:0 4px 8px;border-bottom:1px solid var(--line)}
.buy{padding:8px 0;border-bottom:1px solid var(--line)}
.sum{display:flex;justify-content:space-between;gap:16px}
.sum b{display:block;font-size:20px}
.sum span{color:var(--dim);font-size:13px}
.hold{display:flex;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.hold:last-child{border-bottom:0}
.hold div{flex:1;min-width:0}
.hold small{display:block;color:var(--dim);font-size:13px}
.lock{display:flex;gap:8px;color:var(--dim);font-size:13px;margin:8px 0}
.lock svg{flex:none;width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;margin-top:2px}
#msg{position:fixed;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom));max-width:528px;margin:0 auto;background:var(--text);color:var(--bg);border-radius:14px;padding:12px 16px;font-size:15px}
</style>
</head>
<body>
<div id="wait" class="card"><p id="waitT">جارٍ الاتصال بالتلفزيون…</p><button id="again" class="lnk hidden">أعد المحاولة</button><a id="toP" class="hidden" href="/p">افتح صفحة الجوال</a></div>
<div id="app" class="hidden">
  <h1>محفظتي</h1>
  <div id="have" class="card hidden"><h2>في محفظتك</h2><div id="holds"></div></div>
  <h1 id="addT">أضف إلى محفظتي</h1>
  <input id="q" type="search" autocomplete="off" placeholder="ابحث باسم الشركة أو رمزها" aria-label="ابحث باسم الشركة أو رمزها">
  <div id="found" class="list hidden"></div>
  <div id="form" class="hidden">
    <div class="seg"><button id="one">متوسط واحد</button><button id="many">عدة عمليات شراء</button></div>
    <div class="card">
      <div class="hd"><span>الكمية</span><span id="priceT">السعر</span><span></span></div>
      <div id="buys"></div>
      <button id="more" class="lnk">+ عملية أخرى</button>
    </div>
    <div class="card sum"><div><span>المجموع</span><b id="total">—</b></div><div><span>المتوسط المحسوب</span><b id="avg" class="num">—</b></div></div>
    <button id="save" class="main">احفظ في التلفزيون</button>
  </div>
  <div class="lock"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span>تُحفظ في التلفزيون فقط، ولا تبقى في الجوال بعد الحفظ. لا تُرسل في أي تقرير ولا تنتقل مع الإعدادات.</span></div>
</div>
<div id="msg" class="hidden" role="status"></div>
<script nonce="__NONCE__">
(function () {
  'use strict';
  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
  try { var th = localStorage.getItem('urtvTheme'); if (th === 'light' || th === 'dark') document.documentElement.setAttribute('data-theme', th); } catch (e) { }
  var EN = document.documentElement.lang === 'en';
  var LOC = EN ? 'en-US' : 'ar-SA-u-nu-arab';
  var MSG = {
    portfolio_closed: 'افتح «محفظتي» على التلفزيون أولًا، ثم أعد المحاولة.', no_session: 'انتهت الجلسة. امسح الرمز من «أسهل من الجوال» على التلفزيون.',
    unknown_code: 'ما وجدنا هذا الرمز في ملف الأسعار.', full: 'المحفظة ممتلئة.', bad_request: 'تحقق من الأرقام.', slow_down: 'مهلًا، طلبات كثيرة.',
    failed: 'ما نجح الحفظ.', wrong: 'الرمز غير صحيح أو منتهٍ.', busy: 'هناك طلب آخر ينتظر موافقة التلفزيون.', locked: 'توقف التحكم لكثرة المحاولات الخاطئة.'
  };
  var sess = null, data = null, pick = null, many = false, poll = null;
  try { sess = sessionStorage.getItem('urtv'); } catch (e) { }

  function toast(t) {
    var m = $('msg'); m.textContent = t; m.classList.remove('hidden');
    clearTimeout(toast.t); toast.t = setTimeout(function () { m.classList.add('hidden'); }, 3500);
  }
  function digits(s) { return String(s).replace(/[٠-٩]/g, function (d) { return d.charCodeAt(0) - 0x660; }).replace(/[۰-۹]/g, function (d) { return d.charCodeAt(0) - 0x6f0; }).replace(/[٫,]/g, '.').replace(/\s/g, ''); }
  function nf(v, dec) { return new Intl.NumberFormat(LOC, { minimumFractionDigits: dec, maximumFractionDigits: dec }).format(v); }
  function qty(v) { return new Intl.NumberFormat(LOC, { maximumFractionDigits: 4 }).format(v); }
  function okNum(s) { return /^\d{1,9}(\.\d{1,4})?$/.test(s) && +s > 0; }
  // Arabic counting: سهم واحد, سهمان, 3 to 10 أسهم, 11 and more سهمًا
  var SH = ['سهم واحد', 'سهمان', 'أسهم', 'سهمًا'];
  function shares(n) { var r = n % 100; return n === 1 ? SH[0] : n === 2 ? SH[1] : qty(n) + ' ' + (n % 1 === 0 && r > 2 && r < 11 ? SH[2] : SH[3]); }
  function unit(code) { return /^\d{4}$/.test(code) ? 'ر.س' : '$'; }

  function api(path, body) {
    var h = {};
    if (sess) h['X-UrTV-Session'] = sess;
    var o = { method: body === undefined ? 'GET' : 'POST', credentials: 'same-origin', headers: h, cache: 'no-store' };
    if (body !== undefined) { h['Content-Type'] = 'application/json'; o.body = JSON.stringify(body); }
    return fetch(path, o).then(function (r) {
      return r.json().catch(function () { return { ok: false, error: 'failed' }; });
    }, function () { return { ok: false, error: 'failed' }; });
  }

  // ---- pairing: the QR of «أسهل من الجوال» opens /m#token; the TV asks «سماح»
  function waiting(t, retry) {
    $('wait').classList.remove('hidden'); $('app').classList.add('hidden');
    $('waitT').textContent = t; $('again').classList.toggle('hidden', !retry); $('toP').classList.toggle('hidden', !!retry || !!sess);
  }
  function pairToken(token) {
    waiting('جارٍ الاتصال بالتلفزيون…', false);
    api('/api/pair', { token: token }).then(function (j) {
      if (!j.ok) { waiting(MSG[j.error] || MSG.failed, false); return; }
      waiting('بانتظار موافقة التلفزيون: اضغط «سماح» بالريموت.', false);
      var end = Date.now() + 70000;
      clearInterval(poll);
      poll = setInterval(function () {
        if (Date.now() > end) { clearInterval(poll); waiting('انتهت المهلة.', false); return; }
        api('/api/pair/status', { id: j.id }).then(function (s) {
          if (!s.ok || s.status === 'waiting') return;
          clearInterval(poll);
          if (s.status === 'approved' && s.session) {
            sess = s.session;
            try { sessionStorage.setItem('urtv', sess); } catch (e) { }
            load();
          } else waiting(s.status === 'denied' ? 'رفض التلفزيون الطلب.' : 'انتهى الطلب.', false);
        });
      }, 1200);
    });
  }

  // ---- the holdings: read from the TV each time, never kept here
  function load() {
    api('/api/portfolio').then(function (j) {
      if (!j.ok) {
        if (j.error === 'no_session') { sess = null; try { sessionStorage.removeItem('urtv'); } catch (e) { } }
        waiting(MSG[j.error] || MSG.failed, j.error === 'portfolio_closed'); return;
      }
      data = j;
      $('wait').classList.add('hidden'); $('app').classList.remove('hidden');
      holdings();
    });
  }
  function nameOf(code) {
    var n = (data.names || []).filter(function (x) { return x[0] === code; })[0];
    return n ? n[1] : code;
  }
  function holdings() {
    var box = $('holds'); box.textContent = '';
    var hs = data.holdings || [];
    $('have').classList.toggle('hidden', !hs.length);
    hs.forEach(function (h) {
      var q = 0, c = 0;
      h.buys.forEach(function (b) { var p = b.split(':'); q += +p[0]; c += p[0] * p[1]; });
      var row = el('div', 'hold'), d = el('div');
      d.appendChild(el('span', '', h.name));
      d.appendChild(el('small', '', h.code + ' · ' + shares(q) + ' · ' + nf(c / q, 2) + ' ' + unit(h.code)));
      row.appendChild(d);
      var ed = el('button', 'lnk', 'عدّل'); ed.onclick = function () { choose(h.code, h.buys); };
      var rm = el('button', 'lnk', 'احذف');
      rm.onclick = function () {
        if (!confirm('أحذف «%s» من محفظتك؟'.replace('%s', h.name))) return;
        api('/api/portfolio', { code: h.code, buys: [] }).then(done);
      };
      row.appendChild(ed); row.appendChild(rm);
      box.appendChild(row);
    });
  }

  // ---- search: the 30 Tadawul names, any 4-digit code or US ticker the price file has
  $('q').oninput = function () {
    var raw = $('q').value.trim(), q = digits(raw).toUpperCase(), box = $('found');
    box.textContent = '';
    if (!raw || !data) { box.classList.add('hidden'); return; }
    var out = [];
    (data.names || []).forEach(function (n) { if (n[1].indexOf(raw) >= 0 || n[0].indexOf(q) === 0) out.push(n[0]); });
    (data.codes || []).forEach(function (c) { if (out.indexOf(c) < 0 && c.indexOf(q) === 0) out.push(c); });
    if (/^(\d{4}|[A-Z][A-Z.\-]{0,5})$/.test(q) && out.indexOf(q) < 0) out.push(q);
    out.slice(0, 6).forEach(function (code, i) {
      var b = el('button', i === 0 ? 'on' : '');
      b.appendChild(el('span', '', nameOf(code)));
      var px = (data.prices || {})[code];
      b.appendChild(el('small', 'num', code + (px ? ' · ' + nf(+px, 2) + ' ' + unit(code) : '')));
      b.onclick = function () { choose(code, null); };
      box.appendChild(b);
    });
    box.classList.toggle('hidden', !out.length);
  };

  function choose(code, buys) {
    pick = code;
    $('q').value = nameOf(code) === code ? code : nameOf(code) + ' ' + code;
    $('found').classList.add('hidden');
    $('form').classList.remove('hidden');
    $('addT').textContent = buys ? 'عدّل في محفظتي' : 'أضف إلى محفظتي';
    $('priceT').textContent = unit(code) === '$' ? 'السعر بالدولار' : 'السعر';
    $('buys').textContent = '';
    (buys && buys.length ? buys : [':']).forEach(function (b) { var p = b.split(':'); addBuy(p[0], p[1]); });
    mode(!!buys && buys.length > 1);
    sum();
    $('form').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  function addBuy(q, p) {
    var r = el('div', 'buy');
    var a = el('input', 'num'), b = el('input', 'num'), x = el('button', 'del', '×');
    a.inputMode = 'decimal'; b.inputMode = 'decimal'; a.value = q || ''; b.value = p || '';
    a.setAttribute('aria-label', 'الكمية'); b.setAttribute('aria-label', 'السعر'); x.setAttribute('aria-label', 'احذف هذه العملية');
    a.oninput = b.oninput = sum;
    x.onclick = function () { if ($('buys').children.length > 1) { r.remove(); sum(); } };
    r.appendChild(a); r.appendChild(b); r.appendChild(x);
    $('buys').appendChild(r);
  }
  function mode(m) {
    if (!m && many) {   // back to one average: the buys become their total and their weighted average, in the first line
      var b = buys() || [], q = 0, c = 0;
      b.forEach(function (x) { var p = x.split(':'); q += +p[0]; c += p[0] * p[1]; });
      $('buys').textContent = '';
      addBuy(q ? String(+q.toFixed(4)) : '', q ? String(+(c / q).toFixed(4)) : '');
    }
    many = m;
    $('one').classList.toggle('on', !m); $('many').classList.toggle('on', m);
    $('more').classList.toggle('hidden', !m);
    var rows = $('buys').children;
    for (var i = 0; i < rows.length; i++) { rows[i].children[2].classList.toggle('hidden', !m); if (!m && i > 0) rows[i].classList.add('hidden'); else rows[i].classList.remove('hidden'); }
    $('priceT').textContent = m ? (unit(pick || '') === '$' ? 'السعر بالدولار' : 'السعر') : 'متوسط التكلفة';
    sum();
  }
  $('one').onclick = function () { mode(false); };
  $('many').onclick = function () { mode(true); };
  $('more').onclick = function () { if ($('buys').children.length < 20) addBuy('', ''); };
  function buys() {
    var out = [], rows = $('buys').children;
    for (var i = 0; i < rows.length; i++) {
      if (rows[i].classList.contains('hidden')) continue;
      var q = digits(rows[i].children[0].value), p = digits(rows[i].children[1].value);
      if (!q && !p) continue;
      if (!okNum(q) || !okNum(p)) return null;
      out.push(q + ':' + p);
    }
    return out;
  }
  function sum() {
    var b = buys(), q = 0, c = 0;
    (b || []).forEach(function (x) { var p = x.split(':'); q += +p[0]; c += p[0] * p[1]; });
    $('total').textContent = q ? shares(q) : '—';
    $('avg').textContent = q ? nf(c / q, 2) + ' ' + unit(pick || '') : '—';
  }
  $('save').onclick = function () {
    var b = buys();
    if (!pick || !b || !b.length) { toast(MSG.bad_request); return; }
    api('/api/portfolio', { code: pick, buys: b }).then(done);
  };
  function done(j) {
    if (!j.ok) { toast(MSG[j.error] || MSG.failed); if (j.error === 'portfolio_closed' || j.error === 'no_session') load(); return; }
    toast('حُفظ في التلفزيون.');
    pick = null; $('q').value = ''; $('form').classList.add('hidden'); $('buys').textContent = ''; $('addT').textContent = 'أضف إلى محفظتي';
    load();   // the list again from the TV; the form keeps nothing
  }
  $('again').onclick = load;

  var m = /^#([0-9a-f]{32})$/.exec(location.hash);
  if (m) { history.replaceState(null, '', '/m'); pairToken(m[1]); }
  else if (sess) load();
  else waiting('امسح الرمز من «أسهل من الجوال» في «محفظتي» على التلفزيون، أو ادخل من صفحة الجوال ثم «محفظتي».', false);
})();
</script>
</body>
</html>
