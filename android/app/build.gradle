plugins {
    id 'com.android.application'
}

android {
    namespace 'sa.urtv.screensaver'
    compileSdk 34

    defaultConfig {
        applicationId 'sa.urtv.screensaver'
        minSdk 21
        targetSdk 34
        // CI passes its run number so every build installs over the previous one: the versionCode, the same number as the home app and
        // as the release. The name people read is the repository's VERSION file («4.0», what Android's app info shows) and nothing else:
        // versionName "4.0", BuildConfig.MARKETING "4.0"; the build is the versionCode, which the apps and the optimize scripts read
        // (the screens say «4.0 (بناء 123)»), never by taking versionName apart.
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
        versionName file('../../VERSION').text.trim()
        buildConfigField "String", "MARKETING", "\"${file('../../VERSION').text.trim()}\""
        // the branch the page, fonts and photos are fetched from: CI passes the one it builds, a local build follows master
        buildConfigField "String", "BRANCH", "\"${System.getenv('URTV_BRANCH') ?: 'master'}\""
    }

    buildFeatures {
        buildConfig true   // off by default since AGP 8
    }

    signingConfigs {
        // the key lives only in the repository's secrets (made with .github/tools/make_signing_key.py) and CI refuses
        // to build without it; a local build without ANDROID_KEYSTORE gets the debug key, so it can't update the TV's apps
        if (System.getenv('ANDROID_KEYSTORE')) {
            release {
                storeFile file(System.getenv('ANDROID_KEYSTORE'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias 'urtv'
                keyPassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.findByName('release') ?: signingConfigs.debug
        }
    }

    // the page is built by ../../src/build.py into dist/; only tv.html goes in (copyPage below): dist/urtv.html is the
    // stand-alone copy with the fonts and photos inlined, which no screen of the app loads
    sourceSets {
        main { assets.srcDirs = ['../launcher/src/main/assets', '../../assets', "$buildDir/generated/page"] }   // Thmanyah fonts, backgrounds/, shared/ (the club lists), the page
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

def copyPage = tasks.register('copyPage', Copy) {
    from('../../dist') { include 'tv.html' }
    into "$buildDir/generated/page"
}
preBuild.dependsOn copyPage
